/* ---- tumbleweeds bowling across the desert roads ---- */
if(DESERT){
  const mat = new THREE.MeshLambertMaterial({color:0x9a7a4a, wireframe:true});

  for(let k=0;k<7;k++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7 + Math.random()*0.4, 1), mat);

    const dt = Math.max(0, Math.min(0.1, t - last)); last = t;

        const base = state.idx;
        w.i = wrapIdx(MAIN, base + Math.round((60 + Math.random()*260)/MAIN.seg));

/* ---- Copper Lake: the water, stone along the causeway, a dock and boats ---- */
if(LAKE.on){
  const STEP = 2, AX = LAKE.rx*1.15, AZ = LAKE.rz*1.15;
  const cols = Math.ceil(AX*2/STEP) + 1, rows = Math.ceil(AZ*2/STEP) + 1;
  const pos=[], uv=[], dep=[], idx=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const x = LAKE.x - AX + c*STEP, z = LAKE.z - AZ + r*STEP;
    const e = Math.hypot((x - LAKE.x)/LAKE.rx, (z - LAKE.z)/LAKE.rz);
    const top = LAKE.frozen ? LAKE.level + 0.05 : LAKE.level;     // ice lies on the flat floor
    pos.push(x, top, z); uv.push(x, z);
    const d = top - surfaceY(x, z) + (LAKE.frozen ? 0.02 : 0);
    // the ice lies on a flat floor, so its depth is how far out from the shore it is: snow drifts at the edge, clear ice out in the middle
    dep.push(e > 1.12 ? -1 : Math.max(-1, Math.min(3, LAKE.frozen && d > 0 ? Math.max(d, (1 - e)*5) : d)));
  }
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    const a = r*cols + c, b = a + 1, d2 = a + cols, e = d2 + 1;
    if(dep[a] <= 0 && dep[b] <= 0 && dep[d2] <= 0 && dep[e] <= 0) continue;
    idx.push(a, d2, e, a, e, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute("aDepth", new THREE.Float32BufferAttribute(dep,1));
  g.setIndex(idx);
  const wm = new THREE.Mesh(g, waterMaterial()); wm.renderOrder = 3; wm.frustumCulled = false; scene.add(wm);
  if(!LAKE.frozen){

    if(Math.hypot((p.x - LAKE.x)/LAKE.rx, (p.z - LAKE.z)/LAKE.rz) > 0.95 || P.surf[i] === SURF.WATER) continue;
    if(Math.random() < 0.55) continue;
    const t = P.tans[i], s2 = Math.random() < 0.5 ? -1 : 1;
    for(let off=P.half[i] + 3; off < P.half[i] + 14; off += 1.6){
      const x = p.x - t.z*s2*off, z = p.z + t.x*s2*off;
      if(Math.abs(surfaceY(x, z) - LAKE.level) < 0.5){
        const sc = 0.5 + Math.random()*1.0, rock = new THREE.Mesh(rockGeometry(i%3), rockMat);
        rock.position.set(x, gradedY(x, z), z); rock.scale.set(sc, sc*0.6, sc);
        rock.rotation.set(Math.random(), Math.random()*6, Math.random()); scene.add(rock);
        break;
      }
    }
  }
  // a dock on the north shore with rowboats tied up, and a few out on the water
  const boat = (c)=>{
    const b = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 5, 0, Math.PI*2, Math.PI/2, Math.PI/2), PM(c));
    hull.scale.set(0.8, 0.5, 2.3); hull.position.y = 0.35; b.add(hull);
    pbox(b, 1.4, 0.1, 0.3, 0x8a6a44, 0, 0.3, 0.3);
    pbox(b, 1.4, 0.1, 0.3, 0x8a6a44, 0, 0.3, -0.8);

  };
  for(let k=0, tries=0; k<6 && tries<200; tries++){

    const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
    if(!clearOf(x, z, 16) || LAKE.level - surfaceY(x, z) < 0.8) continue;

    b.position.set(x, LAKE.level - 0.15, z); b.rotation.y = Math.random()*6; scene.add(b);

      for(const s of [-1, 1]) pbox(g, 0.25, 3, 0.25, 0x5a4430, s*1.4, y0 - 1.2, k*2.2);

  }

  if(LAKE.frozen){

    const P = MAIN, pole = new THREE.MeshLambertMaterial({color:0xff6a1a}), snow = new THREE.MeshLambertMaterial({color:0xf2f6fa});

    for(let i=0;i<P.N;i+=Math.round(16/P.seg)){

        if(CROSSES.length && otherRoadDist(x, z, i, 60) < 12) continue;
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.8, 5), pole);
        m.position.set(x, gradedY(x, z) + 0.9, z); scene.add(m);

    let huts = 0;
    for(let tries=0; tries<400 && huts<14; tries++){
      const a = Math.random()*Math.PI*2, e = 0.2 + Math.random()*0.65;
      const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
      if(!clearOf(x, z, 14)) continue;
      const g = new THREE.Group(), c = hutCols[huts % hutCols.length];

      pbox(g, 2.6, 0.12, 3.2, 0xf2f6fa, 0, 2.45, 0).rotation.z = 0.12;         // snow on the roof

        pbox(g, 1.8, 0.8, 1.8, 0x5a6a7a, 3.2, 1.55, 1.0);
        pbox(g, 1.7, 0.6, 0.06, 0x223038, 3.2, 1.6, 1.92);

    roadSign(i0, 1, ["ICE ROAD", "ice 60cm, drive at own risk"], "#2f6fa8", "#f2efe6");
    /* the pressure ridges: slabs of lake ice a foot thick, shoved up on end
       and leaning on each other in a broken wall, dusted with snow */
    const slabMats = [0x8fc4dc, 0xa9d6ea, 0xc6e6f3, 0xe6f2f8].map(c=> new THREE.MeshPhongMaterial({color:c, shininess:90, specular:0x9fc2d4}));
    RIDGES.forEach((R, n)=>{
      const rnd = seeded(9001 + n*77), g = new THREE.Group();
      for(let u=R.a; u<=R.b; u+=0.9 + rnd()*0.8){
        if(Math.abs(u) < MAIN.half[R.at] + 2.2) continue;          // the road is cut through it

      // loose chunks thrown out onto the ice either side
      for(let k=0;k<70;k++){
        const u = R.a + rnd()*(R.b - R.a);
        if(Math.abs(u) < MAIN.half[R.at] + 2) continue;
        const v = R.wave(u) + (rnd() - 0.5)*14;
        const x = R.x + R.dx*u + R.dz*v, z = R.z + R.dz*u - R.dx*v, c = 0.3 + rnd()*0.7;
        const s = new THREE.Mesh(new THREE.BoxGeometry(c, c*0.35, c*0.8), slabMats[Math.floor(rnd()*4)]);
        s.position.set(x, gradedY(x, z) + 0.08, z); s.rotation.set(rnd(), rnd()*6, rnd()*0.5);
        g.add(s);
      }
      mergeStatic(g); scene.add(g);
      roadSign(wrapIdx(MAIN, R.at - Math.round(65/MAIN.seg)), n % 2 ? 1 : -1, ["PRESSURE RIDGE", "ice heaved \u2014 jump"], "#e2b21e", "#1f1f1f");
    });
  }
  if(WASH.on){
    roadSign(WASH.at - Math.round(110/MAIN.seg), 1, ["WASHOUT AHEAD", "jump it or wade it"], "#e2b21e", "#1f1f1f");
    roadSign(WASH.at - Math.round(110/MAIN.seg), -1, ["WASHOUT AHEAD", "jump it or wade it"], "#e2b21e", "#1f1f1f");
  }
}

    pbox(house, 3.5, 1.0, 1.0, dark, 0, 1.0, -2.3);                        // counterweight

    pbox(house, 1.3, 1.5, 1.5, yellow, -1.0, 2.7, 0.9);                    // cab
    pbox(house, 1.2, 1.0, 0.06, glass, -1.0, 2.9, 1.66);
    pbox(house, 0.06, 1.0, 1.2, glass, -1.66, 2.9, 0.9);
    pbox(house, 0.14, 1.1, 0.14, chrome, 1.1, 2.4, -1.3);                  // exhaust
    for(const z of [-1.4, 0.2]) pbox(house, 3.42, 0.14, 0.9, black, 0, 1.3, z);   // hazard stripes

    const stick = pbox(house, 0.55, 3.8, 0.55, yellow, 0.7, 3.4, 5.9); stick.rotation.x = 0.4;
    const bucket = new THREE.Group();

    for(let k=-2;k<=2;k++) pbox(bucket, 0.14, 0.14, 0.35, chrome, k*0.34, -0.45, 0.62);
    bucket.position.set(0.7, 1.3, 6.8); bucket.rotation.x = 0.5; house.add(bucket);
    pbox(house, 0.14, 0.9, 0.14, 0xe8e2d4, -1.6, 2.35, -0.6);              // grab rail by the door
    beacon(house, -1.0, 3.5, 0.9);
    house.position.y = 0.95; house.rotation.y = (Math.random() - 0.5)*1.4; g.add(house);
    // it works: the house swings between the face and the truck, the arm with it
    house.userData.noMerge = true;
    const h0 = house.rotation.y, ph = Math.random()*6;
    ANIMS.push(t=>{ const c = Math.sin(t*0.45 + ph); house.rotation.y = h0 + Math.sign(c)*Math.pow(Math.abs(c), 0.6)*0.9;
                     bucket.rotation.x = 0.5 + 0.35*Math.sin(t*0.9 + ph); });
    return g;
  };
  /* A heap of gravel laid over the ground itself. Every vertex is set from
     the land under it, so on a slope or on the edge of a bench the heap's
     skirt runs down with the ground instead of hanging a flat bottom in the
     air. Toward the top it settles level, the way a tipped load does. */
  const cone = (h, c, x0, z0)=>{
    const g = new THREE.Group();
    const R = h*1.9, RINGS = 9, SEG = 20;
    const gc = gradedY(x0, z0);
    const pos = [], col = [], idx = [];
    const base = new THREE.Color(c), cc = new THREE.Color();
    const ph = Math.random()*6.28;
    pos.push(0, h + 0.05, 0); cc.copy(base).multiplyScalar(1.06); col.push(cc.r, cc.g, cc.b);
    for(let r=1;r<=RINGS+1;r++){
      const q = Math.min(1.08, r/RINGS);
      for(let k=0;k<SEG;k++){
        const a = k/SEG*Math.PI*2;
        const wob = 1 + 0.10*Math.sin(a*3 + ph) + 0.06*Math.sin(a*5 + ph*2) + (Math.random() - 0.5)*0.06;
        const lx = Math.cos(a)*R*q*wob, lz = Math.sin(a)*R*q*wob;
        const ground = gradedY(x0 + lx, z0 + lz) - gc;
        const qq = Math.min(1, q);
        const prof = h*Math.pow(1 - qq, 1.25)*(1 - 0.12*Math.exp(-qq*qq*30));   // a rounded peak
        const settle = Math.pow(1 - qq, 0.6);                                       // level at the top
        let y = ground*(1 - settle) + Math.min(ground, 0)*settle*0.35 + prof;
        if(q > 1) y = ground - 0.35;                                                 // the skirt, tucked in
        y = Math.max(y, ground + (q > 1 ? -0.35 : 0.04*(1 - qq)));
        pos.push(lx, y, lz);
        cc.copy(base).multiplyScalar(0.84 + 0.2*(1 - qq) + (Math.random() - 0.5)*0.08); col.push(cc.r, cc.g, cc.b);
      }
    }
    for(let k=0;k<SEG;k++) idx.push(0, 1 + (k+1)%SEG, 1 + k);
    for(let r=0;r<RINGS;r++) for(let k=0;k<SEG;k++){
      const A = 1 + r*SEG + k, B = 1 + r*SEG + (k+1)%SEG, C = A + SEG, D = B + SEG;
      idx.push(A, B, D, A, D, C);
    }
    const geo = new THREE.BufferGeometry();
    geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    geo.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    geo.setIndex(idx); geo.computeVertexNormals();
    const m = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true}));
    m.receiveShadow = true; g.add(m);
    // a few boulders rolled down to the foot
    for(let k=0;k<4;k++){
      const a = Math.random()*Math.PI*2, d = R*(0.8 + Math.random()*0.3), sc = 0.25 + Math.random()*0.35;
      const lx = Math.cos(a)*d, lz = Math.sin(a)*d;
      const rock = new THREE.Mesh(new THREE.DodecahedronGeometry(1, 0), PM(0x6a6258));
      rock.scale.set(sc, sc*0.7, sc); rock.position.set(lx, gradedY(x0 + lx, z0 + lz) - gc + sc*0.3, lz);
      rock.rotation.set(Math.random(), Math.random()*6, Math.random()); g.add(rock);
    }
    g.userData.draped = true;
    g.userData.noMerge = true;            // merging would drop the vertex colours
    return g;
  };
  /* only on ground that is near enough level for the footprint, and set at
     the lowest point under it so nothing hangs in the air */
  const footing = (x, z, r)=>{
    let lo = Infinity, hi = -Infinity;
    for(let k=0;k<10;k++){
      const a = k/10*Math.PI*2, y = gradedY(x + Math.cos(a)*r, z + Math.sin(a)*r);
      lo = Math.min(lo, y); hi = Math.max(hi, y);
    }
    const c = gradedY(x, z); lo = Math.min(lo, c); hi = Math.max(hi, c);
    return {lo, hi, range: hi - lo};
  };
  const taken = [];
  const place = (make, rMin, rMax, n, clear, foot, tol)=>{
    for(let k=0, tries=0; k<n && tries<600; tries++){
      const a = Math.random()*Math.PI*2, d = rMin + Math.random()*(rMax - rMin);
      const x = PIT.x + Math.cos(a)*d, z = PIT.z + Math.sin(a)*d;
      if(!clearOf(x, z, clear)) continue;
      if(taken.some(t=> Math.hypot(t[0] - x, t[1] - z) < t[2] + foot + 1.5)) continue;
      const F = footing(x, z, foot);
      if(F.range > tol) continue;
      const obj = make(x, z);
      if(obj.userData.draped){ setDown(obj, x, z, 0); }            // shaped to the ground where it lies
      else { const g = setDown(obj, x, z, Math.random()*6); g.position.y = F.lo - 0.05; }
      taken.push([x, z, foot]);
      k++;
    }
  };
  const floorR = PIT.r*(1 - PIT.span);
  const sand = [0xb89a6a, 0xa88c62, 0x8a7c6a, 0x7a6f60];
  place(truck, 5, floorR - 8, 2, 6, 4.2, 0.6);
  place(digger, 5, floorR - 8, 1, 7, 4.0, 0.6);
  place((x, z)=>cone(3 + Math.random()*3, sand[Math.floor(Math.random()*sand.length)], x, z), 5, floorR, 6, 6, 5, 2.5);
  place(truck, floorR + 10, PIT.r - 8, 2, 6, 4.2, 0.8);
  place((x, z)=>cone(2 + Math.random()*2, sand[Math.floor(Math.random()*sand.length)], x, z), floorR, PIT.r - 5, 10, 4, 3.5, 2.5);
  // floodlight masts on the rim
  for(let k=0;k<6;k++){
    const a = k/6*Math.PI*2 + 0.3, x = PIT.x + Math.cos(a)*(PIT.r + 8), z = PIT.z + Math.sin(a)*(PIT.r + 8);
    if(!clearOf(x, z, 4)) continue;
    const g = new THREE.Group();
    pbox(g, 0.35, 14, 0.35, grey, 0, 7, 0);
    pbox(g, 3, 0.3, 0.3, grey, 0, 14, 0);
    for(const s of [-1, 0, 1]) pbox(g, 0.7, 0.6, 0.4, new THREE.MeshLambertMaterial({color:0xfff3c4, emissive:0x9a8a50}), s*1.1, 13.5, 0.3);
    setDown(g, x, z, Math.atan2(PIT.x - x, PIT.z - z));
  }
  // the crusher house and its conveyor at the rim
  for(let tries=0; tries<100; tries++){
    const a = Math.random()*Math.PI*2, x = PIT.x + Math.cos(a)*(PIT.r + 24), z = PIT.z + Math.sin(a)*(PIT.r + 24);
    if(!clearOf(x, z, 14)) continue;
    const g = new THREE.Group();
    pbox(g, 12, 10, 10, 0x8f5f4a, 0, 5, 0);
    pbox(g, 12.4, 0.5, 10.4, 0x5a5a58, 0, 10.2, 0);
    pbox(g, 3, 4, 3, 0x6a6a68, 3, 12, 2);
    const belt = pbox(g, 1.6, 0.5, 26, 0x444444, 0, 7, 17); belt.rotation.x = 0.36;
    for(let k=0;k<4;k++) pbox(g, 0.3, 6 - k*1.4, 0.3, grey, 0, (6 - k*1.4)/2, 9 + k*6);
    setDown(g, x, z, Math.atan2(PIT.x - x, PIT.z - z));
    break;
  }
  const i0 = snapTo(MAIN, [PIT.x + PIT.r + 40, PIT.z]);
  roadSign(i0, 1, ["IRON QUARRY", "heavy vehicles, blasting"], "#e0a21e", "#1f1f1f");
}

/* ---- leaves coming down, on the fall circuits ---- */
if(FALL || WINTER){
  const N = WINTER ? 1400 : 900, BOX = 46, HT = 22;
  const pos = new Float32Array(N*3), col = new Float32Array(N*3), ph = new Float32Array(N);
  const c = new THREE.Color();
  for(let i=0;i<N;i++){
    pos[i*3] = (Math.random()-0.5)*BOX*2; pos[i*3+1] = Math.random()*HT; pos[i*3+2] = (Math.random()-0.5)*BOX*2;
    if(WINTER) c.setRGB(1, 1, 1); else fallTint(c);
    col[i*3] = c.r; col[i*3+1] = c.g; col[i*3+2] = c.b; ph[i] = Math.random()*6.28;
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos, 3).setUsage(THREE.DynamicDrawUsage));
  g.setAttribute("color", new THREE.BufferAttribute(col, 3));
  const leafTex = new THREE.CanvasTexture(noiseCanvas(32, 32, (q, w, h)=>{
    q.fillStyle = "#fff"; q.beginPath();
    if(WINTER) q.arc(16, 16, 11, 0, 7);
    else { q.moveTo(16, 2); q.quadraticCurveTo(30, 14, 16, 30); q.quadraticCurveTo(2, 14, 16, 2); }
    q.fill();
  }));
  const pts = new THREE.Points(g, new THREE.PointsMaterial({size: WINTER ? 0.2 : 0.32, map:leafTex, vertexColors:true,
                                transparent:true, alphaTest:0.4, depthWrite:false}));
  pts.frustumCulled = false; scene.add(pts);
  let last = 0;
  ANIMS.push(t=>{
    const dt = Math.max(0, Math.min(0.1, t - last)); last = t;
    const cx = camera.position.x, cy = camera.position.y, cz = camera.position.z;
    for(let i=0;i<N;i++){
      let x = pos[i*3], y = pos[i*3+1], z = pos[i*3+2];
      y -= dt*(WINTER ? 0.9 + (i%7)*0.1 : 1.1 + (i%7)*0.12);
      x += Math.sin(t*1.7 + ph[i])*dt*0.9 + dt*0.6;
      z += Math.cos(t*1.3 + ph[i])*dt*0.6;
      // keep them in a box around the camera, recycled from the top
      if(x - cx > BOX) x -= BOX*2; if(x - cx < -BOX) x += BOX*2;
      if(z - cz > BOX) z -= BOX*2; if(z - cz < -BOX) z += BOX*2;
      if(y < cy - 6) y += HT;
      if(y > cy + HT) y -= HT;
      pos[i*3] = x; pos[i*3+1] = y; pos[i*3+2] = z;
    }
    g.attributes.position.needsUpdate = true;
  });
}

/* ---- signage where the alternate routes split off ---- */
paths.forEach(P=>{
  if(P.closed) return;
  const A = P.splitAt;
  const m = MAIN.pts[A], t = MAIN.tans[A];
  const nx=-t.z, nz=t.x;
  const look = P.pts[Math.min(P.N-1, 14)];
  const side = (look.x - m.x)*nx + (look.z - m.z)*nz > 0 ? 1 : -1;
  const board = new THREE.Mesh(new THREE.BoxGeometry(2.6, 1.0, 0.1),
    new THREE.MeshLambertMaterial({map: signTex}));
  board.position.set(m.x + nx*side*9.5, m.y + 2.3, m.z + nz*side*9.5);
  board.rotation.y = Math.atan2(t.x, t.z);
  if(side < 0) board.scale.x = -1;              // arrow points at the turn off
  scene.add(board);
  const post = new THREE.Mesh(new THREE.CylinderGeometry(0.09,0.11,2.4,6),
    new THREE.MeshLambertMaterial({color:0x6b5335}));
  post.position.set(board.position.x, m.y + 1.1, board.position.z);
  scene.add(post);
  P.side = side;
  // marker poles, red and white with a flag, down both sides of the mouth
  const poleM = new THREE.MeshLambertMaterial({color:0xf2efe6}), redM = new THREE.MeshLambertMaterial({color:0xd8302a});
  const flagM = new THREE.MeshLambertMaterial({color:0xffd23d, side:THREE.DoubleSide});
  const pg = new THREE.Group();
  for(let d=4; d<=40; d+=6){
    const i = Math.min(P.N - 1, Math.round(d/P.seg)), p = P.pts[i], tt = P.tans[i];
    for(const sd of [-1, 1]){
      const off = P.half[i] + 1.1, x = p.x - tt.z*sd*off, z = p.z + tt.x*sd*off, y = gradedY(x, z);
      const a = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.9, 0.1), poleM); a.position.set(x, y + 0.45, z); pg.add(a);
      const r = new THREE.Mesh(new THREE.BoxGeometry(0.11, 0.9, 0.11), redM); r.position.set(x, y + 1.35, z); pg.add(r);
      const fl = new THREE.Mesh(new THREE.PlaneGeometry(0.6, 0.38), flagM); fl.position.set(x + tt.x*0.3, y + 1.6, z + tt.z*0.3);
      fl.rotation.y = Math.atan2(tt.x, tt.z) + Math.PI/2; pg.add(fl);
    }
  }
  mergeStatic(pg); scene.add(pg);
})

/* --- conifer geometry, built whorl by whorl ---------------------------
   Unit height, so the instance scale is the tree height. Each whorl is a
   ring of branch tips at varying radius and droop, so the silhouette is
   ragged from every angle. Non-indexed on purpose: flat normals give the
   faceted foliage that reads as a tree rather than a smooth cone. */
function coniferGeometry(kind){
  const rnd = (a,b)=> a + Math.random()*(b-a);
  const TAU = Math.PI*2;
  const P = [
    // tall spruce, narrow, many tiers
    {W:14, N:10, R:0.255, bare:0.15, taper:0.88, droop:0.52, tier:0.115, hueA:104, hueB:132, lumA:16, lumB:30},
    // fat fir, fewer tiers, broad skirt
    {W:11, N:11, R:0.320, bare:0.10, taper:0.74, droop:0.62, tier:0.145, hueA: 88, hueB:118, lumA:19, lumB:34},
    // lanky pine, bare trunk, crown up top
    {W:10, N: 9, R:0.215, bare:0.34, taper:0.62, droop:0.45, tier:0.130, hueA:112, hueB:142, lumA:15, lumB:28}
  ][kind];

  const pos = [], col = [];
  const c = new THREE.Color();
  const push = (x,y,z)=>{ pos.push(x,y,z); col.push(c.r, c.g, c.b); };
  const tri = (a,b,d)=>{ push(a[0],a[1],a[2]); push(b[0],b[1],b[2]); push(d[0],d[1],d[2]); };

  /* trunk: tapered, six sided, running up into the canopy */
  const TN = 6, tH = P.bare + 0.22, rb = 0.028, rt = 0.012;
  for(let n=0;n<TN;n++){
    const a0 = n/TN*TAU, a1 = (n+1)/TN*TAU;
    const shade = rnd(0.75, 1.15);
    c.setHSL(0.075, 0.34, 0.15*shade);
    const p00 = [Math.cos(a0)*rb, 0, Math.sin(a0)*rb];
    const p10 = [Math.cos(a1)*rb, 0, Math.sin(a1)*rb];
    const p01 = [Math.cos(a0)*rt, tH, Math.sin(a0)*rt];
    const p11 = [Math.cos(a1)*rt, tH, Math.sin(a1)*rt];
    tri(p00, p10, p11);
    tri(p00, p11, p01);
  }

  /* branch whorls */
  for(let w=0; w<P.W; w++){
    const f = w/(P.W-1);                                  // 0 at the bottom
    const yb = P.bare + (1 - P.bare)*f*0.93;
    const R  = P.R * Math.pow(1-f, P.taper) + 0.022;
    const apexY = yb + P.tier*(1 - f*0.45);
    const spin = w*0.62 + rnd(0, 0.4);

    // rim points shared between neighbouring faces, alternating long and short
    const rim = [];
    for(let n=0;n<P.N;n++){
      const a = spin + (n/P.N)*TAU + rnd(-0.09, 0.09);
      const len = (n%2 ? 1.0 : 0.76) * rnd(0.86, 1.16);
      const r = R*len;
      rim.push([Math.cos(a)*r, yb - P.droop*R*rnd(0.55, 1.3), Math.sin(a)*r]);
    }

    for(let n=0;n<P.N;n++){
      const a = rim[n], b = rim[(n+1)%P.N];
      const shade = rnd(0.82, 1.14);
      const lum = (P.lumA + (P.lumB-P.lumA)*f)/100 * shade;
      c.setHSL(rnd(P.hueA, P.hueB)/360, rnd(0.30, 0.50), lum);
      tri([0, apexY, 0], a, b);
      // a short underside face so the tier is not hollow when seen from below
      c.setHSL(rnd(P.hueA, P.hueB)/360, rnd(0.26, 0.44), lum*0.62);
      tri([0, yb - P.droop*R*0.35, 0], b, a);
    }
  }

  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color",    new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

/* snow lying on anything that faces up: the tops of the whorls go white */
function snowify(g){
  const n = g.attributes.normal, col = g.attributes.color;
  for(let i=0;i<col.count;i++){
    const up = n.getY(i);
    const k = Math.max(0, Math.min(1, (up - 0.15)/0.45))*0.85;
    col.setXYZ(i, col.getX(i)*(1-k) + 0.93*k, col.getY(i)*(1-k) + 0.95*k, col.getZ(i)*(1-k) + 0.99*k);
  }
  return g;
}
/* a saguaro: a ribbed column with two or three arms turned up at the elbow */
function cactusGeometry(){
  const pos = [], col = [], c = new THREE.Color();
  const put = (geo)=>{
    const g = geo.index ? geo.toNonIndexed() : geo, a = g.attributes.position;
    for(let i=0;i<a.count;i++){
      pos.push(a.getX(i), a.getY(i), a.getZ(i));
      const ang = Math.atan2(a.getZ(i), a.getX(i));
      const rib = 0.82 + 0.18*Math.abs(Math.cos(ang*5));        // the pleats
      c.setHSL(0.27 + Math.random()*0.02, 0.36, 0.30*rib); col.push(c.r, c.g, c.b);
    }
  };
  const R = 0.07;
  const trunk = new THREE.CylinderGeometry(R*0.9, R, 1, 10, 3); trunk.translate(0, 0.5, 0); put(trunk);
  const top = new THREE.SphereGeometry(R*0.9, 10, 4, 0, Math.PI*2, 0, Math.PI/2); top.translate(0, 1, 0); put(top);
  const arms = 2 + (Math.random() < 0.5 ? 1 : 0);
  for(let k=0;k<arms;k++){
    const a = k/arms*Math.PI*2 + Math.random()*0.8, y0 = 0.35 + Math.random()*0.25, out = 0.14 + Math.random()*0.05;
    const up = 0.22 + Math.random()*0.2, r = R*0.62;
    const el = new THREE.CylinderGeometry(r, r, out, 8); el.rotateZ(Math.PI/2); el.translate(out/2, y0, 0);
    el.rotateY(a); put(el);
    const ar = new THREE.CylinderGeometry(r*0.9, r, up, 8); ar.translate(out, y0 + up/2, 0); ar.rotateY(a); put(ar);
    const cap = new THREE.SphereGeometry(r*0.9, 8, 3, 0, Math.PI*2, 0, Math.PI/2); cap.translate(out, y0 + up, 0); cap.rotateY(a); put(cap);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}
/* A broadleaf: a short trunk and a crown of lumpy blobs, drawn pale so
   the per-tree tint gives it its colour (red, orange, gold). */
function hardwoodGeometry(kind){
  const pos = [], col = [], c = new THREE.Color();
  const put = (geo, shade)=>{
    const g = geo.index ? geo.toNonIndexed() : geo, a = g.attributes.position;
    for(let i=0;i<a.count;i++){
      pos.push(a.getX(i), a.getY(i), a.getZ(i));
      shade(a.getY(i)); col.push(c.r, c.g, c.b);
    }
  };
  const tH = kind === 2 ? 0.40 : 0.26;
  const trunk = new THREE.CylinderGeometry(0.012, 0.03, tH + 0.12, 6); trunk.translate(0, (tH + 0.12)/2, 0);
  put(trunk, ()=> c.setHSL(0.07, 0.2, 0.10));
  const R = kind === 1 ? 0.33 : kind === 2 ? 0.24 : 0.28, n = kind === 1 ? 10 : kind === 2 ? 6 : 8;
  for(let k=0;k<n;k++){
    const a = k/n*Math.PI*2 + Math.random()*0.6, rr = k === 0 ? 0 : R*(0.45 + Math.random()*0.4);
    const r = R*(0.55 + Math.random()*0.35);
    const b = new THREE.IcosahedronGeometry(r, 0);
    b.translate(Math.cos(a)*rr, tH + R*0.75 + (k === 0 ? R*0.55 : Math.random()*R*0.9), Math.sin(a)*rr);
    put(b, y=> c.setHSL(0, 0, 0.66 + Math.random()*0.3));
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
  g.computeVertexNormals();
  return g;
}

function billboardField(tex, cell, pos, scale, uv, tint){
  const base = new THREE.PlaneGeometry(1, 1);
  base.translate(0, 0.5, 0);
  const geo = new THREE.InstancedBufferGeometry();
  geo.setIndex(base.index);
  geo.setAttribute("position", base.attributes.position);
  geo.setAttribute("uv", base.attributes.uv);
  geo.setAttribute("normal", base.attributes.normal);
  geo.setAttribute("iPos",   new THREE.InstancedBufferAttribute(new Float32Array(pos), 3));
  geo.setAttribute("iScale", new THREE.InstancedBufferAttribute(new Float32Array(scale), 2));
  geo.setAttribute("iUv",    new THREE.InstancedBufferAttribute(new Float32Array(uv), 2));
  geo.setAttribute("iTint",  new THREE.InstancedBufferAttribute(new Float32Array(tint), 1));
  geo.instanceCount = tint.length;
  geo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 3000);
  const mat = new THREE.ShaderMaterial({
    uniforms: {
      map:{value:tex}, uCell:{value:cell},
      fogColor:{value:new THREE.Color(scene.fog.color)},
      fogNear:{value:scene.fog.near}, fogFar:{value:scene.fog.far}
    },
    vertexShader: [
      "attribute vec3 iPos; attribute vec2 iScale; attribute vec2 iUv; attribute float iTint;",
      "uniform float uCell;",
      "varying vec2 vUv; varying float vTint; varying float vDepth;",
      "void main(){",
      "  vec3 right = normalize(vec3(viewMatrix[0][0], viewMatrix[1][0], viewMatrix[2][0]));",
      "  vec3 world = iPos + right*(position.x*iScale.x) + vec3(0.0,1.0,0.0)*(position.y*iScale.y);",
      "  vec4 mv = viewMatrix * vec4(world, 1.0);",
      "  vDepth = -mv.z; vUv = iUv + uv*uCell; vTint = iTint;",
      "  gl_Position = projectionMatrix * mv;",
      "}"
    ].join("\n"),
    fragmentShader: [
      "uniform sampler2D map; uniform vec3 fogColor; uniform float fogNear; uniform float fogFar;",
      "varying vec2 vUv; varying float vTint; varying float vDepth;",
      "void main(){",
      "  vec4 t = texture2D(map, vUv);",
      "  if(t.a < 0.22) discard;",
      "  float f = clamp((vDepth - fogNear)/(fogFar - fogNear), 0.0, 1.0);",
      "  gl_FragColor = vec4(mix(t.rgb*vTint, fogColor, f), 1.0);",
      "}"
    ].join("\n")
  });
  const m = new THREE.Mesh(geo, mat);
  m.frustumCulled = false;
  return m;
}

/* a lumpy boulder, no two alike */
/* a bush: a core mass with lobes grown out of it, every lobe overlapping
   its neighbour so the thing reads as one plant instead of loose blobs */
function bushGeometry(seed){
  const parts = [];
  const core = new THREE.IcosahedronGeometry(0.62, 1);
  {
    const pp = core.attributes.position, v = new THREE.Vector3();
    for(let i=0;i<pp.count;i++){
      v.fromBufferAttribute(pp, i);
      v.multiplyScalar(0.9 + Math.random()*0.22);
      v.y = v.y*0.8 + 0.5;
      pp.setXYZ(i, v.x, Math.max(0.02, v.y), v.z);
    }
  }
  parts.push(core);

  const lobes = 4 + Math.floor(Math.random()*3);
  for(let b=0;b<lobes;b++){
    const r = 0.30 + Math.random()*0.24;
    const s2 = new THREE.IcosahedronGeometry(r, 1);
    const ang = (b/lobes)*Math.PI*2 + Math.random()*0.5;
    const reach = 0.34 + Math.random()*0.20;          // always inside the core
    const ox = Math.cos(ang)*reach, oz = Math.sin(ang)*reach;
    const oy = 0.34 + Math.random()*0.45;
    const pp = s2.attributes.position, v = new THREE.Vector3();
    for(let i=0;i<pp.count;i++){
      v.fromBufferAttribute(pp, i);
      v.multiplyScalar(0.85 + Math.random()*0.3);
      pp.setXYZ(i, v.x+ox, Math.max(0.02, v.y+oy), v.z+oz);
    }
    parts.push(s2);
  }
  // a few bare stems at the base so it grows out of the ground
  for(let b=0;b<3;b++){
    const st = new THREE.CylinderGeometry(0.02, 0.035, 0.42, 4);
    st.translate((Math.random()-0.5)*0.3, 0.21, (Math.random()-0.5)*0.3);
    parts.push(st);
  }

  const pos = [], col = [];
  const c = new THREE.Color();
  parts.forEach((sgeo, gi)=>{
    const aP = sgeo.attributes.position;
    const idx = sgeo.index;
    const count = idx ? idx.count : aP.count;
    const woody = gi >= parts.length-3;
    for(let k=0;k<count;k++){
      const i = idx ? idx.getX(k) : k;
      const x=aP.getX(i), y=aP.getY(i), z=aP.getZ(i);
      pos.push(x,y,z);
      if(woody) c.setHSL(0.09, 0.30, 0.16 + Math.random()*0.05);
      else c.setHSL(0.23 + Math.random()*0.08, 0.36 + Math.random()*0.2,
                    0.11 + y*0.20 + Math.random()*0.05);
      col.push(c.r, c.g, c.b);
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("color", new THREE.Float32BufferAttribute(col,3));
  g.computeVertexNormals();
  return g;
}

/* Every scatter layer was one InstancedMesh covering the whole map. In
   r128 an instanced mesh is culled against its single source geometry
   sitting at the origin, so a species could vanish when you looked away
   from the middle of the map, and when it didn't, every tree was drawn
   every frame. Split them into cells with honest bounds and the camera,
   and the shadow pass, only touch what they can actually see. */
function chunkInstances(){
  const CELL = 170;
  const list = [];
  scene.children.forEach(o=>{ if(o.isInstancedMesh && o.count > 40 && !o.material.isShaderMaterial) list.push(o); });
  const m = new THREE.Matrix4(), p = new THREE.Vector3(), q = new THREE.Quaternion(), s = new THREE.Vector3();
  list.forEach(src=>{
    const geo = src.geometry;
    if(!geo.boundingSphere) geo.computeBoundingSphere();
    const r0 = geo.boundingSphere.radius, c0 = geo.boundingSphere.center;
    const buckets = new Map();
    for(let i=0;i<src.count;i++){
      src.getMatrixAt(i, m);
      p.setFromMatrixPosition(m);
      const key = Math.floor(p.x/CELL) + "," + Math.floor(p.z/CELL);
      if(!buckets.has(key)) buckets.set(key, []);
      buckets.get(key).push(i);
    }
    const colors = src.instanceColor ? src.instanceColor.array : null;
    buckets.forEach(ids=>{
      const g2 = new THREE.BufferGeometry();
      for(const name in geo.attributes) g2.setAttribute(name, geo.attributes[name]);
      if(geo.index) g2.setIndex(geo.index);
      geo.groups.forEach(gr => g2.addGroup(gr.start, gr.count, gr.materialIndex));
      const im = new THREE.InstancedMesh(g2, src.material, ids.length);
      const ctr = new THREE.Vector3(), pts2 = [];
      ids.forEach((id, k)=>{
        src.getMatrixAt(id, m);
        im.setMatrixAt(k, m);
        m.decompose(p, q, s);
        const cw = c0.clone().multiply(s).applyQuaternion(q).add(p);
        const rad = r0*Math.max(s.x, s.y, s.z);
        pts2.push([cw, rad]);
        ctr.add(cw);
        if(colors){
          if(!im.instanceColor) im.instanceColor = new THREE.InstancedBufferAttribute(new Float32Array(ids.length*3), 3);
          im.instanceColor.setXYZ(k, colors[id*3], colors[id*3+1], colors[id*3+2]);
        }
      });
      ctr.divideScalar(ids.length);
      let R = 0;
      pts2.forEach(e => R = Math.max(R, e[0].distanceTo(ctr) + e[1]));
      g2.boundingSphere = new THREE.Sphere(ctr, R);
      im.instanceMatrix.needsUpdate = true;
      if(im.instanceColor) im.instanceColor.needsUpdate = true;
      im.renderOrder = src.renderOrder;
      im.castShadow = true;
      im.receiveShadow = false;
      im.userData = Object.assign({}, src.userData, {chunk:true});
      scene.add(im);
    });
    scene.remove(src);
  });
}
chunkInstances();

/* --- lofting -------------------------------------------------------
   A car body is a set of cross sections swept along its length, not a
   stack of boxes. Each station is a superellipse with its own width,
   height and tumblehome, so shoulders round over, the nose and tail
   taper, and the sides pull in towards the roof. */
function profileRing(st, N){
  const pts = [];
  const e = 2/st.n;
  for(let j=0;j<N;j++){
    const t = j/N*Math.PI*2;
    const ct = Math.cos(t), stt = Math.sin(t);
    let x = Math.sign(ct)*Math.pow(Math.abs(ct), e)*st.w/2;
    const y = Math.sign(stt)*Math.pow(Math.abs(stt), e)*st.h/2;
    if(stt > 0) x *= (1 - (st.tum||0)*stt);        // tumblehome
    pts.push([x, st.yc + y, st.z]);
  }
  return pts;
}

function loftGeometry(sts, N, matFor, caps){
  const rings = sts.map(s=> profileRing(s, N));
  const pos = [], uvs = [];
  const run = [0];
  for(let i=1;i<sts.length;i++) run.push(run[i-1] + Math.abs(sts[i].z - sts[i-1].z));
  const total = run[run.length-1] || 1;

  rings.forEach((r, i)=>{
    r.forEach((p, j)=>{
      pos.push(p[0], p[1], p[2]);
      uvs.push(run[i]/total, j/N);
    });
  });

  const byMat = {};
  const put = (m, ...ix)=>{ (byMat[m] = byMat[m] || []).push(...ix); };
  for(let i=0;i<rings.length-1;i++){
    for(let j=0;j<N;j++){
      const j2 = (j+1)%N;
      const a = i*N+j, b = i*N+j2, c = (i+1)*N+j, d = (i+1)*N+j2;
      const t = (j+0.5)/N*Math.PI*2;
      const m = matFor ? matFor(i, t) : 0;
      put(m, a, c, d, a, d, b);
    }
  }

  if(caps){
    const front = pos.length/3;                    // cap the nose
    pos.push(0, sts[0].yc, sts[0].z); uvs.push(0, 0);
    for(let j=0;j<N;j++) put(0, front, j, (j+1)%N);
    const back = pos.length/3;                     // and the tail
    const L = sts.length-1;
    pos.push(0, sts[L].yc, sts[L].z); uvs.push(1, 0);
    for(let j=0;j<N;j++) put(0, back, L*N + (j+1)%N, L*N + j);
  }

  const geo = new THREE.BufferGeometry();
  geo.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute("uv", new THREE.Float32BufferAttribute(uvs, 2));
  const idx = [];
  let start = 0;
  Object.keys(byMat).map(Number).sort().forEach(m=>{
    const arr = byMat[m];
    idx.push(...arr);
    geo.addGroup(start, arr.length, m);
    start += arr.length;
  });
  geo.setIndex(idx);
  geo.computeVertexNormals();
  return geo;
}

/* a trim strip that follows the body surface at a fixed profile angle */
function railGeometry(sts, t0, halfW, halfT, zMax, zMin){
  const pos = [], idx = [];
  const use = sts.filter(s=> s.z <= zMax + 1e-6 && s.z >= zMin - 1e-6);
  if(use.length < 2) return null;
  const at = (st, t)=>{
    const e = 2/st.n, ct = Math.cos(t), stt = Math.sin(t);
    let x = Math.sign(ct)*Math.pow(Math.abs(ct), e)*st.w/2;
    const y = Math.sign(stt)*Math.pow(Math.abs(stt), e)*st.h/2;
    if(stt > 0) x *= (1 - (st.tum||0)*stt);
    return [x, st.yc + y];
  };
  use.forEach((st, i)=>{
    const p = at(st, t0), pa = at(st, t0-0.06), pb = at(st, t0+0.06);
    let tx = pb[0]-pa[0], ty = pb[1]-pa[1];
    const tl = Math.hypot(tx,ty) || 1; tx/=tl; ty/=tl;      // surface tangent
    const ox = -ty, oy = tx;                                // outward normal
    const sgn = (p[0]*ox + (p[1]-st.yc)*oy) < 0 ? -1 : 1;
    const nx = ox*sgn, ny = oy*sgn;
    [[ halfW,  halfT], [ halfW, -halfT], [-halfW, -halfT], [-halfW,  halfT]].forEach(c=>{
      pos.push(p[0] + tx*c[0] + nx*c[1], p[1] + ty*c[0] + ny*c[1], st.z);
    });
    if(i>0){
      const a = (i-1)*4, b = i*4;
      for(let k=0;k<4;k++){
        const k2 = (k+1)%4;
        idx.push(a+k, b+k, b+k2, a+k, b+k2, a+k2);
      }
    }
  });
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setIndex(idx);
  g.computeVertexNormals();
  return g;
}

/* --- the car --------------------------------------------------------
   Proportioned off a real full size wagon: 5.56 long, 1.98 wide, 1.49
   to the roof, 2.95 wheelbase, with the short nose and long tail that
   make it read as a wagon rather than a shortened sedan. */
const RIDE = 0.15;        // how far the shell rides above the axles
const WHEEL_R = 0.34;     // the wagon's own wheels
const WAGON_AXLE_F = 1.42, WAGON_AXLE_R = -1.38, WAGON_TRACK = 0.78;
const WAGON_PIPE_X = -0.55, WAGON_PIPE_Z = -2.47;   // driver's side tailpipe
/* Many small static meshes cost one draw call each (two, with the shadow
   pass). Anything that never moves relative to its group is baked into one
   mesh per material. Materials are kept, so recolouring the paint or
   lighting the brake lamps still works. */
function mergeStatic(root, keep){
  root.updateMatrixWorld(true);
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const groups = new Map(), dead = [];
  root.traverse(o=>{
    if(!o.isMesh || o.isInstancedMesh || Array.isArray(o.material)) return;
    if(o.material.transparent || o.material.isMeshBasicMaterial || o.material.isShaderMaterial) return;
    if(keep && keep(o)) return;
    let p = o.parent, skip = false;
    while(p && p !== root){ if(p.userData.noMerge) skip = true; p = p.parent; }
    if(skip) return;
    const m = new THREE.Matrix4().multiplyMatrices(inv, o.matrixWorld);
    let geo = o.geometry.index ? o.geometry.toNonIndexed() : o.geometry.clone();
    geo.applyMatrix4(m);
    if(!geo.attributes.normal) geo.computeVertexNormals();
    const k = o.material.uuid;
    if(!groups.has(k)) groups.set(k, {mat:o.material, geos:[]});
    groups.get(k).geos.push(geo);
    dead.push(o);
  });
  if(dead.length < 3) return root;
  dead.forEach(o=> o.parent.remove(o));
  groups.forEach(({mat, geos})=>{
    const uv = geos.every(g=> g.attributes.uv);
    let n = 0; geos.forEach(g=> n += g.attributes.position.count);
    const aP = new THREE.Float32BufferAttribute(n*3, 3), aN = new THREE.Float32BufferAttribute(n*3, 3);
    const aU = uv ? new THREE.Float32BufferAttribute(n*2, 2) : null;
    const P = aP.array, N = aN.array, U = aU ? aU.array : null;
    let o = 0;
    geos.forEach(g=>{
      P.set(g.attributes.position.array, o*3); N.set(g.attributes.normal.array, o*3);
      if(U) U.set(g.attributes.uv.array, o*2);
      o += g.attributes.position.count; g.dispose();
    });
    const out = new THREE.BufferGeometry();
    out.setAttribute("position", aP);
    out.setAttribute("normal", aN);
    if(aU) out.setAttribute("uv", aU);
    const mesh = new THREE.Mesh(out, mat);
    mesh.castShadow = true; mesh.receiveShadow = false;
    root.add(mesh);
  });
  return root;
}

/* Muck on the car: it builds up through the race, mud and dust low on the
   body and flung up the sides, packed snow in the arches, and a wade through
   a ford washes some of it off again. Only the player's wagon carries it. */
const CAR_DIRT = { uDirt:{value:0}, uSnow:{value:0}, uGround:{value:0}, uDirtCol:{value:new THREE.Color(0x4a3524)} };
function dirtify(m){
  m.onBeforeCompile = sh=>{
    Object.assign(sh.uniforms, CAR_DIRT);
    sh.vertexShader = sh.vertexShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vDW; varying vec3 vDL;")
      .replace("#include <begin_vertex>", "#include <begin_vertex>\nvDL = transformed; vDW = (modelMatrix*vec4(transformed, 1.0)).xyz;");
    sh.fragmentShader = sh.fragmentShader
      .replace("#include <common>", "#include <common>\nvarying vec3 vDW; varying vec3 vDL; uniform float uDirt, uSnow, uGround; uniform vec3 uDirtCol;")
      .replace("#include <color_fragment>", [
        "#include <color_fragment>",
        "{",
        "  float hgt = vDW.y - uGround;",
        "  float low = 1.0 - smoothstep(0.30, 1.35, hgt);",
        "  vec2 q = floor(vDL.xz*7.0 + vDL.y*4.0);",
        "  float n = fract(sin(dot(q, vec2(12.9898, 78.233)))*43758.5453);",
        "  float n2 = fract(sin(dot(floor(vDL.zy*3.0 + vDL.x*2.0), vec2(39.3, 11.7)))*24634.63);",
        "  float cover = clamp(uDirt*(0.35 + low*1.1) - 0.25*(n2 - 0.5), 0.0, 1.0);",
        "  float splat = smoothstep(1.0 - cover*1.4, 1.05 - cover*1.4, n*0.6 + low*0.45);",
        "  diffuseColor.rgb = mix(diffuseColor.rgb, uDirtCol*(0.85 + 0.3*n2), clamp(cover*0.75 + splat*uDirt*0.5, 0.0, 0.88));",
        "  diffuseColor.rgb = mix(diffuseColor.rgb, vec3(0.92, 0.95, 0.99), clamp(uSnow*low*1.3 + uSnow*0.15*n, 0.0, 0.85));",
        "}"].join("\n"));
  };
  m.customProgramCacheKey = ()=> "dirt";
}
function buildWagon(opts){
  /* The boxy station wagon, built the way the game needs it: a body shell
     that rides on its springs, four wheel pivots and a live rear axle that
     move independently of it, one brake-light material the game can light,
     and the exhaust flames. Units are metres, origin at ground level, +Z
     forward, +X is the driver's (left) side. */
  const opt = opts || {};
  const acc = opt.acc || null;
  const cargo = !!(opt.cargo !== undefined ? opt.cargo : (opt.rust || 0) >= 30);
  const o = {
    bodyColor: opt.paint || "#7a3b2e",
    beater: !!opt.beat || (opt.rust || 0) >= 50,   // junkyard door, rust, tape, bare wheel
    sport: opt.model === 1,                        // the low sporty wagon instead of the box
    fender: opt.fender | 0,                        // 0 stock, 1 flares, 2 wide off-road with flaps
    rim: opt.rim | 0,                              // 0 steel, 1 five spoke, 2 rally white, 3 gold
    ws: [0.9, 1, 1.14][opt.wheel === undefined ? 1 : opt.wheel],
    livery: opt.livery | 0,                        // 0 plain, 1 stripes, 2 rally number
    acc: acc || { rack: true, spare: cargo, cans: cargo }
  };
  const A = o.acc;

  const g = new THREE.Group();
  g.name = "stationWagon";
  const shell = new THREE.Group();
  const TWR = WHEEL_R*o.ws, LIFT = TWR - WHEEL_R;   // bigger wheels lift the whole body
  shell.position.y = RIDE + LIFT;          // body sits up on its springs
  g.add(shell);
  // the model is drawn from the ground up; the shell's rest height is RIDE,
  // so everything inside it is offset back down to ground level
  const car = new THREE.Group();
  car.position.y = -RIDE;
  shell.add(car);

  const mat = (color, extra = {}) => new THREE.MeshStandardMaterial(
    Object.assign({ color, flatShading: true, roughness: 0.8, metalness: 0.05,
                    envMap: ENV, envMapIntensity: 0.7 }, extra)
  );
  const doorColor = new THREE.Color(o.bodyColor).lerp(new THREE.Color(0x6b6558), 0.35);
  const M = {
    paint:   mat(o.bodyColor, { roughness: 0.65, metalness: 0.15 }),
    door:    mat(doorColor, { roughness: 0.95 }),
    rust:    mat(0x5e3218, { roughness: 1 }),
    glass:   mat(0x1d2a33, { roughness: 0.15, metalness: 0.6, envMapIntensity: 1.0 }),
    trim:    mat(0x222222, { roughness: 0.9 }),
    under:   mat(0x2a2724, { roughness: 1 }),
    chrome:  mat(0xb8b8b0, { roughness: 0.35, metalness: 0.8, envMapIntensity: 1.1 }),
    tire:    mat(0x1a1a1a, { roughness: 1 }),
    rim:     mat(0x9a9a92, { roughness: 0.5, metalness: 0.6 }),
    head:    mat(0xfff3c4, { emissive: 0xffe9a0, emissiveIntensity: 0.7 }),
    headDim: mat(0xd9cfa8, { emissive: 0x8a7f50, emissiveIntensity: 0.4 }),
    // the game drives this one: dim when rolling, bright under braking
    tail:    mat(0xb01818, { emissive: 0xff1a10, emissiveIntensity: 0.22 }),
    reverse: mat(0xeeeeea, { emissive: 0x333333, emissiveIntensity: 0.3 }),
    amber:   mat(0xe08a1e, { emissive: 0x552800, emissiveIntensity: 0.4 }),
    plate:   mat(0xe8e4d8, { roughness: 0.9 }),
    plateInk:mat(0x1f3a6b, { roughness: 0.9 }),
    defrost: mat(0x3a2a22, { roughness: 1 }),
    tape:    mat(0xb9b5aa, { roughness: 0.7, metalness: 0.3 }),
    sticker: mat(0xd9b43a, { roughness: 0.9 }),
    strap:   mat(0x2b2b2b, { roughness: 1 }),
    jerry:   mat(0x3f5a2a, { roughness: 0.8 }),
    jerryR:  mat(0xb3261e, { roughness: 0.8 }),
    jerryX:  mat(0x55733a, { roughness: 0.7 }),
    jerryRX: mat(0xcf3a2c, { roughness: 0.7 }),
    plastic: mat(0x1c1c1c, { roughness: 0.95 }),
    stripe:  mat(0xf2efe6, { roughness: 0.6 }),
    wood:    mat(0x8a5a34, { roughness: 0.9 }),
    steelB:  mat(0x6c6f72, { roughness: 0.5, metalness: 0.6 }),
    rimW:    mat(0xeeeeea, { roughness: 0.5, metalness: 0.2 }),
    rimG:    mat(0xc9a13a, { roughness: 0.35, metalness: 0.8, envMapIntensity: 1.1 }),
    rimS:    mat(0xc8c8c4, { roughness: 0.3, metalness: 0.85, envMapIntensity: 1.1 }),
  };
  M.brake = M.tail;                        // third brake light lights with the others
  if(opt.dirt) ["paint","door","rust","trim","under","plastic","stripe","wood","tire","rim","rimW","rimG","rimS","steelB","chrome","jerry","jerryR","jerryX","jerryRX","plate","strap"]
    .forEach(k=>{ if(M[k]) dirtify(M[k]); });

  const add = (geo, material, x = 0, y = 0, z = 0, parent = car) => {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  };
  const box = (w, h, d, material, x, y, z, parent) =>
    add(new THREE.BoxGeometry(w, h, d), material, x, y, z, parent);
  const cyl = (r, len, seg, material, axis, x, y, z, parent) => {
    const geo = new THREE.CylinderGeometry(r, r, len, seg);
    if (axis === 'x') geo.rotateZ(Math.PI / 2);
    if (axis === 'z') geo.rotateX(Math.PI / 2);
    return add(geo, material, x, y, z, parent);
  };
  const extrude = (pts, width, material, bevel = 0, x = 0) => {
    const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: width, bevelEnabled: bevel > 0,
      bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 1,
    });
    geo.translate(0, 0, -width / 2);
    geo.rotateY(-Math.PI / 2);
    return add(geo, material, x, 0, 0);
  };

  // ---- Key dimensions ----
  const WR = WHEEL_R;
  const AXLE_F = WAGON_AXLE_F, AXLE_R = WAGON_AXLE_R;
  const ARCH = 0.45*Math.max(1, o.ws), SILL = 0.30, L = 2.3;
  const TRACK = WAGON_TRACK, SIDE = 0.905, REAR = -2.345;
  // the box: a tall glasshouse with an upright tailgate; the sport: low roof,
  // raked screen, and a hatch that slopes away
  const BELT = o.sport ? 0.83 : 0.92, ROOF = o.sport ? 1.29 : 1.46;
  const WSB = o.sport ? 1.08 : 1.18, WST = o.sport ? 0.1 : 0.42;     // windscreen foot and top, along the car
  const RT = o.sport ? -1.72 : -2.08, RB = o.sport ? -2.26 : -2.22;   // rear window top and foot

  // ---- Lower body with chunky low-poly wheel arches ----
  const body = [[-L, SILL]];
  const arch = (cz) => {
    for (let i = 0; i <= 6; i++) {
      const a = Math.PI - (i / 6) * Math.PI;
      body.push([cz + ARCH * Math.cos(a), WR + ARCH * Math.sin(a) * 0.95]);
    }
  };
  arch(AXLE_R);
  arch(AXLE_F);
  if(o.sport) body.push([L, SILL], [L + 0.04, 0.58], [L - 0.14, 0.73], [WSB, BELT], [-L + 0.05, BELT], [-L, 0.8]);
  else body.push([L, SILL], [L, 0.72], [L - 0.1, 0.84], [1.2, BELT], [-L + 0.05, BELT], [-L, 0.86]);
  extrude(body, 1.72, M.paint, 0.04);

  // ---- Greenhouse ----
  extrude([[WSB, BELT], [WST, ROOF - 0.02], [RT, ROOF], [RB, BELT]], 1.58, M.glass);
  box(1.66, 0.06, WST - RT + 0.2, M.paint, 0, ROOF + 0.01, (WST + RT)/2);
  const BP = o.sport ? 0.25 : 0;
  const pillars = [
    [[WSB + 0.02, BELT], [WSB - 0.12, BELT], [WST - 0.06, ROOF - 0.01], [WST + 0.06, ROOF - 0.01]],
    [[0.08 - BP, BELT], [-0.06 - BP, BELT], [-0.06 - BP, ROOF - 0.01], [0.08 - BP, ROOF - 0.01]],
    [[-1.08, BELT], [-1.2, BELT], [-1.2, ROOF], [-1.08, ROOF]],
    [[RB + 0.32, BELT], [RB - 0.02, BELT], [RT, ROOF], [RT + 0.2, ROOF]],
  ];
  for (const s of [1, -1]) for (const p of pillars) extrude(p, 0.05, M.paint, 0, s * 0.805);

  // ---- Front ----
  if(o.sport){
    box(0.7, 0.14, 0.04, M.plastic, 0, 0.58, L + 0.03);
    box(0.34, 0.12, 0.05, M.head, 0.58, 0.62, L - 0.02).rotation.y = -0.15;
    box(0.34, 0.12, 0.05, o.beater ? M.headDim : M.head, -0.58, 0.62, L - 0.02).rotation.y = 0.15;
    box(0.1, 0.06, 0.04, M.amber, 0.82, 0.5, L + 0.02);
    box(0.1, 0.06, 0.04, M.amber, -0.82, 0.5, L + 0.02);
    box(1.84, 0.2, 0.16, M.plastic, 0, 0.36, L + 0.08);
    box(0.5, 0.08, 0.5, M.paint, 0, BELT - 0.02, 1.62);                    // the hood scoop
    box(0.42, 0.05, 0.04, M.plastic, 0, BELT, 1.88);
    for (const s of [1, -1]) cyl(0.07, 0.05, 10, M.head, 'z', s * 0.62, 0.33, L + 0.17);   // fog lamps
    // black cladding along the sills and a lip under the nose
    for (const s of [1, -1]) box(0.03, 0.16, 3.4, M.plastic, s * (SIDE + 0.012), 0.36, 0.05);
    box(1.7, 0.04, 0.22, M.plastic, 0, 0.25, L + 0.12);
  } else {
    box(0.95, 0.2, 0.04, M.trim, 0, 0.62, 2.35);
    for (let i = 0; i < 4; i++) box(0.9, 0.015, 0.02, M.chrome, 0, 0.55 + i * 0.045, 2.37);
    box(0.3, 0.16, 0.04, M.head, 0.6, 0.64, 2.35);
    box(0.3, 0.16, 0.04, o.beater ? M.headDim : M.head, -0.6, 0.64, 2.35);
    box(0.12, 0.08, 0.04, M.amber, 0.8, 0.5, 2.34);
    box(0.12, 0.08, 0.04, M.amber, -0.8, 0.5, 2.34);
    box(1.86, 0.14, 0.14, M.chrome, 0, 0.36, 2.38);
  }
  for (const s of [1, -1]) {
    if(!o.sport){
      cyl(0.085, 0.07, 8, M.trim, 'z', s * 0.38, 0.52, 2.47);
      cyl(0.07, 0.02, 8, M.head, 'z', s * 0.38, 0.52, 2.51);
      box(0.012, 0.008, 0.95, M.trim, s * 0.7, 0.93, 1.72).rotation.x = 0.08;
    }
    box(0.5, 0.02, 0.02, M.trim, s * 0.28, BELT + 0.055, WSB - 0.05).rotation.y = s * 0.08;
  }

  // ---- Sides ----
  for (const s of [1, -1]) {
    const x = s * SIDE;
    box(0.01, 0.55, 0.015, M.trim, x, 0.62, 0.06);
    box(0.01, 0.55, 0.015, M.trim, x, 0.62, -1.14);
    box(0.02, 0.04, 1.84, M.trim, x, 0.56, 0.02);
    box(0.02, 0.03, WSB - RB, M.trim, s * 0.795, BELT + 0.015, (WSB + RB)/2);
    box(0.03, 0.03, 0.12, M.chrome, s * 0.915, 0.8, -0.1);
    box(0.03, 0.03, 0.12, M.chrome, s * 0.915, 0.8, -1.28);
    box(0.12, 0.1, 0.06, M.trim, s * 0.97, BELT + 0.08, WSB - 0.13);
    box(0.24, 0.22, 0.02, M.trim, s * 0.74, 0.3, -1.88);
    box(0.01, 0.05, 0.1, M.amber, x, 0.6, 2.1);
    box(0.01, 0.05, 0.1, M.tail, x, 0.6, -2.12);
  }
  for (const s of [1, -1]) {
    box(0.01, 0.15, 0.15, M.trim, s * SIDE, 0.72, -1.62);
    box(0.012, 0.13, 0.13, M.paint, s * 0.907, 0.72, -1.62);
  }

  // ---- Rear ----
  for (const s of [1, -1]) box(0.012, 0.46, 0.01, M.trim, s * 0.66, 0.69, REAR);
  box(1.32, 0.012, 0.01, M.trim, 0, 0.46, REAR);
  box(0.24, 0.045, 0.03, M.chrome, 0, 0.76, REAR - 0.01);
  box(0.02, 0.02, 0.01, M.trim, 0, 0.715, REAR - 0.01);
  box(0.07, 0.05, 0.015, M.chrome, 0, 0.83, REAR);
  for (const s of [1, -1]) box(0.2, 0.035, 0.012, M.chrome, s * 0.4, 0.8, REAR);
  for (const s of [1, -1]) {
    const x = s * 0.785;
    box(0.22, 0.4, 0.015, M.chrome, x, 0.67, REAR);
    box(0.19, 0.24, 0.03, M.tail, x, 0.74, REAR - 0.01);
    box(0.19, 0.065, 0.03, M.amber, x, 0.585, REAR - 0.01);
    box(0.19, 0.065, 0.03, M.reverse, x, 0.515, REAR - 0.01);
    box(0.012, 0.36, 0.1, M.tail, s * SIDE, 0.68, -2.27);
  }
  box(0.48, 0.2, 0.012, M.trim, 0, 0.58, REAR);
  box(0.4, 0.14, 0.012, M.plate, 0, 0.575, REAR - 0.006);
  for (let i = 0; i < 6; i++) box(0.035, 0.06, 0.005, M.plateInk, -0.14 + i * 0.056, 0.57, REAR - 0.013);
  box(0.1, 0.02, 0.02, M.reverse, 0, 0.665, REAR - 0.01);

  const RG = Math.hypot(RB - RT, ROOF - BELT);
  const hatch = new THREE.Group();
  hatch.position.set(0, BELT, RB);
  hatch.rotation.x = Math.atan2(RT - RB, ROOF - BELT);
  car.add(hatch);
  for (const s of [1, -1]) box(0.07, RG, 0.03, M.paint, s * 0.755, RG / 2, -0.01, hatch);
  box(1.58, 0.07, 0.03, M.paint, 0, RG - 0.035, -0.01, hatch);
  box(0.32, 0.035, 0.03, M.brake, 0, RG - 0.035, -0.03, hatch);
  for (let i = 0; i < 6; i++) box(1.3, 0.006, 0.006, M.defrost, 0, 0.14 + i * 0.05, -0.004, hatch);
  box(0.05, 0.05, 0.03, M.trim, 0, 0.05, -0.025, hatch);
  box(0.9, 0.02, 0.015, M.trim, 0, 0.08, -0.025, hatch);

  if(o.sport){
    // a proper roof spoiler on two stands
    box(1.5, 0.05, 0.34, M.paint, 0, ROOF + 0.13, RT - 0.05).rotation.x = -0.1;
    for (const s of [1, -1]) box(0.05, 0.12, 0.12, M.plastic, s * 0.55, ROOF + 0.06, RT + 0.02);
  } else {
    box(1.62, 0.03, 0.2, M.paint, 0, ROOF + 0.04, RT - 0.12).rotation.x = -0.12;
  }

  const rearBumper = new THREE.Group();
  car.add(rearBumper);
  box(1.86, 0.14, 0.14, o.sport ? M.plastic : M.chrome, 0, 0.36, -2.38, rearBumper);
  box(1.5, 0.025, 0.16, M.trim, 0, 0.44, -2.38, rearBumper);
  for (const s of [1, -1]) box(0.14, 0.14, 0.26, M.chrome, s * 0.86, 0.36, -2.25, rearBumper);

  box(1.1, 0.06, 0.07, M.under, 0, 0.24, -2.3);
  box(0.08, 0.08, 0.22, M.under, 0, 0.24, -2.45);
  box(0.06, 0.03, 0.12, M.chrome, 0, 0.26, -2.6);
  add(new THREE.SphereGeometry(0.04, 6, 4), M.chrome, 0, 0.3, -2.63);

  // underside: tank and exhausts ride with the body...
  box(0.6, 0.14, 0.45, M.under, 0, 0.2, -1.83);
  for (const s of [1, -1]) {
    box(0.22, 0.12, 0.5, M.under, s * 0.55, 0.19, -1.75);
    cyl(0.04, 0.6, 6, M.under, 'z', s * 0.55, 0.2, -2.15);
    cyl(0.045, 0.04, 6, M.trim, 'z', s * 0.55, 0.2, -2.46);
  }
  // ...but the axle and diff hang off the wheels, so they follow the
  // suspension instead of the body
  const rearAxle = new THREE.Group();
  rearAxle.position.set(0, WR, AXLE_R);
  g.add(rearAxle);
  cyl(0.045, 1.36, 6, M.under, 'x', 0, 0.25 - WR, 0, rearAxle);
  add(new THREE.SphereGeometry(0.12, 6, 4), M.under, 0, 0.22 - WR, 0, rearAxle).scale.set(1.1, 0.9, 1);

  // ---- Roof rack and what rides on it ----
  const RY = ROOF + 0.1, RZ0 = WST - 0.2, RZ1 = RT + 0.1, RZM = (RZ0 + RZ1)/2;
  if (A.rack) {
    for (const s of [1, -1]) {
      box(0.05, 0.05, RZ0 - RZ1, M.trim, s * 0.64, RY, RZM);
      box(0.07, 0.06, 0.1, M.trim, s * 0.64, RY - 0.04, RZ0);
      box(0.07, 0.06, 0.1, M.trim, s * 0.64, RY - 0.04, RZ1);
    }
    for (const f of [0.08, 0.5, 0.92]) box(1.34, 0.04, 0.06, M.trim, 0, RY + 0.04, RZ0 + (RZ1 - RZ0)*f);
  }
  /* A proper jerry can, standing up: the tall flat body with the X pressed
     into both faces, the welded seam round its edge, three carry handles
     across the top and the spout with its cam lever on the front corner.
     Origin at the middle of its base, the wide faces front and back. */
  const jerry = (x, y, z, m, rot) => {
    const j = new THREE.Group(); j.position.set(x, y, z); if(rot) j.rotation.y = rot; car.add(j);
    const W = 0.34, H = 0.46, D = 0.165;
    box(W, H - 0.02, D, m, 0, H/2 - 0.01, 0, j);
    box(W - 0.04, 0.02, D - 0.03, m, 0, H - 0.01, 0, j);                       // the shoulder, stepped in
    box(W + 0.012, 0.018, D + 0.012, m, 0, 0.012, 0, j);                         // the seam round the foot
    for (const s of [1, -1]) {
      box(0.012, H - 0.03, D + 0.012, m, s * (W/2 - 0.003), H/2 - 0.01, 0, j);  // the seam up each side
      // the X, pressed into each wide face
      const L = Math.hypot(W - 0.07, H - 0.1), a = Math.atan2(H - 0.1, W - 0.07);
      for (const k of [1, -1]) {
        const x1 = box(L, 0.038, 0.02, (m === M.jerry ? M.jerryX : M.jerryRX), 0, H/2 - 0.02, s * (D/2 + 0.008), j);
        x1.rotation.z = k * a;
      }
      box(W - 0.05, 0.02, 0.012, m, 0, H - 0.07, s * (D/2 + 0.004), j);        // the rib under the shoulder
    }
    // three handles across the top
    for (const hx of [-0.09, 0, 0.09]) {
      box(0.022, 0.012, D * 0.72, M.plastic, hx, H + 0.045, 0, j);
      for (const hz of [1, -1]) box(0.022, 0.045, 0.014, m, hx, H + 0.02, hz * D * 0.3, j);
    }
    // the spout, angled out at the front corner, and its lever
    const sp = cyl(0.028, 0.06, 8, m, 'y', W/2 - 0.055, H + 0.02, 0, j); sp.rotation.z = -0.45;
    cyl(0.032, 0.02, 8, M.plastic, 'y', W/2 - 0.04, H + 0.045, 0, j).rotation.z = -0.45;
    box(0.07, 0.012, 0.03, M.chrome, W/2 - 0.1, H + 0.012, 0.03, j);
  };
  const spare = (x, y, z, axis) => { cyl(0.32, 0.2, 12, M.tire, axis, x, y, z); cyl(0.19, 0.205, 8, M.rim, axis, x, y, z); };
  if (A.spare) {
    if (A.rack) { spare(-0.1, RY + 0.16, RZM, 'y'); box(0.05, 0.012, 0.66, M.strap, -0.1, RY + 0.266, RZM); }
    else spare(0, 0.62, REAR - 0.16, 'z');                                  // hung on the tailgate
  }
  if (A.cans) {
    if (A.rack) {
      // stood side by side in a tray at the back of the rack, strapped in
      const cz = RZ1 + 0.2;
      box(0.84, 0.02, 0.24, M.trim, 0, RY + 0.07, cz);
      jerry(0.2, RY + 0.08, cz, M.jerry); jerry(-0.2, RY + 0.08, cz, M.jerryR);
      box(0.86, 0.03, 0.012, M.strap, 0, RY + 0.33, cz - 0.09);
    } else for (const s of [1, -1]) {
      // standing on the rear bumper either side of the tailgate, in a bracket
      jerry(s * 0.49, 0.435, REAR - 0.11, s > 0 ? M.jerry : M.jerryR);
      box(0.36, 0.03, 0.012, M.strap, s * 0.49, 0.72, REAR - 0.2);
      box(0.02, 0.36, 0.02, M.trim, s * 0.67, 0.62, REAR - 0.05);
    }
  }
  if (A.shovel) {
    // strapped along the rack, or down the passenger side
    const sh = new THREE.Group(); car.add(sh);
    if (A.rack) sh.position.set(0.52, RY + 0.08, RZM);
    else {
      sh.position.set(0.5, ROOF + 0.06, (WST + RT)/2);
      for (const dz of [-0.35, 0.3]) box(0.08, 0.04, 0.05, M.plastic, 0.5, ROOF + 0.03, (WST + RT)/2 + dz);
    }
    cyl(0.025, 1.1, 6, M.wood, 'z', 0, 0, 0.1, sh);
    box(0.24, 0.02, 0.3, M.steelB, 0, 0, -0.6, sh);
    box(0.14, 0.03, 0.05, M.plastic, 0, 0, 0.66, sh);
  }
  if (A.lights) {
    // four rally lamps on a bar across the front of the roof
    const ly = A.rack ? RY + 0.14 : ROOF + 0.12, lz = A.rack ? RZ0 + 0.02 : WST - 0.05;
    box(1.4, 0.04, 0.04, M.plastic, 0, ly - 0.1, lz);
    for (const x of [-0.54, -0.18, 0.18, 0.54]) {
      cyl(0.1, 0.1, 10, M.plastic, 'z', x, ly, lz);
      cyl(0.085, 0.02, 10, M.head, 'z', x, ly, lz + 0.055);
    }
  }
  if (A.bull) {
    // a steel push bar in front of the bumper
    for (const s of [1, -1]) cyl(0.035, 0.5, 6, M.plastic, 'y', s * 0.42, 0.55, L + 0.24);
    cyl(0.035, 0.9, 6, M.plastic, 'x', 0, 0.78, L + 0.24);
    cyl(0.035, 1.1, 6, M.plastic, 'x', 0, 0.42, L + 0.28);
  }
  // ---- fenders ----
  if (o.fender > 0 || A.flaps) {
    const t = o.fender === 2 ? 0.2 : 0.12, out = o.fender === 2 ? 0.13 : 0.07;
    if (o.fender > 0) for (const cz of [AXLE_R, AXLE_F]) for (const s of [1, -1]) {
      for (let i = 0; i < 7; i++) {
        const a0 = Math.PI - (i/7)*Math.PI, a1 = Math.PI - ((i + 1)/7)*Math.PI;
        const R = ARCH + 0.04;
        const z0 = cz + R*Math.cos(a0), y0 = WR + R*Math.sin(a0)*0.95, z1 = cz + R*Math.cos(a1), y1 = WR + R*Math.sin(a1)*0.95;
        const seg = box(t, 0.08, Math.hypot(z1 - z0, y1 - y0) + 0.03, M.plastic, s*(SIDE + out - t/2 + 0.02), (y0 + y1)/2, (z0 + z1)/2);
        seg.rotation.x = -Math.atan2(y1 - y0, z1 - z0);
      }
    }
    if (o.fender === 2 || A.flaps) for (const cz of [AXLE_R, AXLE_F]) for (const s of [1, -1])
      box(0.32, 0.34, 0.025, M.plastic, s * (TRACK + 0.02), 0.26, cz - ARCH - 0.08);
  }
  // ---- livery ----
  if (o.livery === 1) {
    for (const x of [-0.18, 0.18]) {
      box(0.16, 0.008, 1.1, M.stripe, x, BELT + 0.008, 1.7).rotation.x = 0.08;
      box(0.16, 0.008, WST - RT + 0.15, M.stripe, x, ROOF + 0.045, (WST + RT)/2);
    }
  } else if (o.livery === 2) {
    for (const s of [1, -1]) {
      cyl(0.24, 0.012, 16, M.stripe, 'x', s * 0.912, 0.62, -0.5);
      box(0.013, 0.3, 0.07, M.plastic, s * 0.915, 0.62, -0.5);            // a "1" on the roundel
      box(0.012, 0.06, 3.9, M.stripe, s * 0.911, 0.42, 0);
    }
  }


  // ---- Beater details ----
  if (o.beater) {
    box(0.012, 0.58, 0.86, M.door, 0.906, 0.63, 0.53);
    box(0.012, 0.1, 0.22, M.rust, -0.906, 0.4, -0.72);
    box(0.012, 0.12, 0.16, M.rust, 0.906, 0.42, -2.02);
    box(0.012, 0.08, 0.14, M.rust, -0.906, 0.38, 2.05);
    box(0.25, 0.012, 0.18, M.rust, -0.4, 0.925, 1.7).rotation.x = 0.08;
    box(0.3, 0.04, 0.01, M.rust, 0.35, 0.49, REAR - 0.002);
    box(0.3, 0.08, 0.005, M.sticker, -0.38, 0.54, REAR - 0.002);
    for (const x of [0.785, -0.785]) for (const s of [1, -1]) {
      box(0.2, 0.035, 0.005, M.tape, x, 0.74, REAR - 0.03).rotation.z = s * 0.5;
    }
    rearBumper.rotation.z = 0.035;
  }

  // ---- Wheels ----
  // In the order the game's suspension expects: front pair then rear pair,
  // passenger side first. The pivots belong to the car, not the shell, so
  // the body moves on its springs over them.
  const TW = 0.24*(o.ws > 1.05 ? 1.2 : 1) + (o.fender === 2 ? 0.04 : 0);
  const tireGeo = new THREE.CylinderGeometry(TWR, TWR, TW, 12);
  tireGeo.rotateZ(Math.PI / 2);
  const rr = 0.2*o.ws*(o.rim ? 1.08 : 1);
  const rimGeo = new THREE.CylinderGeometry(rr, rr, TW + 0.01, o.rim ? 14 : 8);
  rimGeo.rotateZ(Math.PI / 2);
  const capGeo = new THREE.CylinderGeometry(0.08, 0.08, TW + 0.02, 6);
  capGeo.rotateZ(Math.PI / 2);
  const lugGeo = new THREE.BoxGeometry(0.255, 0.025, 0.025);
  const rimMat = [M.rim, M.rimS, M.rimW, M.rimG][o.rim];
  const wheels = [];
  [[-TRACK, AXLE_F, true, true], [TRACK, AXLE_F, true, true],
   [-TRACK, AXLE_R, false, !o.beater], [TRACK, AXLE_R, false, true]].forEach(w=>{
    const pivot = new THREE.Group();
    pivot.position.set(w[0] * (o.fender === 2 ? 1.06 : 1), TWR, w[1]);
    g.add(pivot);
    const spin = new THREE.Group();
    pivot.add(spin);
    add(tireGeo, M.tire, 0, 0, 0, spin);
    add(rimGeo, rimMat, 0, 0, 0, spin);
    if (o.rim === 0) {
      if (w[3]) add(capGeo, M.chrome, 0, 0, 0, spin);
      else for (let i = 0; i < 4; i++) {
        const a = (i / 4) * Math.PI * 2;
        add(lugGeo, M.trim, 0, Math.cos(a) * 0.09, Math.sin(a) * 0.09, spin);
      }
    } else {
      // spokes: dark windows between them so the pattern reads as it turns
      const n = o.rim === 1 ? 5 : o.rim === 2 ? 8 : 6;
      const hole = new THREE.CylinderGeometry(rr*0.2, rr*0.2, TW + 0.03, 8); hole.rotateZ(Math.PI/2);
      for (let i = 0; i < n; i++) {
        const a = (i / n) * Math.PI * 2 + Math.PI/n;
        add(hole, M.plastic, 0, Math.cos(a)*rr*0.6, Math.sin(a)*rr*0.6, spin);
      }
      add(capGeo, o.rim === 3 ? M.rimG : M.chrome, 0, 0, 0, spin).scale.set(1, 0.7, 0.7);
    }
    mergeStatic(spin);
    wheels.push({pivot, mesh: spin, steer: w[2]});
  });

  // ---- Exhaust flame, off the driver's side tailpipe ----
  const flame = new THREE.Mesh(
    new THREE.ConeGeometry(0.1, 0.5, 8),
    new THREE.MeshBasicMaterial({color:0xffa32c, transparent:true, opacity:0,
                                 blending:THREE.AdditiveBlending, depthWrite:false})
  );
  flame.rotation.x = -Math.PI/2;
  flame.position.set(WAGON_PIPE_X, 0.2, WAGON_PIPE_Z - 0.25);
  car.add(flame);
  const flameCore = new THREE.Mesh(
    new THREE.ConeGeometry(0.05, 0.30, 7),
    new THREE.MeshBasicMaterial({color:0xfff0c0, transparent:true, opacity:0,
                                 blending:THREE.AdditiveBlending, depthWrite:false})
  );
  flameCore.rotation.x = -Math.PI/2;
  flameCore.position.set(WAGON_PIPE_X, 0.2, WAGON_PIPE_Z - 0.15);
  car.add(flameCore);

  /* cast shadows onto the road, but don't shadow itself: self-shadowing at
     this shadow map resolution just blackens the wheels and underbody */
  g.traverse(m=>{
    if(!m.isMesh) return;
    if(!(m.material.transparent || m.material.isMeshBasicMaterial)) m.castShadow = true;
    m.receiveShadow = false;
  });

  g.userData.tail = M.tail;
  g.userData.lamp = M.head;
  g.userData.materials = M;
  g.userData.wheels = wheels;
  g.userData.shell = shell;
  g.userData.flame = flame;
  g.userData.flameCore = flameCore;
  g.userData.rearAxle = rearAxle;
  g.userData.wr = TWR; g.userData.lift = LIFT;
  mergeStatic(car);
  return g;
}

/* The paint chart: colours a station wagon actually left the factory in,
   about fifty years ago, all of them faded since. Kept clear of the three
   rivals' silver, brown and slate so you can always tell which one is you. */
const PAINTS = [
  {name:"Faded maroon",  hex:"#7a3b2e"},
  {name:"Harvest gold",  hex:"#c9962a"},
  {name:"Avocado",       hex:"#6b7a2e"},
  {name:"Burnt orange",  hex:"#c2601f"},
  {name:"Sky blue",      hex:"#6f9ec2"},
  {name:"Forest green",  hex:"#2f5a3a"},
  {name:"Tomato red",    hex:"#b3261e"},
  {name:"Navy",          hex:"#22324f"},
  {name:"Cream",         hex:"#e3d7b0"},
  {name:"Seafoam",       hex:"#7fb8a4"},
  {name:"Chocolate",     hex:"#4a2f22"},
  {name:"Plum",          hex:"#5e3553"}
];
let car = buildWagon({paint:PAINTS[0].hex, rust:38, beat:true, cargo:true});   // rebuilt from the garage once the save is read
/* the body panels and the junkyard door (same paint, but faded toward grey
   as it always was) take the new colour; the rust stays where it is */
function paintCar(hex){
  const M = car.userData.materials;
  if(!M) return;
  M.paint.color.set(hex);
  M.door.color.set(hex).lerp(new THREE.Color(0x6b6558), 0.35);
}
scene.add(car);

/* ------------------------------------------------------------------ *
 *  The rivals' own cars. Each regular turns up in something different,
 *  so you can tell them apart by shape as well as colour, and each has
 *  their own load on the roof.
 *    box     Dale's silver Swedish box wagon, canoe on the roof
 *    trail   Rhonda's lifted two-door 4x4, roof basket with a light bar
 *    pickup  Gus's slate pickup, ladder rack over a bed of firewood
 *  Same contract as buildWagon: origin at the ground, +Z forward, a
 *  shell on its springs, wheel pivots, a tail material the game lights.
 * ------------------------------------------------------------------ */
function buildRival(kind, opts){
  const opt = opts || {};
  const rusty = (opt.rust || 0) >= 50;
  const g = new THREE.Group();
  g.name = "rival_" + kind;
  const shell = new THREE.Group();
  shell.position.y = RIDE;
  g.add(shell);
  const car = new THREE.Group();
  car.position.y = -RIDE;
  shell.add(car);

  const mat = (color, extra = {}) => new THREE.MeshStandardMaterial(
    Object.assign({ color, flatShading: true, roughness: 0.8, metalness: 0.05,
                    envMap: ENV, envMapIntensity: 0.7 }, extra));
  const M = {
    paint:  mat(opt.paint || "#888888", { roughness: 0.65, metalness: 0.15 }),
    paint2: mat(opt.paint2 || "#e6e0cf", { roughness: 0.7 }),
    rust:   mat(0x5e3218, { roughness: 1 }),
    glass:  mat(0x1d2a33, { roughness: 0.15, metalness: 0.6, envMapIntensity: 1.0 }),
    trim:   mat(0x222222, { roughness: 0.9 }),
    rubber: mat(0x161616, { roughness: 1 }),
    under:  mat(0x2a2724, { roughness: 1 }),
    chrome: mat(0xb8b8b0, { roughness: 0.35, metalness: 0.8, envMapIntensity: 1.1 }),
    tire:   mat(0x1a1a1a, { roughness: 1 }),
    rim:    mat(opt.rim || 0x9a9a92, { roughness: 0.5, metalness: 0.6 }),
    head:   mat(0xfff3c4, { emissive: 0xffe9a0, emissiveIntensity: 0.7 }),
    tail:   mat(0xb01818, { emissive: 0xff1a10, emissiveIntensity: 0.22 }),
    amber:  mat(0xe08a1e, { emissive: 0x552800, emissiveIntensity: 0.4 }),
    plate:  mat(0xe8e4d8, { roughness: 0.9 }),
    strap:  mat(0x2b2b2b, { roughness: 1 }),
    canoe:  mat(0x2f6b3c, { roughness: 0.5, metalness: 0.1 }),
    canoeIn:mat(0xcfc3a0, { roughness: 0.8 }),
    wood:   mat(0xffffff, { map: woodTex, roughness: 0.9 }),
    log:    mat(0x6b4a2c, { roughness: 1 }),
    logEnd: mat(0xc9a36a, { roughness: 1 }),
    canvas: mat(0x6d6a4a, { roughness: 1 }),
    tarp:   mat(0x2d4f7a, { roughness: 0.9 }),
    red:    mat(0x9c2a22, { roughness: 0.8 }),
    alu:    mat(0xc9ccc8, { roughness: 0.4, metalness: 0.7 }),
  };
  M.brake = M.tail;

  const add = (geo, material, x = 0, y = 0, z = 0, parent = car) => {
    const m = new THREE.Mesh(geo, material);
    m.position.set(x, y, z); parent.add(m); return m;
  };
  const box = (w, h, d, material, x, y, z, parent) =>
    add(new THREE.BoxGeometry(w, h, d), material, x, y, z, parent);
  const cyl = (r, len, seg, material, axis, x, y, z, parent) => {
    const geo = new THREE.CylinderGeometry(r, r, len, seg);
    if (axis === 'x') geo.rotateZ(Math.PI / 2);
    if (axis === 'z') geo.rotateX(Math.PI / 2);
    return add(geo, material, x, y, z, parent);
  };
  const extrude = (pts, width, material, bevel = 0, x = 0) => {
    const shape = new THREE.Shape(pts.map(p => new THREE.Vector2(p[0], p[1])));
    const geo = new THREE.ExtrudeGeometry(shape, {
      depth: width, bevelEnabled: bevel > 0,
      bevelThickness: bevel, bevelSize: bevel, bevelSegments: 1, curveSegments: 1 });
    geo.translate(0, 0, -width / 2);
    geo.rotateY(-Math.PI / 2);
    return add(geo, material, x, 0, 0);
  };
  /* the side profile of a lower body, [z, y] points, arches cut round the wheels */
  const lower = (R, F, sill, belt, nose, WR, AR, AF, archR, width, material) => {
    const pts = [[R, sill]];
    const arch = cz => {
      for (let i = 0; i <= 6; i++) {
        const a = Math.PI - (i / 6) * Math.PI;
        pts.push([cz + archR * Math.cos(a), Math.max(sill, WR + archR * Math.sin(a) * 0.95)]);
      }
    };
    arch(AR); arch(AF);
    pts.push([F, sill], [F, nose], [F - 0.08, belt], [R, belt]);
    return extrude(pts, width, material, 0.03);
  };

  let S;   // wheel setup for this body
  switch (kind) {

  /* ---- Dale: square Swedish wagon, black rubber bumpers, canoe up top ---- */
  case "box": {
    S = { WR: 0.32, AF: 1.36, AR: -1.30, TRK: 0.74, tw: 0.2 };
    const F = 2.38, R = -2.42, SILL = 0.3, BELT = 0.9, SIDE = 0.86;
    lower(R, F, SILL, BELT, 0.8, S.WR, S.AR, S.AF, 0.42, 1.72, M.paint);
    // tall upright glasshouse, flat back
    extrude([[1.05, BELT], [0.5, 1.46], [-2.36, 1.48], [-2.4, BELT]], 1.6, M.glass);
    box(1.64, 0.06, 2.9, M.paint, 0, 1.49, -0.93);
    for (const s of [1, -1]) {
      extrude([[1.08, BELT], [0.98, BELT], [0.44, 1.47], [0.54, 1.47]], 0.05, M.paint, 0, s * 0.8);
      box(0.05, 0.56, 0.1, M.paint, s * 0.8, 1.18, -0.2);
      box(0.05, 0.56, 0.12, M.paint, s * 0.8, 1.18, -1.35);
      box(0.05, 0.56, 0.14, M.paint, s * 0.8, 1.18, -2.33);
      box(0.02, 0.05, 3.9, M.rubber, s * (SIDE + 0.01), 0.55, 0);        // rubbing strip
      box(0.01, 0.52, 0.015, M.trim, s * (SIDE + 0.005), 0.62, 0.4);
      box(0.01, 0.52, 0.015, M.trim, s * (SIDE + 0.005), 0.62, -0.78);
      box(0.1, 0.12, 0.06, M.trim, s * 0.93, 0.98, 0.95);                // mirrors
    }
    // flat face: square lamps either side of an egg-crate grille
    box(0.9, 0.24, 0.04, M.trim, 0, 0.64, F + 0.045);
    for (let i = 0; i < 5; i++) box(0.018, 0.22, 0.02, M.chrome, -0.36 + i * 0.18, 0.64, F + 0.055);
    for (const s of [1, -1]) {
      box(0.3, 0.2, 0.04, M.head, s * 0.64, 0.64, F + 0.045);
      box(0.1, 0.2, 0.04, M.amber, s * 0.83, 0.64, F);
    }
    box(1.8, 0.16, 0.16, M.rubber, 0, 0.38, F + 0.08);                   // big safety bumpers
    box(1.8, 0.16, 0.16, M.rubber, 0, 0.38, R - 0.08);
    // tall tail lamps up the D-pillars, the Swedish tell
    for (const s of [1, -1]) {
      box(0.16, 0.52, 0.03, M.tail, s * 0.74, 0.8, R - 0.045);
      box(0.16, 0.08, 0.035, M.amber, s * 0.74, 0.5, R - 0.05);
    }
    box(0.4, 0.14, 0.012, M.plate, 0, 0.58, R - 0.045);
    // roof rails and two bars
    for (const s of [1, -1]) box(0.05, 0.05, 2.5, M.trim, s * 0.7, 1.56, -0.95);
    for (const z of [0.05, -1.7]) box(1.44, 0.04, 0.06, M.trim, 0, 1.6, z);
    // the canoe, upside down, hanging off both ends
    const hullGeo = new THREE.SphereGeometry(1, 14, 6, 0, Math.PI * 2, 0, Math.PI / 2);
    const hull = add(hullGeo, M.canoe, 0, 1.63, -0.75);
    hull.scale.set(0.42, 0.26, 2.75);
    const lip = add(new THREE.TorusGeometry(1, 0.035, 4, 24), M.canoeIn, 0, 1.635, -0.75);
    lip.rotation.x = Math.PI / 2; lip.scale.set(0.42, 2.75, 1);
    for (const z of [0.05, -1.7]) {                                       // tie-downs
      box(0.9, 0.012, 0.04, M.strap, 0, 1.9, z);
      for (const s of [1, -1]) box(0.012, 0.3, 0.04, M.strap, s * 0.44, 1.75, z);
    }
    if (rusty) box(0.012, 0.1, 0.3, M.rust, -SIDE - 0.001, 0.4, -1.9);
    S.pipe = [-0.5, -2.5];
    break;
  }

  /* ---- Rhonda: short, lifted two-door 4x4, white hardtop, basket and lights ---- */
  case "trail": {
    S = { WR: 0.42, AF: 1.28, AR: -1.14, TRK: 0.82, tw: 0.3, knobby: true };
    const F = 2.1, R = -2.02, SILL = 0.62, BELT = 1.2, SIDE = 0.9;
    lower(R, F, SILL, BELT, 1.1, S.WR, S.AR, S.AF, 0.52, 1.8, M.paint);
    // chunky black flares over the arches
    for (const z of [S.AF, S.AR]) for (const s of [1, -1]) {
      const fl = add(new THREE.TorusGeometry(0.54, 0.06, 4, 10, Math.PI), M.rubber, s * 0.91, S.WR, z);
      fl.rotation.y = Math.PI / 2;
    }
    box(1.84, 0.14, (S.AF - S.AR) - 1.1, M.under, 0, SILL + 0.06, (S.AF + S.AR)/2);   // rocker panels
    // windscreen and a removable white top over the back
    extrude([[0.95, BELT], [0.7, 1.72], [0.2, 1.74], [0.3, BELT]], 1.66, M.glass);
    extrude([[0.3, BELT], [0.2, 1.8], [-1.96, 1.8], [-2.0, BELT]], 1.7, M.paint2);
    for (const s of [1, -1]) {
      box(0.02, 0.36, 0.7, M.glass, s * 0.855, 1.5, -0.35);             // side glass in the top
      box(0.02, 0.36, 0.6, M.glass, s * 0.855, 1.5, -1.35);
      box(0.1, 0.14, 0.06, M.trim, s * 0.98, 1.3, 0.85);
      box(0.012, 0.5, 0.015, M.trim, s * (SIDE + 0.005), 0.92, 0.2);    // door shut line
      box(0.03, 0.03, 0.12, M.chrome, s * (SIDE + 0.01), 1.05, -0.02);
    }
    // front: round lamps, slotted grille, tubular bull bar
    box(1.0, 0.36, 0.04, M.trim, 0, 0.95, F + 0.045);
    for (let i = 0; i < 7; i++) box(0.06, 0.3, 0.02, M.paint, -0.36 + i * 0.12, 0.95, F + 0.055);
    for (const s of [1, -1]) {
      cyl(0.11, 0.05, 10, M.chrome, 'z', s * 0.66, 0.98, F + 0.05);
      cyl(0.09, 0.04, 10, M.head, 'z', s * 0.66, 0.98, F + 0.06);

    const LX = 0.1, LY = RY + 0.05;
    for (const s of [1, -1]) box(0.05, 0.06, 4.2, M.alu, LX + s * 0.22, LY, -1.1);

    wheels.push({ pivot, mesh: spin, steer: w[2] });
  });

  const flameMat = c => new THREE.MeshBasicMaterial({ color: c, transparent: true, opacity: 0,
                         blending: THREE.AdditiveBlending, depthWrite: false });
  const flame = new THREE.Mesh(new THREE.ConeGeometry(0.1, 0.5, 8), flameMat(0xffa32c));
  flame.rotation.x = -Math.PI / 2; flame.position.set(S.pipe[0], 0.25, S.pipe[1] - 0.25); car.add(flame);

  flameCore.rotation.x = -Math.PI / 2; flameCore.position.set(S.pipe[0], 0.25, S.pipe[1] - 0.15); car.add(flameCore);

  g.traverse(m => {
    if (!m.isMesh) return;
    if (!(m.material.transparent || m.material.isMeshBasicMaterial)) m.castShadow = true;
    m.receiveShadow = false;
  });
  g.userData.tail = M.tail;
  g.userData.lamp = M.head;
  g.userData.materials = M;
  g.userData.wheels = wheels;
  g.userData.wheelR = WR;
  g.userData.shell = shell;
  g.userData.flame = flame;
  g.userData.flameCore = flameCore;
  g.userData.rearAxle = rearAxle;
  mergeStatic(car);
  return g;
}
