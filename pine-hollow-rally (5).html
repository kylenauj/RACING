/* ------------------------------------------------------------------ *
 *  Input: keyboard and the first connected gamepad, folded into one
 * ------------------------------------------------------------------ */
const CTL = { thr:0, brk:0, hand:false, steer:0 };
const PAD = { prev:[], navT:0, navDir:"" };
function pollInput(dt){
  let thr = (held("KeyW")||held("ArrowUp")) ? 1 : 0;
  let brk = (held("KeyS")||held("ArrowDown")) ? 1 : 0;
  let hand = held("Space");
  let steer = (held("KeyA")||held("ArrowLeft")?1:0) - (held("KeyD")||held("ArrowRight")?1:0);

  // Some hosts (iframes, embedded previews) block the gamepad API outright
  // and throw on the call. Ask once, and if it's refused, stop asking.
  let pads = [];
  if(PAD.ok !== false && navigator.getGamepads){
    try{ pads = navigator.getGamepads() || []; PAD.ok = true; }
    catch(e){ PAD.ok = false; pads = []; }
  }
  let gp = null;
  for(let i=0;i<pads.length;i++) if(pads[i] && pads[i].connected){ gp = pads[i]; break; }
  if(gp){
    const b = i => (gp.buttons[i] ? gp.buttons[i].value : 0);
    const down = i => b(i) > 0.5;
    const hit = i => down(i) && !PAD.prev[i];
    const ax = gp.axes[0] || 0, ay = gp.axes[1] || 0;
    if(!GAME.ui){
      if(b(7) > 0.25) thr = 1;
      if(b(6) > 0.25) brk = 1;
      if(down(0)) hand = true;
      if(Math.abs(ax) > 0.14) steer = -Math.sign(ax)*Math.min(1, (Math.abs(ax)-0.14)/0.8);
      if(down(14)) steer = 1;
      if(down(15)) steer = -1;
      if(hit(9)) pauseGame();
      if(hit(3)) cycleCamera();
      if(hit(1)) resetCar();
      if(hit(5)){ trans.auto = false; requestShift(trans.gear+1); }
      if(hit(4)){ trans.auto = false; requestShift(trans.gear-1); }
    } else {
      // menus: d-pad or stick, with key-repeat style timing
      let dir = "";
      if(down(12) || ay < -0.55) dir = "up";
      else if(down(13) || ay > 0.55) dir = "down";
      else if(down(14) || ax < -0.55) dir = "left";
      else if(down(15) || ax > 0.55) dir = "right";
      if(dir){
        PAD.navT -= dt;
        if(dir !== PAD.navDir || PAD.navT <= 0){
          menuNav(dir);
          PAD.navT = dir === PAD.navDir ? 0.11 : 0.38;
        }
      }
      PAD.navDir = dir;
      if(hit(0)) menuNav("ok");
      if(hit(1)) menuNav("back");
      if(hit(9)) menuNav(MENU.id === "scPause" ? "back" : "ok");
    }
    PAD.prev = gp.buttons.map(x => x.value > 0.5);
  }
  CTL.thr = thr; CTL.brk = brk; CTL.hand = hand; CTL.steer = steer;
}
function cycleCamera(){
  camMode = (camMode+1)%2;
  SAVE.settings.cam = camMode; persist();
}

/* ------------------------------------------------------------------ *
 *  Rivals
 *  They follow the same speed profile the routing test works out for
 *  the player's car, so they brake for the corners you brake for.
 *  Each has its own pace, a home lane, and the sense to steer round
 *  whatever is in front of it. Rubber banding is gentle and visible
 *  only if you look for it.
 * ------------------------------------------------------------------ */
let ROUTE_V = null;
const GRID = [[20, 2.4], [14, -2.4], [6, 2.4]];     // metres past the line, lane
function gridRivals(){
  rivals.forEach((r, i)=>{
    r.s = GRID[i][0]/segLen; r.lap = 0; r.v = 0;
    r.lane = r.laneT = GRID[i][1]; r.laneRate = 0; r.home = 0;
    r.y = null; r.vy = 0; r.air = false; r.pitch = 0;
    r.finish = null;
  });
}
function wrapGap(a, b){                         // b - a along the loop, in samples
  let g = b - a;
  if(g >  NS/2) g -= NS;
  if(g < -NS/2) g += NS;
  return g;
}
function stepRivals(dt){
  if(!ROUTE_V){
    const R = routingTest(MAIN);
    ROUTE_V = R.v && R.v.length === NS ? R.v : null;
  }
  const moving = state.phase === "racing" || state.phase === "done" || state.phase === "menu";
  const racing = state.phase === "racing";
  const dk = DIFFS[SAVE.settings.diff].k;
  const myProg = progressOf(state.lap-1, state.idx);
  // where the player sits in the road's own frame
  const pT = tans[state.idx], pP = pts[state.idx];
  const myLane = (pose.x-pP.x)*(-pT.z) + (pose.z-pP.z)*pT.x;
  const myAlong = pose.vx*pT.x + pose.vz*pT.z;
  const playerOn = car.visible && (racing || state.phase === "done") && Math.abs(myLane) < 8;

  FIELD.forEach(r=>{
    const i0 = ((Math.floor(r.s)%NS)+NS)%NS;
    if(moving){
      let target = 30;
      if(ROUTE_V){
        target = 1e9;
        for(let k=0;k<6;k++) target = Math.min(target, ROUTE_V[(i0+k)%NS]);
      }
      target *= r.def.skill * (state.phase === "menu" ? 0.9 : dk);
      if(racing){
        const gap = (progressOf(r.lap, r.s) - myProg)*segLen;     // + means ahead of you
        target *= 1 - Math.max(-1, Math.min(1, gap/240))*0.07;
      }
      const q = nearest(r.mesh.position.x, r.mesh.position.z);
      target *= FROZEN ? 1 - Math.max(q.wet||0, iceAt(r.mesh.position.x, r.mesh.position.z))*0.12 - (q.mud||0)*0.12
                       : 1 - (q.wet||0)*0.32 - (q.mud||0)*0.12;

      // traffic: anything close ahead in the same lane
      let blocked = false;
      const look = (gapS, lane, v)=>{
        const gm = gapS*segLen;
        if(gm > 0 && gm < 13 && Math.abs(lane - r.lane) < 2.5){
          blocked = true;
          if(gm < 8) target = Math.min(target, Math.max(0, v) + (gm-4)*0.8);
          let side = r.lane >= lane ? 1 : -1;
          if(Math.abs(lane + side*2.8) > 3.4) side = -side;
          r.laneT = Math.max(-3.4, Math.min(3.4, lane + side*2.8));
        }
      };
      FIELD.forEach(o=>{ if(o !== r) look(wrapGap(r.s, o.s), o.lane, o.v); });
      if(playerOn) look(wrapGap(r.s, state.idx), myLane, myAlong);
      if(blocked) r.home = 0;
      else {
        r.home += dt;
        if(r.home > 1.5){
          const want = r.def.lane + Math.sin(state.t*0.35 + r.def.lane)*1.1;
          r.laneT += (want - r.laneT)*Math.min(1, dt*0.4);
        }
      }
      r.mesh.userData.tail.emissiveIntensity = target < r.v - 1.0 ? 1.7 : 0.22;
      r.v += Math.max(-17*dt, Math.min(7.2*dt, target - r.v));
      r.s += Math.max(0, r.v)*dt/segLen;
    }
    if(r.s >= NS){
      r.s -= NS; r.lap++;
      if(racing && r.lap >= LAPS && r.finish === null) r.finish = state.t;
    }
    const prevLane = r.lane;
    r.lane += (r.laneT - r.lane)*Math.min(1, dt*1.4);
    r.laneRate = dt > 0 ? (r.lane - prevLane)/dt : 0;

    const i = Math.floor(r.s)%NS, f = r.s - Math.floor(r.s);
    const a = pts[i], b = pts[(i+1)%NS], t = tans[i];
    const nx = -t.z, nz = t.x;
    const lim = Math.max(0.3, MAIN.half[i] - 1.25);
    const laneUse = Math.max(-lim, Math.min(lim, r.lane));
    const x = a.x + (b.x-a.x)*f + nx*laneUse;
    const z = a.z + (b.z-a.z)*f + nz*laneUse;
    /* the same rule the player's car flies by: the road lets go when it
       curves away faster than gravity can follow, and the car leaves at the
       slope it was just on */
    const gy = surfaceY(x, z), spR = Math.max(0, r.v), look = Math.max(1.2, spR*dt*1.2);
    const gA = surfaceY(x + t.x*look, z + t.z*look), gB = surfaceY(x - t.x*look, z - t.z*look);
    const gSlope = (gA - gB)/(2*look), gCurve = (gA - 2*gy + gB)/(look*look);
    if(r.y === null || !isFinite(r.y) || dt <= 0){ r.y = gy; r.vy = 0; r.air = false; }
    else if(!r.air && (gCurve*spR*spR > -26 || spR < 6)){ r.y = gy; r.vy = gSlope*spR; }
    else {
      const launching = !r.air;
      if(launching){ r.vy = Math.max(-14, Math.min(11, ((gy - gB)/look)*spR)); r.air = true; r.airT = 0; }
      r.vy -= 26*dt; r.y += r.vy*dt; r.airT += dt;
      if(r.y <= gy && r.vy > 0 && r.airT < 0.12) r.y = gy;            // still crossing the lip
      else if(r.y <= gy){ r.y = gy; r.vy = gSlope*spR; r.air = false; }
    }
    const pitchT = r.air ? Math.max(-0.2, Math.min(0.22, r.vy*0.02)) : Math.atan(gSlope);
    r.pitch += (pitchT - r.pitch)*Math.min(1, dt*(r.air ? 2.5 : 12));
    r.mesh.position.set(x, r.y, z);
    r.mesh.rotation.y = Math.atan2(t.x, t.z) - Math.atan2(r.laneRate, Math.max(4, r.v));
    r.mesh.rotation.x = -r.pitch;
    const wr = r.mesh.userData.wheelR || WHEEL_R;
    r.mesh.userData.wheels.forEach(w=> w.mesh.rotation.x += r.v*dt/wr);

    if(playerOn) collideRival(r, t, nx, nz);
  });
}

/* Two boxes, resolved along whichever axis overlaps least. The player
   takes most of the shove; a rival hit from behind gets pushed on. */
function collideRival(r, t, nx, nz){
  const dx = pose.x - r.mesh.position.x, dz = pose.z - r.mesh.position.z;
  if(Math.abs(pose.y - r.mesh.position.y) > 2.2) return;
  const da = dx*t.x + dz*t.z, dl = dx*nx + dz*nz;
  const LA = 4.8, LL = 1.95;
  if(Math.abs(da) >= LA || Math.abs(dl) >= LL) return;
  const pa = LA - Math.abs(da), pl = LL - Math.abs(dl);
  let ix, iz, pen, side;
  if(pl*1.6 < pa){ side = Math.sign(dl)||1; ix = nx*side; iz = nz*side; pen = pl;
                   r.lane -= side*pen*0.4; r.laneT = r.lane - side*1.4; }
  else           { side = Math.sign(da)||1; ix = t.x*side; iz = t.z*side; pen = pa;
                   r.s = (r.s - side*pen*0.35/segLen + NS) % NS; }
  pose.x += ix*pen*0.65; pose.z += iz*pen*0.65;
  const rel = (pose.vx - t.x*r.v)*ix + (pose.vz - t.z*r.v)*iz;
  if(rel < 0){
    const j = -rel;
    pose.vx += ix*j*0.75; pose.vz += iz*j*0.75;
    r.v -= (ix*t.x + iz*t.z)*j*0.45;
    if(j > 1.2 && (GAME.bumpCool||0) <= 0){
      SFX.bump(j); GAME.shake = Math.max(GAME.shake, Math.min(0.5, j*0.05));
      GAME.bumpCool = 0.25;
    }
  }
}

function progressOf(lap, idx){ return lap*NS + idx; }
function computePlace(){
  if(state.phase === "done") return GAME.finishPlace;
  const mine = progressOf(state.lap-1, state.idx);
  let ahead = 0;
  FIELD.forEach(r=>{ if(r.finish !== null || progressOf(r.lap, r.s) > mine) ahead++; });
  return ahead + 1;
}

/* ------------------------------------------------------------------ *
 *  Ghost: your best lap on this track, replayed in time trial
 * ------------------------------------------------------------------ */
const GHOST = (()=>{
  const g = buildWagon({paint:"#bfe8ff", rust:0, wood:false});
  g.traverse(o=>{
    if(!o.material) return;
    const one = m => { const c = m.clone(); c.transparent = true; c.opacity = 0.34; c.depthWrite = false; return c; };
    o.material = Array.isArray(o.material) ? o.material.map(one) : one(o.material);
  });
  g.userData.flame.visible = false; g.userData.flameCore.visible = false;
  g.visible = false;
  scene.add(g);
  return { mesh:g, rec:[], data:null };
})();
function stepGhost(){
  const lt = state.t - state.lapStart;
  if(state.phase === "racing"){
    while(GHOST.rec.length*0.1 <= lt && GHOST.rec.length < 3000){
      GHOST.rec.push([+pose.x.toFixed(2), +pose.y.toFixed(2), +pose.z.toFixed(2), +pose.h.toFixed(3)]);
    }
  }
  const D = GHOST.data;
  if(!D || state.phase !== "racing"){ GHOST.mesh.visible = false; return; }
  const u = lt/0.1, i = Math.floor(u), f = u - i;
  if(i+1 >= D.length){ GHOST.mesh.visible = false; return; }
  const a = D[i], b = D[i+1];
  let dh = b[3] - a[3];
  while(dh >  Math.PI) dh -= Math.PI*2;
  while(dh < -Math.PI) dh += Math.PI*2;
  GHOST.mesh.position.set(a[0]+(b[0]-a[0])*f, a[1]+(b[1]-a[1])*f, a[2]+(b[2]-a[2])*f);
  GHOST.mesh.rotation.set(0, a[3] + dh*f, 0);
  // fade it out when it sits on top of you, or you can't see your own car
  const near = Math.hypot(GHOST.mesh.position.x - pose.x, GHOST.mesh.position.z - pose.z);
  GHOST.mesh.visible = near > 3.5;
}

/* ------------------------------------------------------------------ *
 *  Race events: laps, banners, sounds that hang off the car's state
 * ------------------------------------------------------------------ */
const BANNER = { text:"", col:"#ffd23d", t:0, dur:0, sub:"", subCol:"#fff" };
const SPLIT  = { text:"", delta:"", col:"#fff", t:0 };
function banner(text, col, dur, sub, subCol){
  BANNER.text = text; BANNER.col = col || UI.key; BANNER.t = 0; BANNER.dur = dur || 2;
  BANNER.sub = sub || ""; BANNER.subCol = subCol || UI.ink;
}

function onLap(lt, prevBest){
  const done = state.lap - 1;                  // the lap just completed
  SPLIT.text = "LAP " + done + "  " + fmt(lt);
  SPLIT.delta = ""; SPLIT.t = 2.6;
  if(prevBest !== null){
    const d = lt - prevBest;
    SPLIT.delta = (d < 0 ? "-" : "+") + Math.abs(d).toFixed(2);
    SPLIT.col = d < 0 ? "#5cf07a" : "#ff6a4a";
  }
  const rec = recordFor();
  if(!TRACK.test && (rec.bestLap == null || lt < rec.bestLap)){
    const first = rec.bestLap == null;
    rec.bestLap = lt;
    if(GHOST.rec.length > 20){
      rec.ghost = GHOST.rec;
      if(MODE === "trial") GHOST.data = rec.ghost;       // chase the lap you just set
    }
    persist();
    GAME.lapRecord = true;
    if(!first){ banner("LAP RECORD", "#5cf07a", 2.2, fmt(lt)); SFX.best(); }
    else SFX.lap();
  } else SFX.lap();
  GHOST.rec = [];
  if(state.lap === LAPS && LAPS > 1){
    setTimeout(()=>{ if(state.phase === "racing"){ banner("FINAL LAP", UI.key, 2.2); SFX.finalLap(); } }, 900);
  }
}

function stepRaceEvents(dt, info){
  GAME.goT = Math.max(0, GAME.goT - dt);
  GAME.shake = Math.max(0, GAME.shake - dt*1.6);
  GAME.bumpCool = Math.max(0, (GAME.bumpCool||0) - dt);
  GAME.resetFlash = Math.max(0, GAME.resetFlash - dt*2);
  BANNER.t += dt; SPLIT.t = Math.max(0, SPLIT.t - dt);
  if(state.phase === "menu") return;

  // landings
  if(pose.air){ GAME.airT += dt; GAME.airVy = Math.min(GAME.airVy, pose.vy); }
  else {
    if(GAME.wasAir && GAME.airT > 0.3 && GAME.airVy < -4){
      SFX.land(-GAME.airVy);
      GAME.shake = Math.max(GAME.shake, Math.min(0.4, -GAME.airVy*0.03));
    }
    GAME.airT = 0; GAME.airVy = 0;
  }
  GAME.wasAir = pose.air;

  // water: a sound on the way in, not every frame you're wet
  GAME.wetCool = Math.max(0, GAME.wetCool - dt);
  if(splash.water - GAME.wetPrev > 0.03 && GAME.wetCool <= 0){ SFX.splash(); GAME.wetCool = 0.9; }
  GAME.wetPrev = splash.water;

  // drift charge and turbo
  if(drift.on && drift.tier > GAME.tierPrev && drift.tier >= 0) SFX.tier(drift.tier);
  GAME.tierPrev = drift.on ? drift.tier : -1;
  if(drift.boostT > 0 && GAME.boostPrev <= 0) SFX.boost(Math.max(0, drift.boostTier));
  GAME.boostPrev = drift.boostT;

  if(state.phase !== "racing") return;

  // positions gained and lost
  if(state.t > 2 && FIELD.length){
    if(GAME.placePrev && state.place !== GAME.placePrev){
      GAME.placeT = 1.4; GAME.placeUp = state.place < GAME.placePrev ? 1 : -1;
    }
  }
  GAME.placePrev = state.place;
  GAME.placeT = Math.max(0, GAME.placeT - dt);

  // wrong way, and a hint when you're stuck somewhere
  const t = tans[state.idx];
  const fwd = Math.sin(pose.h)*t.x + Math.cos(pose.h)*t.z;
  if(info.sp > 3 && fwd < -0.35) GAME.wrongT += dt;
  else GAME.wrongT = Math.max(0, GAME.wrongT - dt*3);
  if(GAME.wrongT > 1 && !GAME.wrongSaid){ SFX.wrong(); GAME.wrongSaid = true; }
  if(GAME.wrongT <= 0) GAME.wrongSaid = false;
  const off = nearest(pose.x, pose.z).dist > HALF + 3;
  if((off && info.sp < 3) || GAME.wrongT > 3) GAME.stuckT += dt;
  else GAME.stuckT = Math.max(0, GAME.stuckT - dt*2);
}

/* put the car back on the road, pointing the right way */
function resetCar(){
  if(state.phase !== "racing" || GAME.paused) return;
  const i = state.idx, p = pts[i], t = tans[i];
  pose.x = p.x; pose.z = p.z; pose.h = Math.atan2(t.x, t.z);
  pose.y = surfaceY(p.x, p.z); pose.lastGy = pose.y;
  pose.vx = pose.vz = 0; pose.vy = 0; pose.air = false; pose.airT = 0;
  pose.yawVis = 0; pose.steerIn = 0; pose.steerVis = 0; pose.roll = pose.pitch = 0;
  pose.spring = pose.springV = 0; pose.artPitch = pose.artRoll = pose.artBase = 0; pose.bH = pose.bHv = pose.bP = pose.bPv = pose.bR = pose.bRv = 0;
  drift.mode = "off"; drift.on = false; drift.t = 0; drift.tier = -1; drift.boostT = 0;
  trans.gear = 1; trans.target = 1; trans.dir = 1; trans.shiftT = 0; trans.cut = 0;
  camH = pose.h;
  camera.position.set(pose.x - Math.sin(pose.h)*9, pose.y + 3.6, pose.z - Math.cos(pose.h)*9);
  GAME.stuckT = 0; GAME.wrongT = 0; GAME.resetFlash = 1;
  SFX.reset();
}

/* ------------------------------------------------------------------ *
 *  HUD additions, drawn over the original readout
 * ------------------------------------------------------------------ */
function drawLights(lit, green){
  const k = HK, cx = HUD_W/2, cy = HUD_H*0.27, r = 15*k, gap = 40*k;
  const w = gap*3 + 4*k, h = r*2 + 16*k;
  hud.fillStyle = "#121611"; hud.fillRect(cx - w/2, cy - h/2, w, h);
  hud.lineWidth = 3*k; hud.strokeStyle = "#000"; hud.strokeRect(cx - w/2, cy - h/2, w, h);
  for(let i=0;i<3;i++){
    const x = cx + (i-1)*gap;
    hud.beginPath(); hud.arc(x, cy, r, 0, 7);
    hud.fillStyle = green ? "#3ce04a" : (i < lit ? "#ff2d20" : "#3b1512");
    hud.fill(); hud.lineWidth = 2*k; hud.stroke();
    if(green || i < lit){
      hud.beginPath(); hud.arc(x - r*0.3, cy - r*0.3, r*0.28, 0, 7);
      hud.fillStyle = "rgba(255,255,255,.55)"; hud.fill();
    }
  }
}
function drawBig(text, y, size, col, scale, alpha){
  hud.save();
  hud.globalAlpha = alpha;
  hud.translate(HUD_W/2, y);
  hud.scale(scale, scale);
  hudText(text, 0, 0, size, col, "center");
  hud.restore();
}
function drawOverlay(dt){
  const W = HUD_W, H = HUD_H, k = HK;
  if(state.phase === "countdown"){
    const n = Math.ceil(state.countdown);
    const lit = Math.max(0, Math.min(3, 4 - n));
    drawLights(lit, false);
    if(n <= 3 && n >= 1){
      const f = state.countdown - (n-1);          // 1 down to 0 through each count
      drawBig(String(n), H*0.44, UI.value*2.4, UI.ink, 1 + (f-0.7)*0.4, 1);
    }
  }
  if(GAME.goT > 0){
    const a = Math.min(1, GAME.goT*1.6);
    if(GAME.goT > 0.6) drawLights(3, true);
    drawBig("GO!", H*0.44, UI.value*2.6, "#3ce04a", 1 + (1.3-GAME.goT)*0.25, a);
  }
  if(BANNER.t < BANNER.dur){
    const tIn = Math.min(1, BANNER.t/0.14);
    const a = Math.min(1, (BANNER.dur - BANNER.t)/0.35);
    drawBig(BANNER.text, H*0.36, UI.value*1.6, BANNER.col, 1.5 - tIn*0.5, a);
    if(BANNER.sub) drawBig(BANNER.sub, H*0.36 + 26*k, UI.small*1.3, BANNER.subCol, 1, a);
  }
  if(SPLIT.t > 0 && !(BANNER.t < BANNER.dur)){
    const a = Math.min(1, SPLIT.t*1.5);
    drawBig(SPLIT.text, H*0.31, UI.value*0.85, UI.key, 1, a);
    if(SPLIT.delta) drawBig(SPLIT.delta, H*0.31 + 24*k, UI.small*1.4, SPLIT.col, 1, a);
  }
  if(state.phase === "racing"){
    if(GAME.wrongT > 1 && Math.floor(state.t*3) % 2 === 0)
      drawBig("WRONG WAY", H*0.5, UI.value*1.2, "#ff5a36", 1, 1);
    if(GAME.stuckT > 2.2)
      drawBig("PRESS X TO RESET", H*0.58, UI.small*1.1, UI.ink, 1, Math.min(1, GAME.stuckT-2.2));
    if(GAME.placeT > 0 && FIELD.length){
      const up = GAME.placeUp > 0;
      const a = Math.min(1, GAME.placeT*2);
      hud.save(); hud.globalAlpha = a;
      hudText((up ? "\u25B2 " : "\u25BC ") + ordinal(state.place),
              W-12*k, 124*k + (1.4-GAME.placeT)*-6*k, UI.small*1.2, up ? "#5cf07a" : "#ff6a4a", "right");
      hud.restore();
    }
  }
  if(GAME.resetFlash > 0){
    hud.fillStyle = "rgba(255,255,255," + (GAME.resetFlash*0.35).toFixed(3) + ")";
    hud.fillRect(0, 0, W, H);
  }
  if(MODE === "trial" && GHOST.data && state.phase === "racing" && state.lap === 1 && state.t < 4){
    drawBig("GHOST: YOUR BEST LAP", H*0.62, UI.small, UI.dim, 1, Math.min(1, 4 - state.t));
  }
}
function ordinal(n){ return n + (["TH","ST","ND","RD"][n] || "TH"); }

/* ------------------------------------------------------------------ *
 *  Cameras for the attract loop and after the flag
 * ------------------------------------------------------------------ */
const _cv = new THREE.Vector3(), _ca = new THREE.Vector3();
function setFov(f, dt){
  if(Math.abs(camera.fov - f) > 0.01){
    camera.fov += (f - camera.fov)*Math.min(1, dt*3);
    camera.updateProjectionMatrix();
  }
}
function attractCam(dt){
  GAME.attractT += dt; GAME.attractCut -= dt;
  const list = rivals.length ? rivals : [{mesh:car}];
  if(GAME.attractCut <= 0){
    GAME.attractCut = 6.5;
    GAME.attractStyle = (GAME.attractStyle + 1) % 3;
    GAME.attractCar = (GAME.attractCar + 1) % list.length;
    GAME.attractSnap = true;
  }
  const m = list[GAME.attractCar].mesh, p = m.position, h = m.rotation.y;
  const fx = Math.sin(h), fz = Math.cos(h), rx = -fz, rz = fx;
  let lerp = 1;
  if(GAME.attractStyle === 0){                     // low, tracking alongside
    _cv.set(p.x + fx*7 + rx*4.5, p.y + 1.4, p.z + fz*7 + rz*4.5); lerp = dt*4;
  } else if(GAME.attractStyle === 1){              // slow orbit from above
    const a = GAME.attractT*0.22;
    _cv.set(p.x + Math.sin(a)*15, p.y + 6.5, p.z + Math.cos(a)*15); lerp = dt*3;
  } else {                                        // a trackside camera it drives past
    if(GAME.attractSnap){
      GAME.fixed = new THREE.Vector3(p.x + fx*55 + rx*9, 0, p.z + fz*55 + rz*9);
      GAME.fixed.y = surfaceY(GAME.fixed.x, GAME.fixed.z) + 2.2;
    }
    _cv.copy(GAME.fixed);
  }
  if(GAME.attractSnap){ camera.position.copy(_cv); GAME.attractSnap = false; }
  else camera.position.lerp(_cv, Math.min(1, lerp));
  _ca.set(p.x, p.y + 1.0, p.z);
  camera.lookAt(_ca);
  setFov(GAME.attractStyle === 2 ? 34 : 52, 10);
}
function finishCam(dt){
  GAME.orbitA = (GAME.orbitA || pose.h + Math.PI*0.8) + dt*0.32;
  _cv.set(pose.x + Math.sin(GAME.orbitA)*11, pose.y + 3.2, pose.z + Math.cos(GAME.orbitA)*11);
  camera.position.lerp(_cv, Math.min(1, dt*2));
  _ca.set(pose.x, pose.y + 1.0, pose.z);
  camera.lookAt(_ca);
  setFov(54, dt);
}

 *  Race start, finish and results

function resetRace(){
  state.phase = "countdown"; state.countdown = TRACK.test ? 0.6 : 3.2; state.t = 0;
  state.lap = 1; state.lapTimes = []; state.lapStart = 0; state.best = null;
  placeAtStart();
  if(typeof resetPiles === "function") resetPiles();
  car.visible = true; carShadow.visible = true;
  camH = pose.h;
  camera.position.set(pose.x - Math.sin(pose.h)*9.2, pose.y + 3.55, pose.z - Math.cos(pose.h)*9.2);
  GAME.paused = false; GAME.doneT = 0; GAME.resultsShown = false; GAME.goT = 0;
  GAME.wrongT = 0; GAME.stuckT = 0; GAME.placePrev = 0; GAME.placeT = 0;
  GAME.lapRecord = false; GAME.raceRecord = false; GAME.orbitA = 0;
  BANNER.dur = 0; SPLIT.t = 0; GHOST.rec = [];
  if(MODE === "trial") GHOST.data = recordFor().ghost || null;
  AUD.musicMode = "race";
  startAudio(); setLevels();
  closeUI();
}

function finishRace(){
  state.phase = "done";
  GAME.doneT = 0;
  GAME.finishTime = state.t;
  GAME.finishPlace = 1 + FIELD.filter(r => r.finish !== null).length;
  banner(FIELD.length ? (GAME.finishPlace === 1 ? "WINNER!" : "FINISH") : "FINISH",
         GAME.finishPlace === 1 ? UI.key : UI.ink, 3.2);
  SFX.finish();
  if(!TRACK.test){
    const rec = recordFor(), key = "race" + LAPS;
    if(rec[key] == null || state.t < rec[key]){ rec[key] = state.t; GAME.raceRecord = true; }
    persist();
  }
}

/* every car's time, estimated for anyone still out there */
function classification(){
  const rows = [{name:"You", you:true, time:GAME.finishTime}];
  FIELD.forEach(r=>{
    let time = r.finish;
    if(time === null){
      const done = Math.max(1, progressOf(r.lap, r.s));
      const avg = done*segLen/Math.max(1, state.t);
      time = state.t + (LAPS*NS - done)*segLen/Math.max(5, avg);
    }
    rows.push({name:r.def.name, car:r.def.car, time, est:r.finish === null});
  });
  rows.sort((a,b)=> a.time - b.time);
  // the player's place is whatever the flag said, not the estimate
  const me = rows.findIndex(x=>x.you), want = GAME.finishPlace-1;
  if(me !== want && want < rows.length){ const [y] = rows.splice(me,1); rows.splice(want,0,y); }
  return rows;
}

/* ------------------------------------------------------------------ *
 *  Menus
 *  Every screen is a list of plates navigated the same way by mouse,
 *  keyboard or pad: up and down to move, left and right to change a
 *  setting, enter to pick, escape to go back.
 * ------------------------------------------------------------------ */
const UIEL = document.getElementById("ui");
const MENU = { id:null, items:[], sel:0, back:null, onSel:null, grid:false, acts:{} };
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;");

function openScreen(id, html, o){
  o = o || {};
  UIEL.innerHTML = '<div class="screen on ' + (o.cls || "dim") + '" id="' + id + '">' + html + '</div>';
  MENU.id = id; MENU.back = o.back || null; MENU.onSel = o.onSel || null;
  MENU.grid = !!o.grid; MENU.acts = o.acts || {};
  MENU.items = [...UIEL.querySelectorAll("[data-act],[data-opt],[data-track]")];
  MENU.items.forEach((el, i)=>{
    el.addEventListener("mouseenter", ()=> select(i, true));
    el.addEventListener("click", e=>{
      e.preventDefault(); el.blur(); startAudio();
      select(i, true); activate(i);
    });
  });
  GAME.ui = true;
  MENU.sel = -1;
  select(Math.min(o.sel || 0, MENU.items.length-1), true);
}
function closeUI(){ UIEL.innerHTML = ""; MENU.id = null; MENU.items = []; GAME.ui = false; }
function select(i, quiet){
  if(!MENU.items.length) return;
  i = Math.max(0, Math.min(MENU.items.length-1, i));
  if(i === MENU.sel) return;
  MENU.sel = i;
  MENU.items.forEach((el, j)=> el.classList.toggle("sel", j === i));
  const el = MENU.items[i];
  if(el.scrollIntoView) el.scrollIntoView({block:"nearest"});
  if(!quiet) SFX.move();
  if(MENU.onSel) MENU.onSel(el);
}
function gridCols(){
  const t = MENU.items.filter(el => el.dataset.track !== undefined);
  if(!t.length) return 1;
  const top = t[0].offsetTop;
  return Math.max(1, t.filter(el => el.offsetTop === top).length);
}
function activate(i){
  const el = MENU.items[i];
  if(!el || el.disabled) return;
  if(el.dataset.opt){ adjustOpt(el, +1, true); return; }
  const fn = MENU.acts[el.dataset.act || "track"];
  if(fn){ fn(el); }
}
function menuNav(dir){
  if(!MENU.id) return;
  const it = MENU.items[MENU.sel];
  const onTrack = it && it.dataset.track !== undefined;
  if(dir === "up" || dir === "down"){
    let step = dir === "up" ? -1 : 1;
    if(MENU.grid && onTrack) step *= gridCols();
    let j = MENU.sel + step;
    if(MENU.grid && onTrack && dir === "down" && j >= MENU.items.length) j = MENU.items.length-1;
    select(j);
  } else if(dir === "left" || dir === "right"){
    const d = dir === "left" ? -1 : 1;
    if(it && it.dataset.opt) adjustOpt(it, d, false);
    else if(MENU.grid && onTrack) select(MENU.sel + d);
  } else if(dir === "ok"){
    activate(MENU.sel);
  } else if(dir === "back" && MENU.back){
    SFX.back(); MENU.back();
  }
}

function optValue(O){
  if(O.get){
    const idx = O.get();
    const sw = O.swatch ? '<span class="swatch" style="background:' + PAINTS[idx].hex + '"></span>' : '';
    return '<i>\u2039</i>' + sw + '<b>' + esc(O.vals[idx]) + '</b><i>\u203A</i>';
  }
  const v = SAVE.settings[O.key];
  if(O.bar) return '<span class="bar"><span style="width:calc(' + Math.round(v*100) + '% - 2px)"></span></span>';
  const idx = O.bool ? (v ? 1 : 0) : v;
  const sw = O.swatch ? '<span class="swatch" style="background:' + PAINTS[idx].hex + '"></span>' : '';
  return '<i>\u2039</i>' + sw + '<b>' + esc(O.vals[idx]) + '</b><i>\u203A</i>';
}
function adjustOpt(el, d, wrap){
  const O = OPTS.find(o => o.key === el.dataset.opt) || GOPTS.find(o => o.key === el.dataset.opt);
  const S = SAVE.settings;
  if(O.get){
    const n = O.vals.length;
    let v = O.get() + d;
    v = wrap ? (v + n)%n : Math.max(0, Math.min(n - 1, v));
    O.set(v); persist(); applySettings();
    el.querySelector(".val").innerHTML = optValue(O);
    SFX.adjust();
    return;
  }
  if(O.bar){
    let v = Math.round((S[O.key] + d*0.1)*10)/10;
    if(wrap && v > 1) v = 0;
    S[O.key] = Math.max(0, Math.min(1, v));
  } else if(O.bool){
    S[O.key] = !S[O.key];
  } else {
    const n = O.vals.length;
    let v = S[O.key] + d;
    v = wrap ? (v+n)%n : Math.max(0, Math.min(n-1, v));
    S[O.key] = v;
  }
  persist(); applySettings();
  el.querySelector(".val").innerHTML = optValue(O);
  SFX.adjust();
}

/* ---- little shared pieces ---- */
const THUMBS = [];
function trackThumb(id){
  if(!THUMBS[id]){
    const curve = new THREE.CatmullRomCurve3(trackCtrl(TRACKS[id]), true, "catmullrom", 0.5);
    THUMBS[id] = { pts: curve.getSpacedPoints(200), len: curve.getLength() };
  }
  return THUMBS[id];
}
function drawThumb(cv, id){
  const T = trackThumb(id), P = T.pts, c = cv.getContext("2d");
  let minX=1e9, maxX=-1e9, minZ=1e9, maxZ=-1e9;
  P.forEach(p=>{ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z); });
  const pad = 14, W = cv.width, H = cv.height;
  const sc = Math.min((W-pad*2)/(maxX-minX), (H-pad*2)/(maxZ-minZ));
  const px = x => (x-(minX+maxX)/2)*sc + W/2, pz = z => (z-(minZ+maxZ)/2)*sc + H/2;
  c.fillStyle = "#0a1a11"; c.fillRect(0,0,W,H);
  c.strokeStyle = "rgba(243,230,196,.07)"; c.lineWidth = 1;
  for(let g=0; g<W; g+=12){ c.beginPath(); c.moveTo(g,0); c.lineTo(g,H); c.stroke();
                           c.beginPath(); c.moveTo(0,g); c.lineTo(W,g); c.stroke(); }
  const trace = (w, col)=>{
    c.strokeStyle = col; c.lineWidth = w; c.lineJoin = "round"; c.lineCap = "round";
    c.beginPath(); P.forEach((p,i)=> i ? c.lineTo(px(p.x), pz(p.z)) : c.moveTo(px(p.x), pz(p.z)));
    c.closePath(); c.stroke();
  };
  trace(7, "#000"); trace(4, "#f3e6c4");
  c.fillStyle = "#e0301e"; c.beginPath(); c.arc(px(P[0].x), pz(P[0].z), 4, 0, 7); c.fill();
  c.strokeStyle = "#000"; c.lineWidth = 1.5; c.stroke();
}
function trackFacts(id){
  const t = TRACKS[id], rec = SAVE.records[t.name] || {};
  const bits = [["Length", (trackThumb(id).len/1000).toFixed(2) + " km"]];
  if(id === TRACK_ID) bits.push(["Typical lap", fmt(LAP_TEST.lap)]);
  bits.push(["Best lap", rec.bestLap != null ? fmt(rec.bestLap) : "none yet"]);
  if(rec.race5 != null) bits.push(["Best 5 laps", fmt(rec.race5)]);
  if(rec.race3 != null) bits.push(["Best 3 laps", fmt(rec.race3)]);
  return '<div class="facts">' + bits.map(b => '<span>' + b[0] + '<b>' + esc(b[1]) + '</b></span>').join("") + '</div>';
}
function detailHTML(id){
  const t = TRACKS[id];
  const blurb = t.blurb.charAt(0).toUpperCase() + t.blurb.slice(1) + ".";
  return '<h3>' + esc(t.name) + '</h3><p>' + esc(blurb) + ' Laid out after ' + esc(t.after) + '.</p>' + trackFacts(id);
}
function standingsRows(){
  const C = SAVE.champ;
  const names = ["You"].concat(rivalDefs.map(d => d.name));
  return names.map(n => ({name:n, pts:(C && C.pts[n]) || 0, you:n === "You"}))
              .sort((a,b)=> b.pts - a.pts || (a.you ? -1 : 1));
}
function standingsTable(){
  return '<table class="grid">' + standingsRows().map((r,i)=>
    '<tr' + (r.you ? ' class="you"' : '') + '><td class="p">' + (i+1) + '</td><td class="n">' + esc(r.name) +
    '</td><td class="t">' + r.pts + ' pts</td></tr>').join("") + '</table>';
}

/* the garage camera: a slow turn round your car, parked on the grid */
function garageCam(dt){
  GAME.garageA = (GAME.garageA || 0.6) + dt*0.22;
  car.visible = true; carShadow.visible = true;
  rivals.forEach(r=>{ r.mesh.visible = false; r.shadow.visible = false; });
  const a = GAME.garageA, cx = pose.x, cz = pose.z, cy = car.position.y;
  camera.position.set(cx + Math.sin(a)*7.6, cy + 1.7, cz + Math.cos(a)*7.6);
  // aim a little to the left of the car so it sits to the right of the menu
  const rx = Math.cos(a), rz = -Math.sin(a);
  camera.lookAt(cx - rx*2.4, cy + 0.65, cz - rz*2.4);
}

/* ---- results ---- */
function showResults(){
  GAME.resultsShown = true;
  const rows = classification();
  const lead = rows[0].time;
  let gained = null;
  if(MODE === "champ" && SAVE.champ && !SAVE.champ.done){
    const C = SAVE.champ;
    gained = {};
    rows.forEach((r, i)=>{ gained[r.name] = CHAMP_POINTS[i] || 0; C.pts[r.name] = (C.pts[r.name]||0) + gained[r.name]; });
    C.log[C.round] = { track:TRACK.name, place:GAME.finishPlace };
    C.round++;
    if(C.round >= CHAMP_ROUNDS.length) C.done = true;
    persist();
  }
  const table = FIELD.length ? '<table class="grid">' + rows.map((r, i)=>
      '<tr' + (r.you ? ' class="you"' : '') + '><td class="p">' + (i+1) + '</td><td class="n">' + esc(r.name) +
      '</td><td class="t">' + fmt(r.time) + '</td><td class="x">' +
      (i ? '+' + (r.time - lead).toFixed(2) + (r.est ? ' est.' : '') : '') + '</td>' +
      (gained ? '<td class="t">+' + gained[r.name] + '</td>' : '') + '</tr>').join("") + '</table>' : '';
  const laps = '<div class="laps">' + state.lapTimes.map((t, i)=>
      '<span' + (t === state.best ? ' class="best"' : '') + '>Lap ' + (i+1) + ' ' + fmt(t) + '</span>').join("") + '</div>';
  const badges = (GAME.raceRecord ? '<span class="badge">NEW BEST RACE</span>' : '') +
                 (GAME.lapRecord ? '<span class="badge">NEW BEST LAP</span>' : '');
  const title = FIELD.length ? (GAME.finishPlace === 1 ? "YOU WIN" : ordinal(GAME.finishPlace) + " PLACE") : fmt(GAME.finishTime);
  const acts = {}, items = [];
  if(MODE === "champ"){
    items.push(['stand', SAVE.champ && SAVE.champ.done ? "FINAL STANDINGS" : "STANDINGS"]);
    acts.stand = ()=>{ SFX.ok(); showStandings(); };
  } else {
    items.push(['again', MODE === "trial" ? "GO AGAIN" : "RACE AGAIN"], ['tracks', "CHOOSE CIRCUIT"], ['menu', "MAIN MENU"]);
    acts.again = ()=>{ SFX.ok(); setMode(MODE); resetRace(); };
    acts.tracks = ()=>{ SFX.ok(); const m = MODE; enterMenuWorld(); showTracks(m); };
    acts.menu = ()=>{ SFX.back(); const m = MODE; enterMenuWorld(); showMain(m === "race" ? 1 : 2); };
  }
  openScreen("scResults",
    '<div class="cols" style="align-items:flex-start"><div class="left">' +
    '<div class="big">' + title + '</div><h2 class="head" style="margin-top:6px">' + esc(TRACK.name) +
    (FIELD.length ? ' in ' + fmt(GAME.finishTime) : '') + '</h2>' + badges +
    '<div class="menu" style="margin-top:22px">' +
    items.map(x => '<button class="item" data-act="' + x[0] + '"><span>' + x[1] + '</span></button>').join("") +
    '</div></div><div class="right">' + table + laps + '</div></div>',
    { cls:"dim", acts });
}
function showStandings(){
  const C = SAVE.champ;
  const rows = standingsRows();
  const final = C.done;
  const myPos = rows.findIndex(r => r.you) + 1;
  const next = !final ? TRACKS[CHAMP_ROUNDS[C.round]].name : "";
  openScreen("scStand",
    '<div class="cols"><div class="left">' +
    (final ? '<div class="big">' + (myPos === 1 ? "CHAMPION" : ordinal(myPos) + " OVERALL") + '</div>'

    '<h2 class="head" style="margin-top:6px">' + (final ? "Championship over" : "After round " + C.round + " of " + CHAMP_ROUNDS.length) + '</h2>' +
    '<div class="menu">' +
    (final ? '' : '<button class="item" data-act="next"><span>NEXT ROUND</span><small>' + esc(next) + '</small></button>') +
    '<button class="item' + (final ? '' : ' back') + '" data-act="menu"><span>MAIN MENU</span></button></div></div>' +
    '<div class="right">' + standingsTable() + '</div></div>',
    { acts:{ next:()=>{ SFX.ok(); champRound(); },
             menu:()=>{ SFX.back(); if(final){ SAVE.champ = null; persist(); } enterMenuWorld(); showMain(0); } } });
  if(final && myPos === 1) SFX.best();
}

/* ------------------------------------------------------------------ *
 *  Boot
 * ------------------------------------------------------------------ */
function boot(){
  applySettings();
  enterMenuWorld();
  let b = null;
  try{ b = JSON.parse(sessionStorage.getItem(BOOT_KEY) || "null"); sessionStorage.removeItem(BOOT_KEY); }catch(e){}
  document.getElementById("loading").classList.add("gone");
  if(b && b.mode === "champ" && SAVE.champ && !SAVE.champ.done) showChampIntro();
  else if(b && b.then === "ready" && MODES[b.mode]) showReady(b.mode);
  else showTitle();
}

 * ------------------------------------------------------------------ */
placeAtStart();
sizeHUD();
let last = performance.now();
let info = {sp:0, offRoad:false, thr:0, hand:false, surf:0, air:false};

/* ------------------------------------------------------------------ *
 *  Litter on the road
 *
 *  Loose leaves lying in drifts across the road on the summer and fall
 *  circuits, and sticks scattered over the old broken tar everywhere. Each
 *  one is its own piece: a car going by (yours or a rival's) pushes air
 *  ahead of it and drags a wake behind, and whatever is close enough is
 *  flung up and out, tumbles, and flutters back down where it lands.
 *  Nothing is reset during a race, so a lap later the road shows where
 *  you went.
 * ------------------------------------------------------------------ */
const PILES = [];                      // (kept for the debug handle)
const PILE_KIND = TRACK.season === "winter" || TRACK.season === "desert" ? "none" : FALL ? "fall" : "summer";
function pileColour(c){
  const r = Math.random();
  if(PILE_KIND === "fall") return fallTint(c);
  // late summer: green going brown and gold
  if(r < 0.45) return c.setHSL(0.22 + Math.random()*0.06, 0.45, 0.34 + Math.random()*0.1);
  if(r < 0.75) return c.setHSL(0.10 + Math.random()*0.04, 0.55, 0.40 + Math.random()*0.1);
  return c.setHSL(0.07, 0.45, 0.28 + Math.random()*0.08);
}
const LITTER = { items:[], leaf:null, stick:null, home:[] };
{
  const items = LITTER.items;
  const put = (kind, x, z)=>{
    const y = surfaceY(x, z) + 0.02;
    items.push({kind, x, y, z, vx:0, vy:0, vz:0, yaw:Math.random()*6.28, tilt:(Math.random() - 0.5)*0.3, roll:(Math.random() - 0.5)*0.3,
                spin:0, air:false, sc: kind ? 0.7 + Math.random()*0.8 : 1.5 + Math.random()*0.9, ph:Math.random()*6.28});
  };
  const scatter = (P, i, n, kind, reach)=>{
    const t = P.tans[i], p = P.pts[i], hw = P.half[i] + 1.2;
    for(let k=0;k<n;k++){
      const along = (Math.random() - 0.5)*reach, lat = (Math.random()*2 - 1)*hw*(0.6 + 0.4*Math.random());
      put(kind, p.x + t.x*along - t.z*lat, p.z + t.z*along + t.x*lat);
    }
  };
  const clearHere = (P, i)=> P.surf[i] !== SURF.WATER && !(P.deck && P.deck[i]) && !(P.wet && P.wet[i] > 0.3);
  // drifts of leaves: often, the whole way round
  if(PILE_KIND !== "none"){
    const step = Math.round(58/MAIN.seg);
    for(let i=Math.round(40/MAIN.seg); i<MAIN.N - step*0.4; i+=step + Math.round(Math.random()*30/MAIN.seg)){
      if(clearHere(MAIN, i)) scatter(MAIN, i, 90 + Math.round(Math.random()*50), 0, 16 + Math.random()*12);
    }
    BRANCHES.forEach(P=>{ for(const f of [0.3, 0.55, 0.8]){ const i = Math.round(P.N*f); if(clearHere(P, i)) scatter(P, i, 45, 0, 12); } });
  }
  // sticks: thick over the old tar, a few everywhere in the woods
  paths.forEach(P=>{
    for(let i=0;i<P.N;i+=Math.max(1, Math.round(5/P.seg))){
      const tar = P.st_paved ? P.st_paved[i] : 0;
      const pr = tar > 0.5 ? 0.9 : (PILE_KIND !== "none" ? 0.08 : 0.03);
      if(Math.random() < pr && clearHere(P, i)) scatter(P, i, tar > 0.5 ? 3 + Math.floor(Math.random()*3) : 2, 1, 6);
    }
  });
  items.forEach(o=> LITTER.home.push([o.x, o.y, o.z, o.yaw]));
  // a leaf: a little pointed oval, double sided; a stick: a thin crooked rod
  const lg = new THREE.BufferGeometry();
  { const P = [0,0,0.16, 0.07,0,0.05, 0.06,0,-0.08, 0,0,-0.15, -0.06,0,-0.08, -0.07,0,0.05];
    lg.setAttribute("position", new THREE.Float32BufferAttribute(P, 3));
    lg.setIndex([0,1,5, 1,2,5, 2,4,5, 2,3,4]); lg.computeVertexNormals(); }
  const sg = new THREE.CylinderGeometry(0.022, 0.03, 0.9, 5); sg.rotateZ(Math.PI/2);
  const nL = items.filter(o=> !o.kind).length, nS = items.length - nL;
  if(nL){ LITTER.leaf = new THREE.InstancedMesh(lg, new THREE.MeshLambertMaterial({side:THREE.DoubleSide}), nL); scene.add(LITTER.leaf); }
  if(nS){ LITTER.stick = new THREE.InstancedMesh(sg, new THREE.MeshLambertMaterial({color: DESERT ? 0x9a7a52 : 0x5e4630}), nS);
          LITTER.stick.castShadow = true; scene.add(LITTER.stick); }
  const c = new THREE.Color();
  let li = 0, si = 0;
  items.forEach(o=>{ o.slot = o.kind ? si++ : li++;
    if(!o.kind){ pileColour(c); LITTER.leaf.setColorAt(o.slot, c); } });
  if(LITTER.leaf && LITTER.leaf.instanceColor) LITTER.leaf.instanceColor.needsUpdate = true;
  [LITTER.leaf, LITTER.stick].forEach(m=>{ if(m){ m.frustumCulled = false; m.instanceMatrix.setUsage(THREE.DynamicDrawUsage); } });
}
const _lm = new THREE.Matrix4(), _lq = new THREE.Quaternion(), _le = new THREE.Euler(), _lv = new THREE.Vector3(), _ls = new THREE.Vector3();
function placeLitter(o){
  _le.set(o.tilt, o.yaw, o.roll, "YXZ"); _lq.setFromEuler(_le);
  _lv.set(o.x, o.y, o.z); _ls.set(o.sc, o.sc, o.sc); _lm.compose(_lv, _lq, _ls);
  (o.kind ? LITTER.stick : LITTER.leaf).setMatrixAt(o.slot, _lm);
}
LITTER.items.forEach(placeLitter);
let litterRustle = 0;
function stepLeafPiles(dt){
  const items = LITTER.items;
  if(!items.length) return;
  // the cars moving the air: where they are, how fast, which way
  const who = [];
  const psp = Math.hypot(pose.vx, pose.vz);
  if(psp > 5) who.push([pose.x, pose.y, pose.z, pose.vx, pose.vz, psp, true]);
  if(typeof rivals !== "undefined") FIELD.forEach(r=>{
    if(!r.mesh.visible || (r.v || 0) < 5) return;
    const t = tans[((Math.floor(r.s)%NS)+NS)%NS];
    who.push([r.mesh.position.x, r.mesh.position.y, r.mesh.position.z, t.x*r.v, t.z*r.v, r.v, false]);
  });
  let kicked = 0, dirtyL = false, dirtyS = false;
  for(const o of items){
    if(!o.air){
      for(const w of who){
        const dx = o.x - w[0], dz = o.z - w[2], sp = w[5];
        const R = 1.6 + sp*0.085;                    // faster cars move more air, wider
        if(dx*dx + dz*dz > R*R || Math.abs(o.y - w[1]) > 2.5) continue;
        const ux = w[3]/sp, uz = w[4]/sp, d = Math.hypot(dx, dz) || 0.1;
        const along = dx*ux + dz*uz, lat = dx*-uz + dz*ux;
        const k = (1 - d/R)*(0.55 + Math.random()*0.7)*(o.kind ? 0.55 : 1);
        const side = Math.sign(lat) || 1;
        // out to the side, dragged along in the wake, and lifted
        o.vx = w[3]*(0.35 + 0.35*(along < 0 ? 1 : 0))*k - uz*side*(2 + sp*0.14)*k + (Math.random() - 0.5)*1.5;
        o.vz = w[4]*(0.35 + 0.35*(along < 0 ? 1 : 0))*k + ux*side*(2 + sp*0.14)*k + (Math.random() - 0.5)*1.5;
        o.vy = (1.5 + sp*(o.kind ? 0.09 : 0.16))*k*(0.6 + Math.random()*0.8);
        o.spin = (Math.random() - 0.5)*(o.kind ? 18 : 12);
        o.air = true; o.y += 0.05;
        if(w[6]) kicked++;
        break;
      }
      continue;
    }
    // flying: leaves are all drag and flutter, sticks tumble and drop
    const drag = o.kind ? 0.9 : 3.0;
    o.vy -= 9.8*dt;
    o.vx -= o.vx*Math.min(1, dt*drag); o.vz -= o.vz*Math.min(1, dt*drag);
    if(!o.kind && o.vy < -1.3) o.vy += (-1.3 - o.vy)*Math.min(1, dt*6);
    o.ph += dt*(o.kind ? 3 : 6);
    const sway = o.kind ? 0 : 0.9;
    o.x += (o.vx + Math.sin(o.ph)*sway)*dt; o.y += o.vy*dt; o.z += (o.vz + Math.cos(o.ph*0.8)*sway)*dt;
    o.yaw += o.spin*dt; o.tilt = o.kind ? o.tilt + o.spin*dt*0.6 : Math.sin(o.ph)*0.9; o.roll = o.kind ? o.roll : Math.cos(o.ph*1.3)*0.8;
    const gy = surfaceY(o.x, o.z) + 0.02;
    if(o.y <= gy && o.vy < 0){
      if(o.kind && o.vy < -3){ o.vy *= -0.3; o.spin *= 0.5; o.y = gy; }
      else { o.y = gy; o.air = false; o.vx = o.vy = o.vz = 0; o.tilt = (Math.random() - 0.5)*0.3; o.roll = o.kind ? 0 : (Math.random() - 0.5)*0.3; }
    }
    placeLitter(o);
    if(o.kind) dirtyS = true; else dirtyL = true;
  }
  if(dirtyL || kicked) LITTER.leaf && (LITTER.leaf.instanceMatrix.needsUpdate = true);
  if(dirtyS || kicked) LITTER.stick && (LITTER.stick.instanceMatrix.needsUpdate = true);
  litterRustle -= dt;
  if(kicked > 3 && litterRustle <= 0 && typeof SFX !== "undefined"){ SFX.leaves(Math.min(1, kicked/25 + 0.2)); litterRustle = 0.35; }
}
function resetPiles(){
  LITTER.items.forEach((o, i)=>{ const h = LITTER.home[i]; o.x = h[0]; o.y = h[1]; o.z = h[2]; o.yaw = h[3];
    o.air = false; o.vx = o.vy = o.vz = 0; o.tilt = (Math.random() - 0.5)*0.3; o.roll = 0; placeLitter(o); });
  [LITTER.leaf, LITTER.stick].forEach(m=>{ if(m) m.instanceMatrix.needsUpdate = true; });
}

function stepDust(dt){
  for(let i=0;i<DUST;i++){
    if(dustLife[i] > 0){
      dustLife[i] -= dt;
      dustPos[i*3]   += dustVel[i*3]*dt;
      dustPos[i*3+1] += dustVel[i*3+1]*dt;
      dustPos[i*3+2] += dustVel[i*3+2]*dt;
      dustVel[i*3]   *= (1 - dt*1.9);
      dustVel[i*3+2] *= (1 - dt*1.9);
      dustVel[i*3+1] -= dustGrav[i]*dt;
      dustSize[i]    += dt*dustGrow[i];
      dustAlpha[i]    = Math.max(0, Math.min(1, dustLife[i]))*0.85;
      if(dustLife[i] <= 0){ dustPos[i*3+1] = -999; dustAlpha[i] = 0; }
    }
  }
  dustGeo.attributes.position.needsUpdate = true;
  dustGeo.attributes.aAlpha.needsUpdate = true;
  dustGeo.attributes.aSize.needsUpdate = true;
  dustGeo.attributes.aCol.needsUpdate = true;
}

function frame(now){
  requestAnimationFrame(frame);
  let dt = (now - last)/1000; last = now;
  // the first frame after a slow load can be stamped before `last` was taken,
  // which made dt negative and ran the rivals backwards off the lap
  dt = Math.max(0, Math.min(dt, 0.05));
  pollInput(dt);
  const run = !GAME.paused;

  if(run){
    if(state.phase === "countdown"){
      const before = Math.ceil(state.countdown);
      state.countdown -= dt;
      const after = Math.ceil(state.countdown);
      if(after !== before && after >= 1 && after <= 3) SFX.beep();
      if(state.countdown <= 0){
        state.phase = "racing";
        postMat.uniforms.uFlash.value = 0.35;
        state.t = 0; state.lapStart = 0;
        GAME.goT = 1.3; GHOST.rec = [];
        SFX.go();
      }
    } else if(state.phase === "racing"){
      state.t += dt;
    } else if(state.phase === "done"){
      GAME.doneT += dt;
      if(GAME.doneT > 3.4 && !GAME.resultsShown) showResults();
    }

    info = stepCar(dt);
    stepRivals(dt);
    stepLeafPiles(dt);
    if(state.phase === "racing" || state.phase === "done") state.place = computePlace();
    stepRaceEvents(dt, info);
    stepGhost();

    stepDust(dt);

    if(state.phase === "menu") (GAME.garage ? garageCam(dt) : attractCam(dt));
    else if(state.phase === "done" && GAME.doneT > 1.4) finishCam(dt);
    else stepCamera(dt, info.sp);
    if(GAME.shake > 0){
      camera.position.x += (Math.random()-0.5)*GAME.shake;
      camera.position.y += (Math.random()-0.5)*GAME.shake;
    }
  }
  skyDome.position.set(camera.position.x, 0, camera.position.z);  // horizon stays put
  stepAudio(info, dt);

  const alongNow = pose.vx*Math.sin(pose.h) + pose.vz*Math.cos(pose.h);
  drawHUD(run ? dt : 0, alongNow);

  carShadow.position.set(pose.x, surfaceY(pose.x, pose.z) + 0.05, pose.z);
  carShadow.rotation.z = -(pose.h + pose.yawVis);
  rivals.forEach(r=>{
    r.shadow.position.set(r.mesh.position.x, r.mesh.position.y + 0.05, r.mesh.position.z);
    r.shadow.rotation.z = -r.mesh.rotation.y;
  });

  if(run){
    splash.mud   = Math.max(0, splash.mud   - dt*0.42);
    splash.water = Math.max(0, splash.water - dt*0.75);
  }
  const lens = state.phase === "menu" ? 0 : 1;
  elSplatMud.style.opacity   = (splash.mud*0.10*lens).toFixed(3);
  elSplatWater.style.opacity = (splash.water*0.16*lens).toFixed(3);

  const clock = state.phase === "menu" ? GAME.attractT : state.t;
  ANIMS.forEach(f=> f(clock));
  waterMats.forEach(m=>{
    if(m.uniforms) m.uniforms.uTime.value = clock;
    else if(m.map) m.map.offset.y = (clock*0.09)%1;
  });
  car.userData.tail.emissiveIntensity =
    (state.phase === "racing" && CTL.brk && alongNow > 0.5) ? 1.8 : 0.22;

  skidMat.uniforms.uTime.value = state.t;
  const sp = state.phase === "menu" ? 0 : info.sp;
  postMat.uniforms.uSpeed.value = GAME.paused ? 0 : Math.max(0, (sp/MAXV - 0.42))*1.7
                                 + (drift.on ? Math.min(0.5, 0.12 + drift.t*0.16) : 0)
                                 + (drift.boostT > 0 ? 0.55*Math.min(1, drift.boostT) : 0);
  postMat.uniforms.uFlash.value = Math.max(0, postMat.uniforms.uFlash.value - dt*2.2);
  updateSunGlow();

  followShadow();
  renderView(now*0.001);
}
/* #debug: a handle on the world for testing tools */
if(/debug/.test(location.hash)){
  window.__R = { THREE, TRACKS, TRACK, TRACK_ID, MAIN, BRANCHES, paths, ROUTE, pose, state, camera, scene, renderer,
                 surfaceY, gridH, nearest, PILES, PIT, GAME, CTL, trans, MAXV, radiiOf, radiiOpen, resetRace, setMode,
                 closeUI, rivals, car, splash, cornerHoldSpeed, stepCar, placeAtStart, drift, AUTO_JUMPS,
                 CALM, AUTO_JUMPS_N: AUTO_JUMPS.length, __ox: TRACK._ox, __oz: TRACK._oz, stepDust, stepCamera, stepLeafPiles, FORDS, RIVER, CANYON, STONES, stoneY, carNow: ()=> car };
}
boot();
requestAnimationFrame(frame);

addEventListener("resize", ()=>{
  camera.aspect = window.innerWidth/window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
  sizeRT();
  sizeHUD();
});
})();
</script>
