/* ---- music: a little arcade loop, sequenced ahead of the clock -------
   A minor, i - VI - III - VII, four on the floor. The menu gets all of
   it; in a race it sits under the engine. */
const MUSIC = {
  bpm: 126,
  chords: [[57,60,64], [53,57,60], [48,52,55], [55,59,62]],   // Am F C G (midi)
  lead: [ // one bar per chord, 16 steps, -1 is a rest
    [76,-1,74,-1, 72,-1,74,76, -1,-1,79,-1, 76,-1,74,-1],
    [72,-1,74,-1, 76,-1,-1,72, -1,69,-1,-1, 72,-1,-1,-1],
    [76,-1,79,-1, 81,-1,79,76, -1,-1,74,-1, 72,-1,74,-1],
    [74,-1,-1,71, -1,-1,74,-1, 79,-1,78,-1, 79,-1,-1,-1]
  ]
};
const mtof = m => 440*Math.pow(2, (m-69)/12);
function tickMusic(){
  if(!actx || actx.state !== "running") return;
  const spb = 60/MUSIC.bpm/4;                  // seconds per 16th
  while(AUD.seqNext < actx.currentTime + 0.12){
    const t = AUD.seqNext, s = AUD.step % 16, bar = Math.floor(AUD.step/16) % 4;
    const ch = MUSIC.chords[bar];
    const at = t - actx.currentTime;
    const B = AUD.music;
    // kick and snare
    if(s % 4 === 0) tone(120, 0.16, "sine", 0.55, 42, at, B);
    if(s === 4 || s === 12) burst(0.14, "bandpass", 1800, 0.22, 0.7, at, 0, B);
    if(s % 2 === 1) burst(0.04, "highpass", 7000, 0.07, 0.8, at, 0, B);
    // bass on the eighths, octave pop on the offbeat
    if(s % 2 === 0) tone(mtof(ch[0]-24 + (s % 4 === 2 ? 12 : 0)), 0.14, "triangle", 0.30, 0, at, B);
    // arpeggio underneath, quiet
    tone(mtof(ch[s % 3] + 12), 0.07, "square", 0.022, 0, at, B);
    // lead only in the menu, the race is busy enough
    const n = MUSIC.lead[bar][s];
    if(n > 0 && AUD.musicMode === "menu" && Math.floor(AUD.step/64) % 2 === 1)
      tone(mtof(n), 0.22, "square", 0.05, 0, at, B);
    AUD.seqNext += spb;
    AUD.step++;
  }
}

/* continuous layers, driven from the car every frame */
function stepAudio(info, dt){
  if(!actx) return;
  tickMusic();
  const now = actx.currentTime;
  const live = !GAME.paused && (state.phase === "racing" || state.phase === "countdown" || state.phase === "done");
  const R = AUD.road;
  if(!muted && live){
    /* On the grid you can rev it: hold the throttle through the countdown
       and it climbs to the limiter and bounces there. */
    const onGrid = state.phase === "countdown";
    const gas = onGrid ? (CTL.thr ? 1 : 0) : info.thr;
    if(onGrid){
      AUD.revRpm = AUD.revRpm || DRIVE.idle;
      AUD.revRpm += gas ? Math.min(9000*dt, (DRIVE.redline*1.02 - AUD.revRpm)) : -Math.min(5000*dt, AUD.revRpm - DRIVE.idle);
    } else AUD.revRpm = trans.rpm;
    let rpm = onGrid ? AUD.revRpm : Math.min(DRIVE.redline*1.02, trans.rpm + (trans.spin || 0));
    /* The limiter: at the red line with the throttle down, the ignition cuts
       and comes back fifteen times a second, and it spits pops. */
    AUD.limT = (AUD.limT || 0) + dt;
    let limiting = false;
    if(gas && rpm >= DRIVE.redline*0.975){
      limiting = true;
      if(AUD.limT > 0.065){ AUD.limT = 0; AUD.limOn = !AUD.limOn; if(!AUD.limOn && Math.random() < 0.45) SFX.pop(0.9); }
      if(!AUD.limOn){ rpm *= 0.94; if(onGrid) AUD.revRpm = DRIVE.redline*0.93; }
    } else AUD.limOn = true;
    const r = rpm/DRIVE.redline;
    const load = gas ? (limiting && !AUD.limOn ? 0.1 : 1) : 0.15;
    let vol = (0.10 + load*0.07 + r*0.07)*(1 - trans.cut*0.6)*(limiting && !AUD.limOn ? 0.45 : 1);
    if(state.phase === "done") vol *= Math.max(0, 1 - GAME.doneT*0.4);
    setEngine(AUD.eng, rpm, load, vol, now, 0.03);
    // pops: one on every upshift under power, a crackle on the overrun
    if(trans.shiftT > 0 && AUD.shiftPrev <= 0 && info.thr && trans.target > trans.gear) SFX.pop(0.8 + r*0.4);
    AUD.shiftPrev = trans.shiftT;
    AUD.crackleT -= dt;
    if(!gas && rpm > 3400 && AUD.crackleT <= 0){ SFX.crackle(0.6 + r); AUD.crackleT = 0.04 + Math.random()*0.16; }
    if(!gas && rpm > 4200 && Math.random() < dt*1.5) SFX.pop(0.5);

    const sp = info.sp || 0, ground = info.air ? 0 : 1;
    const mud = info.mud || 0, wet = info.wet || 0, ice = info.ice || 0;
    const off = info.offRoad ? 1 : 0;
    const snow = WINTER ? 1 : 0, sand = DESERT ? 1 : 0;
    const v = Math.min(1, sp/40);
    // gravel crunch: the bread and butter, darker in sand, brighter and softer in snow
    const crunch = Math.max(0, 1 - mud - ice*0.9 - wet*0.6);
    R.mid.g.gain.setTargetAtTime(ground*crunch*v*(0.16 + off*0.1)*(1 - sand*0.35), now, 0.06);
    R.mid.f.frequency.setTargetAtTime((sand ? 450 : snow ? 1300 : 700) + sp*(snow ? 30 : 22), now, 0.1);
    // rumble through the body, much more off the road
    R.low.g.gain.setTargetAtTime(ground*v*(0.10 + off*0.22 + mud*0.12), now, 0.08);
    R.low.f.frequency.setTargetAtTime(90 + sp*2.5 + mud*60, now, 0.1);
    // ice hiss and powder
    R.high.g.gain.setTargetAtTime(ground*v*(ice*0.09 + snow*0.025), now, 0.08);
    // the tyres scrubbing sideways: a drift, a slide, a hard corner
    const slide = Math.min(1, (drift.on ? 1 : 0) + Math.max(0, (info.slip || 0) - 1.2)*0.25)*Math.min(1, sp/15)*ground;
    R.slide.g.gain.setTargetAtTime(slide*(0.10 + ice*0.05)*(1 - mud*0.5), now, 0.05);
    R.slide.f.frequency.setTargetAtTime((ice ? 2600 : 1200) + (drift.tier + 1)*350, now, 0.1);
    // wading: a continuous churn while the wheels are in the water
    R.wade.g.gain.setTargetAtTime(ground*Math.min(1, wet*1.5)*Math.min(1, sp/8)*0.22*(0.8 + Math.random()*0.4), now, 0.03);
    R.wade.f.frequency.setTargetAtTime(700 + sp*25, now, 0.1);
    // wind rising with speed, louder in the air
    AUD.wind.g.gain.setTargetAtTime(Math.pow(v, 2)*(0.07 + (info.air ? 0.08 : 0)), now, 0.1);
    AUD.wind.f.frequency.setTargetAtTime(300 + sp*28, now, 0.1);
  } else {
    AUD.eng.out.gain.setTargetAtTime(0, now, 0.05);
    for(const k in R) R[k].g.gain.setTargetAtTime(0, now, 0.05);
    AUD.wind.g.gain.setTargetAtTime(0, now, 0.05);
  }
  // the room: echo off the canyon walls and the snow shed's roof
  let room = 0.06;
  if(live && CANYON.on) room = Math.max(room, 0.06 + canyonAt(pose.x, pose.z)*0.5);
  if(live && GALLERY.on){
    const n = nearest(pose.x, pose.z);
    if(n.path === MAIN && ((n.pi - GALLERY.a)%MAIN.N + MAIN.N)%MAIN.N <= GALLERY.b - GALLERY.a) room = 0.55;
  }
  if(live && GORGE.on && deckAt(pose.x, pose.z) > 0.5) room = Math.max(room, 0.3);
  AUD.verbSend.gain.setTargetAtTime(room, now, 0.3);
  // rivals: heard where they are, louder close by, and pitched by their speed
  const cr = camera.matrixWorld.elements, rx = cr[0], rz = cr[2];      // the camera's right
  AUD.rivals.forEach((A, k)=>{
    const r = FIELD[k];
    if(!r || !r.mesh.visible || muted || GAME.paused || state.phase === "menu"){ A.out.gain.setTargetAtTime(0, now, 0.1); return; }
    const dx = r.mesh.position.x - pose.x, dz = r.mesh.position.z - pose.z, d = Math.hypot(dx, dz);
    const vol = 0.09/(1 + (d/14)*(d/14));
    const rv = Math.max(0, r.v || 0), rpm = 1800 + (rv % 12)/12*3800 + rv*25;
    setEngine(A.e, rpm, 0.8, 1, now, 0.08);
    A.out.gain.setTargetAtTime(vol, now, 0.1);
    if(A.pan) A.pan.pan.setTargetAtTime(Math.max(-1, Math.min(1, (dx*rx + dz*rz)/Math.max(6, d))), now, 0.1);
  });
}

/* ------------------------------------------------------------------ *
 *  Race state
 * ------------------------------------------------------------------ */
let LAPS = TRACK.test ? 99 : 5;
const state = {
  phase:"menu",      // menu | countdown | racing | done
  t:0, countdown:3,
  lap:1, prevIdx:0, idx:0, place:4,
  lapTimes:[], lapStart:0, best:null
};
const pose = { x:0, z:0, y:0, h:0, vx:0, vz:0, yawVis:0, roll:0, pitch:0, wheelSpin:0,
               steerVis:0, steerIn:0, accLP:0,
               vy:0, air:false, lastGy:0, spring:0, springV:0, airT:0, bumpLP:0,
               artPitch:0, artRoll:0, artBase:0 };
/* Charge tiers, the mini turbo idea: holding a slide builds a charge whose
   colour tells you what you have banked, and letting go spends it. Nothing
   is gained during the slide itself, only on release. */
const DRIFT_TIERS = [
  {at:0.75, name:"BLUE",   col:[0.30, 0.72, 1.00], push:6.9, time:0.90},
  {at:1.70, name:"ORANGE", col:[1.00, 0.60, 0.12], push:7.0, time:1.40},
  {at:2.90, name:"VIOLET", col:[0.76, 0.38, 1.00], push:6.9, time:2.00}
];
function driftTier(t){
  let idx = -1;
  for(let i=0;i<DRIFT_TIERS.length;i++) if(t >= DRIFT_TIERS[i].at) idx = i;
  return idx;
}
const drift = { mode:"off", dir:0, hold:0, spacePrev:false,
                on:false, t:0, best:0, score:0, angle:0, tier:-1,
                boostT:0, boostPower:0, boostTier:-1, flash:0 };
const splash = { mud:0, water:0 };

function placeAtStart(){
  const p = pts[0], t = tans[0];
  const nx=-t.z, nz=t.x;
  pose.x = p.x - nx*1.8; pose.z = p.z - nz*1.8;
  pose.y = p.y; pose.h = Math.atan2(t.x, t.z);
  pose.vx = pose.vz = 0; pose.yawVis = 0; pose.steerIn = 0; pose.steerVis = 0;
  pose.roll = pose.pitch = 0; pose.accLP = 0;
  pose.vy = 0; pose.air = false; pose.spring = 0; pose.springV = 0; pose.airT = 0;
  pose.artPitch = 0; pose.artRoll = 0; pose.artBase = 0; pose.bH = pose.bHv = pose.bP = pose.bPv = pose.bR = pose.bRv = 0;
  pose.lastGy = surfaceY(pose.x, pose.z);
  drift.mode = "off"; drift.dir = 0; drift.hold = 0; drift.spacePrev = false;
  drift.on = false; drift.t = 0; drift.score = 0; drift.tier = -1;
  drift.boostT = 0; drift.boostPower = 0; drift.boostTier = -1; drift.flash = 0;
  splash.mud = splash.water = 0;
  trans.gear = 1; trans.target = 1; trans.dir = 1;
  trans.rpm = DRIVE.idle; trans.shiftT = 0; trans.cut = 0; trans.lock = 0;
  state.idx = 0; state.prevIdx = 0;
  gridRivals();
}


/* ------------------------------------------------------------------ *
 *  Driving model
 * ------------------------------------------------------------------ */
const MAXV = 44;

/* Drivetrain. Gear now drives the physics rather than being read off the
   speedometer after the fact, so a shift is an event with torque behind it. */
const DRIVE = {
  R: 0.40,                                   // rolling radius, metres
  totals: [24.0, 15.5, 10.8, 7.7, 5.5],      // gear ratio x final drive
  idle: 900, redline: 6300,
  up: 5800, down: 2500,                      // auto shift points: wound out near the top before it changes
  K: 0.62,                                   // torque to acceleration constant
  shiftTime: 0.18,                           // brief, so a change is a blip not a lurch
  lockout: 0.55                              // minimum gap between changes
};
const trans = { gear:1, dir:1, rpm:900, shiftT:0, cut:0, target:1, auto:true, lock:0 };

const RPM_PER = 60/(2*Math.PI);
function rpmAt(speed, gear){
  return Math.abs(speed)/DRIVE.R * DRIVE.totals[gear-1] * RPM_PER;
}
function torqueCurve(rpm){                   // tired six, peak around 3800
  const r = Math.min(1.06, rpm/DRIVE.redline);
  return Math.max(0.18, 0.62 + 1.15*r - 0.95*r*r) * (rpm > DRIVE.redline ? 0.25 : 1);
}

function requestShift(g){
  if(g === trans.gear || g < 1 || g > DRIVE.totals.length) return;
  if(trans.shiftT > 0 || trans.lock > 0) return;
  trans.target = g;
  trans.shiftT = DRIVE.shiftTime;
  trans.lock = DRIVE.lockout;
}
function autoDrive(){
  if(EXP.on){ const al = pose.vx*Math.sin(pose.h) + pose.vz*Math.cos(pose.h); return {thr:0, brk: al > 0.4 ? 1 : 0, steer:0}; }   // pull up on the top
  const P = MAIN, i = state.idx, sp = Math.hypot(pose.vx, pose.vz);
  const ahead = Math.round((9 + sp*0.45)/P.seg), tg = P.pts[wrapIdx(P, i + ahead)];
  let err = Math.atan2(tg.x - pose.x, tg.z - pose.z) - pose.h;
  while(err >  Math.PI) err -= Math.PI*2;
  while(err < -Math.PI) err += Math.PI*2;
  let want = 26;
  if(ROUTE_V){ want = 1e9; for(let k=0;k<Math.round(40/P.seg);k+=2) want = Math.min(want, ROUTE_V[wrapIdx(P, i + k)]); want *= 0.8; }
  const along = pose.vx*Math.sin(pose.h) + pose.vz*Math.cos(pose.h);
  // pointing the wrong way (it spun, or it was sideways at the line): turn it round slowly
  if(Math.abs(err) > 1.6) return {thr: 1, brk: 0, steer: Math.sign(err)};
  return {thr: along < want ? 1 : 0, brk: along > want + 3 ? 1 : 0, steer: Math.max(-1, Math.min(1, err*2.6))};
}
function stepCar(dt){
  const fx = Math.sin(pose.h), fz = Math.cos(pose.h);
  const along = pose.vx*fx + pose.vz*fz;
  const latx = pose.vx - fx*along, latz = pose.vz - fz*along;

  const near0 = nearest(pose.x, pose.z);
  // at a crossing, stay on the stretch of road the car came in on
  if(CROSSES.length && near0.path === MAIN && CROSSES.some(c=> Math.hypot(pose.x - c[0], pose.z - c[1]) < 32)){
    const reach = Math.round(30/MAIN.seg);
    let best = Infinity, bi = state.idx;
    for(let k=-reach;k<=reach;k++){
      const i = wrapIdx(MAIN, state.idx + k), q = MAIN.pts[i];
      const d = (q.x - pose.x)**2 + (q.z - pose.z)**2;
      if(d < best){ best = d; bi = i; }
    }
    if(best < 400){ near0.i = near0.pi = bi; near0.half = MAIN.half[bi]; near0.surf = MAIN.surf[bi]; }
  }
  const nIdx = near0.i, nDist = near0.dist, nHalf = near0.half;
  const surf = near0.surf;
  const offRoad = nDist > nHalf - 0.3;
  const deepOff = nDist > nHalf + 3.5;
  const mudAmt = offRoad ? 0 : near0.mud;          // 0 to 1, blended along the road
  const tarAmt = offRoad ? 0 : pavedAt(pose.x, pose.z);
  /* In the Winter Cup the water is ice: a ford or the creek is not deep and
     draggy but glassy, and the frozen lake is ice from shore to shore. */
  const wet0 = offRoad ? 0 : near0.wet;
  const iceAmt = FROZEN ? Math.max(wet0, iceAt(pose.x, pose.z)) : 0;
  const wetAmt = FROZEN ? 0 : wet0;
  const inMud   = mudAmt > 0.25;
  const inWater = wetAmt > 0.30;

  const driving = state.phase === "racing";
  /* After the flag the computer takes the wheel and drives a cool-down
     lap, round and round, at a steady pace, the way the rivals do: aim at
     a point on the road ahead, ease off for the corners the routing test
     says to brake for. */
  const auto = state.phase === "done" ? autoDrive() : null;
  const thr = (auto ? auto.thr : driving && CTL.thr ? 1 : 0)*((GAME.stallT || 0) > 0 ? 0.15 : 1);
  const brk = auto ? auto.brk : driving && CTL.brk ? 1 : 0;
  const hand = auto ? false : driving && CTL.hand;
  const steer = auto ? auto.steer : driving ? CTL.steer : 0;

  // ---- drivetrain -------------------------------------------------
  const sp0 = Math.abs(along);
  // dirt off the road costs grip and some speed, not the whole run
  const traction = (deepOff ? 0.60 : offRoad ? 0.74 : 1 - mudAmt*0.20 - wetAmt*0.08) * (1 - iceAmt*0.28);

  // engage forward or reverse from a near stop
  if(sp0 < 0.6){
    if(thr) trans.dir = 1;
    else if(brk) trans.dir = -1;
  }

  // shift timing: torque eases out through the change, then the new ratio lands
  if(trans.lock > 0) trans.lock -= dt;
  if(trans.shiftT > 0){
    trans.shiftT -= dt;
    if(trans.shiftT <= DRIVE.shiftTime*0.45) trans.gear = trans.target;
  } else if((trans.auto || state.phase === "done") && trans.dir > 0 && (state.phase === "racing" || state.phase === "done")){
    const g = trans.gear;
    if(g < DRIVE.totals.length && trans.rpm > (thr ? DRIVE.up : DRIVE.up*0.72)) requestShift(g+1);
    else if(g > 1 && trans.rpm < DRIVE.down && rpmAt(along, g-1) < DRIVE.up*0.90) requestShift(g-1);
  }
  trans.cut += ((trans.shiftT > 0 ? 1 : 0) - trans.cut) * Math.min(1, dt*13);
  trans.rpm += (Math.max(DRIVE.idle, rpmAt(along, trans.gear)) - trans.rpm) * Math.min(1, dt*12);
  if(state.phase === "countdown" && AUD.revRpm) trans.rpm = AUD.revRpm;      // revving it on the grid: the tach follows
  {
    const muck = EXP.on && !pose.air ? Math.min(1, mudAmt + wetAmt*0.5) : 0;
    const want = thr ? muck*3300*(1 - Math.min(1, Math.abs(along)/18)) : 0;
    trans.spin = (trans.spin || 0) + (want - (trans.spin || 0))*Math.min(1, dt*(want > (trans.spin || 0) ? 6 : 3));
  }

  /* On the mountain the ground matters: the slope pulls the car back (or
     runs it away downhill), and past about 45% loose ground spins the
     wheels, so the steep way up wants a run at it and the right line. */
  let hillA = 0, climbGrip = 1;
  if(EXP.on && !pose.air){
    const hx = Math.sin(pose.h), hz = Math.cos(pose.h);
    const grade = (surfaceY(pose.x + hx*1.6, pose.z + hz*1.6) - surfaceY(pose.x - hx*1.6, pose.z - hz*1.6))/3.2;
    hillA = -9.8*grade/Math.sqrt(1 + grade*grade);
    // past about 55% the wheels just dig in: the switchbacks are the way up
    climbGrip = 1 - 0.88*smoothstep(0.40, 0.64, grade) - (offRoad ? 0.12*smoothstep(0.3, 0.5, grade) : 0);
    pose.grade = grade;
  }
  let a = hillA;
  const drive = DRIVE.K * torqueCurve(trans.rpm) * DRIVE.totals[trans.gear-1] * traction * climbGrip;

  if(trans.dir > 0){
    if(thr) a += Math.min(11.0, drive) * (1 - trans.cut*0.7);
    if(brk) a -= along > 0.4 ? (offRoad ? 15 : 23) : 0;
  } else {
    if(brk) a -= along > -11 ? 6.2 : 0;      // reverse is one lazy ratio
    if(thr) a += along < -0.4 ? (offRoad ? 15 : 23) : 0;
  }

  // resistance sets top speed instead of a hard clamp
  const sgn = Math.sign(along || 1);
  a -= sgn * (0.0006*along*along + (deepOff ? 1.9 : offRoad ? 1.0 : 0.30 + mudAmt*0.68 + wetAmt*0.34));
  a -= along * (deepOff ? 0.15 : offRoad ? 0.09 : 0.02 + mudAmt*0.075 + wetAmt*0.035 - tarAmt*0.006);
  /* The mountain's mud is thick. It holds the car harder the faster it tries
     to go (the tyres and the body are pushing a bow wave of it), so in a
     bog you plough along with the engine screaming and the wheels flinging
     it, not cruise. Swamp water drags the same way, a bit less. */
  if(EXP.on){
    const muck = mudAmt + wetAmt*0.6;
    a -= Math.sign(along)*muck*(0.95*Math.abs(along) + 0.028*along*along);
  }
  if(pose.air) a = -sgn*0.12;                       // no drive in the air
  if(hand && drift.mode !== "slide") a -= along*0.45;   // only a plain handbrake scrubs

  let newAlong = along + a*dt;
  if(!thr && !brk && Math.abs(newAlong) < 0.35) newAlong = 0;   // no creeping
  if(newAlong < -11) newAlong = -11;
  const ceiling = MAXV + (drift.boostT > 0 ? 8 : 0);   // boost lifts the limiter
  if(newAlong > ceiling) newAlong = ceiling;
  const netA = (newAlong - along)/Math.max(dt, 0.0001);

  // steering authority tapers with speed and off the ribbon
  const sp = Math.abs(newAlong);
  const auth = Math.min(1, sp/7) * (1 - Math.min(0.5, sp/MAXV*0.55)) * (offRoad?0.86:1);
  const rate = 2.05 * auth * (hand?1.25:1);
  // Turn in at the old rate, but let go and flick across much faster: on a
  // keyboard the wheel is all or nothing, and a slow return made catching a
  // slide or a quick left-right feel like steering through syrup.
  const across = steer*pose.steerIn < 0;
  const easing = !across && Math.abs(steer) < Math.abs(pose.steerIn);
  pose.steerIn += (steer - pose.steerIn) * Math.min(1, dt*(across ? 18 : easing ? 14 : 8));
  pose.h += pose.steerIn * rate * dt * Math.sign(newAlong || 1);

  // grip: lateral velocity bleeds off, slower on mud and under handbrake
  // Kart style drift: tapping the button hops the car, and it lands sideways
  // into a slide you steer through. Speed is carried, not scrubbed.
  const slipPrev = pose.vx*(-Math.cos(pose.h)) + pose.vz*Math.sin(pose.h);
  const pressed = hand && !drift.spacePrev;
  drift.spacePrev = hand;
  if(pressed && drift.mode === "off" && !pose.air && sp > 4){
    pose.vy = 2.8; pose.air = true;                  // the hop
    drift.mode = "hop";
    drift.dir = Math.abs(pose.steerIn) > 0.15 ? Math.sign(pose.steerIn) : 0;
  } else if(hand && drift.mode === "off" && !pose.air && sp > 4){
    // still holding the button: drop straight back into a slide, no second hop
    drift.mode = "slide";
    drift.hold = 0.16;
    drift.dir = Math.abs(pose.steerIn) > 0.15 ? Math.sign(pose.steerIn)
              : (Math.abs(slipPrev) > 0.5 ? Math.sign(slipPrev) : 1);
  }
  if(drift.mode === "hop"){
    if(drift.dir === 0 && Math.abs(pose.steerIn) > 0.15) drift.dir = Math.sign(pose.steerIn);
    if(!pose.air){
      if(hand){
        // if you were not steering on landing, pick the way the car is already going
        if(drift.dir === 0) drift.dir = Math.abs(slipPrev) > 0.5 ? Math.sign(slipPrev) : 1;
        drift.mode = "slide"; drift.hold = 0.16;
      } else drift.mode = "off";
    }
  }
  const sliding = drift.mode === "slide";
  if(sliding && (!hand || sp < 2.5)) drift.mode = "release";

  let grip = (hand && !sliding) ? 1.9 : deepOff ? 3.4 : offRoad ? 5.0
           : 8.6 - mudAmt*3.5 - wetAmt*2.3;
  grip *= 1 - iceAmt*0.66;                          // on ice the tail keeps on going
  grip *= 1 + tarAmt*0.18;                           // and on tar it bites
  if(pose.air) grip = 0.35;                          // barely any yaw authority mid air
  let nfx, nfz;
  if(sliding && !pose.air){
    // hold the speed the drivetrain just produced, and turn the velocity
    // itself. Steering into the slide tightens it, steering out opens it up.
    const preSpd = Math.hypot(pose.vx, pose.vz);
    const spd = Math.max(0, preSpd + (newAlong - along));
    const vh = Math.atan2(pose.vx, pose.vz);
    const into = Math.max(0,  pose.steerIn*drift.dir);
    const out  = Math.max(0, -pose.steerIn*drift.dir);
    const carve = (0.60 + into*0.95 - out*0.46) * Math.min(1, spd/9);
    const nvh = vh + drift.dir*carve*dt;
    const want = 0.30 + into*0.26 - out*0.16;        // how sideways it sits
    drift.hold += (want - drift.hold) * Math.min(1, dt*5);
    pose.vx = Math.sin(nvh)*spd;
    pose.vz = Math.cos(nvh)*spd;
    pose.h = nvh + drift.dir*drift.hold;             // nose turned into the corner
    nfx = Math.sin(pose.h); nfz = Math.cos(pose.h);
  } else {
    const k = Math.exp(-grip*dt);
    nfx = Math.sin(pose.h); nfz = Math.cos(pose.h);
    pose.vx = nfx*newAlong + latx*k;
    pose.vz = nfz*newAlong + latz*k;
  }

  pose.x += pose.vx*dt;
  pose.z += pose.vz*dt;

  // keep the car inside the world
  const rad = Math.hypot(pose.x, pose.z);
  if(rad > WORLD_EDGE){
    pose.x *= WORLD_EDGE/rad; pose.z *= WORLD_EDGE/rad;
    pose.vx *= 0.4; pose.vz *= 0.4;
  }

  /* The bridge has walls on it, so they stop the car. Without this the only
     thing between 90mph and a 10m drop into the ravine was a stone parapet
     the car could drive straight through. */
  {
    const nB = nearest(pose.x, pose.z);
    if(nB.path === MAIN && deckAt(pose.x, pose.z) > 0.5){
      const pB = MAIN.pts[nB.pi], tB = MAIN.tans[nB.pi];
      const nx2 = -tB.z, nz2 = tB.x;
      const lat = (pose.x - pB.x)*nx2 + (pose.z - pB.z)*nz2;
      const lim = nB.half + 0.95;
      if(Math.abs(lat) > lim){
        const push = (Math.abs(lat) - lim)*Math.sign(lat);
        pose.x -= nx2*push; pose.z -= nz2*push;
        const vn = pose.vx*nx2 + pose.vz*nz2;
        pose.vx -= nx2*vn*1.35; pose.vz -= nz2*vn*1.35;   // scrub along the stone
      }
    }
  }

  /* The gallery's pillars and the canyon's walls are solid: running wide
     there scrapes along them instead of climbing the rock. */
  if(GALLERY.on || CANYON.on){
    const nW = nearest(pose.x, pose.z);
    if(nW.path === MAIN){
      const inGal = GALLERY.on && ((nW.pi - GALLERY.a)%MAIN.N + MAIN.N)%MAIN.N <= GALLERY.b - GALLERY.a;
      const inCan = !inGal && canyonAt(pose.x, pose.z) > 0.35;
      if(inGal || inCan){
        const pW = MAIN.pts[nW.pi], tW = MAIN.tans[nW.pi];
        const nx2 = -tW.z, nz2 = tW.x;
        const lat = (pose.x - pW.x)*nx2 + (pose.z - pW.z)*nz2;
        let lim = nW.half + (inGal ? 1.0 : 1.7);
        if(inCan){ const uv = canyonUV(pose.x, pose.z); if(uv) lim = Math.min(lim, canyonFoot(uv[1]) - 1.9); }
        if(Math.abs(lat) > lim){
          const push = (Math.abs(lat) - lim)*Math.sign(lat);
          pose.x -= nx2*push; pose.z -= nz2*push;
          const vn = pose.vx*nx2 + pose.vz*nz2;
          if(vn*Math.sign(lat) > 0){ pose.vx -= nx2*vn*1.3; pose.vz -= nz2*vn*1.3; }
          pose.vx *= 0.995; pose.vz *= 0.995;
          if(Math.abs(vn) > 4) GAME.shake = Math.max(GAME.shake || 0, 0.12);
          if(Math.abs(vn) > 1.5 && (AUD.scrapeT || 0) < now0()){ SFX.scrape(Math.min(1, Math.abs(vn)/10 + 0.3)); AUD.scrapeT = now0() + 0.3; }
        }
      }
    }
  }

  // the oak's trunk is solid: glance off it
  if(GIANT.on){
    const dx = pose.x - GIANT.x, dz = pose.z - GIANT.z, d = Math.hypot(dx, dz), lim = GIANT.trunk + 2.4;
    if(d < lim && d > 0.01){
      const ux = dx/d, uz = dz/d;
      pose.x = GIANT.x + ux*lim; pose.z = GIANT.z + uz*lim;
      const vn = pose.vx*ux + pose.vz*uz;
      if(vn < 0){ pose.vx -= ux*vn*1.4; pose.vz -= uz*vn*1.4;
        if(-vn > 3){ SFX.bump(-vn); GAME.shake = Math.max(GAME.shake || 0, Math.min(0.5, -vn*0.05)); } }
    }
  }
  // vertical: integrate against the ground so crests actually launch the car
  const gy = surfaceY(pose.x, pose.z);
  const rawStep = gy - pose.lastGy;
  /* Ground that rises sharply under the car in one frame is a wall, not a
     ramp: lift the car onto it rather than reading the step as launch speed,
     which is what used to fire it into orbit.

     Ground that drops sharply is a cliff, and this used to snap to that too,
     symmetrically. So leaving the side of the bridge at 34m/s teleported the
     car 10.7m straight down in a single frame instead of falling off it,
     which measured as 38,807 m/s^2. A cliff needs no special case at all:
     leave the car where it is and the airborne test below does the rest. */
  if(rawStep > 1.1){
    pose.lastGy = gy;
    pose.y = Math.max(pose.y, gy);
    pose.vy = 0;
    pose.air = false;
  }
  const gRate = Math.max(-30, Math.min(30, (gy - pose.lastGy)/Math.max(dt, 0.001)));
  pose.lastGy = gy;

  /* The old rule was: while the wheels are down, take the ground's own rate of
     climb as the car's vertical speed, capped at 7.6 m/s. But that rate is
     slope times speed, and at speed it is large -- a 20% grade at 40m/s is
     8m/s -- so every rise in the road threw the car off it and every fall
     dropped it back. Measured on Ash Ridge: 41% of its time above 108km/h
     spent in the air, in 403 separate hops. That is the bouncing, the nose
     swinging, and the camera chasing it.

     A car does not leave the road because the road goes uphill. It leaves
     when the road curves away downward faster than gravity can follow, which
     is v^2 * curvature < -g and nothing else. So take the slope and the
     curvature from the surface a step either side along the line of travel,
     and let the curvature decide. Below the threshold the car is simply on
     the road, riding whatever gradient it is on; above it, it flies. */
  const spV = Math.hypot(pose.vx, pose.vz);
  const look = Math.max(1.2, spV*dt*1.2);
  const ux = spV > 0.4 ? pose.vx/spV : nfx;
  const uz = spV > 0.4 ? pose.vz/spV : nfz;
  const gA = surfaceY(pose.x + ux*look, pose.z + uz*look);
  const gB = surfaceY(pose.x - ux*look, pose.z - uz*look);
  const slope = (gA - gB)/(2*look);
  const curve = (gA - 2*gy + gB)/(look*look);        // d2y/ds2, per metre
  const glue  = slope*spV;                           // the rate the road itself climbs
  let landed = 0;
  /* The car rides on its springs over the road, not glued to it. The
     chassis height is a spring and damper above the ground: the road can
     push the car up (through the tyres) but never pull it down, so where
     the road falls away faster than gravity the tyres simply unload.
     A row of bumps is soaked up by the travel and the car bobs over them;
     it only flies when the wheels have hung out to full droop and the
     ground is still falling away (a ramp lip, a crest taken fast), and a
     hard landing or a steep dip runs the springs onto the bump stops.
     This replaces the old rule that threw the car off any bump whose
     curvature beat gravity, which hopped it from mogul to mogul. */
  const G = 26, SK = 105, SC = 7.5, DROOP = 0.20, STOP = 0.24;
  if(!pose.air){
    const sq = gy - pose.y;                          // + compressed
    const push = Math.max(0, G + SK*sq + SC*(glue - pose.vy));   // what the tyres can give
    pose.vy += (push - G)*dt;
    pose.y += pose.vy*dt;
    const sq2 = gy - pose.y;
    if(sq2 > STOP){                                  // on the bump stops: the ground carries it
      pose.y = gy - STOP;
      if(pose.vy < glue){ pose.stopHit = Math.max(pose.stopHit || 0, glue - pose.vy); pose.vy = glue; }
    }
    if(sq2 < -DROOP){                                // wheels hanging, ground gone: flying
      pose.air = true; pose.airT = 0;
      pose.vy = Math.min(11, pose.vy);
    } else pose.airT = 0;
  } else {
    pose.vy -= G*dt;                                 // mass, not a balloon
    pose.y += pose.vy*dt;
    pose.airT += dt;
    // back on the tyres: the springs take it from here
    if(pose.y <= gy + DROOP*0.5 && (pose.vy <= glue || pose.airT > 0.12)){
      landed = Math.min(9, Math.max(0, glue - pose.vy));
      pose.air = false;
      if(pose.y < gy - STOP){ pose.y = gy - STOP; pose.vy = Math.max(pose.vy, glue); }
    }
  }
  // visual yaw from the slide
  const slip = (pose.vx*(-nfz) + pose.vz*nfx);
  pose.yawVis += (Math.max(-0.42, Math.min(0.42, slip*0.045)) - pose.yawVis) * Math.min(1, dt*7);
  // weight transfer: filtered, and frozen while the box is mid-change so a
  // shift does not throw the nose up and down
  if(trans.cut < 0.3) pose.accLP += (netA - pose.accLP) * Math.min(1, dt*3.5);
  // (pitch and roll are set with the suspension, below)
  pose.steerVis += (pose.steerIn*0.42 - pose.steerVis) * Math.min(1, dt*10);
  pose.wheelSpin += (newAlong + (trans.spin || 0)*0.006)*dt/(car.userData.wr || WHEEL_R);

  /* ---- chassis and body -------------------------------------------
     Two layers, the way a real car is built.

     The rolling chassis (the car group, with the wheels on it) sits on the
     road plane fitted through the four tyre contacts. It used to take only
     three quarters of the slope, and its pitch was applied about the
     world's east-west axis instead of the car's own, so off a north-south
     heading "pitch" leaked into roll. With both overhangs that put the
     tail or the nose 0.6m into the road at speed.

     The body (the shell) rides on top on three damped springs: heave,
     pitch and roll. Their targets come from where the wheels are pushed
     up or hang down, plus the load moved by braking, throttle and
     cornering. The engine sits over the front axle, so the front is
     sprung stiffer: the car squats more than it dives and the nose
     recovers first. A landing keeps the attitude the car had in the air
     for an instant and lets the springs take it, instead of snapping
     flat; big hits run into bump stops. */
  const WB = WAGON_AXLE_F - WAGON_AXLE_R, TW = WAGON_TRACK*2;
  const WOFF = [[WAGON_AXLE_F, WAGON_TRACK], [WAGON_AXLE_F,-WAGON_TRACK],
                [WAGON_AXLE_R, WAGON_TRACK], [WAGON_AXLE_R,-WAGON_TRACK]];
  // the car is drawn turned by its slide angle; everything that has to sit
  // on the ground is placed where it is drawn, not where it is heading
  const vh = pose.h + pose.yawVis, vfx = Math.sin(vh), vfz = Math.cos(vh);
  const cG = [0,0,0,0], cRgh = [0,0,0,0], wX = [0,0,0,0];
  car.userData.wheels.forEach((w, wi)=>{
    const o = WOFF[wi];
    const wx = pose.x + vfx*o[0] - vfz*o[1];
    const wz = pose.z + vfz*o[0] + vfx*o[1];
    cG[wi] = surfaceY(wx, wz);
    cRgh[wi] = roughY(wx, wz);
    wX[wi] = -o[1];                                   // model x: + is the driver's side
  });
  const gPitch = Math.atan2((cG[2]+cG[3]) - (cG[0]+cG[1]), 2*WB);   // + is nose down
  const gRoll  = Math.atan2((cG[1]+cG[3]) - (cG[0]+cG[2]), 2*TW);   // + is driver's side up
  if(pose.bH === undefined){ pose.bH = pose.bHv = pose.bP = pose.bPv = pose.bR = pose.bRv = 0; }
  /* Touchdown. The chassis goes onto the ground plane at once, wheels
     down. The difference between how the car was flying and how the ground
     lies becomes spin on the body: land tail first and the nose carries on
     down past level onto the front springs and comes back; land nose first
     and the tail does the same. Nothing is held at an angle into the road. */
  const touchdown = ()=>{
    const mP = pose.pitch - gPitch, mR = pose.roll - gRoll;
    pose.pitch = gPitch; pose.roll = gRoll;
    pose.bPv += Math.max(-0.85, Math.min(0.85, -mP*6.5));
    pose.bRv += Math.max(-0.85, Math.min(0.85, -mR*6.0));
    pose.bHv -= Math.min(1.6, landed*0.16);
    // coming down on the lake ice: a burst of ice chips and powder
    if(landed > 2.5 && iceAt(pose.x, pose.z) > 0.3){
      burst(0.16, "highpass", 2600, Math.min(0.2, 0.05 + landed*0.02), 1.2, 0, 5200);
      tone(140, 0.4, "sawtooth", Math.min(0.06, landed*0.008), 70, 0.02);
      for(let k=0;k<Math.min(26, 6 + landed*2.5);k++){
        const a = Math.random()*Math.PI*2, v = 2 + Math.random()*4 + landed*0.4;
        spawnDust(pose.x + Math.cos(a)*1.2, gy + 0.1, pose.z + Math.sin(a)*1.6, 4, 0.35 + Math.random()*0.35,
                  pose.vx*0.2 + Math.cos(a)*v, pose.vz*0.2 + Math.sin(a)*v, 1.5 + Math.random()*2);
      }
    }
  };
  if(landed) touchdown();
  let sP = Math.sin(pose.pitch), sR = Math.sin(pose.roll);
  /* Touchdown is when any tyre reaches the ground, not only the middle of
     the car. Flying low onto a rise, the nose would otherwise meet the slope
     long before the centre does, and the body had to be shoved upward to
     stay out of it. */
  if(pose.air && pose.vy < 0 && pose.airT > 0.15){
    let pen = -1;
    for(let wi=0; wi<4; wi++){
      const hub = pose.y - WOFF[wi][0]*sP + wX[wi]*sR - 0.14;   // tyre at full droop
      pen = Math.max(pen, cG[wi] - hub);
    }
    if(pen > 0){
      landed = Math.min(9, Math.max(1.2, glue - pose.vy));
      pose.y = Math.max(pose.y, gy - STOP);
      pose.air = false; pose.airT = 0;
      touchdown();
    }
  }
  if(!pose.air){
    pose.pitch += (gPitch - pose.pitch) * Math.min(1, dt*6);
    pose.roll  += (gRoll  - pose.roll)  * Math.min(1, dt*7);
  } else {
    // in flight the chassis turns slowly toward the arc it is flying
    const arc = Math.max(-0.16, Math.min(0.18, -pose.vy*0.016));
    pose.pitch += (arc - pose.pitch) * Math.min(1, dt*1.6);
    pose.roll  *= 1 - Math.min(1, dt*0.8);
  }
  sP = Math.sin(pose.pitch); sR = Math.sin(pose.roll);
  /* The chassis rests on whatever touches first. Over a ledge, with the rear
     tyres on the lip and the fronts on the flat below, the plane through the
     four tyres points the nose into the ground ahead. A real car rests on
     its rear wheels and its front bumper instead, so pivot about the far
     axle until neither end is below the ground; the wheels on the lifted
     end just hang. */
  if(!pose.air){
    const ends = [[2.45, 0.29, WAGON_AXLE_R], [-2.55, 0.21, WAGON_AXLE_F]];   // bumper, its height, the axle it pivots about
    for(const e of ends){
      const bx = pose.x + vfx*e[0], bz = pose.z + vfz*e[0];
      // the body rides on top: its heave and pitch move the bumper too
      const under = surfaceY(bx, bz) + 0.03 - (pose.y - e[0]*sP + e[1] + pose.bH - e[0]*Math.sin(pose.bP));
      if(under <= 0) continue;
      const arm = Math.abs(e[0] - e[2]);
      const dp = under/arm;
      if(e[0] > 0){ pose.pitch -= dp; pose.y += dp*Math.abs(e[2]); }   // nose up about the rear axle
      else        { pose.pitch += dp; pose.y += dp*Math.abs(e[2]); }   // tail up about the front axle
      sP = Math.sin(pose.pitch);
    }
  }

  /* Wheels: each corner on its own. The tyre is stiff and follows the
     ground under it (and any stone it is running over) up at once, but
     falls back under its spring, so a sharp edge at speed hops the wheel
     for an instant. Long travel: 20cm of droop, 26cm of bump. */
  let knock = 0;
  const wr0 = car.userData.wr || WHEEL_R;
  car.userData.wheels.forEach((w, wi)=>{
    const o = WOFF[wi];
    if(w.sy === undefined){ w.sy = 0; w.sv = 0; }
    const plane = pose.y - o[0]*sP + wX[wi]*sR;      // where the chassis puts this hub
    const wx = pose.x + vfx*o[0] - vfz*o[1], wz = pose.z + vfz*o[0] + vfx*o[1];
    const target = pose.air ? -0.17
      : Math.max(-0.20, Math.min(0.26, cG[wi] + cRgh[wi] + stoneY(wx, wz) - plane));
    const up = target > w.sy;
    w.sv += ((up ? -1500 : -260)*(w.sy - target) - (up ? 60 : 20)*w.sv)*dt;
    w.sy += w.sv*dt;
    if(!pose.air && w.sy < target - 0.05){ w.sy = target - 0.05; w.sv = Math.max(w.sv, 0); }   // never through the ground
    w.sy = Math.max(-0.20, Math.min(0.26, w.sy));    // droop straps and bump stops
    if(w.sy >= 0.26) w.sv = Math.min(0, w.sv);
    if(!pose.air) knock = Math.max(knock, w.sv);
    pose.wsv = pose.wsv || [0,0,0,0]; pose.wsv[wi] = w.sv;
    w.pivot.position.y = wr0 + w.sy;
  });

  /* The body: sprung on four corners, each spring pushing on its own
     corner. A wheel pushed up heaves, pitches and rolls the body in
     proportion to where it sits, so one front wheel over a stone lifts
     that corner and the car rocks diagonally, not all of it at once. The
     engine is over the front axle, so the front springs are stiffer. */
  const lean = pose.air ? 0 : Math.max(-0.075, Math.min(0.075, pose.steerIn*sp*0.0098));
  const squat = pose.air ? 0 : Math.max(-0.045, Math.min(0.055, -pose.accLP*0.0046));
  const KF = 125, KR = 96, ZS = 0.30;                // corner rates (per unit mass) and damping
  let IP = 0, IR = 0;
  for(let wi=0; wi<4; wi++){ const k = wi < 2 ? KF : KR; IP += k*WOFF[wi][0]*WOFF[wi][0]; IR += k*wX[wi]*wX[wi]; }
  IP *= 0.25/(10.5*10.5); IR *= 0.25/(11.5*11.5);   // pitch about 1.7Hz, roll 1.8Hz
  let aH = 0, aP = 0, aR = 0, meanSy = 0;
  car.userData.wheels.forEach(w=> meanSy += (w.sy || 0)*0.25);
  car.userData.wheels.forEach((w, wi)=>{
    const o0 = WOFF[wi][0], ox = wX[wi], k = wi < 2 ? KF : KR;
    const cy = pose.bH - o0*pose.bP + ox*pose.bR;       // the body's corner over this wheel
    const cv = pose.bHv - o0*pose.bPv + ox*pose.bRv;
    const wy = pose.air ? Math.max(w.sy, -0.04) : w.sy - meanSy*0.8; // in the air the wheels hang, the body does not follow them down
    const f = k*(wy - cy) + 2*ZS*Math.sqrt(k)*((pose.air ? 0 : w.sv) - cv);
    aH += f*0.25; aP -= o0*f*0.25; aR += ox*f*0.25;
  });
  aH += pose.air ? -0.05*KF : 0;
  pose.bHv += aH*dt;
  pose.bPv += (aP/IP + 10.5*10.5*squat)*dt;
  pose.bRv += (aR/IR + 11.5*11.5*lean)*dt;
  pose.bH += pose.bHv*dt; pose.bP += pose.bPv*dt; pose.bR += pose.bRv*dt;
  // a hard hit on one wheel: felt in the seat and heard through the shell
  if(!pose.air && knock > 3.2 && sp > 5){
    const k = Math.min(1, (knock - 3.2)/9);
    GAME.kick = Math.max(GAME.kick || 0, 0.02 + k*0.07);
    if((GAME.knockCool || 0) <= 0){ SFX.knock(k); GAME.knockCool = 0.09; }
  }
  GAME.knockCool = (GAME.knockCool || 0) - dt;
  // the springs running out of travel: a dip taken flat, a heavy landing
  if(pose.stopHit > 2.5 && (GAME.knockCool || 0) <= 0){
    const k = Math.min(1, (pose.stopHit - 2.5)/6);
    SFX.knock(0.5 + k*0.5); GAME.kick = Math.max(GAME.kick || 0, 0.04 + k*0.08); GAME.knockCool = 0.15;
  }
  pose.stopHit = 0;
  // bump stops: hard rubber past 10cm of compression, straps at full droop
  if(pose.bH < -0.10){ pose.bHv += (-0.10 - pose.bH)*900*dt; pose.bHv *= 1 - Math.min(1, dt*14); }
  if(pose.bH < -0.15){ pose.bH = -0.15; pose.bHv = Math.max(0, pose.bHv); }
  if(pose.bH >  0.14){ pose.bH = 0.14;  pose.bHv = Math.min(0, pose.bHv); }
  if(Math.abs(pose.bP) > 0.12){ pose.bP = Math.sign(pose.bP)*0.12; pose.bPv *= -0.3; }
  if(Math.abs(pose.bR) > 0.13){ pose.bR = Math.sign(pose.bR)*0.13; pose.bRv *= -0.3; }

  /* Ground clearance. Where the road rises past the wheels (the bottom of
     a dip, the lip of a ramp) the long overhangs would reach it first. Lift
     the body clear instead of letting it pass through. */
  const LOW = [[0, 0.21, -2.55], [0.8, 0.29, -2.45], [-0.8, 0.29, -2.45],
               [0.8, 0.29, 2.45], [-0.8, 0.29, 2.45]];
  // and the sills, front and back of each door, against banks either side
  const SIDE = [[0.9, 0.30, 1.1], [0.9, 0.30, -1.1], [-0.9, 0.30, 1.1], [-0.9, 0.30, -1.1]];
  let need = 0, needF = 0, needR = 0;
  const sbP = Math.sin(pose.bP), sbR = Math.sin(pose.bR);
  for(const q of LOW){
    const yCh = q[1] + pose.bH - q[2]*sbP + q[0]*sbR;          // in the chassis
    const yW = pose.y + yCh - q[2]*sP + q[0]*sR;
    const qx = pose.x + vfx*q[2] + vfz*q[0], qz = pose.z + vfz*q[2] - vfx*q[0];
    const n = surfaceY(qx, qz) + 0.03 - yW;
    if(q[2] < 0) needR = Math.max(needR, n); else needF = Math.max(needF, n);
  }
  /* An end that would touch tips the car away from it, the way a tow ball
     or a bumper catching a ramp lip does, rather than lifting the whole
     body into the air. What rotation cannot fix, a small lift does. */
  // a tip may only spend the clearance the other end actually has
  const tipDown = Math.min(Math.max(0, needR)/2.5, Math.max(0, -needF)/2.45);
  const tipUp   = Math.min(Math.max(0, needF)/2.45, Math.max(0, -needR)/2.5);
  const tip = tipDown - tipUp;                                  // + is nose down
  if(tip !== 0){
    if(pose.air) pose.pitch += tip;
    else {
      pose.bP = Math.max(-0.11, Math.min(0.11, pose.bP + tip));
      if(tip > 0) pose.bPv = Math.max(0, pose.bPv); else pose.bPv = Math.min(0, pose.bPv);
    }
  }
  need = Math.max(needR - tipDown*2.5, needF - tipUp*2.45);
  // a bank alongside rolls the body away from it, within the room the far side has
  let needSL = -1, needSR = -1;
  for(const q of SIDE){
    const yCh = q[1] + pose.bH - q[2]*sbP + q[0]*sbR;
    const yW = pose.y + yCh - q[2]*sP + q[0]*sR;
    const qx = pose.x + vfx*q[2] + vfz*q[0], qz = pose.z + vfz*q[2] - vfx*q[0];
    const n = surfaceY(qx, qz) + 0.03 - yW;
    if(q[0] > 0) needSL = Math.max(needSL, n); else needSR = Math.max(needSR, n);
  }
  const rollUp = Math.min(Math.max(0, needSL)/0.9, Math.max(0, -needSR)/0.9)
               - Math.min(Math.max(0, needSR)/0.9, Math.max(0, -needSL)/0.9);   // + lifts the driver's side
  if(rollUp !== 0){
    if(pose.air) pose.roll += rollUp;
    else {
      pose.bR = Math.max(-0.12, Math.min(0.12, pose.bR + rollUp));
      if(rollUp > 0) pose.bRv = Math.max(0, pose.bRv); else pose.bRv = Math.min(0, pose.bRv);
    }
  }
  need = Math.max(need, needSL - Math.max(0, rollUp)*0.9, needSR - Math.max(0, -rollUp)*0.9);
  if(need > 0){
    // a scrape, not a lift: at most 12cm, the rest is the chassis' job
    pose.bH = Math.min(pose.bH + need, Math.max(pose.bH, 0.12)); if(pose.bHv < 0) pose.bHv = 0;
    pose.scrape = Math.min(1, (pose.scrape || 0) + need*6);
  } else pose.scrape = Math.max(0, (pose.scrape || 0) - dt*3);
  // backfire: a hard flame on every upshift under power, and a steady one
  // while the drift turbo is burning
  const fl = car.userData.flame, flc = car.userData.flameCore;
  if(fl){
    let want = 0;
    if(trans.shiftT > 0 && thr) want = 1;
    if(drift.boostT > 0) want = Math.max(want, 0.75);
    const lvl = drift.on && drift.tier >= 0 ? drift.tier : drift.boostT > 0 ? drift.boostTier : -1;
    if(drift.on && drift.tier >= 0) want = Math.max(want, 0.5 + drift.tier*0.2);
    const fc = lvl >= 0 ? DRIFT_TIERS[lvl].col : [1.0, 0.64, 0.17];
    fl.material.color.setRGB(fc[0], fc[1], fc[2]);
    flc.material.color.setRGB(0.75 + fc[0]*0.25, 0.75 + fc[1]*0.25, 0.75 + fc[2]*0.25);
    if(sp > MAXV*0.92 && thr && Math.random() < 0.06) want = Math.max(want, 0.8);
    const rate = want > fl.material.opacity ? 30 : 9;
    fl.material.opacity += (want - fl.material.opacity) * Math.min(1, dt*rate);
    flc.material.opacity = fl.material.opacity * 0.9;
    const flick = 0.75 + Math.random()*0.5;
    fl.scale.set(flick, 0.7 + fl.material.opacity*1.1, flick);
    flc.scale.set(flick*0.9, 0.7 + fl.material.opacity*0.9, flick*0.9);
    if(fl.material.opacity > 0.5 && Math.random() < 0.5){
      spawnDust(pose.x + nfx*(WAGON_PIPE_Z-0.4) + nfz*WAGON_PIPE_X, pose.y + 0.2,
                pose.z + nfz*(WAGON_PIPE_Z-0.4) - nfx*WAGON_PIPE_X,
                fc, 0.25 + Math.max(0, lvl)*0.12,
                -pose.vx*0.3, -pose.vz*0.3, 0.6);
    }
  }

  const axleObj = car.userData.rearAxle;
  if(axleObj){
    const lw = car.userData.wheels[2].sy || 0, rw = car.userData.wheels[3].sy || 0;
    axleObj.position.y = (car.userData.wr || WHEEL_R) + (lw + rw)*0.5;
    axleObj.rotation.z = Math.atan2(rw - lw, WAGON_TRACK*2);
  }
  const shellObj = car.userData.shell;
  shellObj.position.y = RIDE + (car.userData.lift || 0) + pose.bH;
  shellObj.rotation.x = pose.bP;                          // squat, dive, landings
  shellObj.rotation.z = pose.bR;                          // lean and bumps

  // drift charge
  const slipAng = Math.abs(Math.atan2(slip, Math.max(2, Math.abs(newAlong))));
  drift.angle = slipAng;
  const drifting = sliding && sp > 3;          // stays charged over bumps and jumps
  if(drifting){
    drift.on = true;
    drift.t += dt;
    drift.tier = driftTier(drift.t);
    drift.score += dt*sp*slipAng*2.2;

    // smoke from all four contact patches for as long as the slide is held
    const srx = -nfz, srz = nfx;                   // lateral, local to this block
    const smokeDir = -drift.dir;
    const thick = 1 + Math.min(1.6, drift.t*0.5);  // the longer you hold it, the denser
    // grey until the first level is banked, then the level's own colour
    const smokeCol = drift.tier >= 0 ? {tint: DRIFT_TIERS[drift.tier].col} : 3;
    for(let w2=0; w2<2; w2++){
      const o = [WAGON_AXLE_R, (w2 % 2 ? WAGON_TRACK : -WAGON_TRACK)];
      const wx = pose.x + nfx*o[0] + srx*o[1];
      const wz = pose.z + nfz*o[0] + srz*o[1];
      spawnDust(wx + (Math.random()-0.5)*0.6, pose.y + 0.10,
                wz + (Math.random()-0.5)*0.6,
                smokeCol, (0.8 + drift.t*0.35)*thick,
                -pose.vx*0.08 + srx*smokeDir*(0.9 + Math.random()*1.4),
                -pose.vz*0.08 + srz*smokeDir*(0.9 + Math.random()*1.4),
                1.0 + Math.random()*0.7);
    }

    // sparks off the rear wheels once a tier is banked, coloured by tier
    if(drift.tier >= 0){
      const T = DRIFT_TIERS[drift.tier];
      const sideOut = -drift.dir;
      for(let k=0;k<2;k++){
        const o = [WAGON_AXLE_R, WAGON_TRACK*(k ? sideOut : -sideOut)];
        const wx = pose.x + nfx*o[0] + srx*o[1];
        const wz = pose.z + nfz*o[0] + srz*o[1];
        spawnDust(wx + (Math.random()-0.5)*0.35, pose.y + 0.16,
                  wz + (Math.random()-0.5)*0.35,
                  T.col, 0.2 + drift.tier*0.25,
                  -pose.vx*0.24 + srx*sideOut*(1.6 + Math.random()*2.2),
                  -pose.vz*0.24 + srz*sideOut*(1.6 + Math.random()*2.2),
                  1.9 + drift.tier*0.7);
      }
    }
  } else if(drift.mode !== "slide" && drift.mode !== "hop" && (drift.on || drift.mode === "release")){
    if(drift.tier >= 0){
      const T = DRIFT_TIERS[drift.tier];
      drift.boostT = T.time;
      drift.boostPower = T.push;
      drift.boostTier = drift.tier;
      drift.flash = 1;
      if(typeof postMat !== "undefined") postMat.uniforms.uFlash.value = 0.12 + drift.tier*0.07;
    }
    drift.best = Math.max(drift.best, drift.t);
    drift.on = false; drift.t = 0; drift.tier = -1;
    drift.mode = "off"; drift.dir = 0; drift.hold = 0;
  }

  // spending the charge: a hard shove along the heading that fades out
  if(drift.boostT > 0){
    drift.boostT -= dt;
    const fade = Math.max(0, Math.min(1, drift.boostT/0.5));
    const push = drift.boostPower * fade * dt;
    pose.vx += nfx*push; pose.vz += nfz*push;
    if(drift.boostT <= 0){ drift.boostTier = -1; drift.boostPower = 0; }
  }
  drift.flash = Math.max(0, drift.flash - dt*1.6);

  // in thick mud the wheels sink in up to the hubs
  pose.sink = (pose.sink || 0) + ((EXP.on && !pose.air ? Math.min(1, mudAmt*1.1 + wetAmt*0.4)*0.24 : 0) - (pose.sink || 0))*Math.min(1, dt*3);
  if(EXP.on && !pose.air && (trans.spin || 0) > 250){
    const k2 = Math.min(1, trans.spin/2600), n = 1 + Math.round(k2*2);
    for(const o of [[-1.22, 0.80], [-1.22,-0.80], [1.3, 0.8], [1.3, -0.8]]){
      if(o[0] > 0 && Math.random() > 0.35) continue;
      for(let q=0;q<n;q++){
        const fling = 3 + k2*6;
        spawnDust(pose.x + nfx*o[0] + (-nfz)*o[1], pose.y + 0.15, pose.z + nfz*o[0] + nfx*o[1], 5, k2,
                  -nfx*fling + (-nfz)*o[1]*(Math.random()*2), -nfz*fling + nfx*o[1]*(Math.random()*2), 2.5 + k2*4*Math.random());
      }
    }
    splash.mud = Math.min(1, splash.mud + k2*dt*0.12);
  }
  car.position.set(pose.x, pose.y - (pose.sink || 0), pose.z);
  car.rotation.order = "YXZ";
  car.rotation.set(pose.pitch, pose.h + pose.yawVis, pose.roll);
  car.userData.wheels.forEach(w=>{
    w.mesh.rotation.x = pose.wheelSpin;
    if(w.steer) w.pivot.rotation.y = pose.steerVis;
  });

  // spray off the rear wheels, and rubber where it is sliding on the hard stuff
  const rx = -nfz, rz = nfx;                       // lateral unit vector
  const slid = Math.abs(slip);
  const working = sp > 4 && (offRoad || hand || slid > 2.2);
  // cornering load: yaw rate times speed is the lateral acceleration the
  // outside tyres are carrying, which is when they start tearing at the surface
  const yawRate = Math.abs(pose.steerIn * rate);
  const latAcc = yawRate * sp;
  const hardTurn = !pose.air && latAcc > 5.0 && sp > 6;
  const wading = (inWater || inMud) && sp > 3;
  if(working || wading){
    const force = Math.min(3.0, slid*0.22 + sp*0.03 + (inWater ? sp*0.11 : wading ? sp*0.05 : 0));
    const kind = inWater ? 2 : (inMud || offRoad) ? 1 : 0;
    // the wheel throws material back along its own contact patch: opposite the
    // way the car is travelling, plus a sideways kick when the tail steps out
    const dirScale = (inWater ? 0.62 : 0.45) * Math.min(1, sp/12);
    const backX = -pose.vx*dirScale, backZ = -pose.vz*dirScale;
    const sideKick = -slip*0.45;
    const lift = inWater ? 2.2 : 0.6;            // thrown back along the ground, not up
    // the rear tyres throw it: the fronts used to as well, and in water that
    // stood a column of spray straight up in front of the camera
    const wheels = [[-1.22, 0.80], [-1.22,-0.80]];
    const perWheel = inWater ? 3 : (wading || slid > 2.2 || hand) ? (Math.random() < 0.6 ? 1 : 0)
                   : (Math.random() < 0.2 ? 1 : 0);
    wheels.forEach(w=>{
      const wx = pose.x + nfx*w[0] + rx*w[1];
      const wz = pose.z + nfz*w[0] + rz*w[1];
      for(let k=0;k<perWheel;k++){
        const spread = (Math.random()-0.5)*1.6;
        spawnDust(wx + (Math.random()-0.5)*0.5,
                  pose.y + (inWater ? 0.06 : 0.16),
                  wz + (Math.random()-0.5)*0.5,
                  kind, force,
                  backX + rx*(sideKick + spread),
                  backZ + rz*(sideKick + spread),
                  lift);
      }
    });
    if(inWater) splash.water = Math.min(1, splash.water + sp*dt*0.10);
    if(inMud)   splash.mud   = Math.min(1, splash.mud   + sp*dt*0.025);  // mud only; running wide no longer muddies the lens
  }
  // dirt off the outside pair while the body is leaning on them
  if(hardTurn){
    const outSide = pose.steerIn > 0 ? -1 : 1;        // outside of the corner
    const load = Math.min(3.2, (latAcc - 5.0)*0.34);
    const kickX = rx*outSide*(2.2 + load*2.8) - nfx*sp*0.34;
    const kickZ = rz*outSide*(2.2 + load*2.8) - nfz*sp*0.34;
    [[1.73, 0.80*outSide], [-1.22, 0.80*outSide]].forEach((o, wi)=>{
      const wx = pose.x + nfx*o[0] + rx*o[1];
      const wz = pose.z + nfz*o[0] + rz*o[1];
      const n2 = wi && Math.random() < 0.5 ? 1 : 0;    // rear throws, front barely
      for(let k=0;k<n2;k++){
        spawnDust(wx + (Math.random()-0.5)*0.45,
                  pose.y + 0.13,
                  wz + (Math.random()-0.5)*0.45,
                  1, 0.9 + load*1.3,
                  kickX + (Math.random()-0.5)*1.4,
                  kickZ + (Math.random()-0.5)*1.4,
                  1.1 + load*0.5);
      }
    });
  }

  if(iceAmt > 0.3 && !pose.air && sp > 6 && (slid > 1.2 || sliding || Math.random() < 0.3)){
    // loose snow blown off the ice
    for(const o of [[-1.22, 0.80], [-1.22,-0.80]]){
      spawnDust(pose.x + nfx*o[0] + rx*o[1], pose.y + 0.1, pose.z + nfz*o[0] + rz*o[1], 4, 0.4 + slid*0.1,
                -pose.vx*0.25 + rx*(Math.random() - 0.5)*2, -pose.vz*0.25 + rz*(Math.random() - 0.5)*2, 0.5);
    }
  }
  if(!offRoad && !pose.air && wetAmt < 0.4 && iceAmt < 0.4 && sp > 3 && (slid > 1.8 || sliding)){
    layMark(0, pose.x - nfx*1.22 + rx*0.80, pose.y + 0.035, pose.z - nfz*1.22 + rz*0.80, rx, rz);
    layMark(1, pose.x - nfx*1.22 - rx*0.80, pose.y + 0.035, pose.z - nfz*1.22 - rz*0.80, rx, rz);
  } else {
    lastMark[0] = lastMark[1] = null;
  }

  // lap counting: progress index wraps past the gate
  state.idx = nIdx;
  // Which way the car is pointing along the road decides whether a crossing
  // counts. Rolling back over the line by accident used to strip a lap.
  const tanHere = tans[nIdx];
  const goingForward = (pose.vx*tanHere.x + pose.vz*tanHere.z) > 0.5;
  const goingBack    = (pose.vx*tanHere.x + pose.vz*tanHere.z) < -1.5;
  const wrapForward = state.prevIdx > NS*0.86 && state.idx < NS*0.14 && goingForward;
  const wrapBack    = state.idx > NS*0.86 && state.prevIdx < NS*0.14 && goingBack;
  // The index can jump the width of the lap when the nearest sample snaps to
  // a different part of the track, which was logging laps of a third of a
  // second. A lap only counts near the actual start line, and never twice
  // inside ten seconds.
  const gateDist = Math.hypot(pose.x - pts[0].x, pose.z - pts[0].z);
  const sane = gateDist < 40 && (state.t - state.lapStart) > 10;
  if(wrapForward && nDist < HALF + 14 && sane && !EXP.on){
    const now = state.t;
    const lt = now - state.lapStart;
    const prevBest = state.best;
    state.lapTimes.push(lt);
    if(state.best === null || lt < state.best) state.best = lt;
    state.lapStart = now;
    state.lap++;
    onLap(lt, prevBest);
    if(state.lap > LAPS && state.phase === "racing") finishRace();
  } else if(wrapBack && state.lap > 1 && gateDist < 40){
    state.lap--;
  }
  state.prevIdx = state.idx;

  return {sp, offRoad, thr, hand, surf, air: pose.air, mud: mudAmt, wet: wetAmt, ice: iceAmt, slip: Math.abs(slip)};
}


/* ------------------------------------------------------------------ *
 *  Camera
 * ------------------------------------------------------------------ */
let camMode = 0;
const camPos = new THREE.Vector3(), camAim = new THREE.Vector3();
let camH = 0;
function stepCamera(dt, sp){
  // In a slide the car turns under you but the view stays behind your line of
  // travel, so the drift is something you steer rather than something that
  // swings the whole screen around.
  const travel = (drift.mode === "slide" && sp > 3)
    ? Math.atan2(pose.vx, pose.vz)
    : pose.h;
  let d = travel - camH;
  while(d >  Math.PI) d -= Math.PI*2;
  while(d < -Math.PI) d += Math.PI*2;
  camH += d * Math.min(1, dt*(drift.mode === "slide" ? 5 : 9));
  camera.position.y -= GAME.bobWas || 0;             // the seat motion is added back at the end
  const fx = Math.sin(camH), fz = Math.cos(camH);
  if(camMode !== 1){
    const far = camMode === 2;
    const back = (far ? 13.5 : 9.2) + Math.min(3.4, sp*0.09);
    camPos.set(pose.x - fx*back, pose.y + (far ? 5.6 : 3.55), pose.z - fz*back);
    camAim.set(pose.x + fx*7, pose.y + 1.25, pose.z + fz*7);
    // vertical follows slower than lateral so crests and dips don't pump the view
    camera.position.x += (camPos.x - camera.position.x) * Math.min(1, dt*7);
    camera.position.z += (camPos.z - camera.position.z) * Math.min(1, dt*7);
    camera.position.y += (camPos.y - camera.position.y) * Math.min(1, dt*3);
  } else {
    camPos.set(pose.x + fx*0.62, pose.y + 1.58, pose.z + fz*0.62);
    camAim.set(pose.x + fx*12, pose.y + 1.5, pose.z + fz*12);
    camera.position.x = camPos.x; camera.position.z = camPos.z;
    camera.position.y += (camPos.y - camera.position.y) * Math.min(1, dt*9);
  }
  /* on the grid: the view swings round from the front of the car and
     settles in behind it as the lights count down */
  if(state.phase === "countdown" && !TRACK.test && !EXP.on && camMode !== 1){
    const e = smoothstep(0, 1, 1 - state.countdown/3.2);
    const a = (1 - e)*2.5, r = 9.2 + (1 - e)*5, hgt = 3.55 + (1 - e)*3.5;
    const hx = Math.sin(pose.h + a), hz = Math.cos(pose.h + a);
    camera.position.set(pose.x - hx*r, pose.y + hgt, pose.z - hz*r);
    camAim.set(pose.x + fx*7*e, pose.y + 1.25, pose.z + fz*7*e);
    camH = pose.h;
  }
  // rumble only where the surface is actually rough
  if(nearest(pose.x, pose.z).dist > HALF && sp > 4){
    const r = Math.min(0.045, sp*0.0011);
    camera.position.y += Math.sin(state.t*29)*r + Math.sin(state.t*53)*r*0.45;
  }
  camera.lookAt(camAim);
  /* the body's motion in the seat: the chase view rides a share of the
     heave and the jolts, the bonnet view all of it, pitch and roll too */
  {
    GAME.kick = Math.max(0, (GAME.kick || 0) - dt*0.5);
    const kick = (GAME.kick || 0)*Math.sin(state.t*63);
    const chase = camMode !== 1;
    const bob = pose.bH*(chase ? 0.45 : 1) + kick*(chase ? 0.6 : 1);
    camera.position.y += bob; GAME.bobWas = bob;
    if(!chase){ camera.rotateX(-pose.bP*0.8); camera.rotateZ(pose.bR*0.8); }
    else camera.rotateZ(pose.bR*0.25);
  }
  const fovT = 62 + Math.min(1, sp/MAXV)*11;      // the frame opens up with speed
  if(Math.abs(camera.fov - fovT) > 0.01){
    camera.fov += (fovT - camera.fov)*Math.min(1, dt*2.5);
    camera.updateProjectionMatrix();
  }
}

 *  HUD

/* minimap: the layout in plan, with you and the field on it */
const MAP = (()=>{
  let minX=1e9, maxX=-1e9, minZ=1e9, maxZ=-1e9;
  paths.forEach(P=> P.pts.forEach(p=>{
    minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x);
    minZ=Math.min(minZ,p.z); maxZ=Math.max(maxZ,p.z);
  }));
  return {cx:(minX+maxX)/2, cz:(minZ+maxZ)/2,
          span:Math.max(maxX-minX, maxZ-minZ)};
})();
const hudCanvas = document.getElementById("hud2d");
const hud = hudCanvas.getContext("2d");
const elSplatMud2 = document.getElementById("splatMud");
let HUD_W = 640, HUD_H = 384, HK = 1;
const UI_SIZES = [0.58, 0.70, 0.84, 1.0];
let uiSize = 1;                       // index into UI_SIZES
function sizeHUD(){
  const pr = Math.min(window.devicePixelRatio || 1, 2);
  HUD_W = Math.round(window.innerWidth*pr);
  HUD_H = Math.round(window.innerHeight*pr);
  hudCanvas.width = HUD_W;
  hudCanvas.height = HUD_H;
  HK = (HUD_H/384) * 0.74 * (window.innerWidth < 700 ? 0.85 : 1);

}
hudReady = true;

/* arcade clock: 1'37"33 */
function fmt(t){
  if(!(t > 0)) t = 0;
  const m = Math.floor(t/60);
  const sec = Math.floor(t%60);
  const cs = Math.floor((t*100)%100);
  return m + "'" + String(sec).padStart(2,"0") + '"' + String(cs).padStart(2,"0");
}
let splitTimer = 0;
function flashSplit(t){ splitTimer = 2.4; splitText = "LAP " + state.lap + "   " + fmt(t); }
let splitText = "";

function gearLabel(){
  const along = pose.vx*Math.sin(pose.h) + pose.vz*Math.cos(pose.h);
  if(trans.dir < 0) return "R";
  if(Math.abs(along) < 0.5 && trans.rpm <= DRIVE.idle + 30) return "N";
  return String(trans.gear);
}

/* italic block type with a hard black outline, the way the cabinets did it */
function hudText(txt, x, y, size, colour, align){
  hud.font = 'italic 900 ' + Math.round(size*HK) + 'px "Arial Black", Arial, sans-serif';
  hud.textAlign = align || "left";
  hud.textBaseline = "alphabetic";
  hud.lineJoin = "round";
  hud.lineWidth = Math.max(2, size*HK*0.18);
  hud.strokeStyle = "#000";
  hud.strokeText(txt, x, y);
  hud.fillStyle = colour;
  hud.fillText(txt, x, y);
}

const TACH_MAX = 7000;
function drawTach(rpm, cx, cy, R){
  const c = hud;
  const a0 = Math.PI*0.80, a1 = Math.PI*2.20;
  const ang = v => a0 + (v/9)*(a1-a0);
  c.beginPath();
  c.arc(cx, cy, R+16*HK, a0, a1);
  c.arc(cx, cy, R-10*HK, a1, a0, true);
  c.closePath();
  c.fillStyle = "rgba(238,238,232,.9)"; c.fill();
  c.lineWidth = 3*HK; c.strokeStyle = "rgba(0,0,0,.85)"; c.stroke();

  c.beginPath(); c.arc(cx, cy, R+9*HK, ang(7.4), ang(9));
  c.lineWidth = 13*HK; c.strokeStyle = "#e11d10"; c.stroke();

  c.textAlign = "center"; c.textBaseline = "middle";
  for(let v=0; v<=9; v++){
    const a = ang(v);
    c.beginPath();
    c.moveTo(cx + Math.cos(a)*(R+2*HK), cy + Math.sin(a)*(R+2*HK));
    c.lineTo(cx + Math.cos(a)*(R+15*HK), cy + Math.sin(a)*(R+15*HK));
    c.lineWidth = 2.4*HK; c.strokeStyle = "#15181a"; c.stroke();
    c.fillStyle = "#15181a";
    c.font = 'italic bold ' + Math.round(15*HK) + 'px "Arial Black", Arial, sans-serif';
    c.fillText(String(v), cx + Math.cos(a)*(R-1*HK), cy + Math.sin(a)*(R-1*HK));
  }
  const v = Math.max(0, Math.min(9, rpm/TACH_MAX*9));
  const a = ang(v);
  c.beginPath();
  c.moveTo(cx - Math.cos(a)*9*HK, cy - Math.sin(a)*9*HK);
  c.lineTo(cx + Math.cos(a)*(R+12*HK), cy + Math.sin(a)*(R+12*HK));
  c.lineWidth = 3.4*HK; c.strokeStyle = "#d81f14"; c.stroke();
  c.beginPath(); c.arc(cx, cy, 6*HK, 0, 7);
  c.fillStyle = "#15181a"; c.fill();
}

/* One palette and one type scale across the whole readout. Labels were
   yellow, orange, green and red at three different sizes, which made the
   panel look assembled rather than designed. */
const UI = {
  label: 11,            // every caption
  value: 28,            // every primary number
  small: 14,            // secondary numbers
  ink:   "#ffffff",
  dim:   "#9fb6c6",
  key:   "#ffd23d",     // the one accent, used sparingly
  warn:  "#ff6a2a"
};
/* The expedition's readout: how high you are, which way the summit is and
   how far, the camps you have reached, and the best time to the top. */
function expTarget(){
  const c = EXP.camps.find(q=> !q.reached);
  return c ? {x:c.x, z:c.z, label:"NEXT: " + c.name.toUpperCase()} : {x:EXP.summit.x, z:EXP.summit.z, label:"TO THE SUMMIT"};
}
function drawExpHUD(W, H, k){
  const reached = EXP.camps.filter(c=> c.reached).length;
  hudText("CAMPS", 12*k, 72*k, UI.label, UI.dim);
  for(let i=0;i<EXP.camps.length;i++){
    hud.beginPath(); hud.moveTo((16 + i*16)*k, 90*k); hud.lineTo((23 + i*16)*k, 78*k); hud.lineTo((30 + i*16)*k, 90*k); hud.closePath();
    hud.fillStyle = EXP.camps[i].reached ? UI.key : "rgba(20,26,30,.55)"; hud.fill();
    hud.lineWidth = 2*k; hud.strokeStyle = "#000"; hud.stroke();
  }
  // altitude, big, in the middle, and the summit's for scale
  const alt = Math.max(0, Math.round(pose.y - EXP.baseY)), top = Math.round(EXP.summit.y - EXP.baseY);
  hudText(alt + " M", W/2, 44*k, UI.value*1.2, UI.key, "center");
  hudText("ALTITUDE  \u00b7  SUMMIT " + top + " M", W/2, 57*k, UI.label, UI.dim, "center");
  // a compass needle pointing at the summit, relative to where you are looking
  const tgt = expTarget(), dx = tgt.x - pose.x, dz = tgt.z - pose.z, dist = Math.hypot(dx, dz);
  const ang = Math.atan2(dx, dz) - camH;
  const cx = W/2, cy = 80*k, r = 13*k;
  hud.beginPath(); hud.arc(cx, cy, r + 4*k, 0, 7); hud.fillStyle = "rgba(12,22,32,.55)"; hud.fill();
  hud.lineWidth = 2*k; hud.strokeStyle = "#000"; hud.stroke();
  hud.save(); hud.translate(cx, cy); hud.rotate(-ang);
  hud.beginPath(); hud.moveTo(0, -r); hud.lineTo(r*0.55, r*0.6); hud.lineTo(0, r*0.25); hud.lineTo(-r*0.55, r*0.6); hud.closePath();
  hud.fillStyle = UI.warn; hud.fill(); hud.lineWidth = 1.6*k; hud.strokeStyle = "#000"; hud.stroke();
  hud.restore();
  // how far, and the best climb
  hudText(tgt.label, W-12*k, 20*k, UI.label, UI.dim, "right");
  hudText(dist > 999 ? (dist/1000).toFixed(2) + " KM" : Math.round(dist) + " M", W-10*k, 50*k, UI.value*0.9, UI.ink, "right");
  const rb = recordFor().summit;
  hudText("BEST CLIMB", W-12*k, 72*k, UI.label, UI.dim, "right");
  hudText(rb != null ? fmt(rb) : "--'--\"--", W-10*k, 90*k, UI.small, UI.ink, "right");
  if(EXP.resets) hudText("RESETS " + EXP.resets, W-10*k, 106*k, UI.label, UI.dim, "right");
  if(pose.grade !== undefined && Math.abs(pose.grade) > 0.25 && !pose.air)
    hudText(Math.round(pose.grade*100) + "% GRADE", W/2, 112*k, UI.small, Math.abs(pose.grade) > 0.45 ? UI.warn : UI.ink, "center");
}
/* the pace notes: the next call big under the lap counter, the one after
   small beside it, each with a bar running down to the corner */
function drawNoteTile(sh, cx, y, s, alpha, warn){
  const n = sh.n, k = HK, w = 58*k*s, h = 46*k*s, x = cx - w/2;
  const hazard = n.kind !== "corner";
  // Coming in faster than the corner can be held on grip: the tile throbs
  // red and says so, early enough to get on the brakes.
  const hot = warn && !hazard && n.hold && sh.ahead < sh.look && PACE.sp > n.hold*1.08;
  if(hot) alpha = 1;
  hud.save(); hud.globalAlpha = alpha;
  hud.fillStyle = "rgba(12,20,16,.78)"; hud.fillRect(x, y, w, h);
  hud.strokeStyle = "#000"; hud.lineWidth = 2.5*k; hud.strokeRect(x, y, w, h);
  if(hot){
    const pulse = 0.55 + 0.45*Math.sin(performance.now()*0.018);
    hud.strokeStyle = "rgba(255,58,40," + pulse.toFixed(3) + ")"; hud.lineWidth = 3.5*k;
    hud.strokeRect(x - 2*k, y - 2*k, w + 4*k, h + 4*k);
  }
  const col = hazard ? (n.kind === "bigjump" || n.kind === "ridge" ? "#ff6a2a" : "#ffd23d") : (n.sev <= 1 ? "#ff6a2a" : n.sev <= 3 ? "#ffd23d" : "#f3e6c4");
  if(!hazard){
    // a bent arrow: the tighter the corner, the harder it bends
    const ang = [2.9, 2.35, 1.85, 1.4, 1.0, 0.7, 0.45][n.sev], dir = n.dir > 0 ? -1 : 1;
    const ax = x + w*0.36, ay = y + h*0.82, L = h*0.62;
    const pts = []; let px = ax, py = ay, hd = -Math.PI/2;
    pts.push([px, py]);
    for(let q=0;q<4;q++){ px += Math.cos(hd)*L*0.06; py += Math.sin(hd)*L*0.06; pts.push([px, py]); }
    for(let q=0;q<14;q++){ hd += dir*ang/14; px += Math.cos(hd)*L*0.055; py += Math.sin(hd)*L*0.055; pts.push([px, py]); }
    const draw = (lw, c)=>{ hud.beginPath(); pts.forEach((p, i)=> i ? hud.lineTo(p[0], p[1]) : hud.moveTo(p[0], p[1]));
      hud.lineWidth = lw; hud.strokeStyle = c; hud.lineCap = "round"; hud.lineJoin = "round"; hud.stroke(); };
    draw(7*k*s, "#000"); draw(3.6*k*s, col);
    const hx = Math.cos(hd), hy = Math.sin(hd), a = 6*k*s;
    hud.beginPath(); hud.moveTo(px + hx*a, py + hy*a); hud.lineTo(px - hy*a*0.8, py + hx*a*0.8); hud.lineTo(px + hy*a*0.8, py - hx*a*0.8); hud.closePath();
    hud.fillStyle = col; hud.fill(); hud.lineWidth = 1.6*k; hud.strokeStyle = "#000"; hud.stroke();
    hudText(n.sev === 0 ? "H" : String(n.sev), x + w*0.8, y + h*0.62, UI.value*0.8*s, col, "center");
  } else {
    const label = n.kind === "fork" ? (n.dir > 0 ? "\u2190 SHORT" : "SHORT \u2192") : {jump:"JUMP", bigjump:"BIG JUMP", ridge:"RIDGE", water:"WATER", creek:"CREEK", mud:"MUD", crossing:"CROSS", ice:"ICE", crest:"CREST", bumps:"BUMPS"}[n.kind] || n.kind.toUpperCase();
    // a warning triangle
    const tx = x + w/2, ty = y + h*0.12, ts = h*0.44;
    hud.beginPath(); hud.moveTo(tx, ty); hud.lineTo(tx + ts*0.62, ty + ts); hud.lineTo(tx - ts*0.62, ty + ts); hud.closePath();
    hud.fillStyle = col; hud.fill(); hud.lineWidth = 2*k; hud.strokeStyle = "#000"; hud.stroke();
    hudText("!", tx, ty + ts*0.88, UI.small*s, "#111", "center");
    hudText(label, tx, y + h*0.86, UI.label*s*(label.length > 6 ? 0.85 : 1), "#fff", "center");
  }
  const sub = (n.into ? "into" : "") || (n.mods && n.mods[0]) || "";
  if(hot) hudText("BRAKE", x + w/2, y + h + 13*k*s, UI.small*s, "#ff3a28", "center");
  else if(sub && !hazard) hudText(sub.toUpperCase(), x + w/2, y + h + 11*k*s, UI.label*0.85*s, UI.dim, "center");
  // distance to it
  const f = Math.max(0, Math.min(1, sh.ahead/(sh.look*1.5)));
  hud.fillStyle = col; hud.fillRect(x + 2*k, y + h - 4*k, (w - 4*k)*f, 2.5*k);
  hud.restore();
}
function drawNotes(W, k){
  if(!PACE.shown.length) return;
  const a = PACE.shown[0];
  drawNoteTile(a, W/2, 66*k, 1, Math.min(1, 0.35 + (1 - a.ahead/(a.look*1.5))*1.4), true);
  if(PACE.shown[1]) drawNoteTile(PACE.shown[1], W/2 + 52*k, 70*k, 0.66, 0.75);
}
function drawHUD(dt, alongNow){
  const W = HUD_W, H = HUD_H, k = HK;
  hud.clearRect(0, 0, W, H);
  if(state.phase === "menu" || GAME.ui && !GAME.paused) return;
  const lapNo = Math.min(state.lap, LAPS);

  /* top left: total and lap times */
  hudText("TOTAL TIME", 12*k, 20*k, UI.label, UI.dim);
  hudText(fmt(state.t), 10*k, 46*k, UI.value, UI.ink);
  if(EXP.on) drawExpHUD(W, H, k);
  else {
  hud.fillStyle = UI.key;
  hud.fillRect(11*k, 54*k, 20*k, 16*k);
  hud.strokeStyle = "#000"; hud.lineWidth = 2*k;
  hud.strokeRect(11*k, 54*k, 20*k, 16*k);
  hudText(String(lapNo), 21*k, 67*k, UI.label, "#16202a", "center");
  hudText("LAP TIME", 37*k, 67*k, UI.label, UI.dim);
  hudText(fmt(state.t - state.lapStart), 10*k, 92*k, UI.value, UI.ink);
  { const d = traceDelta();
    if(d !== null) hudText((d < 0 ? "\u2212" : "+") + Math.abs(d).toFixed(2), 12*k, 110*k, UI.small, d < 0 ? "#5cf07a" : "#ff6a4a"); }

  /* top centre: the lap counter */
  if(LAPS < 99){
    hud.font = 'italic 900 ' + Math.round(UI.value*1.3*k) + 'px "Arial Black", Arial, sans-serif';
    const wN = hud.measureText(String(lapNo)).width;
    hudText(String(lapNo), W/2 - 4*k, 44*k, UI.value*1.3, UI.key, "right");
    hudText("/" + LAPS, W/2 - 2*k, 44*k, UI.small*1.2, UI.ink, "left");
  } else hudText(String(lapNo), W/2, 44*k, UI.value*1.3, UI.key, "center");
  hudText("LAP", W/2, 57*k, UI.label, UI.dim, "center");
  drawNotes(W, k);

  /* top right: position and the best laps */
  const field = FIELD.length + 1;
  if(FIELD.length){
    hudText("POSITION", W-12*k, 20*k, UI.label, UI.dim, "right");
    hudText(state.place + "/" + field, W-10*k, 52*k, UI.value, UI.ink, "right");
  } else {
    const rb = recordFor().bestLap;
    hudText("RECORD LAP", W-12*k, 20*k, UI.label, UI.dim, "right");
    hudText(rb != null ? fmt(rb) : "--'--\"--", W-10*k, 50*k, UI.value*0.8, UI.ink, "right");
  }
  hudText("BEST TIME", W-12*k, 72*k, UI.label, UI.dim, "right");
  const top = state.lapTimes.slice().sort((x,y)=>x-y).slice(0,3);
  for(let i=0;i<3;i++){
    const y = (88 + i*15)*k;
    hudText(String(i+1), W-84*k, y, UI.label, UI.key, "right");
    hudText(top[i] !== undefined ? fmt(top[i]) : "--'--\"--", W-10*k, y, UI.small, UI.ink, "right");
  }

  }
  /* bottom left: tachometer */
  drawTach(Math.min(DRIVE.redline*1.02, trans.rpm + (trans.spin || 0)), 74*k, H-58*k, 46*k);

  /* gear box and speed */
  const gx = 140*k, gy = H-70*k, gw = 42*k, gh = 44*k;
  hud.fillStyle = "#f1f1ea"; hud.fillRect(gx, gy, gw, gh);
  hud.fillStyle = "#111";    hud.fillRect(gx, gy+gh-13*k, gw, 13*k);
  hud.strokeStyle = "#000";  hud.lineWidth = 3*k;
  hud.strokeRect(gx, gy, gw, gh);
  hud.save();
  hud.globalAlpha = trans.shiftT > 0 ? 0.4 : 1;
  hudText(gearLabel(), gx+gw/2, gy+29*k, UI.value, "#16202a", "center");
  hud.restore();
  hudText("SHIFT", gx+gw/2, gy+gh-3*k, UI.label*0.82, UI.ink, "center");
  const kmh = SAVE.settings.units === 1;
  hudText(String(Math.round(Math.abs(alongNow)*(kmh ? 3.6 : 2.23694))), gx+gw+62*k, H-30*k, UI.value, UI.ink, "right");
  hudText(kmh ? "KM/H" : "MPH", gx+gw+66*k, H-30*k, UI.label, UI.dim);

  /* drift charge: the bar fills toward the next tier and takes its colour */
  const hex = c => "rgb(" + c.map(v=>Math.round(v*255)).join(",") + ")";
  const FULL = DRIFT_TIERS[DRIFT_TIERS.length-1].at * 1.12;
  if(drift.on && drift.t > 0.12){
    const tint = drift.tier >= 0 ? hex(DRIFT_TIERS[drift.tier].col) : "#cfd6da";
    const label = drift.tier >= 0 ? DRIFT_TIERS[drift.tier].name : "DRIFT";
    hudText(label, W-124*k, H-48*k, UI.small*1.2, tint, "right");
    const bw = 110*k, bx = W-124*k-bw, by = H-40*k, bh = 9*k;
    hud.fillStyle = "rgba(20,20,18,.65)"; hud.fillRect(bx, by, bw, bh);
    hud.fillStyle = tint;
    hud.fillRect(bx, by, bw*Math.min(1, drift.t/FULL), bh);
    hud.strokeStyle = "#000"; hud.lineWidth = 2*k;
    hud.strokeRect(bx, by, bw, bh);
    DRIFT_TIERS.forEach(T=>{                      // where the next tier lands
      const x = bx + bw*(T.at/FULL);
      hud.beginPath(); hud.moveTo(x, by); hud.lineTo(x, by+bh);
      hud.lineWidth = 2*k; hud.strokeStyle = "#000"; hud.stroke();
    });
  } else if(drift.boostT > 0 && drift.boostTier >= 0){
    const T = DRIFT_TIERS[drift.boostTier];
    hud.save();
    hud.globalAlpha = Math.max(0.25, Math.min(1, drift.boostT*1.6));
    hudText("TURBO", W-124*k, H-48*k, UI.small*1.2, hex(T.col), "right");
    hud.restore();
  }

  /* minimap, bottom right (not on an expedition: finding the way is the point) */
  if(!EXP.on){
    const size = 96*k, mx = W - size - 12*k, my = H - size - 12*k;
    const sc = (size - 10*k)/MAP.span;
    const px = x => mx + size/2 + (x - MAP.cx)*sc;
    const pz = z => my + size/2 + (z - MAP.cz)*sc;
    hud.fillStyle = "rgba(12,22,32,.55)";
    hud.fillRect(mx, my, size, size);
    hud.strokeStyle = "#000"; hud.lineWidth = 2*k;
    hud.strokeRect(mx, my, size, size);
    paths.forEach((P, pi)=>{
      hud.beginPath();
      const step = Math.max(1, Math.round(P.N/90));
      for(let i=0;i<P.N;i+=step){
        const p = P.pts[i];
        i ? hud.lineTo(px(p.x), pz(p.z)) : hud.moveTo(px(p.x), pz(p.z));
      }
      if(P.closed) hud.closePath();
      hud.lineWidth = (pi ? 2.0 : 3.4)*k;
      hud.strokeStyle = pi ? "rgba(150,190,220,.75)" : "#dfe7ec";
      hud.lineJoin = "round"; hud.lineCap = "round";
      hud.stroke();
    });
    hud.fillStyle = UI.key;
    hud.fillRect(px(pts[0].x)-2*k, pz(pts[0].z)-2*k, 4*k, 4*k);
    if(EXP.on){
      EXP.camps.forEach(c=>{ hud.beginPath(); hud.arc(px(c.x), pz(c.z), 2.4*k, 0, 7);
        hud.fillStyle = c.reached ? UI.key : "#8fa0a8"; hud.fill(); hud.lineWidth = 1.2*k; hud.strokeStyle = "#000"; hud.stroke(); });
      const sx = px(EXP.summit.x), sz = pz(EXP.summit.z);
      hud.beginPath(); hud.moveTo(sx, sz - 5*k); hud.lineTo(sx + 4.5*k, sz + 3*k); hud.lineTo(sx - 4.5*k, sz + 3*k); hud.closePath();
      hud.fillStyle = "#f2efe6"; hud.fill(); hud.lineWidth = 1.4*k; hud.strokeStyle = "#000"; hud.stroke();
    }
    FIELD.forEach(r=>{
      hud.beginPath();
      hud.arc(px(r.mesh.position.x), pz(r.mesh.position.z), 2.6*k, 0, 7);
      hud.fillStyle = r.def.paint; hud.fill();
      hud.lineWidth = 1.4*k; hud.strokeStyle = "#000"; hud.stroke();
    });
    const hx = px(pose.x), hz = pz(pose.z);
    const fx = Math.sin(pose.h), fz = Math.cos(pose.h);
    hud.beginPath();
    hud.moveTo(hx + fx*5.2*k, hz + fz*5.2*k);
    hud.lineTo(hx - fz*3.4*k - fx*3.0*k, hz + fx*3.4*k - fz*3.0*k);
    hud.lineTo(hx + fz*3.4*k - fx*3.0*k, hz - fx*3.4*k - fz*3.0*k);
    hud.closePath();
    hud.fillStyle = UI.warn; hud.fill();
    hud.lineWidth = 1.6*k; hud.strokeStyle = "#000"; hud.stroke();
  }

  drawOverlay(dt);
}

/* ------------------------------------------------------------------ *
 *  Save data
 *  Settings, records and a championship in progress live in local
 *  storage. A track change is a reload (the world is built once at
 *  load), so what to do after the reload rides along in session storage.
 * ------------------------------------------------------------------ */
const SAVE_KEY = "pinehollow.save.v1";
const BOOT_KEY = "pinehollow.boot";
const SAVE = (()=>{
  const def = { settings:{ master:0.1, music:0.5, sfx:0.9, vol10:true, cam:0, auto:true, filter:true,
                           res:1, hud:1, diff:1, units:1, gfx:0, look:0, paint:0, notes:2,
                           car:{ model:0, fender:0, rim:0, wheel:1, livery:0, beat:1,
                                 rack:1, spare:1, cans:1, shovel:0, lights:0, flaps:0, bull:0 } },
                records:{}, champ:null };
  try{
    const s = JSON.parse(localStorage.getItem(SAVE_KEY) || "null");
    if(s){
      const carDef = def.settings.car;
      Object.assign(def.settings, s.settings || {});
      def.settings.car = Object.assign({}, carDef, (s.settings && s.settings.car) || {});
      if(!(s.settings && s.settings.vol10)){ def.settings.master = 0.1; def.settings.vol10 = true; }   // start quiet, once
      def.records = s.records || {};
      def.champ = s.champ || null;
    }
  }catch(e){}
  return def;
})();
function persist(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(SAVE)); }catch(e){} }
function recordFor(){ return SAVE.records[TRACK.name] || (SAVE.records[TRACK.name] = {}); }

/* the garage build, as buildWagon wants it */
function carOpts(){
  const S = SAVE.settings, C = S.car;
  return { dirt: true, paint: PAINTS[Math.max(0, Math.min(PAINTS.length-1, S.paint|0))].hex, beat: !!C.beat, rust: C.beat ? 38 : 0,
           model: C.model, fender: C.fender, rim: C.rim, wheel: C.wheel, livery: C.livery,
           acc: { rack: !!C.rack, spare: !!C.spare, cans: !!C.cans, shovel: !!C.shovel, lights: !!C.lights, flaps: !!C.flaps, bull: !!C.bull } };
}
let carBuilt = "";
function rebuildCar(){
  const key = JSON.stringify(SAVE.settings.car);
  if(key === carBuilt) return;
  carBuilt = key;
  const vis = car.visible, p = car.position.clone(), r = car.rotation.clone();
  scene.remove(car);
  car = buildWagon(carOpts());
  car.visible = vis; car.position.copy(p); car.rotation.copy(r);
  scene.add(car);
}
function applySettings(){
  const S = SAVE.settings;
  rebuildCar();
  camMode = S.cam;
  trans.auto = S.auto;
  const fast = S.gfx === 1;
  paintCar(PAINTS[Math.max(0, Math.min(PAINTS.length-1, S.paint|0))].hex);
  const print = S.look !== 1;
  if(print !== LOOK.print){ LOOK.print = print; sizeRT(); }
  if(fast !== GFX.fast || !rt){
    GFX.fast = fast;
    sun.castShadow = !fast;
    renderer.setPixelRatio(fast ? 1 : Math.min(window.devicePixelRatio, 1.5));
    renderer.setSize(window.innerWidth, window.innerHeight);
    sizeRT();
  }
  sizeHUD();
  setLevels();
}
