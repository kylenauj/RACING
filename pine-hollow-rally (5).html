function paintCanvas(base, rustAmt){
  return new THREE.CanvasTexture(noiseCanvas(128,128,(g,w,h)=>{
    g.fillStyle=base; g.fillRect(0,0,w,h);
    for(let i=0;i<rustAmt;i++){
      const x=Math.random()*w, y=Math.random()*h, r=2+Math.random()*9;
      const grd=g.createRadialGradient(x,y,0,x,y,r);
      grd.addColorStop(0,"rgba(120,58,26,.72)");
      grd.addColorStop(1,"rgba(120,58,26,0)");
      g.fillStyle=grd; g.beginPath(); g.arc(x,y,r,0,7); g.fill();
    }
    const dirt=g.createLinearGradient(0,h*0.45,0,h);
    dirt.addColorStop(0,"rgba(70,52,34,0)");
    dirt.addColorStop(1,"rgba(56,40,26,.6)");
    g.fillStyle=dirt; g.fillRect(0,h*0.45,w,h*0.55);
    for(let i=0;i<300;i++){
      g.fillStyle="rgba(48,36,24,.28)";
      g.fillRect(Math.random()*w, h*0.5+Math.random()*h*0.5, 2, 3);
    }
  }));
}

/* ------------------------------------------------------------------ *
 *  Ground and road
 *
 *  The terrain mesh is the heightfield, vertex for vertex, in tiles so
 *  the camera only draws what it can see. The road is painted on in the
 *  shader from four numbers per vertex: how far past the road edge it
 *  is, where it sits across the road, mud and wet. Because the edge is a
 *  distance, not a triangle boundary, it comes out crisp at any angle.
 * ------------------------------------------------------------------ */
const TERRAIN_MAT = new THREE.MeshLambertMaterial({map:grassTex, vertexColors:true});
const GROUND_MAT = TERRAIN_MAT;
TERRAIN_MAT.onBeforeCompile = sh=>{
  sh.vertexShader = sh.vertexShader
    .replace("#include <common>", "#include <common>\nattribute vec4 aRoad;\nattribute vec4 aRoad2;\nvarying vec4 vRoad;\nvarying vec4 vRoad2;\nvarying vec2 vXZ;")
    .replace("#include <begin_vertex>", "#include <begin_vertex>\nvRoad = aRoad;\nvRoad2 = aRoad2;\nvXZ = position.xz;");
  sh.fragmentShader = sh.fragmentShader
    .replace("#include <common>", "#include <common>\nvarying vec4 vRoad;\nvarying vec4 vRoad2;\nvarying vec2 vXZ;\n" +
      "float h21(vec2 p){ return fract(sin(dot(p, vec2(127.1, 311.7)))*43758.5453); }\n" +
      "float vnz(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.0 - 2.0*f);\n" +
      "  return mix(mix(h21(i), h21(i + vec2(1.0, 0.0)), f.x), mix(h21(i + vec2(0.0, 1.0)), h21(i + vec2(1.0, 1.0)), f.x), f.y); }")
    .replace("#include <map_fragment>", [
      (WINTER || DESERT) ? "vec3 grd = vec3(0.55 + 0.9*dot(texture2D(map, vUv).rgb, vec3(0.3, 0.59, 0.11))) * vColor;"
                         : "vec3 grd = texture2D(map, vUv).rgb * vColor;",
      "float n1 = texture2D(map, vXZ*0.21).r;",
      "float n2 = texture2D(map, vXZ*0.043 + 0.37).r;",
      "float n3 = texture2D(map, vXZ*0.9).r;",
      "float edge = vRoad.x, lat = vRoad.y, mud = vRoad.z, wet = vRoad.w;",
      // a ragged edge, so it reads as a dirt road and not a painted line
      "float e = edge + (n2 - 0.5)*0.9 + (n1 - 0.5)*0.35;",
      "float onRoad = 1.0 - smoothstep(-0.25, 0.35, e);",
      "float verge  = 1.0 - smoothstep(0.2, 2.2, e);",
      // gravel: grey-brown, lighter on the crown, wheel tracks worn darker
      "vec3 gravel = " + (WINTER ? "vec3(0.47, 0.46, 0.46)" : DESERT ? "vec3(0.62, 0.48, 0.36)" : "vec3(0.43, 0.395, 0.34)") +
        " * (0.80 + 0.28*n3) * (0.90 + 0.16*n2);",
      "float rut = exp(-pow((abs(lat) - 1.65)/0.55, 2.0));",
      // deeper ruts are darker and wetter, with a pale ridge of loose stone between
      "float rutK = 0.6 + clamp(vRoad2.x/0.08, 0.0, 1.6);",
      "gravel *= 1.0 - 0.15*rut*rutK;",
      "gravel *= 1.0 + 0.06*rutK*exp(-pow((abs(lat) - 0.2)/0.6, 2.0));",
      // washboard: ripples across the road, only where it is chattering
      "float ripple = 0.5 + 0.5*sin(vRoad2.z*6.2832/1.35);",
      "gravel *= 1.0 - clamp(vRoad2.y*2.4, 0.0, 0.2)*ripple;",
      "gravel = mix(gravel, " + (WINTER ? "vec3(0.66, 0.68, 0.72)" : DESERT ? "vec3(0.72, 0.58, 0.44)" : "vec3(0.50, 0.46, 0.39)") +
        "*(0.85+0.2*n3), (1.0 - smoothstep(0.0, 0.9, abs(lat)))*0.35);",
      "vec3 sandy = " + (WINTER ? "vec3(0.70, 0.74, 0.80)" : DESERT ? "vec3(0.66, 0.50, 0.34)" : "vec3(0.42, 0.35, 0.25)") +
        " * (0.82 + 0.3*n3);",
      // mud comes in from the verges first
      "float mk = clamp((mud - 0.42 + 0.30*smoothstep(-3.5, 0.0, edge))/0.28, 0.0, 1.0);",
      "vec3 mudC = " + (WINTER ? "vec3(0.40, 0.41, 0.44)" : DESERT ? "vec3(0.55, 0.40, 0.28)" : "vec3(0.29, 0.21, 0.14)") + " * (0.8 + 0.35*n3);",
      "vec3 col = mix(grd, sandy, verge*0.85);",
      "col = mix(col, gravel, onRoad);",
      "col = mix(col, mudC, mk*max(onRoad, verge*0.7));",
      // what is left of an old tar road: dark, cracked, broken into islands with gravel between
      "float pv = vRoad2.w;",
      "float brk = vnz(vXZ*0.085)*0.6 + vnz(vXZ*0.31 + 7.0)*0.3 + vnz(vXZ*1.3)*0.1;",
      "float tar = pv*smoothstep(0.46, 0.51, brk)*smoothstep(-0.2, -1.6, e + (n1 - 0.5)*1.4);",
      "vec3 asph = " + (WINTER ? "vec3(0.36, 0.37, 0.40)" : DESERT ? "vec3(0.33, 0.30, 0.28)" : "vec3(0.24, 0.24, 0.25)") + "*(0.85 + 0.3*n3);",
      "asph *= 1.0 - 0.5*(1.0 - smoothstep(0.0, 0.02, abs(fract(n1*9.0) - 0.5)))*step(0.5, n3);",
      "asph = mix(asph, vec3(0.85, 0.8, 0.55), (1.0 - smoothstep(0.05, 0.12, abs(lat)))*step(0.5, fract(vRoad2.z/6.0))*0.6);",
      "col = mix(col, asph, tar);",
      FROZEN ? "col = mix(col, vec3(0.80, 0.88, 0.95)*(0.9 + 0.12*n3), clamp(wet*1.4, 0.0, 1.0)*max(onRoad, verge)*0.8);"
             : "col = mix(col, col*vec3(0.62, 0.64, 0.66), clamp(wet*1.4, 0.0, 1.0)*max(onRoad, verge));",
      "diffuseColor.rgb *= col;"
    ].join("\n"))
    .replace("#include <color_fragment>", "");
};

{
  const TILE = 64;                        // cells per tile side
  const c = new THREE.Color();
  const nrm = (a, b)=>{
    const l = GH[b*GN + Math.max(0, a-1)], r = GH[b*GN + Math.min(GN-1, a+1)];
    const d = GH[Math.max(0, b-1)*GN + a], u = GH[Math.min(GN-1, b+1)*GN + a];
    const nx = l - r, ny = 2*GSTEP, nz = d - u;
    const k = 1/Math.hypot(nx, ny, nz);
    return [nx*k, ny*k, nz*k];
  };
  for(let tb=0; tb<GN-1; tb+=TILE){
    for(let ta=0; ta<GN-1; ta+=TILE){
      const a1 = Math.min(GN-1, ta+TILE), b1 = Math.min(GN-1, tb+TILE);
      const cols = a1-ta+1, rows = b1-tb+1;
      const pos = new Float32Array(cols*rows*3), nor = new Float32Array(cols*rows*3);
      const col = new Float32Array(cols*rows*3), uv = new Float32Array(cols*rows*2);
      const road = new Float32Array(cols*rows*4);
      const road2 = new Float32Array(cols*rows*4);
      let v = 0;
      for(let b=tb;b<=b1;b++){
        for(let a=ta;a<=a1;a++){
          const g = b*GN + a;
          const x = -GHALF + a*GSTEP, z = -GHALF + b*GSTEP;
          pos[v*3] = x; pos[v*3+1] = GH[g]; pos[v*3+2] = z;
          const n = nrm(a, b);
          nor[v*3] = n[0]; nor[v*3+1] = n[1]; nor[v*3+2] = n[2];
          uv[v*2] = x/17.33; uv[v*2+1] = z/17.33;
          const hw = GP[g] >= 0 ? GHW[g] : 5;
          const d = GD[g] > 1e8 ? 99 : GD[g];
          const edge = Math.min(40, d - hw);
          road[v*4] = edge;
          // where two roads overlap the offset across belongs to neither:
          // push it out past the ruts and the crown so neither is drawn
          road[v*4+1] = Math.max(-12, Math.min(12, GL[g]))*(1 - GX[g]) + 6*GX[g];
          road[v*4+2] = GP[g] >= 0 ? GM[g] : 0;
          road[v*4+3] = GP[g] >= 0 ? GW[g] : 0;
          road2[v*4] = GP[g] >= 0 ? GRU[g] : 0;
          road2[v*4+1] = GP[g] >= 0 ? GWA[g] : 0;
          road2[v*4+2] = GP[g] >= 0 ? GSM[g] : 0;
          road2[v*4+3] = GP[g] >= 0 ? GPV[g] : 0;
          // dirt near the road, grass beyond; bare earth on steep banks
          const t = smoothstep(1.5, 9, edge);
          const steep = Math.max(smoothstep(0.80, 0.55, n[1]),
                                 GP[g] >= 0 ? Math.min(1, GBK[g]/1.5)*(1 - smoothstep(4, 9, edge)) : 0);
          if(WINTER){
            // snow, blue in the hollows, a little trodden to slush by the verge
            const r0 = Math.random();
            c.setHSL(0.58 + r0*0.03, 0.24 + (1 - t)*0.06, 0.64 + t*0.12 + r0*0.03 - steep*0.12);
          } else if(DESERT){
            // sand and hardpan, ochre to red; the steep rock banded in layers of sandstone
            const r0 = Math.random(), band = Math.sin(GH[g]*0.85) + 0.5*Math.sin(GH[g]*2.3 + 1.1);
            c.setHSL(0.065 + r0*0.025 - steep*0.025 + band*0.008*steep, 0.42 + t*0.1 + steep*0.08,
                     0.46 + t*0.06 + r0*0.04 - steep*0.10 + band*0.05*steep);
            // the canyon's tableland: bare red slickrock, a little sand drifted on the flats
            if(CANYON.on){
              const cw = canyonWall(x, z);
              if(cw > 1.5){
                const k = smoothstep(1.5, 6, cw), sandy = smoothstep(0.85, 1, n[1])*0.35;
                c.lerp(new THREE.Color().setHSL(0.03 + r0*0.015 + Math.sin(GH[g]*0.9)*0.008, 0.52, 0.40 + r0*0.05 + Math.sin(GH[g]*0.9)*0.04), k*(1 - sandy));
              }
            }
            if(DUNE.on && t > 0.5){
              const dd = Math.hypot(x - DUNE.x, z - DUNE.z);
              if(dd < DUNE.r) c.lerp(new THREE.Color().setHSL(0.095, 0.55, 0.62 + r0*0.04), 0.8*(1 - smoothstep(DUNE.r*0.7, DUNE.r, dd)));
            }
          } else if(FALL){
            // dry gold grass, and fallen leaves drifted up against the verges
            const leaf = Math.random() < 0.18 + 0.25*(1 - smoothstep(2, 14, edge));
            if(leaf && t > 0.15) c.setHSL(0.02 + Math.random()*0.09, 0.55 + Math.random()*0.2, 0.30 + Math.random()*0.08);
            else c.setHSL(0.078 + t*0.07 + Math.random()*0.02, 0.30 + t*0.12 - steep*0.10,
                          0.33 - t*0.02 + Math.random()*0.03 - steep*0.03);
          } else
          c.setHSL(0.078 + t*0.172 + Math.random()*0.012,
                   0.25 + t*0.08 - steep*0.10,
                   0.33 - t*0.05 + Math.random()*0.03 - steep*0.03);
          // the quarry is bare rock, banded by its benches; the lake has a sandy rim
          if(PIT.on){
            const pd = Math.hypot(x - PIT.x, z - PIT.z);
            if(pd < PIT.r*1.04 && t > 0.3){
              /* cooler and darker than the haul road, so the road you are on
                 reads against the rock around it; faces darker than shelves */
              const band = Math.sin(GH[g]*1.7)*0.035;
              c.setHSL(0.09 + Math.random()*0.02, 0.06 + Math.random()*0.04,
                       0.30 + band + Math.random()*0.04 - smoothstep(0.6, 0.35, n[1])*0.09);
            }
          }
          if(LAKE.on && !LAKE.frozen && t > 0.3){
            const dy = GH[g] - LAKE.level;
            if(dy < 0.9 && dy > -1.5) c.setHSL(0.10, 0.28, 0.42 + Math.random()*0.04);
          }
          col[v*3] = c.r; col[v*3+1] = c.g; col[v*3+2] = c.b;
          v++;
        }
      }
      const idx = [];
      for(let r=0;r<rows-1;r++){
        for(let q=0;q<cols-1;q++){
          const A = r*cols + q, B = A + 1, C = A + cols, D = C + 1;
          if(GFLIP[(tb + r)*GN + ta + q]) idx.push(A, C, B, B, C, D);   // diagonal B-C, as gridH
          else idx.push(A, C, D, A, D, B);                               // diagonal A-D, same as gridH
        }
      }
      const gg = new THREE.BufferGeometry();
      gg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
      gg.setAttribute("normal", new THREE.BufferAttribute(nor, 3));
      gg.setAttribute("color", new THREE.BufferAttribute(col, 3));
      gg.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
      gg.setAttribute("aRoad", new THREE.BufferAttribute(road, 4));
      gg.setAttribute("aRoad2", new THREE.BufferAttribute(road2, 4));
      gg.setIndex(idx);
      gg.computeBoundingSphere();
      const m = new THREE.Mesh(gg, TERRAIN_MAT);
      m.receiveShadow = true;
      scene.add(m);
    }
  }

  /* beyond the grid, a coarse apron of the same land out to the fog, tucked
     just under the edge of the grid so the two never fight */
  {
    const STEP = 30, R = 1650;
    const n = Math.round(2*R/STEP);
    const pos=[], col=[], uv=[], idx=[];
    const inside = (x, z)=> Math.abs(x) < GHALF - 1 && Math.abs(z) < GHALF - 1;
    for(let b=0;b<=n;b++) for(let a=0;a<=n;a++){
      const x = -R + a*STEP, z = -R + b*STEP;
      pos.push(x, macro(x, z) - 0.6, z);
      uv.push(x/17.33, z/17.33);
      if(FALL) c.setHSL(0.10 + Math.random()*0.03, 0.36, 0.30 + Math.random()*0.03);
      else if(WINTER) c.setHSL(0.58 + Math.random()*0.02, 0.16, 0.80 + Math.random()*0.04);
      else if(DESERT) c.setHSL(0.065 + Math.random()*0.02, 0.44, 0.48 + Math.random()*0.04);
      else c.setHSL(0.25 + Math.random()*0.012, 0.33, 0.28 + Math.random()*0.03);
      col.push(c.r, c.g, c.b);
    }
    for(let b=0;b<n;b++) for(let a=0;a<n;a++){
      const A = b*(n+1) + a, B = A + 1, C = A + n + 1, D = C + 1;
      const x = -R + a*STEP, z = -R + b*STEP;
      if(inside(x, z) && inside(x+STEP, z) && inside(x, z+STEP) && inside(x+STEP, z+STEP)) continue;
      idx.push(A, C, D, A, D, B);
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    gg.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    gg.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    const far = new Float32Array(pos.length/3*4).fill(0); for(let i=0;i<far.length;i+=4) far[i] = 40;
    gg.setAttribute("aRoad", new THREE.BufferAttribute(far, 4));
    gg.setAttribute("aRoad2", new THREE.BufferAttribute(new Float32Array(far.length), 4));
    gg.setIndex(idx);
    gg.computeVertexNormals();
    scene.add(new THREE.Mesh(gg, TERRAIN_MAT));
  }
}


/* Winter and desert repaint the sky once it is drawn: the blue stays sky,
   everything else (the range, the foothills, the treeline) is recoloured,
   snow for winter, red rock and ochre for the desert. */
function themeSky(g, w, h, hz){
  const img = g.getImageData(0, 0, w, h), d = img.data;
  for(let y=0;y<h;y++){
    const below = y > hz + 8;
    for(let x=0;x<w;x++){
      const k = (y*w + x)*4;
      let r = d[k], gg = d[k+1], b = d[k+2];
      const l = (0.3*r + 0.59*gg + 0.11*b)/255;
      const sky = !below && (b - r > 38) && b > 120;
      if(WINTER){
        if(sky){ r = r*0.75 + 200*0.25; gg = gg*0.75 + 214*0.25; b = b*0.8 + 230*0.2; }
        else if(!below){ const m = 0.35 + 0.5*l; r = r*(1-m) + 238*m; gg = gg*(1-m) + 244*m; b = b*(1-m) + 250*m; }
        else { const snow = ((x*7 + y*13) % 11) > 3 ? 0.62 : 0.2;
               r = r*(1-snow) + 232*snow; gg = gg*(1-snow) + 238*snow; b = b*(1-snow) + 246*snow; }
      } else {
        if(sky){ const m = y/h; r = r*0.55 + 236*0.45*(0.6 + m); gg = gg*0.6 + 214*0.4*(0.6 + m); b = b*0.75 + 190*0.25; }
        else {
          // red rock: dark oxblood in shadow up to pale sandstone in the light
          const t = Math.min(1, l*1.35);
          r = 96 + (236 - 96)*t; gg = 44 + (178 - 44)*t; b = 30 + (126 - 30)*t;
          if(!below){ const hazeK = 0.35; r = r*(1-hazeK) + 232*hazeK; gg = gg*(1-hazeK) + 200*hazeK; b = b*(1-hazeK) + 170*hazeK; }
        }
      }
      d[k] = Math.min(255, r); d[k+1] = Math.min(255, gg); d[k+2] = Math.min(255, b);
    }
  }
  g.putImageData(img, 0, 0);
}

    for(let i=0;i<70;i++){
      const cy = 30 + Math.random()*h*0.26;
      const cx = Math.random()*w;
      const len = 120 + Math.random()*420;
      g.save();
      g.globalAlpha = 0.05 + Math.random()*0.16;
      g.fillStyle = "#ffffff";
      for(let k=0;k<6;k++){
        g.beginPath();
        g.ellipse(cx + (Math.random()-0.5)*len*0.5, cy + (Math.random()-0.5)*14,
                  len*(0.2+Math.random()*0.4), 3 + Math.random()*7, 0, 0, 7);
        g.fill();
      }
      g.restore();
    }

    /* cumulus banks, lit from the sun side and shaded underneath */
    for(let i=0;i<52;i++){
      const cx = Math.random()*w;
      const cy = h*0.14 + Math.random()*h*0.30;
      const sc = 0.6 + Math.random()*1.7;
      const lit = Math.sign(sx - cx) || 1;
      for(let k=0;k<14;k++){
        const ox=(Math.random()-0.5)*150*sc, oy=(Math.random()-0.5)*34*sc;
        const r=(16+Math.random()*34)*sc;
        const rad=g.createRadialGradient(cx+ox+lit*r*0.3, cy+oy-r*0.4, r*0.1, cx+ox, cy+oy, r);
        rad.addColorStop(0.00,"rgba(255,255,255,.98)");
        rad.addColorStop(0.55,"rgba(240,247,255,.85)");
        rad.addColorStop(0.80,"rgba(197,214,232,.55)");
        rad.addColorStop(1.00,"rgba(186,205,226,0)");
        g.fillStyle=rad; g.beginPath(); g.arc(cx+ox, cy+oy, r, 0, 7); g.fill();
      }
    }

    /* The range. Each summit gets a sunward face and a shadow face split at
       the ridgeline, plus gullies and a snow line, so it reads as rock with
       form rather than a flat cut out silhouette. */
    const peakColour = (base, shade)=>{
      const c = base.map(v=> Math.max(0, Math.min(255, Math.round(v*shade))));
      return "rgb(" + c.join(",") + ")";
    };
    const range = (baseY, amp, step, rock, hazeCol, snowLine)=>{
      let x = -step;
      while(x < w + step){
        const pw = step*(0.55 + Math.random()*0.9);
        const hgt = amp*(0.45 + Math.random()*0.55);
        const apexX = x + pw*(0.35 + Math.random()*0.3);
        const apexY = baseY - hgt;
        const leftX = x - pw*0.25, rightX = x + pw*1.25;
        const lit = apexX < sx;                       // which side faces the sun

        // shadow face
        g.beginPath();
        g.moveTo(apexX, apexY);
        g.lineTo(lit ? rightX : leftX, baseY + 8);
        g.lineTo(apexX + (lit ? pw*0.05 : -pw*0.05), baseY + 8);
        g.closePath();
        g.fillStyle = peakColour(rock, 0.74); g.fill();

        // sunward face
        g.beginPath();
        g.moveTo(apexX, apexY);
        g.lineTo(lit ? leftX : rightX, baseY + 8);
        g.lineTo(apexX + (lit ? -pw*0.05 : pw*0.05), baseY + 8);
        g.closePath();
        g.fillStyle = peakColour(rock, 1.16); g.fill();

        // a gradient down each face, which is what gives a mountain its form
        const faceGrad = g.createLinearGradient(apexX, apexY, apexX, baseY);
        faceGrad.addColorStop(0, peakColour(rock, 1.24));
        faceGrad.addColorStop(0.45, peakColour(rock, 1.02));
        faceGrad.addColorStop(1, peakColour(rock, 0.80));
        g.fillStyle = faceGrad;
        g.beginPath();
        g.moveTo(apexX, apexY);
        g.lineTo(lit ? leftX : rightX, baseY + 8);
        g.lineTo(apexX + (lit ? -pw*0.05 : pw*0.05), baseY + 8);
        g.closePath();
        g.fill();

        // bands of strata across the faces
        for(let k=0;k<2;k++){
          const f2 = 0.34 + k*0.26 + Math.random()*0.08;
          g.strokeStyle = "rgba(255,242,220,.055)";
          g.lineWidth = 2 + Math.random()*3;
          g.beginPath();
          g.moveTo(apexX - pw*0.5*f2, apexY + hgt*f2);
          g.lineTo(apexX + pw*0.5*f2, apexY + hgt*f2*1.06);
          g.stroke();
        }
        // scree fanning out at the foot
        const screeGrad = g.createLinearGradient(apexX, baseY - hgt*0.16, apexX, baseY + 8);
        screeGrad.addColorStop(0, "rgba(0,0,0,0)");
        screeGrad.addColorStop(1, peakColour(rock, 0.86));
        g.fillStyle = screeGrad;
        g.beginPath();
        g.moveTo(apexX - pw*0.28, baseY - hgt*0.16);
        g.lineTo(apexX - pw*0.55, baseY + 8);
        g.lineTo(apexX + pw*0.55, baseY + 8);
        g.lineTo(apexX + pw*0.28, baseY - hgt*0.16);
        g.closePath(); g.fill();

        // gullies running down off the ridge
        for(let k=0;k<2;k++){
          const f = 0.3 + Math.random()*0.5;
          g.strokeStyle = "rgba(38,52,68,.10)";
          g.lineWidth = 1 + Math.random()*1.8;
          g.beginPath();
          g.moveTo(apexX, apexY + hgt*0.06);
          let gx = apexX, gy = apexY;
          for(let seg2=0; seg2<5; seg2++){
            gx += (lit ? -1 : 1)*pw*0.10*f + (Math.random()-0.5)*8;
            gy += hgt*0.20;
            g.lineTo(gx, gy);
          }
          g.stroke();
        }

        // snow above the line, with a ragged lower edge
        if(hgt > amp*snowLine){
          const snowDrop = hgt*(0.26 + Math.random()*0.16);
          g.beginPath();
          g.moveTo(apexX, apexY);
          const steps = 7;
          for(let k=0;k<=steps;k++){
            const f2 = k/steps;
            g.lineTo(apexX + pw*0.55*f2*(lit?-1:1),
                     apexY + snowDrop*f2 + (k%2 ? snowDrop*0.16 : 0));
          }
          for(let k=steps;k>=0;k--){
            const f2 = k/steps;
            g.lineTo(apexX - pw*0.5*f2*(lit?-1:1),
                     apexY + snowDrop*f2*0.86 + (k%2 ? snowDrop*0.2 : 0));
          }
          g.closePath();
          g.fillStyle = "rgba(255,255,255,.92)"; g.fill();
          g.fillStyle = "rgba(206,224,240,.5)";
          g.beginPath();
          g.moveTo(apexX, apexY);
          g.lineTo(apexX + pw*0.5*(lit?1:-1)*0.5, apexY + snowDrop*0.8);
          g.lineTo(apexX, apexY + snowDrop*0.9);
          g.closePath(); g.fill();
        }
        x += pw*0.82;                                  // overlap the next one
      }
      const haze = g.createLinearGradient(0, baseY - amp, 0, baseY + 14);
      haze.addColorStop(0, "rgba(255,255,255,0)");
      haze.addColorStop(1, hazeCol);
      g.fillStyle = haze; g.fillRect(0, baseY - amp, w, amp + 14);
    };
    // four ranges: a pale snowbound wall at the back, then progressively
    // warmer and more solid rock as they come forward
    range(hz - 20, 330, 360, [176, 196, 222], "rgba(200,224,244,.94)", 0.40);
    range(hz -  6, 246, 276, [150, 156, 172], "rgba(188,214,236,.86)", 0.50);
    range(hz +  6, 176, 214, [138, 126, 118], "rgba(176,204,230,.70)", 0.62);
    range(hz + 18, 114, 168, [116,  98,  84], "rgba(166,196,224,.54)", 0.76);

    /* wooded foothills below the rock, so the range sits on something */
    for(let layer=0; layer<2; layer++){
      const baseY = hz + 26 + layer*10;
      const amp = 54 - layer*20;
      const tone = layer ? "#3d5a41" : "#4a6b4b";
      g.beginPath();
      g.moveTo(0, baseY);
      let x = 0;
      while(x < w + 40){
        const pw = 26 + Math.random()*54;
        g.lineTo(x + pw*0.5, baseY - amp*(0.35 + Math.random()*0.65));
        g.lineTo(x + pw, baseY - amp*(0.10 + Math.random()*0.30));
        x += pw;
      }
      g.lineTo(w, baseY + 60); g.lineTo(0, baseY + 60);
      g.closePath();
      g.fillStyle = tone; g.fill();
      // ragged tree edge along the top of each fold
      g.strokeStyle = layer ? "rgba(44,68,48,.75)" : "rgba(58,84,58,.7)";
      g.lineWidth = 3;
      for(let k=0;k<220;k++){
        const tx = Math.random()*w;
        const ty = baseY - amp*(0.1 + Math.random()*0.55);
        g.beginPath(); g.moveTo(tx, ty); g.lineTo(tx + (Math.random()-0.5)*4, ty - 4 - Math.random()*9); g.stroke();
      }
      const fh = g.createLinearGradient(0, baseY - amp, 0, baseY + 20);
      fh.addColorStop(0, "rgba(166,196,220,0)");
      fh.addColorStop(1, layer ? "rgba(166,196,220,.30)" : "rgba(166,196,220,.46)");
      g.fillStyle = fh; g.fillRect(0, baseY - amp, w, amp + 20);
    }

    /* a treeline so the sky meets forest rather than a hard edge */
    g.beginPath();
    g.moveTo(0, hz + 40);
    for(let x=0; x<=w; x+=7){
      const tall = 16 + Math.sin(x*0.06)*7 + Math.random()*22;
      g.lineTo(x, hz + 34 - tall);
      g.lineTo(x + 3.5, hz + 36);
    }
    g.lineTo(w, hz + 90); g.lineTo(0, hz + 90);
    g.closePath();
    g.fillStyle = "#3f5b46"; g.fill();
    const tHaze = g.createLinearGradient(0, hz - 6, 0, hz + 48);
    tHaze.addColorStop(0, "rgba(178,204,224,.62)");
    tHaze.addColorStop(1, "rgba(178,204,224,.10)");
    g.fillStyle = tHaze; g.fillRect(0, hz - 6, w, 54);
    if(WINTER || DESERT) themeSky(g, w, h, hz);
  }));
  skyTex.anisotropy = 4;

  skyDome = new THREE.Mesh(
    new THREE.SphereGeometry(1000, 32, 20),
    new THREE.MeshBasicMaterial({map:skyTex, side:THREE.BackSide, fog:false, depthWrite:false})
  );
  skyDome.renderOrder = -1;
  scene.add(skyDome);
}

/* ---- corner boards ---------------------------------------------------
   Rally chevron boards on the outside of every corner, so a blind turn tells
   you which way it goes and roughly how hard before you are in it.

   Which side is outside falls straight out of the geometry. The driver's
   right hand direction is the road normal n = (-t.z, t.x), and a corner whose
   heading angle is increasing curves toward -n, so a left hander runs away
   from n and its outside edge is +n. That also settles which way the arrow
   points: a plane told to look back up the road ends up with its local +x
   along n, which is the driver's right, so a right hander gets the arrow
   drawn toward +u in the texture and a left hander the mirror of it.

   How tight the corner is sets how many boards it gets, which is how a real
   stage is marked: more chevrons means slow down more. */
{
  const chevron = right => {
    const t = new THREE.CanvasTexture(noiseCanvas(160, 72, (g,w,h)=>{
      g.fillStyle = "#e0ab1c"; g.fillRect(0,0,w,h);
      g.fillStyle = "#17170f"; g.fillRect(0,0,w,5); g.fillRect(0,h-5,w,5);
      g.strokeStyle = "#17170f"; g.lineWidth = 11;
      g.lineCap = "round"; g.lineJoin = "round";
      for(let c=0;c<3;c++){
        const base = 26 + c*44, tip = base + (right ? 26 : -26);
        const x0 = right ? base : base;
        g.beginPath();
        g.moveTo(x0, 16); g.lineTo(tip, h/2); g.lineTo(x0, h-16);
        g.stroke();
      }
    }));
    return t;
  };

  const marks = {l:[], r:[]};
  paths.forEach(P=>{
    const N = P.N, R = radiiOf(P);
    const W = Math.max(4, Math.round(10/P.seg));
    const bend = new Float64Array(N);
    for(let i=0;i<N;i++){
      const a = P.tans[P.closed ? ((i-W)%N+N)%N : Math.max(0, i-W)];
      const b = P.tans[P.closed ? (i+W)%N : Math.min(N-1, i+W)];
      let d = Math.atan2(b.x,b.z) - Math.atan2(a.x,a.z);
      while(d >  Math.PI) d -= Math.PI*2;
      while(d < -Math.PI) d += Math.PI*2;
      bend[i] = d;
    }
    let i = 0;
    while(i < N){
      if(R[i] >= 100){ i++; continue; }
      let j = i;
      while(j+1 < N && R[j+1] < 125) j++;
      let rmin = 1e9, turn = 0;
      for(let k=i;k<=j;k++){ rmin = Math.min(rmin, R[k]); turn += bend[k]; }
      const arc = (j-i)*P.seg;
      if(arc > 10 && rmin < 100 && Math.abs(turn) > 0.25){
        const left = turn > 0;
        const out  = left ? 1 : -1;                    // which side is outside
        const count = rmin < 26 ? 5 : rmin < 45 ? 4 : 3;
        const from = i - Math.round(26/P.seg);         // start before turn in
        const to   = i + Math.round(arc*0.55/P.seg);
        for(let c=0;c<count;c++){
          const f = count > 1 ? c/(count-1) : 0;
          const k = wrapIdx(P, Math.round(from + (to-from)*f));
          const q = P.pts[k], t = P.tans[k];
          const nx = -t.z, nz = t.x;
          const off = (P.half[k] + 3.6)*out;
          const x = q.x + nx*off, z = q.z + nz*off;
          if(deckAt(x,z) > 0.4 || inWaterway(x,z)) continue;
          if(nearest(x,z).dist < P.half[k] + 2.4) continue;     // not in the mouth of another road
          marks[left ? "l" : "r"].push([x, gradedY(x,z), z, t.x, t.z]);
        }
      }
      i = j + 1;
    }
  });

  const boardGeo = new THREE.PlaneGeometry(1.85, 1.02);
  const postGeo  = new THREE.CylinderGeometry(0.065, 0.075, 1.6, 5);
  const postMat  = new THREE.MeshLambertMaterial({color:0x5e4b31});
  const total = marks.l.length + marks.r.length;
  if(total){
    const dummy = new THREE.Object3D();
    const posts = new THREE.InstancedMesh(postGeo, postMat, total);
    let n = 0;
    ["l","r"].forEach(side=>{
      const list = marks[side];
      if(!list.length) return;
      const mat = new THREE.MeshLambertMaterial({
        map: chevron(side === "r"), side: THREE.DoubleSide
      });
      const im = new THREE.InstancedMesh(boardGeo, mat, list.length);
      list.forEach((m, k)=>{
        const [x, gy, z, tx, tz] = m;
        dummy.position.set(x, gy + 1.42, z);
        dummy.lookAt(x - tx, gy + 1.42, z - tz);      // face back up the road
        dummy.updateMatrix();
        im.setMatrixAt(k, dummy.matrix);
        dummy.rotation.set(0,0,0);
        dummy.position.set(x, gy + 0.8, z);
        dummy.updateMatrix();
        posts.setMatrixAt(n++, dummy.matrix);
      });
      im.instanceMatrix.needsUpdate = true;
      im.frustumCulled = false;
      im.name = "cornerBoards";
      scene.add(im);
    });
    posts.instanceMatrix.needsUpdate = true;
    posts.frustumCulled = false;
    posts.name = "cornerPosts";
    scene.add(posts);
  }
}

/* ---- the water itself ------------------------------------------------
   Drawn as a fine sheet over the whole crossing, with the depth of water
   worked out at every vertex from the ground under it. The shader fades
   the sheet out as the depth reaches zero, so the shoreline follows the
   bank exactly and softly, and shallow water over the road shows the
   road through it. Colour goes from clear and brown in the shallows to
   green and deep in the channel, with the sky on it at a grazing angle. */
const waterMats = [];
function waterMaterial(){
  const m = new THREE.ShaderMaterial({
    uniforms:{
      uTime:{value:0}, tRipple:{value:waterTex},
      uSun:{value:SUN_DIR.clone()},
      fogColor:{value:new THREE.Color(scene.fog.color)},
      fogNear:{value:scene.fog.near}, fogFar:{value:scene.fog.far}
    },
    vertexShader:[
      "attribute float aDepth; attribute float aFoam;",
      "varying float vDepth; varying vec3 vWorld; varying vec2 vUv; varying float vFoam;",
      "void main(){",
      "  vDepth = aDepth; vUv = uv; vFoam = aFoam;",
      "  vec4 w = modelMatrix*vec4(position, 1.0); vWorld = w.xyz;",
      "  gl_Position = projectionMatrix*viewMatrix*w;",
      "}"].join("\n"),
    fragmentShader:[
      "uniform float uTime, fogNear, fogFar; uniform sampler2D tRipple; uniform vec3 uSun, fogColor;",
      "varying float vDepth; varying vec3 vWorld; varying vec2 vUv; varying float vFoam;",
      "void main(){",
      "  if(vDepth <= 0.0) discard;",
      "  vec2 p = vWorld.xz;",
      "  float r1 = texture2D(tRipple, p*0.09 + vec2(0.0, uTime*0.11)).r;",
      "  float r2 = texture2D(tRipple, p*0.16 + vec2(uTime*0.05, -uTime*0.07)).r;",
      "  float rip = (r1 + r2)*0.5;",
      "  vec3 N = normalize(vec3((r1 - 0.5)*0.35, 1.0, (r2 - 0.5)*0.35));",
      "  vec3 V = normalize(cameraPosition - vWorld);",
      "  float fres = pow(1.0 - max(dot(N, V), 0.0), 4.0);",
      "  float deep = smoothstep(0.05, 1.1, vDepth);",
      "  vec3 shallow = vec3(0.42, 0.40, 0.30);",
      "  vec3 deepC = vec3(0.10, 0.25, 0.26);",
      "  vec3 col = mix(shallow, deepC, deep);",
      "  col = mix(col, vec3(0.70, 0.82, 0.90), fres*0.75);",
      "  float spec = pow(max(dot(reflect(-uSun, N), V), 0.0), 90.0);",
      "  col += vec3(1.0, 0.93, 0.78)*spec*1.4;",
      FROZEN ? [
      // ice: still, milky blue, cracked, with the sun glaring off it
      "  float ck = texture2D(tRipple, p*0.035).r, ck2 = texture2D(tRipple, p*0.11 + 0.3).r;",
      "  float crack = (1.0 - smoothstep(0.0, 0.018, abs(ck - 0.5)))*0.8 + (1.0 - smoothstep(0.0, 0.012, abs(ck2 - 0.5)))*0.4;",
      "  vec3 ice = mix(vec3(0.46, 0.60, 0.68), vec3(0.30, 0.44, 0.55), clamp(0.5 + (ck - 0.5)*1.6, 0.0, 1.0));",
      "  ice = mix(ice, vec3(0.90, 0.94, 0.98), smoothstep(0.60, 0.78, ck2)*0.7);",
      "  ice = mix(ice, vec3(0.92, 0.95, 1.0), crack*0.7);",
      "  vec3 Ni = normalize(vec3((ck - 0.5)*0.08, 1.0, (ck2 - 0.5)*0.08));",
      "  float specI = pow(max(dot(reflect(-uSun, Ni), V), 0.0), 60.0);",
      "  ice += vec3(1.0, 0.97, 0.9)*specI*0.9 + vec3(0.75, 0.85, 0.95)*fres*0.35;",
      // snow blown onto the ice along the shore, so it runs out into the bank instead of stopping at a line
      "  float rim = 1.0 - smoothstep(0.02, 0.32, vDepth + (ck2 - 0.5)*0.22 + (ck - 0.5)*0.1);",
      "  ice = mix(ice, vec3(0.93, 0.95, 0.985), rim*0.9);",
      "  float fdI = length(cameraPosition - vWorld);",
      "  ice = mix(ice, fogColor, smoothstep(fogNear, fogFar, fdI));",
      "  gl_FragColor = vec4(ice, smoothstep(0.0, 0.07, vDepth)*0.94);",
      "  return;"].join("\n") : "",
      "  float foam = (1.0 - smoothstep(0.0, 0.10, vDepth))*smoothstep(0.45, 0.62, rip);",
      "  foam = max(foam, vFoam*smoothstep(0.30, 0.55, rip + vFoam*0.2));",
      "  col = mix(col, vec3(0.86, 0.88, 0.84), foam*0.7);",
      "  float a = smoothstep(0.0, 0.06, vDepth)*mix(0.42, 0.88, deep);",
      "  a = max(a, fres*0.6*smoothstep(0.0, 0.05, vDepth));",
      "  a = max(a, foam*0.8);",
      "  float fd = length(cameraPosition - vWorld);",
      "  col = mix(col, fogColor, smoothstep(fogNear, fogFar, fd));",
      "  gl_FragColor = vec4(col, a);",
      "}"].join("\n"),
    transparent:true, depthWrite:false
  });
  waterMats.push(m);
  return m;
}
FORDS.forEach(F=>{
  const nx = -F.tz, nz = F.tx;                 // along the stream
  const level = F.level;
  const STEP = 0.8;
  const ACROSS = FORD_HALF + FORD_BANK + 12, ALONG = FORD_REACH;
  const cols = Math.ceil(ACROSS*2/STEP) + 1, rows = Math.ceil(ALONG*2/STEP) + 1;
  const pos=[], uv=[], dep=[], idx=[];
  const shoreRows = [];
  for(let r=0;r<rows;r++){
    const v = -ALONG + r*STEP;
    let wetRow = false;
    for(let c=0;c<cols;c++){
      const u = -ACROSS + c*STEP;
      const x = F.x + nx*v + F.tx*u, z = F.z + nz*v + F.tz*u;
      const d = level - surfaceY(x, z);
      pos.push(x, level, z); uv.push(u, v);
      dep.push(Math.max(-1, Math.min(3, d)));
      if(d > 0.02) wetRow = true;
    }
    shoreRows.push(wetRow);
  }
  for(let r=0;r<rows-1;r++){
    for(let c=0;c<cols-1;c++){
      const a = r*cols + c, b = a + 1, d2 = a + cols, e = d2 + 1;
      if(dep[a] <= 0 && dep[b] <= 0 && dep[d2] <= 0 && dep[e] <= 0) continue;
      idx.push(a, d2, e, a, e, b);
    }
  }
  if(!idx.length) return;
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute("aDepth", new THREE.Float32BufferAttribute(dep,1));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, waterMaterial());
  m.renderOrder = 3;
  m.frustumCulled = false;
  scene.add(m);

  // wet stones along the waterline, found from the depth grid itself
  const rockMat = new THREE.MeshLambertMaterial({map:rockTex});
  let placed = 0;
  for(let tries=0; tries<600 && placed<16; tries++){
    const k = Math.floor(Math.random()*dep.length);
    if(dep[k] > 0.06 || dep[k] < -0.25) continue;
    const bx = pos[k*3] + (Math.random()-0.5)*0.6, bz = pos[k*3+2] + (Math.random()-0.5)*0.6;
    if(nearest(bx, bz).dist < (F.roadHalf || 5.7) + 0.8) continue;     // not in the road
    const sc = 0.25 + Math.random()*0.5;
    const rock = new THREE.Mesh(rockGeometry(placed%3), rockMat);
    rock.position.set(bx, gradedY(bx,bz) + sc*0.08, bz);
    rock.scale.set(sc, sc*0.55, sc);
    rock.rotation.set(Math.random(), Math.random()*6, Math.random());
    scene.add(rock);
    placed++;
  }
});

/* ---- the bridge over the gorge, on the tracks that have one ---- */
if(GORGE.depth > 0.5){
  const stoneTex = new THREE.CanvasTexture(noiseCanvas(256, 256, (g,w,h)=>{
    g.fillStyle="#8d8a80"; g.fillRect(0,0,w,h);
    for(let i=0;i<5200;i++){
      const v=Math.random();
      g.fillStyle = v<0.4 ? "rgba(96,94,86,.5)" : v<0.75 ? "rgba(176,172,160,.4)" : "rgba(128,124,114,.45)";
      g.fillRect(Math.random()*w, Math.random()*h, Math.random()*4+1, Math.random()*4+1);
    }
    for(let y=0;y<h;y+=32){
      g.strokeStyle="rgba(58,56,50,.35)"; g.lineWidth=2;
      g.beginPath(); g.moveTo(0,y); g.lineTo(w,y); g.stroke();
      const off = (y/32)%2 ? 0 : 44;
      for(let x=off;x<w;x+=88){
        g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+32); g.stroke();
      }
    }
  }));
  stoneTex.wrapS = stoneTex.wrapT = THREE.RepeatWrapping;
  const TRESTLE = !!(TRACK.gorge && TRACK.gorge.trestle);
  const woodTex = TRESTLE ? new THREE.CanvasTexture(noiseCanvas(128, 128, (g,w,h)=>{
    g.fillStyle = "#7a5634"; g.fillRect(0, 0, w, h);
    for(let y=0;y<h;y+=16){ g.fillStyle = "rgba(40,24,12,.55)"; g.fillRect(0, y, w, 2);
      for(let i=0;i<30;i++){ g.fillStyle = "rgba(" + (110 + Math.random()*40|0) + "," + (80 + Math.random()*30|0) + ",50,.35)"; g.fillRect(Math.random()*w, y + 2 + Math.random()*12, 10 + Math.random()*30, 1); } }
  })) : null;
  if(woodTex) woodTex.wrapS = woodTex.wrapT = THREE.RepeatWrapping;
  const stone = TRESTLE ? new THREE.MeshLambertMaterial({map:woodTex, side:THREE.DoubleSide})
                        : new THREE.MeshLambertMaterial({map:stoneTex, side:THREE.DoubleSide,
                            color: DESERT ? 0xe8b894 : WINTER ? 0xe6ecf2 : 0xffffff});
  const steel = new THREE.MeshLambertMaterial({color:0x8f5f4a, side:THREE.DoubleSide});
  const bridge = new THREE.Group();
  const S = GORGE.samples;
  const idx = k => wrapIdx(MAIN, GORGE.i + k);

  /* The structure is built as a closed box: deck top, both flanks, the
     underside and an abutment at each end, so there is nothing to see
     through from any angle. */
  const topY = i => MAIN.pts[i].y + BED - 0.04;
  const botY = i => MAIN.pts[i].y + BED - 1.30;
  const edge = i => MAIN.half[i] + 1.15;

  const build = (rows, mat)=>{
    const pos=[], uv=[], ix=[];
    let run = 0;
    for(let k=-S;k<=S;k++){
      const i = idx(k), p = MAIN.pts[i], t = MAIN.tans[i];
      const nx=-t.z, nz=t.x;
      rows(i, p, nx, nz).forEach(r=>{
        pos.push(r[0], r[1], r[2]);
      });
      const n = rows(i, p, nx, nz).length;
      for(let r=0;r<n;r++) uv.push(r/(n-1), run/7);
      run += MAIN.seg;
      if(k<S){
        const cols = n;
        const a2 = (k+S)*cols, b2 = (k+S+1)*cols;
        for(let r=0;r<cols-1;r++){
          ix.push(a2+r, b2+r+1, b2+r, a2+r, a2+r+1, b2+r+1);
        }
      }
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
    gg.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
    gg.setIndex(ix);
    gg.computeVertexNormals();
    bridge.add(new THREE.Mesh(gg, mat));
  };

  // one continuous shell: down the left flank, across the underside, up the right
  build((i,p,nx,nz)=>{
    const e = edge(i), ty = topY(i), by = botY(i);
    return [
      [p.x+nx*e, ty,        p.z+nz*e],
      [p.x+nx*e, by,        p.z+nz*e],
      [p.x+nx*e*0.5, by-0.12, p.z+nz*e*0.5],
      [p.x-nx*e*0.5, by-0.12, p.z-nz*e*0.5],
      [p.x-nx*e, by,        p.z-nz*e],
      [p.x-nx*e, ty,        p.z-nz*e]
    ];
  }, stone);

  /* The driving surface itself. The shell is open on top: the old road
     ribbon used to lie across it, and without that you looked straight into
     the hollow bridge at the tops of the piers. Drawn with the terrain's own
     road shader, so the gravel runs onto the bridge without a seam. */
  {
    const pos=[], nor=[], col=[], uv=[], road=[], ix=[];
    const lats = e => [-e, -e*0.8, -MAIN.half[0], -2.5, -1.2, 0, 1.2, 2.5, MAIN.half[0], e*0.8, e];
    let row = 0, cols = 0;
    for(let k=-S;k<=S;k++){
      const i = idx(k), p = MAIN.pts[i], t = MAIN.tans[i];
      const nx=-t.z, nz=t.x, e = edge(i), hw = MAIN.half[i];
      const L = lats(e).map(v => Math.abs(v) === MAIN.half[0] ? Math.sign(v)*hw : v);
      cols = L.length;
      L.forEach(u=>{
        const x = p.x + nx*u, z = p.z + nz*u;
        pos.push(x, topY(i) + 0.05, z);
        nor.push(0, 1, 0);
        col.push(1, 1, 1);
        uv.push(x/17.33, z/17.33);
        // same convention as the terrain: lat is positive on the -n side
        road.push(Math.abs(u) - hw, -u, 0, 0);
      });
      if(k < S){
        const a = row*cols, b = (row+1)*cols;
        for(let c=0;c<cols-1;c++) ix.push(a+c, b+c+1, b+c, a+c, a+c+1, b+c+1);
      }
      row++;
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
    gg.setAttribute("normal", new THREE.Float32BufferAttribute(nor,3));
    gg.setAttribute("color", new THREE.Float32BufferAttribute(col,3));
    gg.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
    gg.setAttribute("aRoad", new THREE.Float32BufferAttribute(road,4));
    gg.setAttribute("aRoad2", new THREE.Float32BufferAttribute(new Array(road.length).fill(0),4));
    gg.setIndex(ix);
    const deck = new THREE.Mesh(gg, TERRAIN_MAT);
    deck.receiveShadow = true;
    bridge.add(deck);
  }

  // parapet walls standing on the deck
  [-1, 1].forEach(sd=>{
    const pos=[], uv=[], ix=[];
    let run = 0;
    for(let k=-S;k<=S;k++){
      const i = idx(k), p = MAIN.pts[i], t = MAIN.tans[i];
      const nx=-t.z, nz=t.x, e = edge(i);
      pos.push(p.x+nx*sd*e, topY(i)+0.72, p.z+nz*sd*e);
      pos.push(p.x+nx*sd*e, topY(i)-0.10, p.z+nz*sd*e);
      uv.push(0, run/4, 1, run/4);
      run += MAIN.seg;
      if(k<S){ const a2=(k+S)*2; ix.push(a2, a2+2, a2+1, a2+1, a2+2, a2+3); }
    }
    const gg = new THREE.BufferGeometry();
    gg.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
    gg.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
    gg.setIndex(ix);
    gg.computeVertexNormals();
    bridge.add(new THREE.Mesh(gg, stone));
  });

  // abutments closing each end into the hillside
  [-1, 1].forEach(end=>{
    const i = idx(end*S), p = MAIN.pts[i], t = MAIN.tans[i];
    const nx=-t.z, nz=t.x, e = edge(i);
    const wall = new THREE.Mesh(new THREE.BoxGeometry(e*2, 3.2, 1.6), stone);
    wall.position.set(p.x + t.x*end*0.7, topY(i) - 1.7, p.z + t.z*end*0.7);
    wall.rotation.y = Math.atan2(t.x, t.z);
    bridge.add(wall);
  });

  // on the trestle, a timber bent every few metres, cross braced, down to the floor
  if(TRESTLE){
    const beam = new THREE.MeshLambertMaterial({map:woodTex});
    for(let k=-S+2; k<=S-2; k+=Math.max(2, Math.round(6/MAIN.seg))){
      const i = idx(k), p = MAIN.pts[i], t = MAIN.tans[i], nx = -t.z, nz = t.x, hw = MAIN.half[i] + 0.6;
      const floor = Math.min(gradedY(p.x + nx*hw, p.z + nz*hw), gradedY(p.x - nx*hw, p.z - nz*hw)) - 0.5;
      const top = botY(i), hgt = Math.max(1, top - floor), rot = Math.atan2(t.x, t.z);
      if(hgt < 1.2) continue;
      for(const sd of [-1, 1]){
        const post = new THREE.Mesh(new THREE.BoxGeometry(0.5, hgt + 1, 0.5), beam);
        post.position.set(p.x + nx*sd*hw*(0.8 + 0.25*0), floor + hgt/2, p.z + nz*sd*hw*0.8);
        post.rotation.set(0, rot, sd*0.06); bridge.add(post);
      }
      for(let y=floor + 4; y<top - 1; y+=5){
        const tie = new THREE.Mesh(new THREE.BoxGeometry(hw*2, 0.3, 0.3), beam);
        tie.position.set(p.x, y, p.z); tie.rotation.y = rot; bridge.add(tie);
        const br = new THREE.Mesh(new THREE.BoxGeometry(Math.hypot(hw*1.6, 5), 0.22, 0.22), beam);
        br.position.set(p.x, y + 2.5, p.z); br.rotation.set(0, rot, Math.atan2(5, hw*1.6)*((Math.round(y) % 2) ? 1 : -1)); bridge.add(br);
      }
    }
  }
  // piers into the floor of the ravine
  (TRESTLE ? [] : [-0.62, -0.2, 0.2, 0.62]).forEach(f=>{
    const i = idx(Math.round(f*S));
    const p = MAIN.pts[i], t = MAIN.tans[i], nx=-t.z, nz=t.x;
    [-1, 1].forEach(sd=>{
      const px = p.x + nx*sd*(MAIN.half[i]*0.55), pz = p.z + nz*sd*(MAIN.half[i]*0.55);
      const floor = gradedY(px, pz) - 1.0;
      const hgt = Math.max(1.5, botY(i) - floor);
      const pier = new THREE.Mesh(new THREE.BoxGeometry(1.5, hgt, 1.9), stone);
      pier.position.set(px, floor + hgt/2, pz);
      pier.rotation.y = Math.atan2(t.x, t.z);
      bridge.add(pier);
    });
  });

  // handrails
  const railPts = [[],[]];
  for(let k=-S;k<=S;k+=3){
    const i = idx(k), p = MAIN.pts[i], t = MAIN.tans[i], nx=-t.z, nz=t.x, e = edge(i);
    [-1,1].forEach((sd, si)=>{
      const px = p.x+nx*sd*e, pz = p.z+nz*sd*e;
      const post = new THREE.Mesh(new THREE.BoxGeometry(0.10, 0.78, 0.10), steel);
      post.position.set(px, topY(i) + 1.02, pz);
      post.rotation.y = Math.atan2(t.x, t.z);
      bridge.add(post);
      railPts[si].push([px, topY(i), pz]);
    });
  }
  railPts.forEach(list=>{
    [1.38, 1.02].forEach(hgt=>{
      for(let i=1;i<list.length;i++){
        const a2 = list[i-1], b2 = list[i];
        const dx = b2[0]-a2[0], dz = b2[2]-a2[2];
        const len = Math.hypot(dx, dz);
        const bar = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.07, len+0.05), steel);
        bar.position.set((a2[0]+b2[0])/2, (a2[1]+b2[1])/2 + hgt, (a2[2]+b2[2])/2);
        bar.rotation.y = Math.atan2(dx, dz);
        bridge.add(bar);
      }
    });
  });
  mergeStatic(bridge);
  scene.add(bridge);
  /* ---- the river along the floor of the ravine: one sheet at a single
         level, drawn wherever the carved floor lies below it ---- */
  {
    const nx = -GORGE.tz, nz = GORGE.tx;
    const AU = GORGE.wall + 14, AV = GORGE.reach, STEP = 1.2;
    const cols = Math.ceil(AU*2/STEP)+1, rows = Math.ceil(AV*2/STEP)+1;
    const pos=[], uv=[], dep=[], idx=[];
    for(let r=0;r<rows;r++){
      const v = -AV + r*STEP;
      for(let c=0;c<cols;c++){
        const u = -AU + c*STEP;
        const x = GORGE.x + GORGE.tx*u + nx*v, z = GORGE.z + GORGE.tz*u + nz*v;
        const d = GORGE.level - gridH(x, z);
        pos.push(x, GORGE.level, z); uv.push(u, v);
        dep.push(Math.max(-1, Math.min(3, d)));
      }
    }
    for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
      const a = r*cols + c, b = a + 1, d2 = a + cols, e = d2 + 1;
      if(dep[a] <= 0 && dep[b] <= 0 && dep[d2] <= 0 && dep[e] <= 0) continue;
      idx.push(a, d2, e, a, e, b);
    }
    if(idx.length){
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
      g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
      g.setAttribute("aDepth", new THREE.Float32BufferAttribute(dep,1));
      g.setIndex(idx);
      const m = new THREE.Mesh(g, waterMaterial());
      m.renderOrder = 3; m.frustumCulled = false;
      scene.add(m);
    }
  }
}


/* ------------------------------------------------------------------ *
 *  The set pieces, drawn: the creek, the village, the edge
 * ------------------------------------------------------------------ */
/* the creek: one sheet laid along its whole line, each row at the water
   level there, so the rapids slope from pool to pool and foam as they go */
if(RIVER.on){
  const S = RIVER.S, ACROSS = RIVER_BANK + 5, STEP = 1.1;
  const cols = Math.ceil(ACROSS*2/STEP) + 1;
  const pos=[], uv=[], dep=[], foam=[], idx=[];
  let rows = 0;
  for(let j=0;j<S.length;j+=2){
    const A = S[Math.max(0, j-2)], B = S[Math.min(S.length-1, j+2)];
    let tx = B[0]-A[0], tz = B[1]-A[1]; const tl = Math.hypot(tx, tz) || 1; tx/=tl; tz/=tl;
    const nx = -tz, nz = tx, lev = S[j][2];
    const grad = Math.abs(B[2] - A[2])/tl;                  // how fast the water is falling here
    for(let c=0;c<cols;c++){
      const u = -ACROSS + c*STEP;
      const x = S[j][0] + nx*u, z = S[j][1] + nz*u;
      pos.push(x, lev, z); uv.push(u, j*MAIN.seg);
      dep.push(Math.max(-1, Math.min(3, lev - surfaceY(x, z))));
      foam.push(Math.min(1, grad*9));
    }
    rows++;
  }
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    const a = r*cols + c, b = a + 1, d2 = a + cols, e = d2 + 1;
    if(dep[a] <= 0 && dep[b] <= 0 && dep[d2] <= 0 && dep[e] <= 0) continue;
    idx.push(a, e, d2, a, b, e);          // wound to face up
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute("aDepth", new THREE.Float32BufferAttribute(dep,1));
  g.setAttribute("aFoam", new THREE.Float32BufferAttribute(foam,1));
  g.setIndex(idx);
  const m = new THREE.Mesh(g, waterMaterial());
  m.renderOrder = 3; m.frustumCulled = false;
  scene.add(m);
  // boulders along the banks and a few sitting out in the stream
  const rockMat = new THREE.MeshLambertMaterial({map:rockTex});
  for(let k=0, placed=0; k<900 && placed<60; k++){
    const j = Math.floor(Math.random()*S.length);
    const A = S[Math.max(0, j-2)], B = S[Math.min(S.length-1, j+2)];
    let tx = B[0]-A[0], tz = B[1]-A[1]; const tl = Math.hypot(tx, tz) || 1; tx/=tl; tz/=tl;
    const side = Math.random() < 0.5 ? -1 : 1;
    const u = side*(RIVER_BED - 1 + Math.random()*(RIVER_BANK - RIVER_BED + 3));
    const x = S[j][0] - tz*u, z = S[j][1] + tx*u;
    if(nearest(x, z).dist < 7.2) continue;               // keep the driven line clear
    const sc = 0.4 + Math.pow(Math.random(), 1.6)*1.6;
    const rock = new THREE.Mesh(rockGeometry(placed%3), rockMat);
    rock.position.set(x, gradedY(x, z) + sc*0.05, z);
    rock.scale.set(sc, sc*0.6, sc);
    rock.rotation.set(Math.random(), Math.random()*6, Math.random());
    rock.castShadow = true;
    scene.add(rock);
    placed++;
  }
}

/* a painted board on a post or two, for the signs below */
function boardTex(lines, bg, fg, w, h){
  return new THREE.CanvasTexture(noiseCanvas(w || 256, h || 96, (g, W, H)=>{
    g.fillStyle = bg; g.fillRect(0, 0, W, H);
    g.strokeStyle = fg; g.lineWidth = 5; g.strokeRect(6, 6, W-12, H-12);
    g.fillStyle = fg; g.textAlign = "center"; g.textBaseline = "middle";
    lines.forEach((l, k)=>{
      g.font = (k ? "bold " + Math.round(H*0.2) : "bold " + Math.round(H*(lines.length > 1 ? 0.34 : 0.46))) + "px Georgia, serif";
      g.fillText(l, W/2, H*(lines.length > 1 ? (k ? 0.74 : 0.38) : 0.53));
    });
  }));
}
function roadSign(i, side, lines, bg, fg, back){
  const P = MAIN, p = P.pts[wrapIdx(P, i)], t = P.tans[wrapIdx(P, i)];
  const off = P.half[wrapIdx(P, i)] + 2.2;
  const x = p.x - t.z*side*off, z = p.z + t.x*side*off;
  const y = gradedY(x, z);
  const g = new THREE.Group();
  const post = new THREE.MeshLambertMaterial({color:0x5a4430});
  for(const s of [-1, 1]){
    const m = new THREE.Mesh(new THREE.BoxGeometry(0.14, 3.0, 0.14), post);
    m.position.set(s*1.25, 1.5, 0); g.add(m);
  }
  const bd = new THREE.Mesh(new THREE.BoxGeometry(3.2, 1.2, 0.08),
    [post, post, post, post, new THREE.MeshLambertMaterial({map:boardTex(lines, bg, fg)}), post]);
  bd.position.set(0, 2.45, 0); g.add(bd);
  g.position.set(x, y, z);
  g.rotation.y = Math.atan2(t.x, t.z) + (back ? 0 : Math.PI);   // face the traffic coming at it
  g.traverse(o=>{ if(o.isMesh) o.castShadow = true; });
  scene.add(g);
}

/* ---- the village of Ash Ridge ---- */
if(TOWN.on){
  const rnd = seeded(5150 + TRACK_ID);
  const cache = {};
  const L = c => cache[c] || (cache[c] = new THREE.MeshLambertMaterial({color:c}));
  const glass = new THREE.MeshLambertMaterial({color:0x223038, emissive:0x0c1418});
  const lit   = new THREE.MeshLambertMaterial({color:0xf6d99a, emissive:0x8a6a2a});
  const WALLS = TOWN.western ? [0x8a6a4a, 0x7a5a3e, 0x9c7c58, 0x6e5a48, 0xa88a64, 0xb9a07a, 0x8f7f6a]
                             : [0xece6d6, 0xd9c79c, 0xa04e3c, 0x7593a2, 0xd8bf72, 0x8ea07c, 0xe6d6c4, 0xb9b3a4, 0x9b6b4c];

/* is a spot clear of every road by at least m metres */
const clearOf = (x, z, m)=>{ const n = nearest(x, z); return n.dist > n.half + m; };

/* ---- the stones of the rocky stretches, set into the road where the bumps are ----
   Each one is also solid: the tyre that runs over it climbs it, on its own
   corner of the car, so a stone under one wheel kicks that wheel and not
   the whole road. Lone stones lie in the wheel tracks of the plain gravel. */
const STONES = new Map();
function stoneKey(a, b){ return a*4099 + b; }
/* how far a tyre standing at x,z is lifted by the stones: a wheel of
   radius 0.36m rolling up onto a rounded stone, not a step */
function stoneY(x, z){
  if(!STONES.size) return 0;
  const a = Math.floor(x/4), b = Math.floor(z/4);
  let y = 0;
  for(let i=-1;i<=1;i++) for(let j=-1;j<=1;j++){
    const L = STONES.get(stoneKey(a+i, b+j)); if(!L) continue;
    for(const st of L){
      const d = Math.hypot(x - st[0], z - st[1]);
      const e = Math.max(0, d - st[3]);
      if(e >= 0.36) continue;
      y = Math.max(y, st[2] - (0.36 - Math.sqrt(0.1296 - e*e)));
    }
  }
  return Math.max(0, y);
}

        const x = p.x - t.z*lat + t.x*along, z = p.z + t.x*lat + t.z*along;
        spots.push([x, z, r[1]*(1.5 + Math.random()*1.2)]);
      }
    }
  });
  if(spots.length){
    const rm = new THREE.InstancedMesh(new THREE.DodecahedronGeometry(1, 0),
      new THREE.MeshLambertMaterial({color: DESERT ? 0x9a6a4a : WINTER ? 0x8a8e96 : 0x7c776c, flatShading:true}), spots.length);
    const m4 = new THREE.Matrix4(), q4 = new THREE.Quaternion(), v3 = new THREE.Vector3(), s3 = new THREE.Vector3(), e3 = new THREE.Euler();
    spots.forEach((sp, i)=>{
      const k = sp[2];
      v3.set(sp[0], surfaceY(sp[0], sp[1]) - k*0.25, sp[1]); s3.set(k*1.3, k*0.7, k);
      const key = stoneKey(Math.floor(sp[0]/4), Math.floor(sp[1]/4));
      if(!STONES.has(key)) STONES.set(key, []);
      STONES.get(key).push([sp[0], sp[1], k*0.42, k*0.9]);        // where, how proud, how wide
      e3.set(Math.random(), Math.random()*6, Math.random()); q4.setFromEuler(e3); m4.compose(v3, q4, s3); rm.setMatrixAt(i, m4);
    });
    rm.castShadow = true; rm.receiveShadow = true; scene.add(rm);
  }
}

/* ---- the avalanche gallery: a concrete snow shed over the road ---- */
if(GALLERY.on){
  const P = MAIN, g = new THREE.Group();
  const conc = new THREE.MeshLambertMaterial({color:0xa9a59c}), dark = new THREE.MeshLambertMaterial({color:0x7c7870});

  for(let k=GALLERY.a; k<=GALLERY.b; k+=step){
    const i = wrapIdx(P, k), p = P.pts[i], t = P.tans[i], o = P.half[i] + 9;
    hill += gradedY(p.x - t.z*o, p.z + t.x*o) - gradedY(p.x + t.z*o, p.z - t.x*o);
  }
  const hs = hill >= 0 ? 1 : -1;                      // +1: the mountain is on the +normal side
  let n = 0;
  for(let k=GALLERY.a; k<=GALLERY.b; k+=step, n++){
    const i = wrapIdx(P, k), p = P.pts[i], t = P.tans[i], nx = -t.z, nz = t.x, hw = P.half[i];
    const y = P.pts[i].y + BED, rot = Math.atan2(t.x, t.z), W = hw*2 + 3.2, L = P.seg*step + 0.25;

    put(conc, W + 1.2, 0.8, L, 0, 5.9);                                   // the roof slab

    if(n % 2 === 0){
      put(conc, 0.9, 5.6, 0.9, -hs*(hw + 1.6), 2.8);                      // pillars on the open side
      put(dark, 1.3, 0.5, 1.3, -hs*(hw + 1.6), 0.1);
    }
    if(n % 3 === 1) put(lamp, 0.8, 0.12, 0.35, 0, 5.45);                 // lights under the roof
  }
  // portals at each end
  for(const k of [GALLERY.a, GALLERY.b]){
    const i = wrapIdx(P, k), p = P.pts[i], t = P.tans[i], hw = P.half[i];
    const o = new THREE.Mesh(new THREE.BoxGeometry(hw*2 + 5, 1.6, 1.2), conc);
    o.position.set(p.x, P.pts[i].y + BED + 6.2, p.z); o.rotation.y = Math.atan2(t.x, t.z); g.add(o);
  }
  g.traverse(o=>{ if(o.isMesh){ o.castShadow = true; o.receiveShadow = true; } });
  mergeStatic(g); scene.add(g);
  roadSign(GALLERY.a - Math.round(70/P.seg), 1, ["AVALANCHE GALLERY", "keep inside the pillars"], "#e2b21e", "#1f1f1f");
}

    const cab = new THREE.Mesh(new THREE.BoxGeometry(6.5, 3.2, 5), white); cab.position.y = 13.6; tw.add(cab);

    sign.position.set(0, 16.3, 0); tw.add(sign);

/* ---- the slot's walls: sculpted sandstone ----
   The heightfield can only draw the slot as 2m triangles, which read as a
   row of polygons. Over it stands a smooth-shaded skin of rock, one per
   side: water-carved, so it swells and undercuts in flowing waves that
   drift with height, lipped where each bed of the rock is harder, and
   rolling back over at the top onto the tableland. The beds are coloured
   in bands, dark and purple at the foot, burning orange up toward the sky. */
if(CANYON.on){
  const P = MAIN, step = Math.max(1, Math.round(1.5/P.seg)), NJ = 18;
  const ext = Math.round(170/P.seg);
  const cc = new THREE.Color();
  const lipY = [];
  [1, -1].forEach(side=>{
    const pos = [], col = [], idx = [];
    const ph = side > 0 ? 0.3 : 2.4;
    let rows = 0;
    for(let k=CANYON.a - ext; k<=CANYON.b + ext; k+=step){
      const i = wrapIdx(P, k), p = P.pts[i], t = P.tans[i];
      const nx = -t.z*side, nz = t.x*side;
      const uv = canyonUV(p.x, p.z), sAl = uv ? uv[1] : 0, W0 = canyonFoot(sAl);
      const fx = p.x + nx*(W0 - 1.2), fz = p.z + nz*(W0 - 1.2);
      const floor = gradedY(fx, fz) - 0.5;
      let top = gradedY(p.x + nx*(W0 + 4.2), p.z + nz*(W0 + 4.2));
      if(top - floor < 1.2) top = floor - 0.2;               // no wall here: the skin sinks out of sight
      if(side > 0) lipY.push([k, floor, top, W0]);
      for(let j=0;j<=NJ;j++){
        const f = j/NJ, y = floor + f*(top - floor), hy = y - floor;
        const flow = smoothstep(1.0, 3.2, hy);                // the bottom stays clear of the car
        let o = W0 - 0.9 - flow*(0.95 + 0.85*Math.sin(k*P.seg*0.10 + hy*0.42 + ph)
                                     + 0.55*Math.sin(k*P.seg*0.037 - hy*0.23 + ph*2));
        const bedF = (hy/1.35) % 1;
        o -= 0.28*flow*smoothstep(0.72, 0.95, bedF);           // a harder bed stands proud
        const lip = smoothstep(0.80, 1, f);
        o = o*(1 - lip) + (W0 + 4.4)*lip;
        pos.push(p.x + nx*o, y, p.z + nz*o);
        // the beds sweep in long waves along the wall, the way the sand was laid
        const yb = y + 1.1*Math.sin(k*P.seg*0.045 + ph) + 0.5*Math.sin(k*P.seg*0.13);
        const band = 0.5*Math.sin(yb*1.9) + 0.35*Math.sin(yb*0.61 + 1) + 0.15*Math.sin(yb*4.7);
        const pale = smoothstep(0.55, 0.9, Math.sin(yb*0.83 + 2));   // a pale cross-bedded layer here and there
        const up = smoothstep(0, 1, f);
        cc.setHSL(0.012 + 0.04*up + 0.02*band - 0.035*(1 - up)*(1 - up) + 0.03*pale,
                  0.45 + 0.2*up - 0.15*pale, 0.24 + 0.2*up + 0.09*band + 0.14*pale);
        col.push(cc.r, cc.g, cc.b);
      }
      rows++;
    }
    for(let r=0;r<rows-1;r++) for(let j=0;j<NJ;j++){
      const a = r*(NJ+1) + j, b = a + 1, c = a + NJ + 1, d = c + 1;
      if(side > 0) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("color", new THREE.Float32BufferAttribute(col, 3));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, new THREE.MeshLambertMaterial({vertexColors:true, side:THREE.DoubleSide}));
    m.receiveShadow = true; m.castShadow = true;
    scene.add(m);
  });
  const core = lipY.filter(q=> q[0] >= CANYON.a && q[0] <= CANYON.b && q[2] - q[1] > 9);
  if(core.length){
    // a chockstone jammed between the walls where the slot is narrowest
    const pinch = core.reduce((m, q)=> q[3] < m[3] ? q : m, core[0]);
    const i = wrapIdx(P, pinch[0]), p = P.pts[i], t = P.tans[i];
    const hy = Math.min(13, (pinch[2] - pinch[1])*0.62);
    const cg = new THREE.DodecahedronGeometry(1, 1), cp = cg.attributes.position;
    for(let v=0; v<cp.count; v++){
      const x = cp.getX(v), y = cp.getY(v), z = cp.getZ(v), n = 1 + 0.14*Math.sin(x*3.1 + z*2.3) + 0.1*Math.sin(y*4.2);
      cp.setXYZ(v, x*n, y*n, z*n);
    }
    cg.computeVertexNormals();
    const stoneMat = new THREE.MeshLambertMaterial({color:0x8e4a30, map:rockTex});
    const chock = new THREE.Mesh(cg, stoneMat);
    chock.position.set(p.x, pinch[1] + hy, p.z);
    chock.scale.set(pinch[3] - 0.2, 2.6, 3.2);
    chock.rotation.y = Math.atan2(t.x, t.z);
    chock.castShadow = true; scene.add(chock);
    // a smaller one wedged under it, the way they pile up
    const c2 = chock.clone(); c2.scale.set(2.2, 1.6, 2); c2.position.set(p.x - t.z*(pinch[3] - 2.8), pinch[1] + hy - 2.9, p.z + t.x*(pinch[3] - 2.8));
    scene.add(c2);

    // shafts of sun falling through the slot onto the floor
    // soft at the edges (seen side on, a shaft is thin) and fading out at both ends
    const beamMat = new THREE.ShaderMaterial({
      uniforms:{}, transparent:true, depthWrite:false, blending:THREE.AdditiveBlending, side:THREE.DoubleSide,
      vertexShader:"varying float vY; varying float vFace; void main(){ vY = uv.y;"
        + " vec4 wp = modelMatrix*vec4(position,1.0); vec3 n = normalize(mat3(modelMatrix)*normal);"
        + " vFace = abs(dot(n, normalize(cameraPosition - wp.xyz))); gl_Position = projectionMatrix*viewMatrix*wp; }",
      fragmentShader:"varying float vY; varying float vFace; void main(){"
        + " float a = 0.11*vFace*vFace*smoothstep(0.0, 0.35, vY)*(1.0 - smoothstep(0.75, 1.0, vY));"
        + " gl_FragColor = vec4(1.0, 0.82, 0.55, a); }"
    });
    for(let n=0;n<4;n++){
      const q = core[Math.floor((n + 0.5)/4*core.length)];
      const bi = wrapIdx(P, q[0]), bp = P.pts[bi], bt = P.tans[bi];
      const H = q[2] - q[1];
      const beam = new THREE.Mesh(new THREE.CylinderGeometry(1.0 + n*0.3, 1.6 + n*0.3, H, 10, 1, true), beamMat);
      const lat = (n % 2 ? 1 : -1)*2.2;
      beam.position.set(bp.x - bt.z*lat, q[1] + H/2, bp.z + bt.x*lat);
      beam.rotation.set(0.12, n*1.3, (n % 2 ? -1 : 1)*0.16);
      beam.renderOrder = 4;
      scene.add(beam);
    }
    // fallen blocks along the foot of the walls
    for(let n=0;n<28;n++){
      const q = core[Math.floor(Math.random()*core.length)];
      const bi = wrapIdx(P, q[0]), bp = P.pts[bi], bt = P.tans[bi], side = Math.random() < 0.5 ? 1 : -1;
      const o = (q[3] - 1.0 + Math.random()*0.5)*side, x = bp.x - bt.z*o, z = bp.z + bt.x*o;
      const sc = 0.5 + Math.random()*0.9;
      const r = new THREE.Mesh(rockGeometry(n % 3), stoneMat);
      r.position.set(x, gradedY(x, z) + sc*0.15, z); r.scale.set(sc, sc*0.7, sc);
      r.rotation.set(Math.random(), Math.random()*6, Math.random());
      r.castShadow = true; scene.add(r);
    }
  }
}

/* ---- the slot canyon's stone arch: a natural bridge from rim to rim ---- */
if(CANYON.on){
  // put it where the tableland is fullest over the road
  let bi = CANYON.a, bh = -1;
  for(let k=CANYON.a; k<=CANYON.b; k+=4){
    const i = wrapIdx(MAIN, k), p = MAIN.pts[i], t = MAIN.tans[i];
    const hL = gradedY(p.x - t.z*17, p.z + t.x*17), hR = gradedY(p.x + t.z*17, p.z - t.x*17);
    const h = Math.min(hL, hR) - MAIN.pts[i].y;
    if(h > bh){ bh = h; bi = k; }
  }
  const i = wrapIdx(MAIN, bi), p = MAIN.pts[i], t = MAIN.tans[i];
  const span = 16, geo = new THREE.TorusGeometry(span, 3.2, 8, 26, Math.PI);
  const pa = geo.attributes.position;
  for(let v=0; v<pa.count; v++){
    const x = pa.getX(v), y = pa.getY(v), zz = pa.getZ(v);
    const n = 1 + 0.18*Math.sin(x*1.3 + y*0.7) + 0.12*Math.sin(zz*2.1 + x*0.4);
    const foot = 1 + 0.9*(1 - Math.min(1, y/span));                 // it thickens where it meets the rock
    pa.setXYZ(v, x*(1 + 0.02*n), y*0.55, zz*n*foot);
  }
  geo.computeVertexNormals();
  const arch = new THREE.Mesh(geo, new THREE.MeshLambertMaterial({color:0xb4623e, map:rockTex, flatShading:true}));
  const hL = gradedY(p.x - t.z*span, p.z + t.x*span), hR = gradedY(p.x + t.z*span, p.z - t.x*span);
  arch.position.set(p.x, Math.min(hL, hR) - 3.5, p.z);            // feet sunk into the rim on both sides
  arch.rotation.y = Math.atan2(t.x, t.z);                          // the torus spans its local x: across the road
  arch.castShadow = true; arch.receiveShadow = true;
  scene.add(arch);
  roadSign(CANYON.a - Math.round(90/MAIN.seg), 1, ["SLOT CANYON", "no way out but through"], "#b4623e", "#f7e7c0");
}

/* ---- the oasis: date palms round the water ---- */
function palmGeometry(h, lean){
  const parts = [];
  const trunk = new THREE.CylinderGeometry(0.22, 0.34, h, 7, 6);
  const tp = trunk.attributes.position;
  for(let v=0; v<tp.count; v++){ const y = tp.getY(v) + h/2, f = y/h; tp.setX(v, tp.getX(v) + lean*f*f*h*0.35); tp.setY(v, y); }
  parts.push([trunk, 0x7a5a3a]);
  const topX = lean*h*0.35;
  for(let k=0;k<8;k++){
    const a = k/8*Math.PI*2 + Math.random()*0.3, L = 2.6 + Math.random()*1.2;
    const fr = new THREE.ConeGeometry(0.45, L, 4, 1);
    fr.scale(1, 1, 0.18); fr.translate(0, L/2, 0); fr.rotateZ(-(1.15 + Math.random()*0.35)); fr.rotateY(a); fr.translate(topX, h, 0);
    parts.push([fr, k % 2 ? 0x3f7a34 : 0x55913e]);
  }
  // merge with vertex colours
  let n = 0; parts.forEach(pp=>{ pp[0] = pp[0].toNonIndexed(); n += pp[0].attributes.position.count; });
  const pos = new Float32Array(n*3), col = new Float32Array(n*3), c = new THREE.Color(); let o = 0;
  parts.forEach(([gg, hex])=>{ pos.set(gg.attributes.position.array, o*3); c.setHex(hex);
    for(let v=0; v<gg.attributes.position.count; v++){ col[(o+v)*3] = c.r; col[(o+v)*3+1] = c.g; col[(o+v)*3+2] = c.b; }
    o += gg.attributes.position.count; });
  const out = new THREE.BufferGeometry();
  out.setAttribute("position", new THREE.BufferAttribute(pos, 3)); out.setAttribute("color", new THREE.BufferAttribute(col, 3));
  out.computeVertexNormals();
  return out;
}
if(TRACK.oasis && LAKE.on){
  const mat = new THREE.MeshLambertMaterial({vertexColors:true, flatShading:true});
  let made = 0;
  for(let tries=0; tries<600 && made<34; tries++){
    const a = Math.random()*Math.PI*2, e = 1.02 + Math.random()*0.7;
    const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
    if(!clearOf(x, z, 4)) continue;
    const m = new THREE.Mesh(palmGeometry(7 + Math.random()*5, (Math.random() - 0.5)*0.6), mat);
    m.position.set(x, gradedY(x, z) - 0.2, z); m.rotation.y = Math.random()*6.28; m.castShadow = true;
    scene.add(m); made++;
  }
  // a ring of green round the water
  const reeds = new THREE.MeshLambertMaterial({color:0x6a8a3a});
  for(let k=0;k<90;k++){
    const a = Math.random()*Math.PI*2, e = 0.98 + Math.random()*0.12;
    const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
    const r = new THREE.Mesh(new THREE.ConeGeometry(0.5 + Math.random()*0.5, 1.4 + Math.random(), 5), reeds);
    r.position.set(x, gradedY(x, z) + 0.5, z); scene.add(r);
  }
}

/* ---- the desert's buttes and mesas out on the horizon ---- */
if(TRACK.buttes){
  const mat = new THREE.MeshLambertMaterial({color:0xb35a38, map:rockTex, flatShading:true});
  const cap = new THREE.MeshLambertMaterial({color:0xc98a5a, flatShading:true});
  const rnd = seeded(4242 + TRACK_ID);
  for(let k=0;k<11;k++){
    const a = k/11*Math.PI*2 + rnd()*0.4, d = FAR + 220 + rnd()*480;
    const x = Math.cos(a)*d, z = Math.sin(a)*d;
    const r = 35 + rnd()*70, h = 45 + rnd()*95, g = new THREE.Group();
    const body = new THREE.Mesh(new THREE.CylinderGeometry(r*0.82, r, h, 9, 3), mat);
    const bp = body.geometry.attributes.position;
    for(let v=0; v<bp.count; v++){ const q = 1 + 0.1*Math.sin(bp.getY(v)*0.2 + v) ; bp.setX(v, bp.getX(v)*q); bp.setZ(v, bp.getZ(v)*q); }
    body.geometry.computeVertexNormals();
    body.position.y = h/2; g.add(body);
    const top = new THREE.Mesh(new THREE.CylinderGeometry(r*0.86, r*0.84, 4, 9), cap); top.position.y = h + 1.5; g.add(top);
    const talus = new THREE.Mesh(new THREE.ConeGeometry(r*1.9, h*0.45, 11, 1, true), mat); talus.position.y = h*0.2; g.add(talus);
    g.position.set(x, macro(x, z) - 4, z); g.rotation.y = rnd()*6;
    scene.add(g);
  }
}

/* ---- tumbleweeds bowling across the desert roads ---- */
if(DESERT){
  const mat = new THREE.MeshLambertMaterial({color:0x9a7a4a, wireframe:true});
  const weeds = [];
  for(let k=0;k<7;k++){
    const m = new THREE.Mesh(new THREE.IcosahedronGeometry(0.7 + Math.random()*0.4, 1), mat);
    scene.add(m);
    weeds.push({m, t: -k*3.5 - Math.random()*4, i: 0, side: 1});
  }
  let last = 0;
  ANIMS.push(t=>{
    const dt = Math.max(0, Math.min(0.1, t - last)); last = t;
    weeds.forEach(w=>{
      w.t -= dt;
      if(w.t < 0){                                    // start another roll somewhere ahead of the player
        const base = state.idx;
        w.i = wrapIdx(MAIN, base + Math.round((60 + Math.random()*260)/MAIN.seg));
        w.side = Math.random() < 0.5 ? 1 : -1; w.u = -26; w.t = 7 + Math.random()*6;
        w.sp = 3.5 + Math.random()*3;
      }
      const p = MAIN.pts[w.i], tn = MAIN.tans[w.i];
      w.u += w.sp*dt;
      const x = p.x - tn.z*w.side*w.u, z = p.z + tn.x*w.side*w.u;
      const bounce = Math.abs(Math.sin(t*3.2 + w.i))*0.8;
      w.m.position.set(x, gradedY(x, z) + 0.7 + bounce, z);
      w.m.rotation.x += dt*w.sp*1.4; w.m.rotation.z += dt*w.sp*0.6;
    });
  });
}

/* ---- Copper Lake: the water, stone along the causeway, a dock and boats ---- */
if(LAKE.on){
  const STEP = 2, AX = LAKE.rx*1.15, AZ = LAKE.rz*1.15;
  const cols = Math.ceil(AX*2/STEP) + 1, rows = Math.ceil(AZ*2/STEP) + 1;
  const pos=[], uv=[], dep=[], idx=[];
  for(let r=0;r<rows;r++) for(let c=0;c<cols;c++){
    const x = LAKE.x - AX + c*STEP, z = LAKE.z - AZ + r*STEP;
    const e = Math.hypot((x - LAKE.x)/LAKE.rx, (z - LAKE.z)/LAKE.rz);
    const top = LAKE.frozen ? LAKE.level + 0.05 : LAKE.level;     // ice lies on the flat floor
    pos.push(x, top, z); uv.push(x, z);
    dep.push(e > 1.12 ? -1 : Math.max(-1, Math.min(3, top - surfaceY(x, z) + (LAKE.frozen ? 0.02 : 0))));
  }
  for(let r=0;r<rows-1;r++) for(let c=0;c<cols-1;c++){
    const a = r*cols + c, b = a + 1, d2 = a + cols, e = d2 + 1;
    if(dep[a] <= 0 && dep[b] <= 0 && dep[d2] <= 0 && dep[e] <= 0) continue;
    idx.push(a, d2, e, a, e, b);
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.Float32BufferAttribute(pos,3));
  g.setAttribute("uv", new THREE.Float32BufferAttribute(uv,2));
  g.setAttribute("aDepth", new THREE.Float32BufferAttribute(dep,1));
  g.setIndex(idx);
  const wm = new THREE.Mesh(g, waterMaterial()); wm.renderOrder = 3; wm.frustumCulled = false; scene.add(wm);
  if(!LAKE.frozen){
  // riprap along the waterline of the causeway
  const rockMat = new THREE.MeshLambertMaterial({map:rockTex});
  const P = MAIN;
  for(let i=0;i<P.N;i+=2){
    const p = P.pts[i];
    if(Math.hypot((p.x - LAKE.x)/LAKE.rx, (p.z - LAKE.z)/LAKE.rz) > 0.95 || P.surf[i] === SURF.WATER) continue;
    if(Math.random() < 0.55) continue;
    const t = P.tans[i], s2 = Math.random() < 0.5 ? -1 : 1;
    for(let off=P.half[i] + 3; off < P.half[i] + 14; off += 1.6){
      const x = p.x - t.z*s2*off, z = p.z + t.x*s2*off;
      if(Math.abs(surfaceY(x, z) - LAKE.level) < 0.5){
        const sc = 0.5 + Math.random()*1.0, rock = new THREE.Mesh(rockGeometry(i%3), rockMat);
        rock.position.set(x, gradedY(x, z), z); rock.scale.set(sc, sc*0.6, sc);
        rock.rotation.set(Math.random(), Math.random()*6, Math.random()); scene.add(rock);
        break;
      }
    }
  }
  // a dock on the north shore with rowboats tied up, and a few out on the water
  const boat = (c)=>{
    const b = new THREE.Group();
    const hull = new THREE.Mesh(new THREE.SphereGeometry(1, 10, 5, 0, Math.PI*2, Math.PI/2, Math.PI/2), PM(c));
    hull.scale.set(0.8, 0.5, 2.3); hull.position.y = 0.35; b.add(hull);
    pbox(b, 1.4, 0.1, 0.3, 0x8a6a44, 0, 0.3, 0.3);
    pbox(b, 1.4, 0.1, 0.3, 0x8a6a44, 0, 0.3, -0.8);
    return b;
  };
  for(let k=0, tries=0; k<6 && tries<200; tries++){
    const a = Math.random()*Math.PI*2, e = 0.35 + Math.random()*0.5;
    const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
    if(!clearOf(x, z, 16) || LAKE.level - surfaceY(x, z) < 0.8) continue;
    const b = boat([0xc2382a, 0xf2efe6, 0x2f6fa8, 0x3f8a4a][k%4]);
    b.position.set(x, LAKE.level - 0.15, z); b.rotation.y = Math.random()*6; scene.add(b);
    const bob = Math.random()*6;
    ANIMS.push(t=>{ b.position.y = LAKE.level - 0.15 + Math.sin(t*1.3 + bob)*0.06; b.rotation.z = Math.sin(t*0.9 + bob)*0.04; });
    k++;
  }
  // the dock: find the lake edge north of the causeway
  for(let tries=0; tries<200; tries++){
    const a = Math.PI*0.2 + Math.random()*Math.PI*0.6;
    const x = LAKE.x + Math.cos(a)*LAKE.rx*0.98, z = LAKE.z + Math.sin(a)*LAKE.rz*0.98;
    if(!clearOf(x, z, 20)) continue;
    const g = new THREE.Group(), toward = Math.atan2(LAKE.x - x, LAKE.z - z);
    const y0 = LAKE.level + 0.5 - gradedY(x, z);
    for(let k=0;k<7;k++){
      pbox(g, 3, 0.2, 2.2, 0x8a6a44, 0, y0, k*2.2);
      for(const s of [-1, 1]) pbox(g, 0.25, 3, 0.25, 0x5a4430, s*1.4, y0 - 1.2, k*2.2);
    }
    const shed = new THREE.Group();
    pbox(shed, 6, 3.4, 5, 0xa04e3c, 0, 1.7, 0);
    const rf = new THREE.Mesh(new THREE.ConeGeometry(4.6, 2.2, 4), PM(0x3b3b3e)); rf.rotation.y = Math.PI/4; rf.position.y = 4.5; rf.scale.set(1, 1, 0.8); shed.add(rf);
    shed.position.set(0, 0, -6); g.add(shed);
    setDown(g, x, z, toward);
    const b = boat(0xf2efe6); b.position.set(x + Math.sin(toward)*12 + Math.cos(toward)*2.4, LAKE.level - 0.15, z + Math.cos(toward)*12 - Math.sin(toward)*2.4);
    b.rotation.y = toward; scene.add(b);
    break;
  }
  }
  /* on the ice: a camp of fishing huts well off the road, marker poles
     either side of the plowed road, and the snow it was plowed into */
  if(LAKE.frozen){
    const P = MAIN, pole = new THREE.MeshLambertMaterial({color:0xff6a1a}), snow = new THREE.MeshLambertMaterial({color:0xf2f6fa});
    const hutCols = [0xc2382a, 0x2f6fa8, 0xe0a21e, 0x3f8a4a, 0x7a4a8a];
    for(let i=0;i<P.N;i+=Math.round(16/P.seg)){
      const p = P.pts[i], t = P.tans[i];
      if(iceAt(p.x, p.z) < 0.5) continue;
      for(const sd of [-1, 1]){
        const off = P.half[i] + 2.2, x = p.x - t.z*sd*off, z = p.z + t.x*sd*off;
        const m = new THREE.Mesh(new THREE.CylinderGeometry(0.06, 0.06, 1.8, 5), pole);
        m.position.set(x, gradedY(x, z) + 0.9, z); scene.add(m);
      }
    }
    // plowed snowbanks along the ice road, one merged mesh
    const bank = new THREE.Group();
    for(let i=0;i<P.N;i+=Math.round(3/P.seg)){
      const p = P.pts[i], t = P.tans[i];
      if(iceAt(p.x, p.z) < 0.6) continue;
      for(const sd of [-1, 1]){
        const off = P.half[i] + 3.4 + Math.random()*0.6, x = p.x - t.z*sd*off, z = p.z + t.x*sd*off;
        const m = new THREE.Mesh(new THREE.SphereGeometry(1, 7, 4, 0, Math.PI*2, 0, Math.PI/2), snow);
        m.scale.set(1.3 + Math.random()*0.6, 0.45 + Math.random()*0.3, 2.2);
        m.position.set(x, gradedY(x, z) - 0.05, z); m.rotation.y = Math.atan2(t.x, t.z); bank.add(m);
      }
    }
    mergeStatic(bank); scene.add(bank);
    let huts = 0;
    for(let tries=0; tries<400 && huts<14; tries++){
      const a = Math.random()*Math.PI*2, e = 0.2 + Math.random()*0.65;
      const x = LAKE.x + Math.cos(a)*LAKE.rx*e, z = LAKE.z + Math.sin(a)*LAKE.rz*e;
      if(!clearOf(x, z, 14)) continue;
      const g = new THREE.Group(), c = hutCols[huts % hutCols.length];
      pbox(g, 2.4, 2.1, 3.0, c, 0, 1.05, 0);
      const roof = pbox(g, 2.8, 0.2, 3.4, 0x3b3b3e, 0, 2.3, 0); roof.rotation.z = 0.12;
      pbox(g, 0.8, 1.6, 0.06, 0x2a2a2a, 0, 0.8, 1.53);
      pbox(g, 0.12, 0.9, 0.12, 0x8a8f8c, 0.7, 2.6, -0.8);                       // stovepipe
      pbox(g, 2.6, 0.12, 3.2, 0xf2f6fa, 0, 2.45, 0).rotation.z = 0.12;         // snow on the roof
      if(huts % 3 === 0){                                                      // a pickup parked by it
        pbox(g, 1.9, 0.9, 4.6, 0x5a6a7a, 3.2, 0.75, 0.4);
        pbox(g, 1.8, 0.8, 1.8, 0x5a6a7a, 3.2, 1.55, 1.0);
        pbox(g, 1.7, 0.6, 0.06, 0x223038, 3.2, 1.6, 1.92);

  }
  if(WASH.on){
    roadSign(WASH.at - Math.round(110/MAIN.seg), 1, ["WASHOUT AHEAD", "jump it or wade it"], "#e2b21e", "#1f1f1f");
    roadSign(WASH.at - Math.round(110/MAIN.seg), -1, ["WASHOUT AHEAD", "jump it or wade it"], "#e2b21e", "#1f1f1f");
  }
}

  /* A heap of gravel laid over the ground itself. Every vertex is set from

     skirt runs down with the ground instead of hanging a flat bottom in the
