<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pine Hollow Rally</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Barlow+Semi+Condensed:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --sky:#8fc3ea;
    --yellow:#ffe400;
    --orange:#ff8a12;
    --green:#3ce04a;
    --red:#ff2d20;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;height:100%;overflow:hidden;background:#8fc3ea;}
  body{font-family:"Arial Black","Arial Bold",Arial,Helvetica,sans-serif;color:#fff;}
  canvas{display:block;}
  #hud{position:fixed;inset:0;pointer-events:none;}

  /* the readout is drawn at the same resolution as the game and scaled up,
     so the type has the same chunky pixels as everything else */
  #hud2d{
    position:absolute;inset:0;width:100%;height:100%;
  }

  .splat{
    position:absolute;inset:0;opacity:0;
    background-size:cover;background-position:center;
    mix-blend-mode:multiply;
  }
  #splatWater{mix-blend-mode:screen;}


  /* ---- front end ----------------------------------------------------
     Palette from the car itself: pine-dark ground, the woody's grain,
     its cream paint, and the HUD's signal yellow. */
  :root{
    --pine:#0f2419; --pine2:#173a28; --grain:#8a5a2b; --grain2:#5e3a1a;
    --cream:#f3e6c4; --signal:#ffd23d; --tail:#e0301e; --ink:#0a0f0c;
    --display:"Russo One","Arial Black",Arial,sans-serif;
    --body:"Barlow Semi Condensed","Arial Narrow",Arial,sans-serif;
  }
  #ui{position:absolute;inset:0;pointer-events:none;}
  .screen{
    position:absolute;inset:0;display:none;pointer-events:auto;
    font-family:var(--body);color:var(--cream);
    padding:max(3vh,env(safe-area-inset-top)) max(4vw,env(safe-area-inset-right))
            max(3vh,env(safe-area-inset-bottom)) max(4vw,env(safe-area-inset-left));
    overflow:auto;
  }
  .screen.on{display:flex;}
  .screen.dim{background:linear-gradient(90deg,rgba(9,20,14,.92) 0%,rgba(9,20,14,.78) 45%,rgba(9,20,14,.35) 100%);}
  .screen.veil{background:rgba(6,14,10,.72);}
  .screen.garage{background:linear-gradient(90deg,rgba(9,20,14,.9) 0%,rgba(9,20,14,.6) 34%,rgba(9,20,14,0) 55%);}
  .left.garage .menu{gap:5px;} .left.garage .item{padding:6px 16px 5px;font-size:clamp(14px,1.35vw,18px);}
  .garnote{margin-top:12px;min-height:3.2em;font-size:15px;line-height:1.4;color:#dbe6d4;max-width:30em;}
  .garnote p{margin:0;}

  /* the logo: cream block letters on a woodgrain plank */
  .logo{font-family:var(--display);line-height:.86;transform:skewX(-9deg);transform-origin:left bottom;}
  .logo .l1{display:block;font-size:clamp(46px,9vw,118px);color:var(--cream);
    text-shadow:4px 4px 0 var(--ink),-2px -2px 0 var(--ink),2px -2px 0 var(--ink),-2px 2px 0 var(--ink);}
  .logo .plank{
    display:inline-block;margin-top:.12em;padding:.1em .45em .12em .3em;
    font-size:clamp(30px,5.6vw,72px);color:var(--signal);
    background:
      repeating-linear-gradient(90deg,rgba(0,0,0,0) 0 18px,rgba(0,0,0,.14) 18px 20px,rgba(0,0,0,0) 20px 47px),
      repeating-linear-gradient(0deg,rgba(255,220,160,.07) 0 3px,rgba(0,0,0,.09) 3px 5px,rgba(0,0,0,0) 5px 9px),
      linear-gradient(180deg,#9a6532,var(--grain) 45%,var(--grain2));
    border:4px solid var(--ink);box-shadow:6px 6px 0 var(--ink);
    text-shadow:3px 3px 0 var(--ink);
  }
  .logo .sub{display:block;margin-top:.7em;font-family:var(--body);font-weight:600;
    font-size:clamp(14px,1.6vw,19px);letter-spacing:.02em;color:#cfe0c8;transform:skewX(9deg);
    text-shadow:1px 1px 0 var(--ink);}

  #scTitle{align-items:flex-end;justify-content:flex-start;
    background:linear-gradient(0deg,rgba(9,20,14,.85) 0%,rgba(9,20,14,0) 55%);}
  #scTitle .press{
    margin-top:28px;font-family:var(--display);font-size:clamp(16px,1.8vw,22px);
    color:var(--signal);text-shadow:2px 2px 0 var(--ink);
    animation:blink 1.1s steps(2,end) infinite;
  }
  @keyframes blink{50%{opacity:0}}
  @media (prefers-reduced-motion:reduce){#scTitle .press{animation:none}}

  /* two column menus: slanted plates on the left, detail on the right */
  .cols{display:flex;gap:4vw;align-items:center;width:100%;max-width:1180px;margin:auto 0;}
  .cols > .left{flex:0 0 min(420px,46vw);}
  .cols > .right{flex:1 1 auto;min-width:0;}
  h2.head{font-family:var(--display);font-weight:400;font-size:clamp(28px,3.4vw,44px);
    margin:0 0 18px;color:var(--cream);transform:skewX(-9deg);
    text-shadow:3px 3px 0 var(--ink);}
  .menu{display:flex;flex-direction:column;gap:9px;}
  .item{
    appearance:none;display:flex;align-items:center;justify-content:space-between;gap:12px;
    width:100%;margin:0;padding:11px 20px 10px;cursor:pointer;text-align:left;
    font-family:var(--display);font-size:clamp(17px,1.7vw,22px);letter-spacing:.02em;
    color:var(--cream);background:rgba(15,36,25,.82);
    border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);
    transform:skewX(-9deg);transition:transform .08s,background .08s;
  }
  .item > *{transform:skewX(9deg);}
  .item small{font-family:var(--body);font-weight:600;font-size:.72em;letter-spacing:0;color:#b9cdb4;}
  .item.sel{color:var(--ink);background:var(--signal);transform:skewX(-9deg) translateX(10px);}
  .item.sel small{color:#3a2c08;}
  .item:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  .item.back{background:rgba(15,36,25,.55);font-size:clamp(14px,1.3vw,17px);padding:8px 18px;}
  .item.back.sel{background:var(--cream);}
  .item[disabled]{opacity:.45;cursor:default;}
  .opt .val{display:flex;align-items:center;gap:10px;}
  .opt .val b{font-weight:400;min-width:5.5em;text-align:center;}
  .opt .val .swatch{width:1.05em;height:1.05em;border-radius:3px;display:inline-block;box-shadow:inset 0 0 0 2px rgba(0,0,0,.35), 0 0 0 1px rgba(255,255,255,.35);margin-right:-4px;}
  .opt .val i{font-style:normal;opacity:.55;}
  .bar{display:inline-block;width:104px;height:12px;border:2px solid currentColor;position:relative;}
  .bar span{position:absolute;inset:1px auto 1px 1px;background:currentColor;}

  .note{max-width:34em;font-size:clamp(15px,1.35vw,18px);line-height:1.5;color:#dbe6d4;}
  .note p{margin:0 0 .8em;}
  .note.detail{margin:0;}
  .note.detail p:last-child{margin:0;}
  .hint{margin-top:18px;font-size:14px;color:#9fb49a;}
  .hint kbd{font-family:var(--display);font-size:12px;color:var(--ink);background:var(--cream);
    padding:1px 6px;border:2px solid var(--ink);margin:0 2px;}

  /* track select */
  .tracks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;}
  .tk{appearance:none;cursor:pointer;padding:8px 8px 10px;text-align:left;color:var(--cream);
    font-family:var(--display);font-size:15px;background:rgba(15,36,25,.85);
    border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);}
  .tk canvas{display:block;width:100%;aspect-ratio:1;background:#0a1a11;image-rendering:pixelated;}
  .tk span{display:block;margin-top:7px;}
  .tk small{display:block;font-family:var(--body);font-weight:600;font-size:13px;color:#a9bfa4;}
  .tk.sel{background:var(--signal);color:var(--ink);}
  .tk.sel small{color:#3a2c08;}
  .tk:focus-visible{outline:3px solid #fff;outline-offset:3px;}
  .detail{margin-top:16px;padding:14px 18px;background:rgba(10,24,16,.85);border-left:6px solid var(--signal);}
  .detail h3{margin:0 0 4px;font-family:var(--display);font-weight:400;font-size:24px;}
  .detail p{margin:0 0 10px;font-size:16px;line-height:1.45;color:#dbe6d4;}
  .facts{display:flex;flex-wrap:wrap;gap:6px 22px;font-size:15px;color:#b9cdb4;}
  .facts b{font-family:var(--display);font-weight:400;color:var(--cream);margin-left:4px;}

  /* tables: results and standings */
  table.grid{border-collapse:collapse;width:100%;max-width:640px;font-size:17px;}
  table.grid td{padding:7px 12px 6px;border-bottom:2px solid rgba(243,230,196,.12);}
  table.grid td.p{font-family:var(--display);width:2.4em;color:var(--signal);}
  table.grid td.t{font-family:var(--display);text-align:right;white-space:nowrap;}
  table.grid td.x{text-align:right;color:#9fb49a;white-space:nowrap;}
  table.grid tr.you td{background:rgba(255,210,61,.14);}
  table.grid tr.you td.n{color:var(--signal);font-weight:700;}
  .laps{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0 0;}
  .laps span{font-family:var(--display);font-size:14px;padding:4px 9px;background:rgba(10,24,16,.85);border:2px solid var(--ink);}
  .laps span.best{background:var(--signal);color:var(--ink);}
  .badge{display:inline-block;margin:10px 8px 0 0;padding:4px 10px;font-family:var(--display);
    font-size:14px;color:var(--ink);background:var(--tail);border:2px solid var(--ink);color:#fff;transform:skewX(-9deg);}
  .big{font-family:var(--display);font-size:clamp(40px,7vw,86px);line-height:1;color:var(--signal);
    transform:skewX(-9deg);text-shadow:4px 4px 0 var(--ink);margin:0 0 6px;}

  .keys2{display:grid;grid-template-columns:auto 1fr;gap:7px 18px;font-size:16px;}
  .keys2 b{font-family:var(--display);font-weight:400;color:var(--signal);white-space:nowrap;}

  #loading{position:fixed;inset:0;z-index:9;display:flex;align-items:center;justify-content:center;
    background:var(--pine);font-family:"Russo One","Arial Black",Arial,sans-serif;color:#f3e6c4;
    font-size:22px;letter-spacing:.04em;}
  #loading.gone{display:none;}

  @media (max-width:760px){
    .cols{flex-direction:column;align-items:stretch;gap:20px;}
    .cols > .left{flex-basis:auto;}
  }
  /* short windows: tighten the plates so long lists fit without scrolling */
  @media (max-height:760px){
    .menu{gap:6px;}
    .item{padding:7px 18px 6px;font-size:clamp(15px,1.5vw,19px);}
    .item.back{padding:6px 16px;}
    h2.head{margin-bottom:12px;}
    .keys2{gap:4px 16px;font-size:15px;}
  }
  @media (max-height:560px){
    .item{padding:5px 16px 4px;}
    .menu{gap:4px;}
    .keys2{font-size:14px;gap:2px 14px;}
    .logo .l1{font-size:clamp(40px,7vw,90px);}
  }
</style>
</head>
<body>
<div id="loading">LOADING</div>
<div id="hud">
  <canvas id="hud2d"></canvas>
  <div id="splatMud" class="splat"></div>
  <div id="splatWater" class="splat"></div>

  <div id="ui"></div>

  </div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";

/* ------------------------------------------------------------------ *
 *  Scene setup
 * ------------------------------------------------------------------ */
const renderer = new THREE.WebGLRenderer({antialias:false, powerPreference:"high-performance"});
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const SKY = new THREE.Color(0xa9d6f2);          // horizon haze, matched by the dome
scene.background = SKY;
scene.fog = new THREE.Fog(0xb4d8ee, 220, 1100); // linear, so the range stays readable

const camera = new THREE.PerspectiveCamera(64, window.innerWidth/window.innerHeight, 0.4, 1700);
camera.position.set(0, 6, -14);

const SUN_DIR = new THREE.Vector3(-0.62, 0.59, 0.52).normalize();
const hemi = new THREE.HemisphereLight(0xc4e2ff, 0x6a6f45, 0.92);
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xffe6c4, 1.18);
sun.position.copy(SUN_DIR).multiplyScalar(200);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
{
  const S = 62, c = sun.shadow.camera;
  c.left = -S; c.right = S; c.top = S; c.bottom = -S; c.near = 20; c.far = 420;
}
sun.shadow.bias = -0.0006;
sun.shadow.normalBias = 0.035;
scene.add(sun);
scene.add(sun.target);

/* Keep the shadow box on what the camera is looking at, and move it in
   whole shadow texels so edges don't crawl as you drive. */
const _lsX = new THREE.Vector3(), _lsY = new THREE.Vector3(), _lsC = new THREE.Vector3(), _lsF = new THREE.Vector3();
_lsX.crossVectors(new THREE.Vector3(0,1,0), SUN_DIR).normalize();
_lsY.crossVectors(SUN_DIR, _lsX).normalize();
function followShadow(){
  if(!sun.castShadow) return;
  camera.getWorldDirection(_lsF);
  _lsF.y = 0; _lsF.normalize();
  _lsC.copy(camera.position).addScaledVector(_lsF, 34);
  _lsC.y = camera.position.y - 4;
  const texel = (sun.shadow.camera.right - sun.shadow.camera.left)/sun.shadow.mapSize.x;
  const a = Math.round(_lsC.dot(_lsX)/texel)*texel;
  const b = Math.round(_lsC.dot(_lsY)/texel)*texel;
  const c = _lsC.dot(SUN_DIR);
  _lsC.set(0,0,0).addScaledVector(_lsX, a).addScaledVector(_lsY, b).addScaledVector(SUN_DIR, c);
  sun.target.position.copy(_lsC);
  sun.position.copy(_lsC).addScaledVector(SUN_DIR, 220);
  sun.target.updateMatrixWorld();
}

/* A small studio environment for anything shiny: sky above, a warm
   bright patch where the sun is, dark forest and dirt below. The car's
   paint, chrome and glass all reflect it. */
let ENV = null;
{
  const cv = document.createElement("canvas"); cv.width = 512; cv.height = 256;
  const g = cv.getContext("2d");
  const grd = g.createLinearGradient(0, 0, 0, 256);
  grd.addColorStop(0.00, "#3f78c6");
  grd.addColorStop(0.35, "#8fbde6");
  grd.addColorStop(0.49, "#d6e8f4");
  grd.addColorStop(0.51, "#46583a");
  grd.addColorStop(0.62, "#2c3a24");
  grd.addColorStop(1.00, "#3b3326");
  g.fillStyle = grd; g.fillRect(0, 0, 512, 256);
  // treeline band, so reflections break up the way they do under trees
  g.fillStyle = "#26402c";
  for(let x=0; x<512; x+=6){ const t = 6 + Math.random()*16; g.fillRect(x, 128 - t, 6, t); }
  // the sun, where SUN_DIR puts it on an equirect map
  const lon = Math.atan2(SUN_DIR.x, SUN_DIR.z), lat = Math.asin(SUN_DIR.y);
  const sx = (0.5 + lon/(2*Math.PI))*512, sy = (0.5 - lat/Math.PI)*256;
  const sg = g.createRadialGradient(sx, sy, 0, sx, sy, 60);
  sg.addColorStop(0, "rgba(255,248,225,1)"); sg.addColorStop(0.15, "rgba(255,236,190,.9)");
  sg.addColorStop(1, "rgba(255,230,180,0)");
  g.fillStyle = sg; g.fillRect(0, 0, 512, 256);
  const tex = new THREE.CanvasTexture(cv);
  tex.mapping = THREE.EquirectangularReflectionMapping;
  try{
    const pm = new THREE.PMREMGenerator(renderer);
    ENV = pm.fromEquirectangular(tex).texture;
    pm.dispose();
  }catch(e){ ENV = tex; }
}

/* ------------------------------------------------------------------ *
 *  World
 *
 *  One heightfield. Every road is stamped into it, every crossing and the
 *  ravine are carved into it, and then it is frozen. The terrain mesh is
 *  that grid, drawn triangle for triangle, and the wheels read the very
 *  same triangles. There is no second description of the ground anywhere,
 *  so there is nothing left to disagree, z fight, or step.
 *
 *  The road is not a separate ribbon any more. It is painted onto the
 *  terrain in the shader from a per vertex "distance past the road edge",
 *  which gives a clean edge without a second surface lying on the first.
 * ------------------------------------------------------------------ */
let RELIEF = 1;
function hills(x, z){
  return (Math.sin(x*0.0125)*3.1 + Math.cos(z*0.0106)*2.7 +
          Math.sin((x+z)*0.0212)*1.35 + Math.cos((x-z)*0.0089)*1.9) * RELIEF;
}
function vergeRoll(x, z){
  return Math.sin(x*0.088 + Math.cos(z*0.061)*1.6)*0.12
       + Math.cos(z*0.104 + Math.sin(x*0.047)*1.9)*0.10
       + Math.sin((x + z)*0.152)*0.075
       + Math.cos((x - z)*0.196)*0.055;
}
/* small scale roughness, only felt off the road: rutted, stony ground */
function offRoadBump(x, z){
  return Math.sin(x*0.62 + Math.cos(z*0.41)*2.1)*0.045
       + Math.sin(z*0.83 + Math.sin(x*0.29)*1.7)*0.040
       + Math.sin((x+z)*1.55)*0.022
       + Math.sin((x-z)*2.30)*0.014;
}
function smoothstep(e0,e1,v){ const t=Math.min(1,Math.max(0,(v-e0)/(e1-e0))); return t*t*(3-2*t); }
function catmull(p0,p1,p2,p3,t){
  const t2 = t*t, t3 = t2*t;
  return 0.5*(2*p1 + (-p0+p2)*t + (2*p0-5*p1+4*p2-p3)*t2 + (-p0+3*p1-3*p2+p3)*t3);
}
let GREAT_JUMP = -1;
const BED = 0.07;        // how far the road surface rides over its own profile line
let WORLD_EDGE = 430;
const SURF = {GRAVEL:0, MUD:1, WATER:2};
const paths = [];

/* ---- the circuits ----------------------------------------------------
   Each circuit is a map, drawn by hand in metres: x is east, z is north.

     ctrl      the main loop, as points the road passes through
     branches  three alternate routes. a and b are where each one leaves
               and rejoins (snapped onto the main road), via is the line
               it takes through the forest in between
     hills     [x, z, radius, height] the shape of the land the map sits
               on. Roads follow the land, so this is also the elevation
     fords     where the main road crosses water
     jumps     [[x, z], height] crests on the main road
     mud       [[x, z], [x, z]] stretches of main road gone to mud
     gorge     a ravine the main road bridges

   Branch kits use fractions along the branch itself, which do not move
   when the main loop is edited. */
const TRACKS = [
  { name:"PINE HOLLOW", after:"Suzuka", relief:1.2,
    blurb:"straight off the grid and over Pine Hollow canyon on a long high bridge, then a three-way fork",
    kit:["staircase","crest","double","tabletop","crest"],
    shape:"THE CANYON — a 25m deep gorge",
    feature:"a long bridge over a 25m deep canyon",
    ctrl:[[0,-330],[0,-260],[0,-140],[40,-60],[10,20],[-45,85],[-25,165],[35,220],
          [140,260],[260,270],[360,240],[420,170],[440,70],[430,-40],[400,-120],
          [340,-150],[300,-110],[300,-40],[250,0],[190,-30],[180,-110],[220,-200],
          [240,-290],[245,-400],[160,-480],[40,-460]],
    hills:[[250,-60,190,16],[-160,220,220,-10],[260,420,200,12]],
    jumps:[], fords:[[430,-40]],
    mud:[[[150,262],[300,262]]],
    gorge:{at:[0,-200], depth:25, reach:175, wall:36, span:42},
    branches:[
      // the trident, south line: through the middle of the fork
      {a:[-46,103], b:[440,59], via:[[49,148],[199,147],[348,120]],
       half:4.7, jumps:[], tune:0.5},
      // the trident, north line: a touch longer, with a crest
      {a:[-38,138], b:[438,95], via:[[65,179],[208,179],[349,154]],
       half:5.0, jumps:[[0.55, 26, 8, 2.2, 44]], tune:0.61},
      // the mill lane: an inside line across the south-west corner, over a
      // crest, while the road swings out round the mill
      {a:[238,-300], b:[8,-392], via:[[200,-360],[140,-405],[65,-425]],
       half:5.2, jumps:[[0.45, 22, 7, 1.8, 42]], tune:0, fast:true}
    ]},

  { name:"BEAR CREEK", after:"Spa", relief:1.7,
    blurb:"turn off the road and drive 200m up the creek itself, climbing its rapids, then four more crossings",
    kit:["rhythm","crest","kicker","tabletop","crest"],
    shape:"THE RIVER — 200m up the creek",
    feature:"a 200m run up the creek bed, over its rapids",
    ctrl:[[0,-250],[-4,-175],[26,-108],[33,-30],[35,40],[40,78],[4,150],[16,215],[60,245],[100,225],[140,150],[180,60],
          [255,-45],[360,-85],[450,20],[520,90],[600,110],[660,60],[650,-40],[590,-120],
          [500,-160],[420,-230],[360,-330],[270,-390],[150,-400],[60,-360]],
    hills:[[330,-190,200,-9],[80,120,160,10],[560,30,170,8],[30,-170,90,-4],[55,150,110,6]],
    jumps:[], fords:[[165,110],[310,-80],[648,55],[270,-390]],
    river:{from:[27,-98], to:[39,68], pools:5, down:70, up:62, downDir:[0.55,-1], upDir:[0.45,1]},
    mud:[[[440,-205],[380,-290]]],
    branches:[
      // over the top of the dip
      {a:[180,60], b:[505,75], via:[[250,52],[330,42],[420,32]],
       half:5.0, jumps:[], tune:0, fast:true},
      // inside the east bend, with its own water
      {a:[574,110], b:[480,-174], via:[[617,74],[599,-1],[553,-89]],
       half:4.7, jumps:[], fords:[0.5], tune:0.1},
      // across the south sweep
      {a:[414,-237], b:[44,-343], via:[[333,-291],[230,-332],[127,-356]],
       half:4.6, jumps:[[0.3, 24, 7, 2.3, 44]], tune:0.44}

/* ---- paths -------------------------------------------------------- */
const vec = a => new THREE.Vector3(a[0], 0, a[1]);
function makePath(ctrl, closed, halfWidth){
  const curve = new THREE.CatmullRomCurve3(ctrl, closed, "centripetal");
  const len = curve.getLength();
  const N = Math.max(32, Math.round(len/1.2));
  const pts = curve.getSpacedPoints(N);
  if(closed) pts.length = N;
  const P = {
    pts, N: pts.length, len, seg: len/(closed ? pts.length : pts.length-1), closed, baseHalf: halfWidth,
    tans: [], surf: new Uint8Array(pts.length), half: new Float32Array(pts.length),
    mainFrom: 0, mainTo: 0, index: paths.length
  };
  for(let i=0;i<P.N;i++) P.half[i] = halfWidth + Math.sin(i*0.11)*0.35 + Math.cos(i*0.037)*0.3;
  paths.push(P);
  return P;
}
function retangent(P){
  P.tans.length = 0;
  for(let i=0;i<P.N;i++){
    const a = P.pts[P.closed ? (i-1+P.N)%P.N : Math.max(0,i-1)];
    const b = P.pts[P.closed ? (i+1)%P.N : Math.min(P.N-1,i+1)];
    P.tans.push(new THREE.Vector3(b.x-a.x, 0, b.z-a.z).normalize());
  }
}
const wrapIdx = (P,i)=> P.closed ? ((Math.round(i)%P.N)+P.N)%P.N : Math.max(0, Math.min(P.N-1, Math.round(i)));
function paint(P, from, to, type){
  for(let i=from;i<=to;i++) P.surf[wrapIdx(P,i)] = type;
}
/* A kicker. The old ramp eased into a flat top (smoothstep has no slope
   at the crest), so the car left it level and just dropped off: a ledge.
   This one runs a gentle lead-in, then a curved face whose slope keeps
   steepening right up to the lip, about 15 degrees, so the car leaves it
   pointing at the sky. Behind the lip the ground falls away straight
   off, which is what tells the physics to let go. */
function ramp(P, centre, up, over, height, land, full, steep){
  /* A kicker whose lip drops onto a hill that is already falling away makes
     a face nobody could land on. The hill gives the flight on its own, so
     the kicker shrinks with the fall past it, and is gone by about 8%. */
  const seg = P.seg;
  const back = Math.max(over, Math.round(height*7/seg));   // the far side, metres -> samples
  if(!full){
    const L = Math.max(back + 8, land || 0);
    const a = P.pts[wrapIdx(P, centre)].y, b = P.pts[wrapIdx(P, centre+L)].y;
    const grade = (b - a)/(L*seg);
    height *= Math.max(0, Math.min(1, 1 + grade/0.08));
    if(height < 0.2) return;
  }
  const run  = up*seg;
  const face = Math.min(run*0.6, Math.max(7, height*(steep || 5)));   // the curved face, metres
  const lead = run - face;
  for(let k=-up;k<=0;k++){
    const s = (k+up)*seg;                                  // metres from the foot
    let y;
    if(s < lead){ const t = s/lead; y = 0.3*height*t*t*(3 - 2*t); }
    else        { const q = (s - lead)/face; y = 0.3*height + 0.7*height*q*q; }
    P.pts[wrapIdx(P, centre+k)].y += y;
  }
  for(let k=1;k<=back;k++){
    const t = k/back;
    P.pts[wrapIdx(P, centre+k)].y += height*Math.pow(1 - t, 1.5);
  }
  /* The landing dip is for flat ground. Where the road already falls away
     past the lip, the hill is the landing, and digging a dip into it as
     well made a 35-50% face that the car could only land on nose first. */
  const L = land || 0;
  if(L){
    const a = P.pts[wrapIdx(P, centre+back)].y, b = P.pts[wrapIdx(P, centre+back+L)].y;
    const grade = (b - a)/(L*seg);                      // negative: downhill
    const keep = Math.max(0, Math.min(1, 1 + grade/0.08));
    for(let k=back+1; k<=back+L; k++){
      const i = wrapIdx(P, centre+k);
      const t = (k-back)/L;
      P.pts[i].y -= keep*height*0.3*Math.sin(Math.PI*t)*(1 - t*0.35);
    }
  }
}
/* a smooth dip in the road, used for the water crossings */
function dip(P, centre, span, depth){
  for(let k=-span;k<=span;k++){
    const i = wrapIdx(P, centre+k);
    const t = k/span;
    P.pts[i].y -= depth*0.5*(1 + Math.cos(Math.PI*t));
    P.half[i] += (1 - Math.abs(t))*1.4;            // fords open out a little
  }
}
function snapTo(P, xz){
  let best = Infinity, bi = 0;
  for(let i=0;i<P.N;i++){
    const d = (P.pts[i].x-xz[0])**2 + (P.pts[i].z-xz[1])**2;
    if(d < best){ best = d; bi = i; }
  }
  return bi;
}

/* ---- routing test ----------------------------------------------------
   What the car can hold through a corner comes from the game's own
   steering authority: turn rate falls off with speed, so v = R*rate(v).
   Anything tighter than the floor is eased until it is drivable, then a
   lap is simulated so the layout can be judged rather than guessed at. */
const ROUTE_MIN_RADIUS = 18;
function cornerHoldSpeed(R){
  let v = 10;
  for(let k=0;k<24;k++){
    const rate = 2.05 * Math.min(1, v/7) * (1 - Math.min(0.5, v/44*0.55));
    v = 0.5*v + 0.5*Math.min(44, R*rate);
  }
  return v;
}
function radiiOf(P){
  // Measured over a 20m baseline. A three sample stencil picks up the jitter
  // in the sampled curve rather than the corner.
  const N = P.N, out = new Float64Array(N), W = Math.max(4, Math.round(10/P.seg));
  for(let i=0;i<N;i++){
    const a = P.tans[P.closed ? ((i-W)%N+N)%N : Math.max(0,i-W)], b = P.tans[P.closed ? (i+W)%N : Math.min(N-1,i+W)];
    let d = Math.atan2(b.x,b.z) - Math.atan2(a.x,a.z);
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    const k = Math.abs(d)/(2*W*P.seg);
    out[i] = k < 1e-5 ? 9999 : 1/k;
  }
  return out;
}
/* Smoothing bunches the samples together, so the spacing the curvature is
   measured against goes stale. Rebuild and respace after every pass. */
function respace(P){
  const stride = Math.max(1, Math.round(6/P.seg));
  const ctrl = [];
  for(let i=0;i<P.N;i+=stride) ctrl.push(P.pts[i].clone());
  const curve = new THREE.CatmullRomCurve3(ctrl, P.closed, "catmullrom", 0.5);
  const len = curve.getLength();
  const n = Math.max(32, Math.round(len/1.2));
  const pts = curve.getSpacedPoints(n);
  if(P.closed) pts.length = n;
  P.pts = pts; P.N = pts.length; P.len = len; P.seg = len/P.N;
  P.half = new Float32Array(P.N);
  P.surf = new Uint8Array(P.N);
  for(let i=0;i<P.N;i++){
    P.half[i] = P.baseHalf + Math.sin(i*0.11)*0.5 + Math.cos(i*0.037)*0.4;
  }
  retangent(P);
}
/* Tight corners are opened out until the car can hold them. Each point is
   pulled toward the average of its neighbours by an amount that fades in and
   out along the road. The old pass moved only the points on the tight bit and
   left their neighbours where they were; the step between the two made a new
   kink, which the next pass then chased, and the road ended up zig zagging
   through the bend (and the rivals, following it exactly, weaving with it). */
function easeCorners(P, floor){
  for(let pass=0; pass<60; pass++){
    const R = radiiOf(P);
    let tight = 0;
    for(let i=0;i<P.N;i++) if(R[i] < floor) tight++;
    if(!tight) return pass;
    const want = new Array(P.N);
    for(let i=0;i<P.N;i++) want[i] = 1 - smoothstep(floor, floor*1.6, R[i]);
    smoothAlong(want, true, 10);
    const nx = new Float64Array(P.N), nz = new Float64Array(P.N);
    for(let i=0;i<P.N;i++){
      const k0 = Math.min(1, want[i]*2);
      if(k0 <= 0.001){ nx[i] = P.pts[i].x; nz[i] = P.pts[i].z; continue; }
      let sx = 0, sz = 0, w = 0;
      for(let k=-16;k<=16;k++){
        const j = ((i+k)%P.N+P.N)%P.N;
        const wt = 1 - Math.abs(k)/17;
        sx += P.pts[j].x*wt; sz += P.pts[j].z*wt; w += wt;
      }
      nx[i] = P.pts[i].x*(1-k0) + (sx/w)*k0; nz[i] = P.pts[i].z*(1-k0) + (sz/w)*k0;
    }
    for(let i=0;i<P.N;i++){ P.pts[i].x = nx[i]; P.pts[i].z = nz[i]; }
    respace(P);
  }
  return 60;
}
function routingTest(P){
  const N = P.N, seg = P.seg, R = radiiOf(P);
  const TOTALS = [24.0, 15.5, 10.8, 7.7, 5.5];
  const torque = r => { const x = Math.max(0, Math.min(1, (r-700)/5600));
                        return 0.62 + 1.15*x - 0.95*x*x; };
  const drive = v => {
    let best = 0;
    for(let g=1; g<=5; g++){
      const rpm = Math.max(900, v/0.40*TOTALS[g-1]*9.5493);
      if(rpm > 6300) continue;
      best = Math.max(best, Math.min(11.0, 0.62*torque(rpm)*TOTALS[g-1]));
    }
    return best;
  };
  const v = new Float64Array(N);
  for(let i=0;i<N;i++) v[i] = Math.min(44, cornerHoldSpeed(R[i]));
  for(let pass=0; pass<3; pass++){
    for(let i=N-1;i>=0;i--){
      const nx2 = (i+1)%N;
      v[i] = Math.min(v[i], Math.sqrt(Math.max(0, v[nx2]*v[nx2] + 2*22*seg)));
    }
    for(let i=0;i<N;i++){
      const pv = v[(i-1+N)%N];
      const a = drive(pv) - (0.0006*pv*pv + 0.30 + pv*0.02);
      v[i] = Math.min(v[i], Math.sqrt(Math.max(0, pv*pv + 2*a*seg)));
    }
  }
  let t = 0, flat = 0;
  for(let i=0;i<N;i++){ t += seg/Math.max(4, v[i]); if(v[i] > 42) flat++; }
  const corners = {slow:0, medium:0, fast:0, total:0};
  let longest = 0, run = 0, i2 = 0;
  while(i2 < N){
    if(R[i2] > 120){ run += seg; longest = Math.max(longest, run); i2++; continue; }
    run = 0;
    let j = i2, rmin = R[i2];
    while(j+1 < N && R[j+1] < 150){ j++; rmin = Math.min(rmin, R[j]); }
    corners.total++;
    if(rmin < 26) corners.slow++;
    else if(rmin < 45) corners.medium++;
    else corners.fast++;
    i2 = j+1;
  }
  return { lap:t, corners, longest, minRadius:Math.min(...R), v:Array.from(v),
           slowest:Math.min(...v), fastest:Math.max(...v),
           flatOut:flat/N, length:P.len };
}

/* open paths get their corners eased too, with both ends pinned where they
   meet the main road */
function radiiOpen(P){
  const N = P.N, out = new Float64Array(N), W = Math.max(4, Math.round(10/P.seg));
  for(let i=0;i<N;i++){
    const ia = Math.max(0, i-W), ib = Math.min(N-1, i+W);
    const a = P.tans[ia], b = P.tans[ib];
    let d = Math.atan2(b.x,b.z) - Math.atan2(a.x,a.z);
    while(d >  Math.PI) d -= Math.PI*2;
    while(d < -Math.PI) d += Math.PI*2;
    const k = Math.abs(d)/(Math.max(1, ib-ia)*P.seg);
    out[i] = k < 1e-5 ? 9999 : 1/k;
  }
  return out;
}
function respaceOpen(P){
  const ctrl = [];
  for(let i=0;i<P.N-1;i+=5) ctrl.push(P.pts[i].clone());
  ctrl.push(P.pts[P.N-1].clone());
  const curve = new THREE.CatmullRomCurve3(ctrl, false, "centripetal");
  const len = curve.getLength(), n = Math.max(32, Math.round(len/1.2));
  P.pts = curve.getSpacedPoints(n); P.N = P.pts.length; P.len = len; P.seg = len/(P.N-1);
  P.half = new Float32Array(P.N); P.surf = new Uint8Array(P.N);
  for(let i=0;i<P.N;i++) P.half[i] = P.baseHalf + Math.sin(i*0.11)*0.35 + Math.cos(i*0.037)*0.3;
  retangent(P);
}
function easeOpen(P, floor){
  const PIN = Math.round(26/P.seg);
  respaceOpen(P);
  for(let pass=0; pass<30; pass++){
    const R = radiiOpen(P);
    let tight = 0;
    for(let i=PIN;i<P.N-PIN;i++) if(R[i] < floor) tight++;
    if(!tight) return;
    // how much each point wants moving, spread along the road so the
    // smoothing fades in and out instead of kinking the line
    const want = new Float64Array(P.N);
    for(let i=PIN;i<P.N-PIN;i++) want[i] = 1 - smoothstep(floor, floor*1.5, R[i]);
    const wsm = Array.from(want); smoothAlong(wsm, false, 8);
    const nx = P.pts.map(p=>p.x), nz = P.pts.map(p=>p.z);
    for(let i=PIN;i<P.N-PIN;i++){
      const k0 = Math.min(1, wsm[i]*2);
      if(k0 <= 0) continue;
      let sx = 0, sz = 0, w = 0;
      for(let k=-12;k<=12;k++){
        const j = Math.max(0, Math.min(P.N-1, i+k)), wt = 1 - Math.abs(k)/13;
        sx += P.pts[j].x*wt; sz += P.pts[j].z*wt; w += wt;
      }
      nx[i] = nx[i]*(1-k0) + (sx/w)*k0; nz[i] = nz[i]*(1-k0) + (sz/w)*k0;
    }
    for(let i=0;i<P.N;i++){ P.pts[i].x = nx[i]; P.pts[i].z = nz[i]; }
    respaceOpen(P);
  }
}

/* box blur along a path, three passes, which is as good as a Gaussian */
function smoothAlong(arr, closed, r){
  const N = arr.length;
  for(let pass=0; pass<3; pass++){
    const src = arr.slice();
    for(let i=0;i<N;i++){
      let s = 0, n = 0;
      for(let k=-r;k<=r;k++){
        let j = i+k;
        if(closed) j = ((j%N)+N)%N; else j = Math.max(0, Math.min(N-1, j));
        s += src[j]; n++;
      }
      arr[i] = s/n;
    }
  }
}

const TRACK_ID = Math.max(0, Math.min(TRACKS.length-1,
  parseInt((location.hash.match(/track=(\d+)/) || [])[1] || "0", 10) || 0));
const TRACK = TRACKS[TRACK_ID];
const FALL = TRACK.season === "fall";
/* the fall palette: maples red, sugar maples orange, birch and aspen gold */
function fallTint(c, rnd){
  const r = (rnd || Math.random)();
  if(r < 0.30)      c.setHSL(0.995 + Math.random()*0.03, 0.72, 0.46 + Math.random()*0.08);
  else if(r < 0.64) c.setHSL(0.055 + Math.random()*0.03, 0.85, 0.52 + Math.random()*0.08);
  else if(r < 0.90) c.setHSL(0.115 + Math.random()*0.03, 0.85, 0.56 + Math.random()*0.08);

}
/* for tuning: #debug&tune=0.1,0.4,0.2 overrides each branch's mud */
const TUNE_OVERRIDE = /debug/.test(location.hash) && /tune=/.test(location.hash)
  ? location.hash.match(/tune=([\d.,]+)/)[1].split(",").map(Number) : null;
RELIEF = TRACK.relief;
if(FALL){ scene.fog.color.set(0xd8cdb4); }
/* the winter and desert circuits: their own air, light and ground */
const WINTER = TRACK.season === "winter", DESERT = TRACK.season === "desert";
const FROZEN = WINTER;               // in the Winter Cup every ford, creek and lake is ice
if(WINTER){
  scene.fog.color.set(0xdfe6ee); SKY.set(0xd2dfeb); scene.fog.near = 180; scene.fog.far = 950;
  hemi.color.set(0xdce8f8); hemi.groundColor.set(0x8a94a2); hemi.intensity = 0.9;
  sun.color.set(0xfff2e2); sun.intensity = 1.05;
}
if(DESERT){

  hemi.color.set(0xf4e2c4); hemi.groundColor.set(0x9a6a44); hemi.intensity = 0.95;
  sun.color.set(0xffdcae); sun.intensity = 1.3;

/* The maps are drawn wherever was convenient; the world is built around
   the origin, so move the whole map (every coordinate in it) to sit there. */
{
  let x0=Infinity, x1=-Infinity, z0=Infinity, z1=-Infinity;
  TRACK.ctrl.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); z0=Math.min(z0,p[1]); z1=Math.max(z1,p[1]); });
  TRACK.branches.forEach(b=> b.via.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); z0=Math.min(z0,p[1]); z1=Math.max(z1,p[1]); }));
  const ox = Math.round((x0+x1)/2), oz = Math.round((z0+z1)/2);
  TRACK._ox = ox; TRACK._oz = oz;
  const mv = p=> [p[0]-ox, p[1]-oz];
  TRACK.ctrl = TRACK.ctrl.map(mv);
  TRACK.hills = TRACK.hills.map(h=> [h[0]-ox, h[1]-oz, h[2], h[3]]);
  TRACK.fords = (TRACK.fords||[]).map(mv);
  TRACK.jumps = (TRACK.jumps||[]).map(j=> [mv(j[0]), j[1]]);
  if(TRACK.bigJump) TRACK.bigJump = [mv(TRACK.bigJump[0]), TRACK.bigJump[1]];
  TRACK.mud = (TRACK.mud||[]).map(m=> [mv(m[0]), mv(m[1])]);
  if(TRACK.gorge) TRACK.gorge = Object.assign({}, TRACK.gorge, {at: mv(TRACK.gorge.at)});
  if(TRACK.drop)  TRACK.drop  = Object.assign({}, TRACK.drop,  {at: mv(TRACK.drop.at)});
  if(TRACK.town)  TRACK.town  = Object.assign({}, TRACK.town,  {at: mv(TRACK.town.at)});
  if(TRACK.river) TRACK.river = Object.assign({}, TRACK.river, {from: mv(TRACK.river.from), to: mv(TRACK.river.to)});
  TRACK.bigJumps = (TRACK.bigJumps||[]).map(j=> [mv(j[0]), j[1]]);
  ["bowl","lake","washout","pit","dunes"].forEach(k=>{ if(TRACK[k]) TRACK[k] = Object.assign({}, TRACK[k], {at: mv(TRACK[k].at)}); });
  ["canyon","gallery"].forEach(k=>{ if(TRACK[k]) TRACK[k] = Object.assign({}, TRACK[k], {from: mv(TRACK[k].from), to: mv(TRACK[k].to)}); });
  TRACK.washes = (TRACK.washes||[]).map(mv);
  TRACK.flats = (TRACK.flats||[]).map(f=> mv([f[0], f[1]]).concat([f[2]]));
  TRACK.branches = TRACK.branches.map(b=> Object.assign({}, b, {a: mv(b.a), b: mv(b.b), via: b.via.map(mv)}));
}

/* the land the map is laid on, before any road touches it */
function macro(x, z){
  let h = hills(x, z);
  const H = TRACK.hills;
  for(let k=0;k<H.length;k++){
    const dx = x-H[k][0], dz = z-H[k][1];
    h += H[k][3]*Math.exp(-(dx*dx + dz*dz)/(H[k][2]*H[k][2]));
  }
  /* the escarpment: behind the edge (u > 0) the land is lifted by the full
     height, then eases back down a long ramp; in front it falls away in six
     metres. v is across the road; the ridge dies off beyond its width. */
  if(DROP.on){
    const dx = x - DROP.x, dz = z - DROP.z;
    const u = -(dx*DROP.tx + dz*DROP.tz), v = Math.abs(-dx*DROP.tz + dz*DROP.tx);
    h += DROP.h*smoothstep(-6, 0, u)*(1 - smoothstep(DROP.top, DROP.top + DROP.back, u))
                *(1 - smoothstep(DROP.width, DROP.width + 60, v));
  }
  /* levelled ground (the fairground) */
  for(let k=0;k<FLATS.length;k++){
    const F = FLATS[k], d = Math.hypot(x - F[0], z - F[1]);
    if(d < F[2] && F[3] !== null){ const w = 1 - smoothstep(F[2]*0.6, F[2], d); h = h*(1 - w) + F[3]*w; }
  }
  /* the lake: a basin sunk below a level taken from the lowest point of its
     shore, so the water can never spill over */
  if(LAKE.on){
    const e = Math.hypot((x - LAKE.x)/LAKE.rx, (z - LAKE.z)/LAKE.rz);
    if(e < 1.1){
      const w = 1 - smoothstep(0.72, 1.02, e + Math.sin(x*0.03 + z*0.05)*0.03);
      /* frozen, the lake is a flat sheet of ice you can drive anywhere on */
      h = Math.min(h, h*(1 - w) + (LAKE.frozen ? LAKE.level : LAKE.level - 4.5)*w);
    }
  }
  /* the quarry: benches cut down into the ground, a flat floor at the bottom */
  if(PIT.on){
    const d = Math.hypot(x - PIT.x, z - PIT.z);
    if(d < PIT.r*1.08){
      const f = Math.max(0, Math.min(1, (1 - d/PIT.r)/PIT.span));
      const n = PIT.benches, sN = f*n, k = Math.floor(sN), fr = sN - k;
      const cut = PIT.depth*Math.min(1, (k + smoothstep(0.55, 0.95, fr))/n);
      /* The lip starts at the land's own height and only settles onto the
         pit's level over the first benches. Forcing the whole rim to one
         height left a kink wherever the land sat above or below it, and
         the road coming over it drew ink lines across the sand. */
      const base = h + (PIT.top - h)*smoothstep(0.02, 0.40, f);
      const w = 1 - smoothstep(PIT.r*0.98, PIT.r*1.06, d);
      h = h*(1 - w) + (base - cut)*w;
    }
  }
  /* the dune sea: long ridges with a steep lee face, running across the
     wind, swelling in from the edge of the field */
  if(DUNE.on){
    const dx = x - DUNE.x, dz = z - DUNE.z, d = Math.hypot(dx, dz);
    if(d < DUNE.r){
      const m = 1 - smoothstep(DUNE.r*0.62, DUNE.r, d);
      const u = x*0.8 + z*0.6, v = -x*0.6 + z*0.8;
      const ph = u*2*Math.PI/DUNE.wave + Math.sin(v*0.013)*1.3 + Math.sin(v*0.031 + 2)*0.5;
      const f = ph/(2*Math.PI) - Math.floor(ph/(2*Math.PI));          // 0..1 along one dune
      const ridge = f < 0.72 ? smoothstep(0, 0.72, f) : 1 - smoothstep(0.72, 1, f);   // long windward, short lee
      h += DUNE.amp*m*(ridge - 0.45) + DUNE.amp*0.12*m*Math.sin(v*0.05 + u*0.02);
    }
  }
  /* the slot canyon: walls standing up either side of the road through it */
  if(CANYON.on) h += canyonWall(x, z);
  /* the hilltop the village sits on, levelled to the summit */
  if(TOWN.on){
    const d = Math.hypot(x - TOWN.x, z - TOWN.z);
    if(d < TOWN.r){
      const w = 1 - smoothstep(TOWN.r*0.5, TOWN.r, d);
      h = h*(1 - w) + TOWN.top*w;
    }
  }
  return h;
}

/* the thumbnails want a closed curve through the map, nothing more */
function trackCtrl(t){
  const curve = new THREE.CatmullRomCurve3(t.ctrl.map(vec), true, "centripetal");
  return curve.getSpacedPoints(160).slice(0, 160);
}

/* ---- the main loop ---- */
const MAIN = makePath(TRACK.ctrl.map(vec), true, 5.7);
retangent(MAIN);
const EASE_PASSES = easeCorners(MAIN, TRACK.minR || ROUTE_MIN_RADIUS);
MAIN.mainFrom = 0; MAIN.mainTo = MAIN.N;

/* ---- the set pieces ------------------------------------------------------
   Each circuit has one thing none of the others has:
     drop    an escarpment: the land climbs a long ramp to an edge, and the
             road launches off it and falls 30m (100ft) onto a landing hill
     town    a flat hilltop the road winds up to, with a village on it
     river   a stretch where the road *is* the creek bed, in pools that
             step up through rapids
     gorge   (the canyon and its bridge, further down)
   CALM lists the stretches the rough stages keep off: [station, metres]. */
const CALM = [];
const PITS = [], SPOTS = [];          // SPOTS: small things jumps keep a little clear of
const DROP = {on:false};
if(TRACK.drop){
  const D = TRACK.drop, i = snapTo(MAIN, D.at), p = MAIN.pts[i], t = MAIN.tans[i];
  Object.assign(DROP, {on:true, i, x:p.x, z:p.z, tx:t.x, tz:t.z,
                       h:D.height, top:D.top, back:D.back, width:D.width});
  CALM.push([i, 80], [wrapIdx(MAIN, i + Math.round(70/MAIN.seg)), 80], [wrapIdx(MAIN, i - Math.round(60/MAIN.seg)), 40]);
}
const TOWN = {on:false, top:null};
const DUNE = {on:false};
if(TRACK.dunes) Object.assign(DUNE, {on:true, x:TRACK.dunes.at[0], z:TRACK.dunes.at[1], r:TRACK.dunes.r, amp:TRACK.dunes.amp, wave:TRACK.dunes.wave});
/* The slot canyon follows the road between two stations. The walls are part
   of the land itself, so they are drawn, shaded and stood on like any hill;
   the car is kept off them the way the bridge parapets keep it on the deck. */
const CANYON = {on:false};
/* Slot Canyon: a tableland of layered red rock, 20m high, with eroded
   ragged edges, and the road cut down through it in a slot. The slot is
   carved along the road a long way either side, so where the tableland
   thins out at each end the road runs out through a proper canyon mouth
   instead of meeting a wall. */
if(TRACK.canyon){
  let a = snapTo(MAIN, TRACK.canyon.from), b = snapTo(MAIN, TRACK.canyon.to);
  if(b < a) b += MAIN.N;
  const ext = Math.round(170/MAIN.seg), step = Math.max(1, Math.round(3/MAIN.seg));
  const pl = [];
  let coreA = -1, coreB = -1;
  for(let k=a - ext; k<=b + ext; k+=step){
    if(coreA < 0 && k >= a) coreA = pl.length;
    if(k <= b) coreB = pl.length;
    const p = MAIN.pts[wrapIdx(MAIN, k)]; pl.push([p.x, p.z]);
  }
  let x0=Infinity, x1=-Infinity, z0=Infinity, z1=-Infinity;
  pl.forEach(p=>{ x0=Math.min(x0,p[0]); x1=Math.max(x1,p[0]); z0=Math.min(z0,p[1]); z1=Math.max(z1,p[1]); });
  Object.assign(CANYON, {on:true, a, b, pl, coreA, coreB, H:TRACK.canyon.height || 20, len:(b - a)*MAIN.seg,
                         box:[x0 - 150, x1 + 150, z0 - 150, z1 + 150]});
  // no jumps or pits in the slot, but its floor keeps its sand and stones ("soft")
  for(let k=a - Math.round(60/MAIN.seg); k<=b + Math.round(60/MAIN.seg); k+=6) CALM.push([wrapIdx(MAIN, k), 25, "soft"]);
}
/* how far the foot of the slot's wall stands from the road's line, along
   the canyon: it pinches into squeezes and opens into chambers */
function canyonFoot(s){ return Math.max(7.3, 9.4 + 2.5*Math.sin(s*0.019 + 0.6) + 1.3*Math.sin(s*0.052 + 2.1)); }
/* where a point is against the canyon: [distance from the road's line,
   metres along the canyon's core, distance from the core], or null */
function canyonUV(x, z){
  const B = CANYON.box;
  if(x < B[0] || x > B[1] || z < B[2] || z > B[3]) return null;
  const pl = CANYON.pl;
  let best = Infinity, bestCore = Infinity, along = 0, run = 0;
  for(let k=0;k<pl.length-1;k++){
    const ax = pl[k][0], az = pl[k][1], ex = pl[k+1][0] - ax, ez = pl[k+1][1] - az, L2 = ex*ex + ez*ez, L = Math.sqrt(L2);
    let t = L2 ? ((x - ax)*ex + (z - az)*ez)/L2 : 0; t = Math.max(0, Math.min(1, t));
    const d = (x - ax - ex*t)**2 + (z - az - ez*t)**2;
    if(d < best) best = d;
    if(k >= CANYON.coreA && k < CANYON.coreB && d < bestCore){ bestCore = d; along = run - 0 + t*L; }
    if(k >= CANYON.coreA) run += L;
  }
  return [Math.sqrt(best), along, Math.sqrt(bestCore)];
}
/* how much tableland stands here, 0 to 1, with a ragged eroded rim */
function canyonPlateau(x, z, uv){
  const rim = 95 + 28*Math.sin(x*0.021 + z*0.013) + 16*Math.sin(x*0.057 - z*0.049 + 1.7) + 8*Math.sin(z*0.11 + x*0.03);
  return 1 - smoothstep(rim - 22, rim, uv[2]);
}
function canyonWall(x, z){
  const uv = canyonUV(x, z);
  if(!uv) return 0;
  const plat = canyonPlateau(x, z, uv);
  if(plat <= 0) return 0;
  const d = uv[0], s = uv[1];
  const W0 = canyonFoot(s);                                   // the foot of the wall
  // the slot: one sheer wall (the sculpted rock is drawn over it), then a
  // last low step back to the top of the tableland
  const slot = 0.85*smoothstep(W0 + 0.8, W0 + 3.6, d) + 0.15*smoothstep(W0 + 6, W0 + 10, d);
  let h = CANYON.H*plat*slot;
  // the rock lies in beds: the rim steps down in terraces as it erodes
  const bed = 4.2, q = h/bed, f = q - Math.floor(q);
  h = (Math.floor(q) + smoothstep(0.55, 0.95, f))*bed;
  // weathered, uneven tops
  h += plat*slot*(0.6*Math.sin(x*0.09 + z*0.07) + 0.4*Math.sin(x*0.23 - z*0.19));
  return h;
}
/* 1 in the slot, where the walls stand close either side of the road */
function canyonAt(x, z){
  if(!CANYON.on) return 0;
  const uv = canyonUV(x, z);
  if(!uv) return 0;
  return canyonPlateau(x, z, uv)*(1 - smoothstep(22, 40, uv[0]));
}
/* The avalanche gallery: a roofed stretch of road along the mountainside */
const GALLERY = {on:false};
if(TRACK.gallery){
  let a = snapTo(MAIN, TRACK.gallery.from), b = snapTo(MAIN, TRACK.gallery.to);
  if(b < a) b += MAIN.N;
  Object.assign(GALLERY, {on:true, a, b});
  for(let k=a - Math.round(30/MAIN.seg); k<=b + Math.round(30/MAIN.seg); k+=6) CALM.push([wrapIdx(MAIN, k), 25]);
}
(TRACK.washes || []).forEach(w=> SPOTS.push([snapTo(MAIN, w), 35]));
const FLATS = [];
const LAKE = {on:false};
const PIT = {on:false};
const BOWL = {on:false};
(TRACK.flats || []).forEach(f=>{ const F = [f[0], f[1], f[2], null]; F[3] = macro(f[0], f[1]); FLATS.push(F); });
if(TRACK.lake){
  const L = TRACK.lake;
  Object.assign(LAKE, {x:L.at[0], z:L.at[1], rx:L.rx, rz:L.rz});
  let lo = Infinity;
  for(let k=0;k<72;k++){
    const a = k/72*Math.PI*2;
    lo = Math.min(lo, macro(LAKE.x + Math.cos(a)*LAKE.rx*1.06, LAKE.z + Math.sin(a)*LAKE.rz*1.06));
  }
  LAKE.level = lo - 0.6;
  LAKE.frozen = !!(L.frozen && FROZEN);
  LAKE.on = true;
}
if(TRACK.pit){
  const Q = TRACK.pit;
  Object.assign(PIT, {x:Q.at[0], z:Q.at[1], r:Q.r, depth:Q.depth, benches:Q.benches, span:1 - (Q.floor || 0.28)});
  let sum = 0;
  for(let k=0;k<24;k++){ const a = k/24*Math.PI*2; sum += macro(PIT.x + Math.cos(a)*PIT.r, PIT.z + Math.sin(a)*PIT.r); }
  PIT.top = sum/24;
  PIT.on = true;
  for(let i=0;i<MAIN.N;i+=5){
    const p = MAIN.pts[i];
    if(Math.hypot(p.x - PIT.x, p.z - PIT.z) < PIT.r + 10) CALM.push([i, 25]);
  }
}
if(TRACK.bowl){
  const B = TRACK.bowl;
  Object.assign(BOWL, {on:true, x:B.at[0], z:B.at[1], r:B.r, bank:B.bank});
  for(let i=0;i<MAIN.N;i+=4){
    const p = MAIN.pts[i];
    if(Math.hypot(p.x - BOWL.x, p.z - BOWL.z) < BOWL.r + 40) CALM.push([i, 30]);
  }
}
if(TRACK.lake){
  for(let i=0;i<MAIN.N;i+=5){
    const p = MAIN.pts[i];
    if(Math.hypot((p.x - LAKE.x)/LAKE.rx, (p.z - LAKE.z)/LAKE.rz) < 1.25) CALM.push([i, 25]);
  }
}
if(TRACK.town){
  Object.assign(TOWN, {x:TRACK.town.at[0], z:TRACK.town.at[1], r:TRACK.town.r,
                       name:TRACK.town.name || "ASH RIDGE", western:!!TRACK.town.western});
  TOWN.top = macro(TOWN.x, TOWN.z);          // the summit, before it is levelled
  TOWN.on = true;
  for(let i=0;i<MAIN.N;i+=4){
    const p = MAIN.pts[i];
    if(Math.hypot(p.x - TOWN.x, p.z - TOWN.z) < TOWN.r + 20) CALM.push([i, 30]);
  }
}
(TRACK.bigJumps || []).forEach(j=> CALM.push([snapTo(MAIN, j[0]), 75]));
if(TRACK.river){
  let a = snapTo(MAIN, TRACK.river.from), b = snapTo(MAIN, TRACK.river.to);
  if(b < a) b += MAIN.N;
  for(let k=a - Math.round(40/MAIN.seg); k<=b + Math.round(40/MAIN.seg); k+=6) CALM.push([wrapIdx(MAIN, k), 30]);
}

/* More going on round every lap: extra water crossings (dry washes in the
   desert), and mud pits (sand traps in the desert, slush in the snow),
   placed on plain road well clear of everything that has to stay put. */
if(!TRACK.test){
  const N = MAIN.N, seg = MAIN.seg, R = radiiOf(MAIN);
  const taken = [[0, 150], [N - 1, 60]];
  (TRACK.fords || []).forEach(f=> taken.push([snapTo(MAIN, f), 110]));
  (TRACK.washes || []).forEach(f=> taken.push([snapTo(MAIN, f), 110]));
  (TRACK.jumps || []).forEach(j=> taken.push([snapTo(MAIN, j[0]), 90]));
  if(TRACK.gorge) taken.push([snapTo(MAIN, TRACK.gorge.at), TRACK.gorge.span + 80]);
  CALM.forEach(c=> taken.push([c[0], c[1] + 40]));
  TRACK.branches.forEach(b=>{ taken.push([snapTo(MAIN, b.a), 90]); taken.push([snapTo(MAIN, b.b), 90]); });
  const gap = (a, b)=>{ const d = Math.abs(a - b) % N; return Math.min(d, N - d)*seg; };
  const pick = (reach, minR, clearM)=>{
    let best = -1, bs = -Infinity;
    for(let i=0;i<N;i+=4){
      let ok = true;
      for(let k=-Math.round(reach/seg); k<=Math.round(reach/seg); k+=3) if(R[((i+k)%N+N)%N] < minR){ ok = false; break; }
      if(!ok) continue;
      let c = Infinity; for(const t of taken) c = Math.min(c, gap(i, t[0]) - t[1]);
      if(c < clearM) continue;
      const sc = c + Math.random()*40;
      if(sc > bs){ bs = sc; best = i; }
    }
    return best;
  };
  const want = DESERT ? 0 : Math.max(0, 2 - (TRACK.fords || []).length);
  for(let k=0;k<want;k++){ const i = pick(35, 70, 0); if(i < 0) break;
    const p = MAIN.pts[i]; TRACK.fords = (TRACK.fords || []).concat([[p.x, p.z]]); taken.push([i, 120]); }
  if(DESERT) for(let k=(TRACK.washes || []).length; k<3; k++){ const i = pick(25, 50, 0); if(i < 0) break;
    const p = MAIN.pts[i]; TRACK.washes = (TRACK.washes || []).concat([[p.x, p.z]]); taken.push([i, 110]); }
  for(let k=0;k<3;k++){ const i = pick(18, 35, 0); if(i < 0) break; PITS.push(i); taken.push([i, 120]); SPOTS.push([i, 25]); }
}
/* how much ice is under a point: the frozen lake, shore to shore */
function iceAt(x, z){
  if(!LAKE.on || !LAKE.frozen) return 0;
  const e = Math.hypot((x - LAKE.x)/LAKE.rx, (z - LAKE.z)/LAKE.rz);
  return 1 - smoothstep(0.93, 1.0, e);
}
/* the road follows the land, smoothed so it climbs at a grade a road would */
function profileFromLand(P){
  const y = P.pts.map(p=> macro(p.x, p.z));
  smoothAlong(y, P.closed, Math.round(24/P.seg));
  P.pts.forEach((p,i)=> p.y = y[i]);
}
profileFromLand(MAIN);
/* the causeway: across the lake the road is held a metre over the water */
function causeway(P){
  if(!LAKE.on || LAKE.frozen) return;
  const lift = new Float64Array(P.N);
  for(let i=0;i<P.N;i++){
    const p = P.pts[i], e = Math.hypot((p.x - LAKE.x)/LAKE.rx, (p.z - LAKE.z)/LAKE.rz);
    const want = LAKE.level + 1.1;
    lift[i] = Math.max(0, want - p.y)*(1 - smoothstep(1.02, 1.3, e));
  }
  const sm = Array.from(lift); smoothAlong(sm, P.closed, Math.round(10/P.seg));
  for(let i=0;i<P.N;i++) P.pts[i].y += Math.max(lift[i], sm[i]);
}
causeway(MAIN);
/* banking: through the Bowl the road leans into the turn, the outside edge
   raised. bank is the rise per metre across the road, signed so it always
   lifts the outside of the bend. */
paths.forEach(P=> P.bank = null);
if(BOWL.on){
  const P = MAIN, W = Math.max(3, Math.round(8/P.seg));
  P.bank = new Float32Array(P.N);
  for(let i=0;i<P.N;i++){
    const p = P.pts[i], d = Math.hypot(p.x - BOWL.x, p.z - BOWL.z);
    const w = 1 - smoothstep(BOWL.r + 8, BOWL.r + 30, d);
    if(w <= 0) continue;
    const a = P.tans[wrapIdx(P, i - W)], b = P.tans[wrapIdx(P, i + W)], t = P.tans[i];
    const left = (b.x - a.x)*(-t.z) + (b.z - a.z)*t.x;          // + turning left
    if(Math.abs(left) < 0.02) continue;
    P.bank[i] = -Math.sign(left)*BOWL.bank*w;                    // inside (the turn side) goes down
  }
  const sm = Array.from(P.bank); smoothAlong(sm, true, Math.round(10/P.seg));
  P.bank = Float32Array.from(sm);
}

/* ---- the alternate routes ----
   Each one leaves along the main road's own heading, drifts a few metres
   aside, runs its own line through the trees and merges back the same way,
   so a fork is a Y and not a T. */
const BRANCHES = [];
const mainAt = s => MAIN.pts[wrapIdx(MAIN, s)];
TRACK.branches.forEach(def=>{
  const A = snapTo(MAIN, def.a), B = snapTo(MAIN, def.b);
  const seg = MAIN.seg, lead = Math.round(30/seg), back = Math.round(12/seg);
  const off = (s, toward)=>{
    const p = mainAt(s), t = MAIN.tans[wrapIdx(MAIN, s)];
    const nx = -t.z, nz = t.x;
    const side = Math.sign((toward[0]-p.x)*nx + (toward[1]-p.z)*nz) || 1;
    return new THREE.Vector3(p.x + nx*side*4.5, 0, p.z + nz*side*4.5);
  };
  const ctrl = [mainAt(A-back).clone(), mainAt(A).clone(), off(A+lead, def.via[0])]
    .concat(def.via.map(vec))
    .concat([off(B-lead, def.via[def.via.length-1]), mainAt(B).clone(), mainAt(B+back).clone()]);
  ctrl.forEach(p=> p.y = 0);
  const P = makePath(ctrl, false, def.half || 4.8);
  retangent(P);
  easeOpen(P, 17);
  let span = B - A; if(span < 0) span += MAIN.N;
  P.mainFrom = A - back; P.mainTo = A - back + span + 2*back;
  P.splitAt = A;
  P.def = def;
  BRANCHES.push(P);
});

/* ---- jumps --------------------------------------------------------------
   Every track gets a kit of jumps on top of the ones drawn into its map,
   placed where the road runs straight enough to fly and land on, and as
   far from everything else as the lap allows.

     kicker     a curved ramp that throws you up off its lip
     crest      a rounded rise; take it quick and it throws you
     double     two kickers one after the other
     tabletop   off a kicker lip, land on the table or the down ramp
     drop       a long gentle rise that ends at a ledge
     rhythm     four rollers in a row, timed to the car
     staircase  three ledges, one after another, down the hill
     ledge      one big ledge, the tall version of a drop           */
const JUMP_LEN = { kicker:100, crest:70, double:150, tabletop:115, drop:95,
                   rhythm:150, staircase:170, ledge:120 };
function shapeJump(P, at, type){
  const seg = P.seg, add = (m0, m1, fn)=>{
    for(let k=Math.round(m0/seg); k<=Math.round(m1/seg); k++){
      P.pts[wrapIdx(P, at+k)].y += fn(k*seg);
    }
  };
  const hump = (c, h, L)=> s=> Math.abs(s-c) < L/2 ? h*0.5*(1 + Math.cos(Math.PI*(s-c)/(L/2))) : 0;
  /* a ledge still drops away, but the last 6m curl up into a small kick so
     the car leaves it nose up and flies off rather than falling off */
  const ledge = (c, h, rise)=> s=>{
    if(s < c - rise || s > c + 2.6) return 0;
    if(s <= c){
      const s0 = s - (c - rise), lead = rise - 6;
      if(s0 < lead){ const t = s0/lead; return 0.7*h*t*t*(3 - 2*t); }
      const q = (s0 - lead)/6; return 0.7*h + 0.3*h*q*q;
    }
    return h*(1 - (s - c)/2.6);                     // the face of the ledge
  };
  switch(type){
    case "kicker":   ramp(P, at, 30, 8, 2.0, 50); break;
    case "crest":    add(-18, 18, hump(0, 1.6, 30)); break;
    case "double":   ramp(P, at, 26, 7, 1.7, 26); ramp(P, at + Math.round(54/seg), 26, 7, 1.9, 44); break;
    /* a proper take-off and landing: a curved kicker onto a lip, a step
       down to a flat table you land on, then a long ramp back to the road.
       Fast enough and you clear the table and touch down on the down ramp. */
    case "tabletop": add(-32, 66, s=>{
                       const h = 2.3, F = 11.5;
                       if(s < -F){ const t = (s + 32)/(32 - F); return 0.3*h*t*t*(3 - 2*t); }
                       if(s <= 0){ const q = (s + F)/F; return 0.3*h + 0.7*h*q*q; }   // the face, to the lip
                       if(s < 3)  return h - 0.18*h*(s/3);                             // off the lip
                       if(s < 26) return 0.82*h;                                        // the table
                       const t = (s - 26)/40; return 0.82*h*(1 - t*t*(3 - 2*t));        // the landing ramp
                     }); break;
    case "drop":     add(-60, 4, ledge(0, 1.5, 58)); break;
    case "ledge":    add(-80, 4, ledge(0, 2.4, 78)); break;
    case "rhythm":   for(let n=0;n<4;n++) add(n*27 - 12, n*27 + 12, hump(n*27, 0.95, 22)); break;
    case "staircase":for(let n=0;n<3;n++) add(n*48 - 40, n*48 + 4, ledge(n*48, 1.2, 38)); break;
  }
}
/* where each extra jump goes: straight road, well clear of everything */
const AUTO_JUMPS = [];
{
  const N = MAIN.N, seg = MAIN.seg, R = radiiOf(MAIN);
  const busy = [];                                     // [station, clear radius in metres]
  busy.push([0, 110]);                                 // the start line and grid
  (TRACK.jumps || []).forEach(j=> busy.push([snapTo(MAIN, j[0]), 90]));
  if(TRACK.bigJump) busy.push([snapTo(MAIN, TRACK.bigJump[0]), 140]);
  (TRACK.fords || []).forEach(f=> busy.push([snapTo(MAIN, f), 55]));
  if(TRACK.gorge) busy.push([snapTo(MAIN, TRACK.gorge.at), TRACK.gorge.span + 45]);
  CALM.forEach(c=> busy.push([c[0], c[1]*0.8 + 8]));
  SPOTS.forEach(c=> busy.push(c));
  BRANCHES.forEach(P=>{
    busy.push([P.splitAt, 50]);
    busy.push([wrapIdx(MAIN, P.mainTo - Math.round(12/seg)), 50]);
  });
  const gap = (a, b)=>{ const d = Math.abs(a - b) % N; return Math.min(d, N - d)*seg; };
  const KIT = (TRACK.kit || []).concat(TRACK.test ? [] : ["kicker","crest","rhythm","double","crest","tabletop"]).slice(0, 9);
  KIT.forEach(type=>{
    const L = JUMP_LEN[type];
    const back = Math.round(L*0.4/seg), fwd = Math.round((L*0.5 + 20)/seg);
    let best = -1, bestScore = -Infinity;
    for(let i=0; i<N; i+=3){
      // straight enough to fly and to land: no corner tighter than 90m
      let straight = true;
      for(let k=-back; k<=fwd; k+=2){ if(R[((i+k)%N+N)%N] < 42){ straight = false; break; } }
      if(!straight) continue;
      let clear = Infinity;
      for(const b of busy) clear = Math.min(clear, gap(i, b[0]) - b[1] - L*0.4);
      if(clear < 0) continue;
      if(clear > bestScore){ bestScore = clear; best = i; }
    }
    if(best < 0) return;                               // nowhere safe: this track goes without
    AUTO_JUMPS.push({type, at:best});
    busy.push([best, L*0.5 + 22]);
  });
}

/* ---- stages ----------------------------------------------------------
   A rally road is not one road. Every 100 to 240 metres it changes: wide
   fast gravel, a narrow rutted stretch, washboard, a lane gone to mud,
   broken crests, or a hollow-way sunk between banks taller than the car.
   Each stage carries its own width, mud, crest size, rut depth, chatter
   and bank height, blended over about 30m into the next.

   Everything that has to stay put (jumps, fords, the bridge, the forks,
   the start line) sits in a calm zone where the stage is held back. */
const STAGE_TYPES = {
  gravel:   {w:1.14, crest:0.05, wash:0.012, rut:0.035, mud:0.00, bank:0},
  rutted:   {w:0.80, crest:0.10, wash:0.020, rut:0.110, mud:0.12, bank:0},
  washboard:{w:1.00, crest:0.05, wash:0.060, rut:0.035, mud:0.00, bank:0},
  muddy:    {w:0.90, crest:0.08, wash:0.015, rut:0.120, mud:0.60, bank:0},
  hollow:   {w:0.70, crest:0.06, wash:0.020, rut:0.090, mud:0.35, bank:2.9},
  broken:   {w:0.96, crest:0.24, wash:0.030, rut:0.050, mud:0.04, bank:0},
  // single track: one car wide and a bit, trees right up to the edge

  for(let k=-span;k<=span;k++){
    const i = wrapIdx(P, at+k);
    const w = 1 - smoothstep(0.25, 1, Math.abs(k)/span);
    P.pts[i].y = P.pts[i].y*(1-w) + y0*w;

}
function addFord(P, at){
  const seg = P.seg;
  const y0 = levelRoad(P, at, Math.round(46/seg));
  dip(P, at, Math.round(16/seg), FORD_DIP);
  paint(P, at - Math.round(9/seg), at + Math.round(9/seg), SURF.WATER);
  const i = wrapIdx(P, at), p = P.pts[i], t = P.tans[i];
  const level = y0 - FORD_DIP + BED + FORD_WADE;
  /* On a slope the road beyond the crossing kept falling, below the water,
     and the stream ran off down it. Lift the approaches onto a causeway so
     the road always climbs clear of the water on both sides. */
  {
    const need = level - BED + 0.35, R = Math.round(75/seg);
    const lift = new Float64Array(2*R+1);
    for(let k=-R;k<=R;k++){
      const d = Math.abs(k)*seg;
      if(d < 17) continue;
      const y = P.pts[wrapIdx(P, at+k)].y;
      lift[k+R] = Math.max(0, need - y)*(1 - smoothstep(50, 75, d))*smoothstep(17, 24, d);
    }
    const sm = Array.from(lift); smoothAlong(sm, false, Math.round(5/seg));
    for(let k=-R;k<=R;k++) P.pts[wrapIdx(P, at+k)].y += Math.max(lift[k+R], sm[k+R]);

/* ---- the river run ----
   The road turns off into the creek and runs up its bed. The run is cut
   into pools, each held level and each a step higher than the one below,
   joined by short rapids where the water (and the road under it) climbs.
   The creek carries on past both ends of the run into the trees, so it
   reads as a river the road borrows, not a long puddle. */
const RIVER = {on:false};
const RIVER_WADE = 0.30;     // water over the road
const RIVER_BED  = 10;       // half width of the channel floor
const RIVER_BANK = 18;       // where the bank reaches the top
const RIVER_FREE = 0.55;     // bank over the water
function addRiver(P, def){
  const seg = P.seg;
  const a = snapTo(P, def.from);
  let b = snapTo(P, def.to); if(b < a) b += P.N;
  const n = b - a, K = Math.max(1, def.pools || 3);
  const cut = j => Math.round(n*j/K);
  const levels = [];
  for(let j=0;j<K;j++){
    let sum = 0, c = 0;
    for(let k=cut(j); k<cut(j+1); k++){ sum += P.pts[wrapIdx(P, a+k)].y; c++; }
    levels.push(sum/Math.max(1, c) + BED + RIVER_WADE);
  }
  // even steps from the bottom pool to the top one, never downhill
  const lo = levels[0], hi = Math.max(levels[K-1], levels[0] + 0.6*(K-1));
  for(let j=0;j<K;j++) levels[j] = lo + (hi - lo)*(K > 1 ? j/(K-1) : 0);
  const RAP = Math.round(14/seg);                        // rapids length
  const levelAt = k=>{
    const j = Math.max(0, Math.min(K-1, Math.floor(k/n*K)));
    const kb = cut(j+1);
    if(j < K-1 && k > kb - RAP) return levels[j] + (levels[j+1] - levels[j])*smoothstep(0, 1, (k - (kb - RAP))/RAP);
    return levels[j];
  };
  const bedY = k => levelAt(k) - BED - RIVER_WADE;
  // the run itself
  for(let k=0;k<=n;k++){
    const i = wrapIdx(P, a+k);
    P.pts[i].y = bedY(k);
    P.surf[i] = SURF.WATER;
  }
  /* in and out: down off a bank that stands clear of the water, and up the
     far one. Where the land beyond is low, it is built up into a causeway so
     the road never runs under the water outside the creek. */
  const ends = [[a, -1, levels[0], bedY(0)], [a+n, 1, levels[K-1], bedY(n)]];
  ends.forEach(([at, dir, lev, yIn])=>{
    const top = lev + RIVER_FREE - BED + 0.1;
    for(let k=1; k<=Math.round(70/seg); k++){
      const i = wrapIdx(P, at + dir*k), d = k*seg;
      let y = P.pts[i].y;
      if(d < 16)      y = yIn + (top - yIn)*smoothstep(0, 16, d);
      else if(d < 40) y = Math.max(y, top)*smoothstep(16, 40, d) + top*(1 - smoothstep(16, 40, d));
      else            y = Math.max(y, top*(1 - smoothstep(40, 70, d)) + y*smoothstep(40, 70, d));
      P.pts[i].y = y;
    }
  });
  // the centreline of the whole creek, downstream end first
  const S = [];
  const push = (x, z, lev)=> S.push([x, z, lev]);
  const dirAt = (k0, k1)=>{
    const A = P.pts[wrapIdx(P, a+k0)], B = P.pts[wrapIdx(P, a+k1)];
    const dx = B.x - A.x, dz = B.z - A.z, L = Math.hypot(dx, dz) || 1;
    return [dx/L, dz/L];
  };
  /* past each end the creek bends away from the road, from the road's
     heading toward the heading the map gives it, and wanders a little */
  const trail = (p, d, want, len)=>{
    const out = [];
    let x = p.x, z = p.z, hx = d[0], hz = d[1];
    const L = Math.hypot(want[0], want[1]) || 1, wx = want[0]/L, wz = want[1]/L;
    for(let m=seg; m<=len; m+=seg){
      const t = smoothstep(0, 35, m);
      let ax = hx*(1-t) + wx*t, az = hz*(1-t) + wz*t;
      const wob = Math.sin(m*0.045)*0.25*smoothstep(25, 50, m);
      const bx = ax - az*wob, bz = az + ax*wob, bl = Math.hypot(bx, bz) || 1;
      x += bx/bl*seg; z += bz/bl*seg;
      out.push([x, z]);
    }
    return out;
  };
  const p0 = P.pts[wrapIdx(P, a)], p1 = P.pts[wrapIdx(P, a+n)];
  trail(p0, dirAt(Math.round(8/seg), 0), def.downDir || dirAt(Math.round(18/seg), 0), def.down || 60)
    .reverse().forEach(q=> push(q[0], q[1], levels[0]));
  for(let k=0;k<=n;k++){ const p = P.pts[wrapIdx(P, a+k)]; push(p.x, p.z, levelAt(k)); }
  trail(p1, dirAt(n - Math.round(8/seg), n), def.upDir || dirAt(n - Math.round(18/seg), n), def.up || 70)
    .forEach(q=> push(q[0], q[1], levels[K-1]));
  let x0=Infinity, x1=-Infinity, z0=Infinity, z1=-Infinity;
  S.forEach(q=>{ x0=Math.min(x0,q[0]); x1=Math.max(x1,q[0]); z0=Math.min(z0,q[1]); z1=Math.max(z1,q[1]); });
  const pad = RIVER_BANK + 16;
  Object.assign(RIVER, {on:true, S, a, n, levels, box:[x0-pad, x1+pad, z0-pad, z1+pad],
                        ends:[S.length ? 0 : 0, S.length-1]});
}
/* nearest point of the creek: [distance across, level there, metres to the nearer end] */
function riverAt(x, z){
  const B = RIVER.box;
  if(x < B[0] || x > B[1] || z < B[2] || z > B[3]) return null;
  const S = RIVER.S;
  let best = Infinity, bj = 0;
  for(let j=0;j<S.length;j+=2){
    const d = (S[j][0]-x)*(S[j][0]-x) + (S[j][1]-z)*(S[j][1]-z);
    if(d < best){ best = d; bj = j; }
  }
  for(let j=Math.max(0,bj-2); j<=Math.min(S.length-1,bj+2); j++){
    const d = (S[j][0]-x)*(S[j][0]-x) + (S[j][1]-z)*(S[j][1]-z);
    if(d < best){ best = d; bj = j; }
  }
  const endM = Math.min(bj, S.length - 1 - bj)*MAIN.seg;
  return [Math.sqrt(best), S[bj][2], endM];
}

BRANCHES.forEach(P=>{

     following the land. The quarry ramp needs it: its own land is a flight

  if(P.def.even){
    const y0 = P.pts[0].y, y1 = P.pts[P.N-1].y;

  }
  /* A leap: the branch holds its height off the main road, kicks up at a lip
     and the ground falls away under it down a landing slope, steep at the
     top and flat at the bottom, the way the drop at Hawks Leap is built, so
     wherever you come down you come down on a slope. */
  if(P.def.leap){
    const L = P.def.leap, seg = P.seg, total = (P.N-1)*seg;
    const y0 = MAIN.pts[wrapIdx(MAIN, P.mainFrom)].y, y1 = MAIN.pts[wrapIdx(MAIN, P.mainTo)].y;
    const lip = Math.min(total*0.45, 42 + L.at), KICK = 1.4;
    /* the run to the lip already falls away, so the leap itself is smaller */
    const yTop = y0 - Math.min(0.08*lip, Math.max(0, (y0 - y1)*0.4));
    const D = Math.max(3, yTop - y1);
    /* the landing follows the arc a car makes leaving the lip at about
       108km/h, down to a 45% slope, holds that, then rounds out onto the
       floor: whatever speed you take it at you come down along the ground
       rather than into it */
    const V0 = L.v || 30, SMAX = 0.45, ROUND = 22;
    const land = [];                                  // drop below the lip, per metre
    { let x = 0, yy = 0, sl = 0, rounding = false, sl0 = 0;
      while(yy < D && x < 400){
        if(!rounding){ sl = Math.min(SMAX, 9.8*x/(V0*V0)); if(D - yy <= sl*ROUND/2){ rounding = true; sl0 = sl; } }
        else sl = Math.max(0.01, sl - sl0/ROUND);
        yy = Math.min(D, yy + sl); land.push(yy); x++;
      } }
    for(let i=0;i<P.N;i++){
      const s2 = i*seg;
      let y;
      if(s2 <= lip){ const q = Math.max(0, (s2 - (lip - 16))/16); y = y0 + (yTop - y0)*(s2/lip) + KICK*q*q; }
      else {
        const x = s2 - lip, k = Math.floor(x), f = x - k;
        const a0 = k < land.length ? land[k] : D, a1 = k + 1 < land.length ? land[k+1] : D;
        y = yTop - (a0 + (a1 - a0)*f) + KICK*Math.max(0, 1 - x/2.5);
      }

    }

  }
  const shaped = !!(P.def.even || P.def.leap);
  P.share = new Float64Array(P.N);
  const near = (i, guess)=>{
    let best = Infinity, bj = guess;
    for(let k=-60;k<=60;k++){
      const j = wrapIdx(MAIN, guess+k);
      const d = (MAIN.pts[j].x-P.pts[i].x)**2 + (MAIN.pts[j].z-P.pts[i].z)**2;
      if(d < best){ best = d; bj = j; }
    }
    return bj;
  };
  const MY = new Float64Array(P.N), WE = new Float64Array(P.N), WN = new Array(P.N).fill(0);

    const guess = fromA < fromB ? P.mainFrom + i : P.mainTo - (P.N-1-i);

    // nearest sample, or the branch picks up a staircase
    let dm = Infinity, my = MAIN.pts[j].y;
    for(let k=-1;k<=0;k++){
      const A = MAIN.pts[wrapIdx(MAIN, j+k)], B = MAIN.pts[wrapIdx(MAIN, j+k+1)];
      const dx = B.x-A.x, dz = B.z-A.z, L2 = dx*dx + dz*dz;
      let t = L2 ? ((P.pts[i].x-A.x)*dx + (P.pts[i].z-A.z)*dz)/L2 : 0;
      t = Math.max(0, Math.min(1, t));
      const d = Math.hypot(P.pts[i].x - A.x - dx*t, P.pts[i].z - A.z - dz*t);
      if(d < dm){ dm = d; my = A.y + (B.y-A.y)*t; }
    }
    MY[i] = my;
    // flush at the ends
    WE[i] = shaped ? 1 - smoothstep(8, 30, Math.min(fromA, fromB))
                   : 1 - smoothstep(30, 110, Math.min(fromA, fromB));
    /* Where the two roads merely pass close, they only share banks if they
       are already near the same height. Pulling a branch onto a main road a
       bench above or below it (the quarry spiral, a hillside) bent it up and

    const dy = Math.abs(P.pts[i].y - my);

  }

  smoothAlong(WN, false, Math.round(12/P.seg));
  for(let i=0;i<P.N;i++){
    const w = Math.max(WE[i], WN[i]);
    P.share[i] = Math.max(0, w);
    if(w <= 0) continue;
    P.pts[i].y = P.pts[i].y*(1-w) + MY[i]*w;
  }
});

/* [how far from the stream's middle, how far along it from the road].
   The stream is not ruled across the map: away from the road it wanders,
   and toward its ends it narrows to a trickle and runs out under the
   bank, so there is no square end to the water (or the ice). The across
   distance is scaled by the narrowing, so every user of it sees the
   stream's real shape. */
function fordUV(F, x, z){
  const dx = x - F.x, dz = z - F.z;
  const u = dx*F.tx + dz*F.tz, v = -dx*F.tz + dz*F.tx, b = Math.abs(v);
  const away = smoothstep(9, 30, b);
  const m = (Math.sin(v*0.061 + F.ph)*4.2 + Math.sin(v*0.143 + F.ph*1.7)*1.6)*away;
  const narrow = 1 - 0.88*smoothstep(FORD_REACH*0.38, FORD_REACH*0.97, b)
               + 0.12*Math.sin(v*0.21 + F.ph*2.9)*away;
  return [Math.abs(u - m)/Math.max(0.1, narrow), b, Math.abs(u - m)];
}
function carveWater(y, x, z){
  if(RIVER.on){
    const r = riverAt(x, z);
    if(r){
      const d = r[0], lev = r[1];
      const w = (1 - smoothstep(RIVER_BANK, RIVER_BANK + 14, d))*smoothstep(0, 18, r[2] + 6);
      if(w > 0){
        const wander = Math.sin(x*0.07 + z*0.05)*1.2;
        const shape = lev - 1.1 + (1.1 + RIVER_FREE)*smoothstep(RIVER_BED*0.7, RIVER_BANK, d + wander);
        y = y*(1 - w) + shape*w;
      }
    }
  }
  for(let k=0;k<FORDS.length;k++){
    const F = FORDS[k];
    const uv = fordUV(F, x, z), a = uv[0], b = uv[1];
    const OUT = FORD_HALF + FORD_BANK + 14;
    if(uv[2] > OUT || b > FORD_REACH*1.35) continue;
    // the blend into the land is judged on the true distance, so where the
    // stream narrows its banks still ease out over the same width
    const w = (1 - smoothstep(FORD_REACH*0.98, FORD_REACH*1.35, b))
            * (1 - smoothstep(FORD_HALF + FORD_BANK, OUT, Math.max(uv[2], Math.min(a, FORD_HALF + FORD_BANK))));
    if(w <= 0) continue;
    // a little wander so the stream is not ruled across the map
    const rise = Math.max(smoothstep(FORD_HALF*0.75, FORD_HALF + FORD_BANK, a + Math.sin(b*0.13 + k)*1.2),
                          smoothstep(FORD_REACH*0.92, FORD_REACH*1.05, b));
    const shape = F.bed + (F.level + FORD_FREE - F.bed)*rise;
    // carve down; where the land is lower than the bank, build the bank up
    y = y*(1-w) + shape*w;
  }
  return y;
}

function barren(x, z){
  if(DUNE.on && Math.hypot(x - DUNE.x, z - DUNE.z) < DUNE.r*0.88) return true;
  if(CANYON.on){ const uv = canyonUV(x, z); if(uv && uv[0] < 30 && canyonPlateau(x, z, uv) > 0.2) return true; }
  return false;
}
function inWaterway(x, z){
  if(RIVER.on){ const r = riverAt(x, z); if(r && r[0] < RIVER_BANK + 1) return true; }
  if(TOWN.on && Math.hypot(x - TOWN.x, z - TOWN.z) < TOWN.r*0.85) return true;   // the village keeps its own ground
  if(LAKE.on && Math.hypot((x - LAKE.x)/LAKE.rx, (z - LAKE.z)/LAKE.rz) < 1.05) return true;
  if(PIT.on && Math.hypot(x - PIT.x, z - PIT.z) < PIT.r*1.02) return true;
  if(BOWL.on && Math.hypot(x - BOWL.x, z - BOWL.z) < BOWL.r + 38) return true;
  for(let i=0;i<FORDS.length;i++){
    const uv = fordUV(FORDS[i], x, z);
    if(uv[0] < FORD_HALF + FORD_BANK && uv[1] < FORD_REACH*1.1) return true;
  }
  if(GORGE.on){
    const uv = gorgeUV(x, z);
    if(Math.abs(uv[0]) < GORGE.wall*0.75 && Math.abs(uv[1]) < GORGE.reach) return true;

function rockGeometry(seed){
  const g = new THREE.IcosahedronGeometry(1, 1);
  const p = g.attributes.position;
  const v = new THREE.Vector3();
  for(let i=0;i<p.count;i++){
    v.fromBufferAttribute(p, i);
    const n = 1
      + Math.sin(v.x*3.1 + seed)*0.16
      + Math.cos(v.y*2.4 + seed*1.7)*0.14
      + Math.sin(v.z*3.7 + seed*0.6)*0.12;
    v.multiplyScalar(n);
    v.y *= 0.68;
    p.setXYZ(i, v.x, v.y, v.z);
  }
  g.computeVertexNormals();
  return g;
}
