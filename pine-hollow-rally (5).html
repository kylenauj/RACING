/* dust */
const DUST = 1800;                 // a held drift alone burns through several hundred
const dustPos = new Float32Array(DUST*3);
const dustVel = new Float32Array(DUST*3);
const dustLife = new Float32Array(DUST);
for(let i=0;i<DUST;i++){ dustPos[i*3+1] = -999; }
const dustGeo = new THREE.BufferGeometry();
dustGeo.setAttribute("position", new THREE.BufferAttribute(dustPos,3));
const dustAlpha = new Float32Array(DUST);
const dustSize  = new Float32Array(DUST);
const dustCol   = new Float32Array(DUST*3);
const dustGrav  = new Float32Array(DUST).fill(5.2);   // water falls, smoke and dust hang
const dustGrow  = new Float32Array(DUST).fill(2.2);
dustGeo.setAttribute("aAlpha", new THREE.BufferAttribute(dustAlpha,1).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute("aSize",  new THREE.BufferAttribute(dustSize,1).setUsage(THREE.DynamicDrawUsage));
dustGeo.setAttribute("aCol",   new THREE.BufferAttribute(dustCol,3).setUsage(THREE.DynamicDrawUsage));
const dust = new THREE.Points(dustGeo, new THREE.ShaderMaterial({
  vertexShader: [
    "attribute float aAlpha; attribute float aSize; attribute vec3 aCol;",
    "varying float vA; varying vec3 vC;",
    "void main(){",
    "  vA = aAlpha; vC = aCol;",
    "  vec4 mv = modelViewMatrix * vec4(position, 1.0);",
    "  gl_PointSize = aSize * (120.0 / max(1.0, -mv.z));",
    "  gl_Position = projectionMatrix * mv;",
    "}"
  ].join("\n"),
  fragmentShader: [
    "varying float vA; varying vec3 vC;",
    "void main(){",
    "  float d = length(gl_PointCoord - 0.5);",
    "  if(d > 0.5 || vA <= 0.01) discard;",
    "  gl_FragColor = vec4(vC, vA * (1.0 - d*2.0) * 0.42);",
    "}"
  ].join("\n"),
  transparent:true, depthWrite:false
}));
// The bounding sphere is computed once from the parked positions, which sit
// 999m underground, and never recomputed as particles move. Three then culls
// the whole system every frame. This is why no smoke or spray ever appeared.
dust.frustumCulled = false;
dustGeo.boundingSphere = new THREE.Sphere(new THREE.Vector3(), 4000);
scene.add(dust);
let dustHead = 0;
function spawnDust(x,y,z,sandy,force,vx,vz,lift){
  const i = dustHead = (dustHead+1)%DUST;
  dustPos[i*3]=x; dustPos[i*3+1]=y; dustPos[i*3+2]=z;
  dustVel[i*3]  =(vx||0) + (Math.random()-0.5)*2.6;
  dustVel[i*3+1]=(lift===undefined?1.4:lift)*(0.6+Math.random()*0.9) + force*0.5;
  dustVel[i*3+2]=(vz||0) + (Math.random()-0.5)*2.6;
  dustLife[i]=0.8+Math.random()*0.7 + force*0.4;
  dustSize[i]=0.8+Math.random()*1.3 + force*0.6;
  dustGrav[i]=5.2; dustGrow[i]=2.2;
  const j=i*3;
  if(Array.isArray(sandy)){                       // drift sparks carry their tier colour
    dustCol[j]=sandy[0]; dustCol[j+1]=sandy[1]; dustCol[j+2]=sandy[2];
    dustSize[i]*=0.5; dustLife[i]*=0.5;
  }
  else if(sandy && sandy.tint){                   // coloured drift smoke
    // the level's own colour, strongly: blue, then orange, then violet
    const c = sandy.tint, g2 = 0.85 + Math.random()*0.15, m = 0.90, b = 0.9 + Math.random()*0.25;
    dustCol[j]   = Math.min(1, (g2*(1-m) + c[0]*m)*b);
    dustCol[j+1] = Math.min(1, (g2*(1-m) + c[1]*m)*b);
    dustCol[j+2] = Math.min(1, (g2*(1-m) + c[2]*m)*b);
    dustSize[i]*=1.7; dustLife[i]*=1.3;
  }
  else if(sandy === 4){                           // powder snow
    const g2 = 0.9 + Math.random()*0.1;
    dustCol[j]=g2*0.95; dustCol[j+1]=g2*0.97; dustCol[j+2]=g2;
    dustSize[i]*=0.9; dustLife[i]*=0.9; dustGrav[i]=2.2;
  }
  else if(sandy === 3){                           // tyre smoke
    const g2 = 0.72 + Math.random()*0.16;
    dustCol[j]=g2; dustCol[j+1]=g2; dustCol[j+2]=g2*0.98;
    dustSize[i]*=1.45; dustLife[i]*=1.05;
  }
  else if(sandy === 2){
    /* water: a spray of drops thrown back off the tyre that falls again,
       not a cloud that climbs and swells over the car */
    dustCol[j]=0.80; dustCol[j+1]=0.89; dustCol[j+2]=0.95;
    dustVel[i*3+1] = (lift===undefined?0.8:lift)*(0.6+Math.random()*0.8) + force*0.12;
    dustSize[i] = 0.6 + Math.random()*0.6; dustLife[i] = 0.5 + Math.random()*0.35;
    dustGrav[i] = 13; dustGrow[i] = 0.5;
  }
  else if(sandy){
    if(WINTER){ dustCol[j]=0.86; dustCol[j+1]=0.89; dustCol[j+2]=0.93; }
    else if(DESERT){ dustCol[j]=0.74; dustCol[j+1]=0.55; dustCol[j+2]=0.38; }
    else { dustCol[j]=0.52; dustCol[j+1]=0.41; dustCol[j+2]=0.27; }
    dustSize[i]*=0.55; dustLife[i]*=0.65; dustGrow[i]=1.5;
  }
  else {           dustCol[j]=0.55; dustCol[j+1]=0.55; dustCol[j+2]=0.53; dustSize[i]*=0.55; dustLife[i]*=0.65; dustGrow[i]=1.5; }
}

/* ------------------------------------------------------------------ *
 *  Image
 *  One grade, always on. The scene renders at full resolution with
 *  multisampling where the browser allows it, then a single pass does
 *  what a film grade would: a soft bloom lifted off the highlights, a
 *  filmic shoulder so the sky and the sun on the gravel roll off
 *  instead of clipping, a warm-highlight / cool-shadow split, a gentle
 *  vignette, and the speed smear kept to the edges of frame where it
 *  sells velocity without blurring what you're steering at.
 * ------------------------------------------------------------------ */
var hudReady = false;             // set once the HUD canvas exists
const POST = { on:true, msaa: renderer.capabilities.isWebGL2 };
/* The Print look: the game as a 1970s rally programme. Brown ink round
   everything, halftone dots in the shadows, cream stock and teal ink. */
const LOOK = { print:true };
const GFX = { fast:false };       // set from options: no shadows, no MSAA

const postScene = new THREE.Scene();
const postCam = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 1);
const QUAD_VS = "varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0.0, 1.0); }";

/* bright pass and blur run at quarter resolution, so bloom costs little */
const brightMat = new THREE.ShaderMaterial({
  uniforms:{ tDiffuse:{value:null}, uThresh:{value:0.86} },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform float uThresh; varying vec2 vUv;",
    "void main(){",
    "  vec3 c = texture2D(tDiffuse, vUv).rgb;",
    "  float l = max(c.r, max(c.g, c.b));",
    "  float k = smoothstep(uThresh, 1.0, l);",          // soft knee
    "  gl_FragColor = vec4(c*k, 1.0);",
    "}"].join("\n"),
  depthTest:false, depthWrite:false
});
const blurMat = new THREE.ShaderMaterial({
  uniforms:{ tDiffuse:{value:null}, uDir:{value:new THREE.Vector2(1,0)} },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse; uniform vec2 uDir; varying vec2 vUv;",
    "void main(){",                                     // 9 tap gaussian, linear filtered
    "  vec3 c = texture2D(tDiffuse, vUv).rgb*0.2270270;",
    "  c += texture2D(tDiffuse, vUv + uDir*1.3846).rgb*0.3162162;",
    "  c += texture2D(tDiffuse, vUv - uDir*1.3846).rgb*0.3162162;",
    "  c += texture2D(tDiffuse, vUv + uDir*3.2308).rgb*0.0702703;",
    "  c += texture2D(tDiffuse, vUv - uDir*3.2308).rgb*0.0702703;",
    "  gl_FragColor = vec4(c, 1.0);",
    "}"].join("\n"),
  depthTest:false, depthWrite:false
});

const postMat = new THREE.ShaderMaterial({
  uniforms: {
    tDiffuse: {value: null},
    tBloom:   {value: null},
    uRes:     {value: new THREE.Vector2(1,1)},
    uAspect:  {value: 1},
    uSpeed:   {value: 0},
    uSunPos:  {value: new THREE.Vector2(-1,-1)},
    uSunVis:  {value: 0},
    uFlash:   {value: 0},
    uTime:    {value: 0},
    uFxaa:    {value: 0},
    tDepth:   {value: null},
    uPrint:   {value: 1},
    uStock:   {value: WINTER ? new THREE.Vector3(0.90, 0.95, 1.0) : new THREE.Vector3(0.98, 0.93, 0.80)},
    uWarm:    {value: WINTER ? new THREE.Vector3(0.97, 1.0, 1.04) : new THREE.Vector3(1.04, 1.00, 0.90)},
    uNear:    {value: camera.near},
    uFar:     {value: camera.far},
    uInk:     {value: 1}
  },
  vertexShader: QUAD_VS,
  fragmentShader: [
    "uniform sampler2D tDiffuse, tBloom;",
    "uniform vec2 uRes, uSunPos;",
    "uniform float uAspect, uSpeed, uSunVis, uFlash, uTime, uFxaa;",
    "uniform sampler2D tDepth; uniform float uPrint, uNear, uFar, uInk; uniform vec3 uStock, uWarm;",
    "float linZ(float d){ float z = d*2.0 - 1.0; return 2.0*uNear*uFar/(uFar + uNear - z*(uFar - uNear)); }",
    "varying vec2 vUv;",

    // FXAA 3.11 console variant, only when the target could not multisample
    "vec3 fxaa(vec2 uv){",
    "  vec2 px = 1.0/uRes;",
    "  vec3 rgbNW = texture2D(tDiffuse, uv + vec2(-1.0,-1.0)*px).rgb;",
    "  vec3 rgbNE = texture2D(tDiffuse, uv + vec2( 1.0,-1.0)*px).rgb;",
    "  vec3 rgbSW = texture2D(tDiffuse, uv + vec2(-1.0, 1.0)*px).rgb;",
    "  vec3 rgbSE = texture2D(tDiffuse, uv + vec2( 1.0, 1.0)*px).rgb;",
    "  vec3 rgbM  = texture2D(tDiffuse, uv).rgb;",
    "  vec3 L = vec3(0.299, 0.587, 0.114);",
    "  float lNW = dot(rgbNW,L), lNE = dot(rgbNE,L), lSW = dot(rgbSW,L), lSE = dot(rgbSE,L), lM = dot(rgbM,L);",
    "  float lMin = min(lM, min(min(lNW,lNE), min(lSW,lSE)));",
    "  float lMax = max(lM, max(max(lNW,lNE), max(lSW,lSE)));",
    "  vec2 dir = vec2(-((lNW + lNE) - (lSW + lSE)), ((lNW + lSW) - (lNE + lSE)));",
    "  float red = max((lNW + lNE + lSW + lSE)*0.03125, 0.0078125);",
    "  float rcp = 1.0/(min(abs(dir.x), abs(dir.y)) + red);",
    "  dir = clamp(dir*rcp, -8.0, 8.0)*px;",
    "  vec3 a = 0.5*(texture2D(tDiffuse, uv + dir*(1.0/3.0 - 0.5)).rgb + texture2D(tDiffuse, uv + dir*(2.0/3.0 - 0.5)).rgb);",
    "  vec3 b = a*0.5 + 0.25*(texture2D(tDiffuse, uv - dir*0.5).rgb + texture2D(tDiffuse, uv + dir*0.5).rgb);",
    "  float lB = dot(b, L);",
    "  return (lB < lMin || lB > lMax) ? a : b;",
    "}",
    "vec3 base(vec2 uv){ return uFxaa > 0.5 ? fxaa(uv) : texture2D(tDiffuse, uv).rgb; }",

    // filmic curve on linearised colour (ACES fit, Narkowicz), back to display
    "vec3 aces(vec3 x){ return clamp((x*(2.51*x + 0.03))/(x*(2.43*x + 0.59) + 0.14), 0.0, 1.0); }",
    "float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }",

    "void main(){",
    "  vec2 uv = vUv;",
    "  vec2 dir = uv - 0.5;",
    "  float r = length(dir*vec2(uAspect, 1.0));",
    "  vec3 col = base(uv);",
    // speed: a radial smear that only reaches the outer frame
    "  float edge = smoothstep(0.30, 0.95, r);",
    "  float sm = uSpeed*edge;",
    "  if(sm > 0.002){",
    "    vec2 stp = dir*sm*0.045;",
    "    vec3 acc = col;",
    "    acc += texture2D(tDiffuse, uv - stp*0.25).rgb;",
    "    acc += texture2D(tDiffuse, uv - stp*0.50).rgb;",
    "    acc += texture2D(tDiffuse, uv - stp*0.75).rgb;",
    "    acc += texture2D(tDiffuse, uv - stp).rgb;",
    "    col = acc*0.2;",
    "  }",
    // a whisper of lateral colour at the edges when you're really moving
    "  float ca = 0.0012*uSpeed*edge;",
    "  if(ca > 0.0001){",
    "    col.r = mix(col.r, texture2D(tDiffuse, uv + dir*ca).r, 0.8);",
    "    col.b = mix(col.b, texture2D(tDiffuse, uv - dir*ca).b, 0.8);",
    "  }",
    "  vec3 bloom = texture2D(tBloom, uv).rgb;",
    "  vec3 lin = pow(col, vec3(2.2));",
    "  lin += pow(bloom, vec3(2.2))*0.28;",
    // sun: a broad warm veil and a tight core when you drive into it
    "  if(uSunVis > 0.0){",
    "    vec2 sp = (uSunPos - 0.5)*vec2(uAspect, 1.0);",
    "    float d = length(dir*vec2(uAspect, 1.0) - sp);",
    "    lin += vec3(1.0, 0.82, 0.58)*uSunVis*(0.55*exp(-d*9.0) + 0.16*exp(-d*2.2));",
    "  }",
    "  lin *= 1.26;",                                   // exposure
    "  col = pow(aces(lin), vec3(1.0/2.2));",
    // split tone: cool, slightly lifted shadows, warm highlights
    "  float lum = dot(col, vec3(0.2126, 0.7152, 0.0722));",
    "  col += vec3(-0.010, 0.004, 0.022)*(1.0 - smoothstep(0.0, 0.45, lum));",
    "  col += vec3(0.022, 0.010, -0.016)*smoothstep(0.55, 1.0, lum);",
    "  col = mix(vec3(lum), col, 1.0);",
    // ---- Print: ink, halftone, stock -------------------------------------
    "  if(uPrint > 0.5){",
    "    vec2 px = uInk*1.25/uRes;",
    "    float dc = texture2D(tDepth, uv).x;",
    "    float zc = linZ(dc);",
    "    float zl = linZ(texture2D(tDepth, uv - vec2(px.x, 0.0)).x);",
    "    float zr = linZ(texture2D(tDepth, uv + vec2(px.x, 0.0)).x);",
    "    float zd = linZ(texture2D(tDepth, uv - vec2(0.0, px.y)).x);",
    "    float zu = linZ(texture2D(tDepth, uv + vec2(0.0, px.y)).x);",
    // silhouettes: a jump in depth relative to how far away it is
    "    float jump = max(max(zl - zc, zr - zc), max(zd - zc, zu - zc))/zc;",
    "    float sil = smoothstep(0.035, 0.10, jump);",
    // creases: 1/z is flat across any plane, so its second difference only
    // lights up where two faces meet at an angle
    "    float wc = 1.0/zc;",
    "    float lap = abs(1.0/zl + 1.0/zr + 1.0/zu + 1.0/zd - 4.0*wc)/wc;",
    "    float crease = smoothstep(0.010, 0.030, lap);",
    "    float ink = max(sil, crease*0.55)*(1.0 - smoothstep(90.0, 420.0, zc));",
    "    if(dc > 0.99999) ink = 0.0;",
    "    float l0 = dot(col, vec3(0.2126, 0.7152, 0.0722));",
    // light falls into a few soft bands, the way cheap colour printing flattens it
    "    float bands = 5.0;",
    "    float q = (floor(l0*bands) + smoothstep(0.30, 0.70, fract(l0*bands)))/bands;",
    "    col *= mix(1.0, (q + 0.03)/(l0 + 0.03), 0.5);",
    // two inks and the stock: teal in the shadows, cream where it is light
    "    float l1 = dot(col, vec3(0.2126, 0.7152, 0.0722));",
    "    vec3 pal = l1 < 0.5 ? mix(vec3(0.07, 0.17, 0.21), vec3(0.52, 0.50, 0.33), l1*2.0)",
    "                        : mix(vec3(0.52, 0.50, 0.33), uStock, l1*2.0 - 1.0);",
    "    col = mix(col, pal, 0.30);",
    // greens drift toward olive and teal, as a two-ink press would print them
    "    float gsh = clamp((col.g - max(col.r, col.b))*3.0, 0.0, 1.0);",
    "    col = mix(col, vec3(col.g*0.62, col.g*0.86, col.g*0.62 + col.b*0.25), gsh*0.35);",
    "    col = mix(col, col*uWarm, smoothstep(0.55, 0.95, l1));",
    // halftone: a 45 degree dot screen that only prints in the shadows
    "    float cellPx = 4.5*uInk;",
    "    vec2 hp = mat2(0.7071, -0.7071, 0.7071, 0.7071)*gl_FragCoord.xy/cellPx;",
    "    float rd = length(fract(hp) - 0.5);",
    "    float dotR = 0.52*sqrt(clamp((0.40 - l1)/0.40, 0.0, 1.0));",
    "    float dotm = 1.0 - smoothstep(dotR - 0.07, dotR + 0.07, rd);",
    "    col = mix(col, col*vec3(0.50, 0.62, 0.68), dotm*0.6);",
    // the stock itself: a fixed fibre, not animated grain
    "    float fib = hash(floor(gl_FragCoord.xy/(1.5*uInk)));",
    "    col *= 0.965 + 0.05*fib;",
    "    col = mix(col, vec3(0.17, 0.11, 0.08), ink*0.92);",
    "  } else {",
    "    col += (hash(gl_FragCoord.xy + fract(uTime)*97.0) - 0.5)*0.018;",
    "  }",
    "  col += uFlash;",
    "  col *= mix(1.0, 0.72, smoothstep(0.55, 1.25, r));",   // vignette
    "  gl_FragColor = vec4(clamp(col, 0.0, 1.0), 1.0);",
    "}"
  ].join("\n"),
  depthTest:false, depthWrite:false
});
const postQuad = new THREE.Mesh(new THREE.PlaneGeometry(2,2), postMat);
postQuad.frustumCulled = false;
postScene.add(postQuad);

let rt = null, rtA = null, rtB = null;
function sizeRT(){
  const pr = renderer.getPixelRatio();
  const w = Math.max(2, Math.floor(window.innerWidth*pr));
  const h = Math.max(2, Math.floor(window.innerHeight*pr));
  [rt, rtA, rtB].forEach(t => t && t.dispose());
  const opts = { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter,
                 format:THREE.RGBAFormat, stencilBuffer:false };
  // the ink reads depth, which a multisampled target cannot hand over in
  // this version; the lines themselves hide what the multisampling did
  const useMsaa = POST.msaa && !GFX.fast && !LOOK.print && THREE.WebGLMultisampleRenderTarget;
  rt = useMsaa ? new THREE.WebGLMultisampleRenderTarget(w, h, opts) : new THREE.WebGLRenderTarget(w, h, opts);
  if(useMsaa) rt.samples = 4;
  const bw = Math.max(2, Math.floor(w/4)), bh = Math.max(2, Math.floor(h/4));
  rtA = new THREE.WebGLRenderTarget(bw, bh, Object.assign({depthBuffer:false}, opts));
  rtB = new THREE.WebGLRenderTarget(bw, bh, Object.assign({depthBuffer:false}, opts));
  postMat.uniforms.tDiffuse.value = rt.texture;
  postMat.uniforms.tBloom.value = rtA.texture;
  postMat.uniforms.uRes.value.set(w, h);
  postMat.uniforms.uAspect.value = w/h;
  postMat.uniforms.uFxaa.value = useMsaa ? 0 : 1;
  if(!useMsaa){
    rt.depthTexture = new THREE.DepthTexture(w, h);
    rt.depthTexture.type = THREE.UnsignedIntType;
  }
  postMat.uniforms.tDepth.value = rt.depthTexture || null;
  postMat.uniforms.uPrint.value = LOOK.print && rt.depthTexture ? 1 : 0;
  postMat.uniforms.uInk.value = pr;
  blurMat.uniforms.uDir.value.set(1/bw, 0);
  if(hudReady) sizeHUD();          // the HUD canvas is created further down
}
sizeRT();

/* the whole chain, in order */
function renderView(time){
  postMat.uniforms.uTime.value = time || 0;
  renderer.setRenderTarget(rt);
  renderer.render(scene, camera);
  postQuad.material = brightMat; brightMat.uniforms.tDiffuse.value = rt.texture;
  renderer.setRenderTarget(rtA); renderer.render(postScene, postCam);
  postQuad.material = blurMat;
  for(let k=0;k<2;k++){
    const s = 1 + k*1.5;
    blurMat.uniforms.tDiffuse.value = rtA.texture;
    blurMat.uniforms.uDir.value.set(s/rtA.width, 0);
    renderer.setRenderTarget(rtB); renderer.render(postScene, postCam);
    blurMat.uniforms.tDiffuse.value = rtB.texture;
    blurMat.uniforms.uDir.value.set(0, s/rtA.height);

  }

  renderer.setRenderTarget(null);
  renderer.render(postScene, postCam);
}

let skidHead = 0;
const lastMark = [null, null];
function layMark(slot, x, y, z, rx, rz){
  const prev = lastMark[slot];
  if(!prev){ lastMark[slot] = [x,y,z]; return; }
  const dx = x-prev[0], dz = z-prev[2];
  const len = Math.hypot(dx, dz);
  if(len < 0.30) return;
  const w = 0.17;
  const i = skidHead; skidHead = (skidHead+1)%SKIDS;
  const o = i*18;
  const q = [
    prev[0]+rx*w, prev[1], prev[2]+rz*w,
    prev[0]-rx*w, prev[1], prev[2]-rz*w,
    x+rx*w,       y,       z+rz*w,
    prev[0]-rx*w, prev[1], prev[2]-rz*w,
    x-rx*w,       y,       z-rz*w,
    x+rx*w,       y,       z+rz*w
  ];
  for(let k=0;k<18;k++) skidPos[o+k] = q[k];
  for(let k=0;k<6;k++) skidBirth[i*6+k] = state.t;
  skidGeo.attributes.position.needsUpdate = true;
  skidGeo.attributes.aBirth.needsUpdate = true;
  lastMark[slot] = [x,y,z];
}

/* ------------------------------------------------------------------ *
 *  Input

 *  drive the car, and a handful of them change settings on the fly.

const keys = {};
const MENU_KEYS = { ArrowUp:"up", KeyW:"up", ArrowDown:"down", KeyS:"down",
                    ArrowLeft:"left", KeyA:"left", ArrowRight:"right", KeyD:"right",
                    Enter:"ok", NumpadEnter:"ok", Space:"ok", Escape:"back", Backspace:"back" };
addEventListener("keydown", e=>{
  if(GAME.ui){
    const dir = MENU_KEYS[e.code];
    startAudio();
    if(MENU.id === "scTitle" && !e.repeat){ e.preventDefault(); menuNav("ok"); return; }
    if(dir){ e.preventDefault(); if(!(e.repeat && (dir === "ok" || dir === "back"))) menuNav(dir); }
    return;
  }
  if(e.repeat && (e.code==="KeyE"||e.code==="KeyQ")) return;
  keys[e.code]=true;
  if(["ArrowUp","ArrowDown","ArrowLeft","ArrowRight","Space"].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  const S = SAVE.settings;
  if(e.code==="Escape" || e.code==="KeyP") pauseGame();
  if(e.code==="KeyC") cycleCamera();
  if(e.code==="KeyM") toggleMute();
  if(e.code==="KeyX") resetCar();
  if(e.code==="KeyR" && state.phase !== "menu"){ setMode(MODE); resetRace(); }
  if(e.code==="KeyE"){ trans.auto = false; requestShift(trans.gear+1); }
  if(e.code==="KeyQ"){ trans.auto = false; requestShift(trans.gear-1); }
  if(e.code==="KeyT"){ trans.auto = !trans.auto; S.auto = trans.auto; persist(); }
});
addEventListener("keyup", e=>{ keys[e.code]=false; });
addEventListener("blur", ()=>{ for(const k in keys) keys[k] = false; });
const held = c => !!keys[c];

/* ------------------------------------------------------------------ *
 *  Audio
 *  Everything is synthesised, so the file stays standalone. Three buses
 *  (engine and effects share one, music has its own) into a compressor,
 *  so a splash on top of the engine on top of the music never clips.
 * ------------------------------------------------------------------ */
let actx=null, muted=false;
const AUD = { master:null, sfx:null, music:null, noise:null, verb:null, verbSend:null,
              eng:null, road:null, wind:null, rivals:[], seqNext:0, step:0, musicMode:"menu",
              shiftPrev:0, crackleT:0, scrapeT:0 };
function startAudio(){
  const AC = window.AudioContext || window.webkitAudioContext;
  if(actx){ if(actx.state === "suspended") actx.resume(); return; }
  if(!AC) return;
  actx = new AC();
  const comp = actx.createDynamicsCompressor();
  comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
  comp.connect(actx.destination);
  AUD.master = actx.createGain(); AUD.master.connect(comp);
  AUD.sfx = actx.createGain(); AUD.sfx.connect(AUD.master);
  // the music through a gentle low pass, so the chiptune squares are not shrill
  const mlp = actx.createBiquadFilter(); mlp.type = "lowpass"; mlp.frequency.value = 4200; mlp.Q.value = 0.5;
  mlp.connect(AUD.master);
  AUD.music = actx.createGain(); AUD.music.connect(mlp);

  // two seconds of white noise, shared by every noisy thing
  const len = actx.sampleRate*2;
  AUD.noise = actx.createBuffer(1, len, actx.sampleRate);
  const d = AUD.noise.getChannelData(0);
  for(let i=0;i<len;i++) d[i] = Math.random()*2-1;

  /* a room: a short synthetic reverb. Barely there in the open, and it
     swells in the slot canyon and under the snow shed. */
  {
    const n = Math.round(actx.sampleRate*1.6), ir = actx.createBuffer(2, n, actx.sampleRate);
    for(let c=0;c<2;c++){ const ch = ir.getChannelData(c);
      for(let i=0;i<n;i++){ const t = i/actx.sampleRate; ch[i] = (Math.random()*2 - 1)*Math.pow(1 - i/n, 2.6)*(t < 0.012 ? 0 : 1); } }
    AUD.verb = actx.createConvolver(); AUD.verb.buffer = ir;
    const back = actx.createGain(); back.gain.value = 0.9;
    AUD.verb.connect(back); back.connect(AUD.master);
    AUD.verbSend = actx.createGain(); AUD.verbSend.gain.value = 0.06;
    AUD.verbSend.connect(AUD.verb);
    AUD.sfx.connect(AUD.verbSend);
  }

  AUD.eng = makeEngine(AUD.sfx, true);

  // the ground under the tyres: three noise bands whose mix follows the surface
  const loop = (type, f, q)=>{
    const src = actx.createBufferSource(); src.buffer = AUD.noise; src.loop = true;
    src.playbackRate.value = 0.9 + Math.random()*0.2;
    const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = actx.createGain(); g.gain.value = 0;
    src.connect(fl); fl.connect(g); g.connect(AUD.sfx); src.start(0, Math.random()*1.5);
    return {g, f:fl};
  };
  AUD.road = { mid:loop("bandpass", 900, 0.9), low:loop("lowpass", 140, 0.7), high:loop("highpass", 3200, 0.6),
               slide:loop("bandpass", 1500, 1.6), wade:loop("bandpass", 1100, 0.5) };
  AUD.wind = loop("lowpass", 500, 0.4);

  // the three rivals, each a smaller engine panned to where it is
  for(let k=0;k<3;k++){
    const pan = actx.createStereoPanner ? actx.createStereoPanner() : null;
    const out = actx.createGain(); out.gain.value = 0;
    if(pan){ out.connect(pan); pan.connect(AUD.sfx); } else out.connect(AUD.sfx);
    AUD.rivals.push({e: makeEngine(out, false), out, pan});
  }
  AUD.seqNext = actx.currentTime + 0.1;
  setLevels();
}
/* A big, tired straight six, deep and lumpy rather than smooth. The voice
   sits an octave under the firing rate: two detuned saws and a sub saw
   through an asymmetric clipper (even harmonics, the growl), a heavy boost
   around 100Hz for the chest, and a low pass that never opens far, so
   nothing whines. On top, the combustion itself: low passed noise chopped
   by the same pulse that beats the exhaust, which is what stops it
   sounding like a synthesiser. The pitch wanders a little, the way a real
   engine never quite holds a note. */
function makeEngine(dest, full){
  const e = {};
  e.out = actx.createGain(); e.out.gain.value = 0; e.out.connect(dest);
  e.lp = actx.createBiquadFilter(); e.lp.type = "lowpass"; e.lp.frequency.value = 400; e.lp.Q.value = 0.8;
  e.lp2 = actx.createBiquadFilter(); e.lp2.type = "lowpass"; e.lp2.frequency.value = 1400; e.lp2.Q.value = 0.5;
  e.body = actx.createBiquadFilter(); e.body.type = "peaking"; e.body.frequency.value = 95; e.body.Q.value = 0.9; e.body.gain.value = 5;
  e.shaper = actx.createWaveShaper();
  const curve = new Float32Array(2048);
  for(let i=0;i<2048;i++){ const x = i/1023.5 - 1; const y = x > 0 ? Math.tanh(x*3.2) : Math.tanh(x*1.8)*0.8; curve[i] = y; }
  e.shaper.curve = curve; e.shaper.oversample = "4x";
  e.drive = actx.createGain(); e.drive.gain.value = 0.8;
  e.chuff = actx.createGain(); e.chuff.gain.value = 0.6;
  // the clipper is lopsided on purpose, so take off the DC and the subsonics it leaves
  e.hp = actx.createBiquadFilter(); e.hp.type = "highpass"; e.hp.frequency.value = 38; e.hp.Q.value = 0.7;
  // and a growl band small speakers can actually play
  e.growl = actx.createBiquadFilter(); e.growl.type = "peaking"; e.growl.frequency.value = 260; e.growl.Q.value = 1.0; e.growl.gain.value = 8;
  e.drive.connect(e.shaper); e.shaper.connect(e.chuff); e.chuff.connect(e.hp); e.hp.connect(e.body); e.body.connect(e.growl);
  e.growl.connect(e.lp); e.lp.connect(e.lp2); e.lp2.connect(e.out);
  const osc = (type, g, det)=>{ const o = actx.createOscillator(); o.type = type; if(det) o.detune.value = det;
                               const gg = actx.createGain(); gg.gain.value = g; o.connect(gg); gg.connect(e.drive); o.start(); return o; };
  e.a = osc("sawtooth", 0.45, -7); e.b = osc("sawtooth", 0.4, 9); e.sub = osc("sawtooth", 0.55); e.deep = osc("sine", 0.6);
  // the exhaust pulse: a lumpy beat at the firing rate over the whole voice
  e.lfo = actx.createOscillator(); e.lfo.type = "sawtooth";
  e.lfoG = actx.createGain(); e.lfoG.gain.value = 0.45;
  e.lfo.connect(e.lfoG); e.lfoG.connect(e.chuff.gain); e.lfo.start();
  // combustion: noise chopped by the same pulse
  const src = actx.createBufferSource(); src.buffer = AUD.noise; src.loop = true;
  e.burn = actx.createBiquadFilter(); e.burn.type = "lowpass"; e.burn.frequency.value = 300; e.burn.Q.value = 0.7;
  e.burnG = actx.createGain(); e.burnG.gain.value = 0;
  e.burnAM = actx.createGain(); e.burnAM.gain.value = 0.5;
  const amD = actx.createGain(); amD.gain.value = 0.5; e.lfo.connect(amD); amD.connect(e.burnAM.gain);
  src.connect(e.burn); e.burn.connect(e.burnAM); e.burnAM.connect(e.burnG); e.burnG.connect(e.body); src.start(0, Math.random()*1.5);
  e.full = full;
  return e;
}
function setEngine(e, rpm, load, vol, now, lag){
  const fire = Math.max(24, rpm/20);               // six cylinders: three firings a turn
  const f = fire*0.5*(1 + (Math.random() - 0.5)*0.018);   // the voice, an octave down, never quite steady
  const r = Math.min(1.1, rpm/DRIVE.redline);
  e.a.frequency.setTargetAtTime(f, now, lag);
  e.b.frequency.setTargetAtTime(f, now, lag);
  e.sub.frequency.setTargetAtTime(f*0.5, now, lag);
  e.deep.frequency.setTargetAtTime(f*0.5, now, lag);
  e.lfo.frequency.setTargetAtTime(fire*0.5, now, lag);
  e.lfoG.gain.setTargetAtTime(0.5 - r*0.2, now, 0.1);
  e.lp.frequency.setTargetAtTime(300 + r*520 + load*380, now, 0.07);
  e.growl.frequency.setTargetAtTime(200 + r*180, now, 0.1);
  e.lp2.frequency.setTargetAtTime(700 + r*700, now, 0.1);
  e.body.frequency.setTargetAtTime(80 + r*70, now, 0.1);
  e.drive.gain.setTargetAtTime(0.6 + load*1.4, now, 0.06);
  e.burn.frequency.setTargetAtTime(160 + fire*1.8, now, lag);
  e.burnG.gain.setTargetAtTime((0.35 + load*0.9)*(e.full ? 1 : 0.6), now, 0.06);
  e.out.gain.setTargetAtTime(vol*1.6, now, 0.05);
}
function setLevels(){
  if(!actx) return;
  const S = SAVE.settings;
  AUD.master.gain.setTargetAtTime(muted ? 0 : S.master, actx.currentTime, 0.03);
  AUD.sfx.gain.setTargetAtTime(S.sfx, actx.currentTime, 0.03);
  const inRace = AUD.musicMode === "race";
  AUD.music.gain.setTargetAtTime(S.music*(inRace ? 0.45 : 1)*(GAME.paused ? 0.5 : 1), actx.currentTime, 0.2);
}
function toggleMute(){
  muted = !muted;
  setLevels();
}

const now0 = ()=> actx ? actx.currentTime : 0;
/* one shot voices */
function tone(freq, dur, type, vol, to, at, bus){
  if(!actx) return;
  const t = actx.currentTime + (at||0);
  const o = actx.createOscillator(), g = actx.createGain();
  o.type = type || "square";
  o.frequency.setValueAtTime(freq, t);
  if(to) o.frequency.exponentialRampToValueAtTime(to, t+dur);
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.008);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  o.connect(g); g.connect(bus || AUD.sfx);
  o.start(t); o.stop(t+dur+0.02);
}
function burst(dur, type, f, vol, q, at, fTo, bus){
  if(!actx) return;
  const t = actx.currentTime + (at||0);
  const s = actx.createBufferSource(); s.buffer = AUD.noise;
  const fl = actx.createBiquadFilter(); fl.type = type; fl.frequency.setValueAtTime(f, t); fl.Q.value = q||1;
  if(fTo) fl.frequency.exponentialRampToValueAtTime(fTo, t+dur);
  const g = actx.createGain();
  g.gain.setValueAtTime(0.0001, t);
  g.gain.exponentialRampToValueAtTime(vol, t+0.004);
  g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
  s.connect(fl); fl.connect(g); g.connect(bus || AUD.sfx);
  s.start(t, Math.random()*1.5); s.stop(t+dur+0.02);
}
/* a soft menu blip: a triangle with a sine an octave up, no buzz */
function blip(f, dur, vol, at, to){ tone(f, dur, "triangle", vol, to, at); tone(f*2, dur*0.6, "sine", vol*0.35, to ? to*2 : 0, at); }
